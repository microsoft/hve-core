name: Setup PowerShell Modules
description: Installs pinned PowerShell modules with caching and retry on PSGallery failures

inputs:
  import:
    description: 'Import modules into the session after install'
    required: false
    default: 'false'
  force:
    description: 'Force reinstall even when modules are already present'
    required: false
    default: 'false'
  modules:
    description: 'Comma-separated pinned module names to install; empty installs every pinned module'
    required: false
    default: ''
  cache-key-suffix:
    description: 'Optional suffix appended to the cache key for isolation'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve PowerShell module selection
      id: ps-selection
      if: inputs.modules != ''
      shell: pwsh
      env:
        INPUT_MODULES: ${{ inputs.modules }}
      run: |
        $names = @($env:INPUT_MODULES -split ',' | ForEach-Object { $_.Trim().ToLowerInvariant() } | Where-Object { $_ } | Sort-Object -Unique)
        $selection = $names -join '+'
        if ($selection -cnotmatch '^[a-z0-9._+-]+$') { throw "Unsupported module selection: $env:INPUT_MODULES" }
        "key=$selection" >> $env:GITHUB_OUTPUT

    - name: Cache PowerShell modules
      id: ps-cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.local/share/powershell/Modules
        key: ps-modules-${{ runner.os }}-${{ hashFiles('scripts/security/ps-module-versions.json') }}${{ steps.ps-selection.outputs.key && format('-{0}', steps.ps-selection.outputs.key) || '' }}${{ inputs.cache-key-suffix && format('-{0}', inputs.cache-key-suffix) || '' }}

    - name: Install PowerShell modules
      shell: pwsh
      env:
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_MODULES: ${{ inputs.modules }}
      run: |
        $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/security/Install-PSModules.ps1'
        $installArgs = @{
          Scope = 'CurrentUser'
        }
        if ($env:INPUT_FORCE -eq 'true') { $installArgs['Force'] = $true }
        $moduleNames = @($env:INPUT_MODULES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        if ($moduleNames.Count -gt 0) { $installArgs['Module'] = $moduleNames }
        & $scriptPath @installArgs

    - name: Import PowerShell modules
      if: inputs.import == 'true'
      shell: pwsh
      env:
        INPUT_MODULES: ${{ inputs.modules }}
      run: |
        $configPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/security/ps-module-versions.json'
        $config = Get-Content -Raw $configPath | ConvertFrom-Json
        $selected = @($env:INPUT_MODULES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
        foreach ($prop in $config.modules.PSObject.Properties) {
          if ($selected.Count -gt 0 -and $prop.Name -notin $selected) { continue }
          Import-Module -Name $prop.Name -RequiredVersion $prop.Value.version -Force -ErrorAction Stop
          Write-Host "Imported $($prop.Name) $($prop.Value.version)"
        }
