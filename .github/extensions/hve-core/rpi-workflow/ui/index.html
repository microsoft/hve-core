<header class="topbar">
  <button type="button" class="icon-btn" id="navToggle" aria-controls="navigator" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="#i-panel"/></svg><span class="visually-hidden">Hide navigator</span></button>

    </div>
  </div>

    <button type="button" class="live-btn" id="liveBtn" data-state="connecting" data-follow="on"><svg class="icon" aria-hidden="true"><use href="#i-live"/></svg><span id="liveLabel">Connecting</span><span class="visually-hidden" id="liveHint"></span></button>
    <button type="button" class="icon-btn" id="appearanceBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="appearanceMenu"><svg class="icon" aria-hidden="true"><use href="#i-contrast"/></svg><span class="visually-hidden">Appearance</span></button>
    <button type="button" class="icon-btn" id="legendBtn" aria-haspopup="dialog" aria-keyshortcuts="l"><svg class="icon" aria-hidden="true"><use href="#i-legend"/></svg><span class="visually-hidden">What the IDs and icons mean</span></button>
    <button type="button" class="icon-btn" id="shortcutsBtn" aria-keyshortcuts="?"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg><span class="visually-hidden">Keyboard shortcuts</span></button>
    <button type="button" class="icon-btn" id="steerToggle" aria-controls="steer" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="#i-panel-right"/></svg><span class="visually-hidden">Hide steering panel</span></button>
  </div>
  <div class="menu appearance-menu" id="appearanceMenu" role="dialog" aria-labelledby="appearanceTitle" hidden>
    <h2 class="menu-title" id="appearanceTitle">Appearance</h2>
    <fieldset class="segmented" id="themeGroup">
      <legend>Theme</legend>
      <label><input type="radio" name="theme" value="system"><svg class="icon" aria-hidden="true"><use href="#i-contrast"/></svg><span>System</span></label>
      <label><input type="radio" name="theme" value="light"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg><span>Light</span></label>
      <label><input type="radio" name="theme" value="dark"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span>Dark</span></label>
    </fieldset>
    <label class="switch-row"><input type="checkbox" role="switch" id="contrastSwitch"><span>More contrast</span></label>
    <p class="menu-note" id="appearanceNote">System follows your editor or operating system.</p>
  </div>
  <div class="menu session-menu" id="sessionMenu" role="dialog" aria-labelledby="sessionMenuTitle" hidden></div>
</header>
<div class="workspace" id="workspace">
  <nav class="navigator" id="navigator" aria-label="Navigator">

    <div class="nav-body" id="navBody"></div>
  </nav>
  <main class="document" id="document" tabindex="-1">

    <div class="doc-body" id="docBody"><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div></div>
    <div class="status-area" id="statusArea" hidden></div>
  </main>
  <aside class="steer" id="steer" aria-labelledby="steerTitle">
    <div class="steer-head"><h2 id="steerTitle">Steer</h2><button type="button" class="icon-btn drawer-close" id="steerClose"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg><span class="visually-hidden">Close steering panel</span></button></div>
    <div class="steer-body" id="steerBody"></div>
  </aside>
</div>
<main class="connect-view" id="connectView" tabindex="-1" hidden></main>
<div class="scrim" id="scrim" hidden></div>
<dialog class="dialog" id="shortcutsDialog" aria-labelledby="shortcutsTitle">
  <div class="dialog-head"><h2 id="shortcutsTitle">Keyboard shortcuts</h2><button type="button" class="icon-btn" data-close><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg><span class="visually-hidden">Close</span></button></div>
  <dl class="shortcut-list" id="shortcutList"></dl>
  <label class="switch-row"><input type="checkbox" role="switch" id="shortcutSwitch" checked><span>Single-key shortcuts</span></label>
</dialog>
<dialog class="dialog legend-sheet" id="legendDialog" aria-labelledby="legendTitle"></dialog>
<dialog class="dialog sheet" id="fileSheet" aria-labelledby="fileSheetTitle"></dialog>
<dialog class="dialog send-sheet" id="sendSheet" aria-labelledby="sendSheetTitle"></dialog>
<div class="visually-hidden" id="announcer" role="status" aria-live="polite"></div>

</html>
