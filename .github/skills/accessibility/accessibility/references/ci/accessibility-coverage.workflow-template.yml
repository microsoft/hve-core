name: Accessibility coverage gate (template)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-accessibility:
    name: Accessibility runtime coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_WORKDIR: .
      TARGET_BASE_URL: http://127.0.0.1:3000
      TARGET_BUILD_COMMAND: npm run build
      TARGET_SERVE_COMMAND: python -m http.server 3000 --directory dist
      TARGET_CONFIG: a11y-runtime.config.json
      TARGET_RESULTS: results.json
      TARGET_INTENT_DIR: design-intent
      TARGET_EVIDENCE_ASSETS: accessibility/asset-journeys.json
      TARGET_EVIDENCE_REQUIREMENTS: accessibility/requirement-methods.json
      TARGET_EVIDENCE_SCOPE: accessibility/evidence-scope.json
      TARGET_RUN_CONTEXT: artifacts/accessibility/run-context.json
      TARGET_EVIDENCE_SOURCE: artifacts/accessibility/evidence-source.json
      TARGET_STATE_PROOFS: artifacts/accessibility/state-proofs.json
      TARGET_EVIDENCE_BUNDLE: artifacts/accessibility/evidence-bundle.json
      TARGET_VALIDATION_INPUT: artifacts/accessibility/validation-input.json
      # Adoption recipe for every input below, completeness exits, retention,
      # the reviewer trust anchor and recomposition:
      # references/evidence-composition-adoption.md
      # Only these files are ever retained, and only from this directory.
      TARGET_EVIDENCE_STAGING: artifacts/accessibility/retained
      TARGET_VALIDATION_MANIFEST: artifacts/accessibility-validation-manifest.json
      TARGET_SCHEMA_REPORT: artifacts/accessibility/schema-validation-report.json
      TARGET_COMMAND_RESULT: artifacts/accessibility/runtime-validation-result.json
      # Point this at the runtime_a11y skill package as vendored in your repo.
      HARNESS_DIR: .github/skills/accessibility/accessibility/scripts/runtime_a11y
      # Point this at the accessibility skill root as vendored in your repo. It
      # holds pyproject.toml, so uv resolves the harness environment from it.
      HARNESS_PROJECT_DIR: .github/skills/accessibility/accessibility
      # Gate strictness dial: basic (adequacy probes warn-only), standard
      # (ratchet: adequacy probes block on changed surfaces), comprehensive
      # (adequacy probes block everywhere). Core probes always block.
      A11Y_TIER: standard
      # Comma-separated surface ids treated as new/changed for the standard-tier
      # ratchet: adequacy-probe failures on these block; others stay advisory.
      A11Y_RATCHET_SURFACES: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ env.TARGET_WORKDIR }}/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install target dependencies
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: npm ci

      - name: Build target
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          echo "TODO: replace TARGET_BUILD_COMMAND with the target project's build step."
          eval "${{ env.TARGET_BUILD_COMMAND }}"

      - name: Provision system Chrome
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome_bin" ]; then
            echo "::error::No system Google Chrome found on the runner."
            exit 1
          fi
          echo "Using system Chrome at: $chrome_bin"
          "$chrome_bin" --version

      - name: Serve target
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          echo "TODO: replace TARGET_SERVE_COMMAND and TARGET_BASE_URL with the target project's serve settings."
          eval "${{ env.TARGET_SERVE_COMMAND }}" > /tmp/a11y-runtime-serve.log 2>&1 &
          echo $! > /tmp/a11y-runtime-serve.pid
          for attempt in $(seq 1 20); do
            if curl -fsS "${{ env.TARGET_BASE_URL }}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Install runtime accessibility harness dependencies
        working-directory: ${{ env.HARNESS_DIR }}
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          echo "TODO: set HARNESS_DIR to the runtime_a11y skill package as vendored in your repo."
          npm ci

      - name: Run runtime accessibility harness
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          intent_records=("${{ env.TARGET_INTENT_DIR }}"/*.intent.yaml)
          intent_active=false
          if [ "${#intent_records[@]}" -gt 0 ]; then
            intent_active=true
          fi

          if [ ! -f "${{ env.TARGET_CONFIG }}" ]; then
            if [ "$intent_active" = true ]; then
              echo "::error::Design intent records exist, but ${{ env.TARGET_CONFIG }} is missing."
              exit 1
            fi
            echo "::warning::No a11y-runtime.config.json is committed yet; the gate activates once the target adopts it."
            exit 0
          fi

          # A pre-existing results file must never satisfy the current run.
          rm -f -- "${{ env.TARGET_RESULTS }}"
          uv run --project "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}" "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}/scripts/runtime_a11y/__main__.py" run-all --config "${{ env.TARGET_CONFIG }}" --out "${{ env.TARGET_RESULTS }}" --base-url "${{ env.TARGET_BASE_URL }}"

          if [ "$intent_active" = true ] && [ ! -f "${{ env.TARGET_RESULTS }}" ]; then
            echo "::error::Runtime harness completed without producing current results for authored design intent."
            exit 1
          fi

      - name: Enforce accessibility probe failures (tier-graduated)
        if: always()
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          result_path = pathlib.Path("${{ env.TARGET_RESULTS }}")
          if not result_path.exists():
              print("No runtime results file found; skipping enforcement.")
              sys.exit(0)

          payload = json.loads(result_path.read_text(encoding="utf-8"))
          tier = os.environ.get("A11Y_TIER", "standard").strip().lower()
          ratchet_surfaces = {
              s.strip() for s in os.environ.get("A11Y_RATCHET_SURFACES", "").split(",") if s.strip()
          }

          # Core probes decide their criteria and block at every tier.
          core_blocking = {
              "probe-axe",
              "probe-dom-hygiene",
              "probe-broken-links",
              "probe-console-errors",
              "probe-target-size",
              "probe-contrast",
              "probe-reflow-resize",
          }
          # Interaction/announcement probes are the adequate method for the classes
          # static analysis only informs. Their blocking posture graduates by tier:
          # basic warn-only, standard ratchet on changed surfaces, comprehensive block.
          adequacy_blocking = {
              "probe-keyboard-traversal",
              "probe-widget-keyboard",
              "probe-live-region",
              "probe-aria-tree",
              "probe-virtual-sr",
              "probe-real-sr",
          }
          all_gated = core_blocking | adequacy_blocking

          def probe_for(item):
              probe_id = item.get("probeId")
              if probe_id in all_gated:
                return probe_id
              evidence = str(item.get("evidence", ""))
              for probe_id in all_gated:
                  if evidence.startswith(f"{probe_id} evaluated"):
                      return probe_id
              return None

          blocking = []
          advisory = []
          for item in payload.get("results", []):
              if item.get("status") != "fail":
                  continue
              probe_id = probe_for(item)
              if probe_id is None:
                  continue
              surface = item.get("surfaceId")
              label = f"{probe_id}: {item.get('criterionId')} ({surface}/{item.get('state')})"
              if probe_id in core_blocking:
                  blocking.append(label)
              elif tier == "comprehensive":
                  blocking.append(label)
              elif tier == "standard" and surface in ratchet_surfaces:
                  blocking.append(label)
              else:
                  advisory.append(label)

          if advisory:
              print(f"Advisory accessibility findings (tier={tier}, not blocking):")
              for finding in advisory:
                  print(f"::warning::{finding}")
          if blocking:
              print(f"Blocking accessibility findings (tier={tier}):")
              for finding in blocking:
                  print(f" - {finding}")
              sys.exit(1)

          print(f"No blocking accessibility findings (tier={tier}).")
          PY

      - name: Verify declared design intent
        if: always()
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          intent_records=("${{ env.TARGET_INTENT_DIR }}"/*.intent.yaml)
          if [ "${#intent_records[@]}" -eq 0 ]; then
            echo "::notice::No authored design-intent records are committed; intent verification is inactive."
            exit 0
          fi
          if [ ! -f "${{ env.TARGET_CONFIG }}" ]; then
            echo "::error::Design intent records exist, but ${{ env.TARGET_CONFIG }} is missing."
            exit 1
          fi
          if [ ! -f "${{ env.TARGET_RESULTS }}" ]; then
            echo "::error::Design intent records exist, but no current runtime results file was produced."
            exit 1
          fi
          status=0
          for record in "${intent_records[@]}"; do
            echo "Verifying $record"
            # Exit 3 means a blocking expectation failed: real intent drift.
            # Exit 4 means a blocking expectation was never evaluated: missing
            # coverage, which would otherwise pass silently. Both fail the job
            # and are reported distinctly. Any other non-zero exit is an
            # adapter error and stops the job.
            uv run --project "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}" "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}/scripts/runtime_a11y/__main__.py" verify-intent \
              --record "$record" \
              --config "${{ env.TARGET_CONFIG }}" \
              --results "${{ env.TARGET_RESULTS }}" || {
              code=$?
              if [ "$code" -eq 3 ]; then
                echo "::error::Design intent drift in $record"
                status=1
              elif [ "$code" -eq 4 ]; then
                echo "::error::Blocking design intent expectation never evaluated in $record"
                status=1
              else
                exit "$code"
              fi
            }
          done
          exit "$status"

      - name: Compose accessibility evidence bundle
        if: always()
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          set -euo pipefail
          required=(
            "${{ env.TARGET_EVIDENCE_ASSETS }}"
            "${{ env.TARGET_EVIDENCE_REQUIREMENTS }}"
            "${{ env.TARGET_EVIDENCE_SCOPE }}"
            "${{ env.TARGET_RUN_CONTEXT }}"
            "${{ env.TARGET_EVIDENCE_SOURCE }}"
            "${{ env.TARGET_STATE_PROOFS }}"
          )
          for path in "${required[@]}"; do
            if [ ! -f "$path" ]; then
              echo "::notice::Evidence composition is inactive because $path is missing."
              exit 0
            fi
          done
          uv run --project "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}" \
            "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}/scripts/runtime_a11y/__main__.py" compose-evidence \
            --asset-catalog "${{ env.TARGET_EVIDENCE_ASSETS }}" \
            --requirement-catalog "${{ env.TARGET_EVIDENCE_REQUIREMENTS }}" \
            --scope "${{ env.TARGET_EVIDENCE_SCOPE }}" \
            --run-context "${{ env.TARGET_RUN_CONTEXT }}" \
            --source "${{ env.TARGET_EVIDENCE_SOURCE }}" \
            --state-proofs "${{ env.TARGET_STATE_PROOFS }}" \
            --artifact-root . \
            --out "${{ env.TARGET_EVIDENCE_BUNDLE }}" \
            --require-completeness automated

      - name: Emit accessibility validation manifest
        if: always()
        working-directory: ${{ env.TARGET_WORKDIR }}
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: |
            set -euo pipefail
            if [ ! -f "${{ env.TARGET_EVIDENCE_BUNDLE }}" ]; then
            echo "::notice::Validation manifest is inactive because no evidence bundle was composed."
            exit 0
            fi
            mkdir -p "$(dirname "${{ env.TARGET_VALIDATION_INPUT }}")"
            uv run --project "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}" python - <<'PY'
            import hashlib
            import json
            import os
            import platform
            import subprocess
            from pathlib import Path

            def digest_bytes(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()

            def digest_file(path: Path) -> str:
              return digest_bytes(path.read_bytes())

            def inventory(paths: list[str]) -> list[dict[str, str]]:
              return [
                {"path": value, "sha256": digest_file(Path(value))}
                for value in sorted(set(paths))
                if value and Path(value).is_file()
              ]

            status = "passed" if os.environ["VALIDATION_JOB_STATUS"] == "success" else "failed"
            command_result = {
              "commandId": "runtime-accessibility-workflow",
              "status": status,
              "jobStatus": os.environ["VALIDATION_JOB_STATUS"],
            }
            command_result_path = Path(os.environ["TARGET_COMMAND_RESULT"])
            command_result_path.parent.mkdir(parents=True, exist_ok=True)
            command_result_path.write_text(
              json.dumps(command_result, indent=2, sort_keys=True), encoding="utf-8"
            )

            workspace = Path(os.environ["GITHUB_WORKSPACE"])
            diff = subprocess.run(
              ["git", "diff", "--binary", "HEAD"],
              cwd=workspace,
              check=True,
              capture_output=True,
            ).stdout
            revision = {
              "sourceRevision": os.environ["GITHUB_SHA"],
              "diffDigest": digest_bytes(diff),
              "tracked": not bool(
                subprocess.run(
                  ["git", "status", "--porcelain"],
                  cwd=workspace,
                  check=True,
                  capture_output=True,
                  text=True,
                ).stdout.strip()
              ),
            }
            branch = os.environ.get("GITHUB_REF_NAME")
            if branch:
              revision["branch"] = branch

            generated = inventory([os.environ["TARGET_EVIDENCE_BUNDLE"]])
            untracked = inventory(
              [os.environ["TARGET_RESULTS"], os.environ["TARGET_COMMAND_RESULT"]]
            )
            payload = {
              "revision": revision,
              "environment": {
                "operatingSystem": platform.platform(),
                "toolVersions": {
                  "node": subprocess.run(
                    ["node", "--version"], check=True, capture_output=True, text=True
                  ).stdout.strip(),
                  "python": platform.python_version(),
                  "uv": subprocess.run(
                    ["uv", "--version"], check=True, capture_output=True, text=True
                  ).stdout.strip(),
                },
              },
              "commands": [
                {
                  "commandId": "runtime-accessibility-workflow",
                  "command": "copied accessibility coverage workflow",
                  "workingDirectory": os.environ["TARGET_WORKDIR"],
                  "status": status,
                  "resultArtifactDigest": digest_file(command_result_path),
                }
              ],
              "generatedInventory": generated,
              "untrackedDeliverables": untracked,
              "assistiveTechnologySample": {
                "advisory": True,
                "journeys": [],
                "boundary": "Copied CI workflow runs deterministic probes only; real assistive-technology sampling is separate and advisory.",
              },
            }
            Path(os.environ["TARGET_VALIDATION_INPUT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding="utf-8"
            )
            PY
            uv run --project "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}" \
            "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}/scripts/runtime_a11y/__main__.py" emit-validation-manifest \
            --input "${{ env.TARGET_VALIDATION_INPUT }}" \
            --out "${{ env.TARGET_VALIDATION_MANIFEST }}" \
            --schema-report "${{ env.TARGET_SCHEMA_REPORT }}"

      - name: Stage accessibility evidence for retention
        if: always()
        working-directory: ${{ env.TARGET_WORKDIR }}
        run: |
          set -euo pipefail
          staging="${{ env.TARGET_EVIDENCE_STAGING }}"
          # Validate containment before any recursive delete: an adopter value of
          # '.', '..', an absolute path or a symlinked parent would otherwise
          # remove the checkout.
          case "$staging" in
            "" | "." | ".." | /* | ~*) echo "::error::Refusing unsafe evidence staging path: '$staging'"; exit 1 ;;
          esac
          case "$staging" in
            */../* | ../* | */..) echo "::error::Refusing traversal in evidence staging path: '$staging'"; exit 1 ;;
          esac
          work_root="$(pwd -P)"
          parent="$(dirname "$staging")"
          mkdir -p "$parent"
          resolved_parent="$(cd "$parent" && pwd -P)"
          resolved="$resolved_parent/$(basename "$staging")"
          if [ "$resolved" = "$work_root" ] || [ "$resolved" = "/" ]; then
            echo "::error::Evidence staging must not resolve to the working directory or filesystem root."
            exit 1
          fi
          case "$resolved/" in
            "$work_root"/*) ;;
            *) echo "::error::Evidence staging must resolve inside the working directory."; exit 1 ;;
          esac
          if [ -L "$resolved" ]; then
            echo "::error::Refusing a symlinked evidence staging directory."
            exit 1
          fi
          rm -rf "$resolved"
          mkdir -p "$resolved"
          staging="$resolved"
          if [ ! -f "${{ env.TARGET_EVIDENCE_BUNDLE }}" ]; then
            echo "::notice::No composed bundle to retain."
            exit 0
          fi
          uv run --project "${{ github.workspace }}/${{ env.HARNESS_PROJECT_DIR }}" python - "$staging" <<'PY'
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], os.environ["HARNESS_PROJECT_DIR"], "scripts"))
          from runtime_a11y.evidence_bundle._validate import reject_prohibited_content
          from runtime_a11y.validation_manifest import validate_retained_document

          staging = Path(sys.argv[1]).resolve()
          # Closed allowlist. Anything not named here is never retained.
          allowlist = {
              "evidence-bundle.json": {
                "source": os.environ["TARGET_EVIDENCE_BUNDLE"],
                "schema": "evidence-bundle.schema.json",
              },
              "composition-summary.json": {
                "source": None,
                "schema": "composition-summary.schema.json",
              },
              "accessibility-validation-manifest.json": {
                "source": os.environ["TARGET_VALIDATION_MANIFEST"],
                "schema": "validation-manifest.schema.json",
              },
              "schema-validation-report.json": {
                "source": os.environ["TARGET_SCHEMA_REPORT"],
                "schema": "schema-validation-report.schema.json",
              },
          }

          def load_document(name: str) -> tuple[Path, dict]:
              entry = allowlist[name]
              source = entry["source"]
              path = Path(source)
              if not source or not path.is_file():
                raise SystemExit(f"Required retained document is missing: {name}")
              if path.is_symlink() or path.name.startswith("."):
                raise SystemExit(f"Refusing to stage a symlink or hidden file: {source}")
              document = json.loads(path.read_text(encoding="utf-8"))
              validate_retained_document(name, document)
              reject_prohibited_content(document)
              return path, document

          bundle_path, bundle = load_document("evidence-bundle.json")

          completeness = bundle["scopeCompleteness"]
          classification = (
              "complete"
              if completeness["automatedCollection"] == "complete"
              and completeness["reviewerEvidence"] in {"not-required", "complete"}
              else "incomplete"
          )
          summary = {
              "classification": classification,
              "bundleDigest": bundle["bundleDigest"],
              "runId": bundle["runManifest"]["runId"],
              "scopeCompleteness": completeness,
              "nonAttestation": bundle["nonAttestation"],
          }
          reject_prohibited_content(summary)
          validate_retained_document("composition-summary.json", summary)

          shutil.copyfile(bundle_path, staging / "evidence-bundle.json")
          for name in (
              "accessibility-validation-manifest.json",
              "schema-validation-report.json",
          ):
              source, _ = load_document(name)
              shutil.copyfile(source, staging / name)
          (staging / "composition-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )

          staged = sorted(item.name for item in staging.iterdir())
          unexpected = [name for name in staged if name not in allowlist]
          if unexpected:
              raise SystemExit(f"Unlisted files reached the staging directory: {unexpected}")
          print(f"::notice::Staged {classification} accessibility evidence: {staged}")
          PY

      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TARGET_WORKDIR }}/${{ env.TARGET_EVIDENCE_STAGING }}
          retention-days: 30
          if-no-files-found: warn
