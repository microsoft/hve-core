[project]
name = "copilot-otel-metrics-skill"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pyyaml>=6.0",
    "ruff>=0.15",
]
fuzz = [
    # Atheris ships manylinux-only wheels; keep separate from dev so uv sync works on macOS.
    "atheris>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "examples"]
python_files = ["test_*.py", "fuzz_harness.py"]
# Runtime-backed carrier evidence needs Docker and a pinned image pull. The
# lane that provisions those prerequisites selects `-m slow` explicitly; every
# other caller of this project gets the container-free suite by default.
addopts = "-m \"not slow\""
markers = [
    "slow: requires a container runtime and the digest-pinned Collector image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
