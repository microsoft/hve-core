# OpenTelemetry Collector configuration for the per-workstation agent-host relay.
#
# Managed VS Code settings apply one telemetry endpoint to both the extension
# and the agent host, and managed telemetry.headers reach only the extension.
# Both emitters send here without a credential; this relay adds the fleet token
# on the upstream hop, so it never enters the environment VS Code hands to
# agent-spawned subprocesses.
#
# Ingress is OTLP/HTTP only, matching the protocol managed settings pin. Host
# exposure is decided by the loopback port mapping in compose.yaml, not here.
#
# Every runtime input arrives through the environment or a read-only mount:
#   COPILOT_OTEL_FLEET_ENDPOINT   https:// base URL of the fleet receiver
#   COPILOT_OTEL_INGEST_TOKEN     the fleet ingest token
#   COPILOT_OTEL_FLEET_CA_BUNDLE  absolute host path to the CA bundle that
#                                 signs the fleet receiver's certificate,
#                                 mounted read-only at the ca_file path below
#
# Requires the OpenTelemetry Collector Contrib distribution; the redaction
# processor is not in the core distribution.
#
# Rollout, rotation, and rollback: ../README.md and
# ../../../references/org-distribution.md.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bounds Collector memory so a traffic spike degrades rather than crashes it.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # The same fail-closed policy the local stack and the fleet Collector apply.
  # Filtering here as well as upstream removes content on the workstation that
  # produced it, before it crosses the network.
  redaction:
    allow_all_keys: false
    allowed_keys:
      # Resource identity. Dropping these would orphan every span.
      - service.name
      - service.namespace
      - service.version
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      # Model and token accounting. The token panels read these directly.
      - gen_ai.provider.name
      - gen_ai.operation.name
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.response.finish_reasons
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - gen_ai.usage.cache_read.input_tokens
      # Prometheus stores this as the gen_ai_token_type label; without it,
      # input and output tokens collapse into one indistinguishable series.
      - gen_ai.token.type
      # The discriminator baseline.py reads through the session_id label. It
      # is a detection control, not a convenience.
      - session.id
      # Agent and tool identity. Names only; arguments and results are not
      # allowed and therefore cannot reach storage.
      - gen_ai.agent.name
      - gen_ai.tool.name
      - gen_ai.tool.type
      - copilot_chat.mode_name
      - copilot_chat.turn_count
      - copilot_chat.copilot_usage_nano_aiu
      - github.copilot.agent.type
      # Both spellings collapse to the copilot_chat_edit_source label and
      # normalization is not reversible, so allow-listing both keeps a wrong
      # single guess from silently emptying the edit-acceptance panel.
      - copilot_chat.edit_source
      - copilot_chat.edit.source
      # Failure triage without failure content.
      - error.type
    # Masked, not dropped, so a panel keeps its shape while the value is gone.
    blocked_values:
      - "gh[pousr]_[0-9A-Za-z]{16,}"
      - "github_pat_[0-9A-Za-z_]{20,}"
      - "xox[baprs]-[0-9A-Za-z-]{10,}"
      - "A(?:KIA|SIA)[0-9A-Z]{16}"
      - "eyJ[0-9A-Za-z_-]{10,}\\.[0-9A-Za-z_-]{10,}\\.[0-9A-Za-z_-]*"
      - "(?i)(?:AccountKey|SharedAccessKey|SharedAccessSignature)=[0-9A-Za-z+/=%&-]{16,}"
      - "sk-(?:ant-)?[0-9A-Za-z_-]{20,}"
      - "AIza[0-9A-Za-z_-]{35}"
      - "(?i)-----BEGIN [A-Z ]*PRIVATE KEY-----"
      - "(?i)\\b(?:bearer|authorization|api[_-]?key|secret|password)\\b\\s*[:=]\\s*\\S+"
    # Silent so the processor does not annotate telemetry with the names of the
    # keys it removed, which would reintroduce the drift it exists to stop.
    summary: silent

  # Carriers the redaction processor cannot reach. redaction traverses
  # attribute maps only, so span status messages, span event names, trace
  # state, and non-map log bodies are overwritten here.
  #
  # Invariant: a carrier the allow-list does not reach is scrubbed unless a
  # shipped consumer reads it. Span names and metric metadata are therefore
  # absent, as are carriers this distribution cannot address. Both residual
  # kinds are registered in SECURITY.md.
  transform/scrub:
    error_mode: ignore
    trace_statements:
      - set(span.status.message, "[redacted]") where span.status.message != ""
      - set(span.trace_state, "") where span.trace_state != ""
      - set(spanevent.name, "[redacted]")
    log_statements:
      - set(log.body, "[redacted]") where log.body != nil
      - set(log.severity_text, "[redacted]") where log.severity_text != ""
      - set(log.event_name, "[redacted]") where log.event_name != ""

  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  # The only place the fleet credential exists on this workstation. TLS
  # verification is explicit: ca_file names the operator's bundle and there is
  # no insecure flag, so an untrusted certificate or mismatched hostname is
  # refused. This skill ships no certificate authority.
  otlp_http/fleet:
    endpoint: ${env:COPILOT_OTEL_FLEET_ENDPOINT}
    auth:
      authenticator: bearertokenauth
    tls:
      ca_file: /run/copilot-otel/fleet-ca.pem

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  # The fleet ingest token, identical on every workstation, so it authenticates
  # the fleet rather than a person. Residual: any process running as the same
  # operating-system user can read the environment file that supplies it.
  bearertokenauth:
    scheme: Bearer
    token: ${env:COPILOT_OTEL_INGEST_TOKEN}

service:
  extensions: [health_check, bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, batch]
      exporters: [otlp_http/fleet]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, batch]
      exporters: [otlp_http/fleet]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/scrub, batch]
      exporters: [otlp_http/fleet]
