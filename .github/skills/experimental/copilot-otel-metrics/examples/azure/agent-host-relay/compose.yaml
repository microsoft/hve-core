# Per-workstation agent-host relay for organization-managed Copilot telemetry.
#
# Deploy and verify this on a workstation before switching its managed settings
# to the loopback endpoint. After that switch the relay carries all of that
# workstation's Copilot telemetry: if it is stopped or missing, telemetry is
# lost rather than queued.
#
# Start it independently of VS Code so it does not inherit the editor's
# environment. Runtime inputs come from an env file outside this repository
# that is readable only by the operator account:
#   COPILOT_OTEL_FLEET_ENDPOINT, COPILOT_OTEL_INGEST_TOKEN,
#   COPILOT_OTEL_FLEET_CA_BUNDLE
#
# The image is pinned by manifest digest, matching the local stack.
#
# Exact commands, rotation, and decommissioning: ../README.md and
# ../../../references/org-distribution.md.

services:
  otel-relay:
    # otel/opentelemetry-collector-contrib:0.158.0
    image: otel/opentelemetry-collector-contrib@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    container_name: copilot-otel-relay
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      # Loopback only. The receiver binds the container interface; this mapping
      # decides host exposure.
      - "127.0.0.1:4318:4318" # OTLP HTTP  <- both Copilot emitters export here
      - "127.0.0.1:13133:13133" # health, for the post-deployment check
    environment:
      # Required with no default; the :? form fails the up with this message.
      COPILOT_OTEL_FLEET_ENDPOINT: ${COPILOT_OTEL_FLEET_ENDPOINT:?set COPILOT_OTEL_FLEET_ENDPOINT in the relay env file}
      COPILOT_OTEL_INGEST_TOKEN: ${COPILOT_OTEL_INGEST_TOKEN:?set COPILOT_OTEL_INGEST_TOKEN in the relay env file}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # The operator's CA bundle, read-only. An absolute host path is required;
      # a relative one would resolve against the directory the up was run from.
      - ${COPILOT_OTEL_FLEET_CA_BUNDLE:?set COPILOT_OTEL_FLEET_CA_BUNDLE to the absolute path of the fleet CA bundle}:/run/copilot-otel/fleet-ca.pem:ro
    networks:
      - copilot-otel-relay
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Bounds the container so the cgroup limit and the Collector's own
    # memory_limiter agree.
    mem_limit: 512m

networks:
  # Dedicated, so this relay shares no network with the local development
  # stack.
  copilot-otel-relay:
    driver: bridge
