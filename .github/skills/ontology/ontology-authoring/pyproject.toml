[project]
name = "ontology-authoring-skill"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "jsonschema==4.25.1",
    "pyshacl==0.40.1",
    "rdflib==7.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "tqdm>=4.67",
]
fuzz = [
    "atheris>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
python_files = ["test_*.py", "fuzz_harness.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
