name: Stable Release Preparation

# Validates main, prepares the even-minor stable version and changelog, and
# opens a reviewable main -> release/stable promotion pull request. This
# workflow never creates a git tag or GitHub release; release-stable-publish.yml
# is the sole Stable tag and release creator.

on:
    push:
        branches:
            - main

    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# Minimal permissions for security
permissions:
    contents: read

jobs:
    spell-check:
        name: Spell Check
        uses: ./.github/workflows/spell-check.yml
        permissions:
            contents: read
        with:
            soft-fail: false

    markdown-lint:
        name: Markdown Lint
        uses: ./.github/workflows/markdown-lint.yml
        permissions:
            contents: read
        with:
            soft-fail: false

    table-format:
        name: Table Format Check
        uses: ./.github/workflows/table-format.yml
        permissions:
            contents: read
        with:
            soft-fail: false

    dependency-pinning-scan:
        name: Dependency Pinning Scan
        uses: ./.github/workflows/dependency-pinning-scan.yml
        permissions:
            contents: read
            security-events: write # Required for SARIF upload to Security tab
        with:
            soft-fail: false
            upload-sarif: true
            upload-artifact: true

    action-version-consistency-scan:
        name: Action Version Consistency Scan
        uses: ./.github/workflows/action-version-consistency-scan.yml
        permissions:
            contents: read
            security-events: write # Required for SARIF upload to Security tab
        with:
            soft-fail: false
            upload-sarif: true
            upload-artifact: true

    gitleaks-scan:
        name: Gitleaks Secret Scan
        uses: ./.github/workflows/gitleaks-scan.yml
        permissions:
            contents: read
            security-events: write # Required for SARIF upload to Security tab
        with:
            soft-fail: false
            upload-sarif: true
            upload-artifact: true

    pester-tests:
        name: PowerShell Tests
        uses: ./.github/workflows/pester-tests.yml
        permissions:
            contents: read
            id-token: write
        with:
            soft-fail: false
            changed-files-only: false
            code-coverage: true

    docusaurus-tests:
        name: Docusaurus Tests
        uses: ./.github/workflows/docusaurus-tests.yml
        permissions:
            contents: read
            id-token: write # Required for Codecov OIDC in the reusable workflow
        with:
            soft-fail: false

    discover-python-projects:
        name: Discover Python Projects
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            directories: ${{ steps.find.outputs.directories }}
            has-projects: ${{ steps.find.outputs.has-projects }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Find Python projects
              id: find
              shell: pwsh
              run: |
                  $projectList = @(Get-ChildItem -Recurse -Force -Filter pyproject.toml |
                    Where-Object { $_.FullName -notmatch 'node_modules' } |
                    ForEach-Object { Resolve-Path -Relative $_.DirectoryName } |
                    ForEach-Object { $_ -replace '^\.[\\/]', '' } |
                    Sort-Object)
                  $jsonItems = $projectList | ForEach-Object { $_ | ConvertTo-Json -Compress }
                  $dirs = '[' + (($jsonItems) -join ',') + ']'
                  "directories=$dirs" >> $env:GITHUB_OUTPUT
                  if ($projectList.Count -eq 0) {
                    "has-projects=false" >> $env:GITHUB_OUTPUT
                    Write-Output 'No Python projects found'
                  } else {
                    "has-projects=true" >> $env:GITHUB_OUTPUT
                    Write-Output "Found Python projects: $dirs"
                  }

    python-lint:
        name: "Python Lint (${{ matrix.directory }})"
        needs: discover-python-projects
        if: needs.discover-python-projects.outputs.has-projects == 'true'
        strategy:
            fail-fast: false
            matrix:
                directory: ${{ fromJson(needs.discover-python-projects.outputs.directories) }}
        uses: ./.github/workflows/python-lint.yml
        permissions:
            contents: read
        with:
            soft-fail: false
            changed-files-only: false
            working-directory: ${{ matrix.directory }}

    pytest:
        name: "Python Tests (${{ matrix.directory }})"
        needs: discover-python-projects
        if: needs.discover-python-projects.outputs.has-projects == 'true'
        uses: ./.github/workflows/pytest-tests.yml
        permissions:
            contents: read
            id-token: write
        with:
            working-directory: ${{ matrix.directory }}
            soft-fail: false
            changed-files-only: false
        strategy:
            fail-fast: false
            matrix:
                directory: ${{ fromJson(needs.discover-python-projects.outputs.directories) }}

    release-please:
        name: Release Please
        needs:
            - spell-check
            - markdown-lint
            - table-format
            - dependency-pinning-scan
            - gitleaks-scan
            - pester-tests
            - docusaurus-tests
            - python-lint
            - pytest
        # Allow release-please to run when conditional CI jobs (python-lint,
        # pytest) are skipped. Block only on actual failures or cancellations.
        if: ${{ !cancelled() && !failure() }}
        runs-on: ubuntu-latest
        # release-please-config.json sets skip-github-release, so this job only
        # maintains the version and changelog pull request on main. Tag and
        # release creation belong to release-stable-publish.yml.
        permissions:
            contents: read
        outputs:
            release-pr-branch: ${{ steps.release-pr.outputs.branch }}
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            # The pull request payload is read through an environment variable and the
            # branch name is re-validated, so no release-please output reaches a shell
            # body by interpolation.
            - name: Resolve the release preparation branch
              id: release-pr
              if: ${{ steps.release.outputs.prs_created == 'true' }}
              env:
                  RELEASE_PR: ${{ steps.release.outputs.pr }}
              run: |
                  set -euo pipefail
                  branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName // ""')
                  if ! printf '%s' "$branch" | grep -Eq '^release-please--[A-Za-z0-9._/-]+$'; then
                    echo "::error::release-please reported an unexpected preparation branch"
                    exit 1
                  fi
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  echo "Release preparation branch: $branch"

    sync-release-pr:
        name: Sync Release Preparation Versions
        needs: [release-please]
        if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release-pr-branch != '' }}
        runs-on: ubuntu-latest
        # The head is release-please's own generated branch rather than a
        # contributor pull request head, so it carries main's trust level.
        permissions:
            contents: read
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            # Credentials persist only so this job can push the locator fix back onto
            # the same preparation branch; that push is its one required capability.
            - name: Checkout the release preparation branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release-please.outputs.release-pr-branch }}
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: true

            # release-please's json extra-files updater writes bare version values and
            # cannot express the catalog's plugins-v<version> locator. Update-VersionFiles.ps1
            # owns every committed version field and that locator together, so the
            # preparation commit that promotion later reads is already consistent.
            - name: Update committed version fields and the plugin locator
              env:
                  RELEASE_BRANCH: ${{ needs.release-please.outputs.release-pr-branch }}
              run: |
                  set -euo pipefail
                  VERSION=$(jq -r '.["."] // ""' .release-please-manifest.json)
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::.release-please-manifest.json has no MAJOR.MINOR.PATCH root version"
                    exit 1
                  fi

                  pwsh -NoProfile -File scripts/release/Update-VersionFiles.ps1 \
                    -Version "$VERSION" \
                    -SkipPluginGenerate

                  if git diff --quiet; then
                    echo "Preparation already carries $VERSION and locator plugins-v$VERSION"
                    exit 0
                  fi

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add --update
                  git commit -m "chore(release): sync committed versions and plugin locator to $VERSION"
                  git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
                  echo "Synced $VERSION and locator plugins-v$VERSION onto $RELEASE_BRANCH"

    prepare-promotion:
        name: Prepare Stable Promotion
        needs: [release-please, sync-release-pr]
        if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            version: ${{ steps.prepared.outputs.version }}
            promote: ${{ steps.promotion.outputs.promote }}
        steps:
            - name: Checkout prepared main commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify even-minor stable preparation
              id: prepared
              run: |
                  set -euo pipefail
                  VERSION=$(jq -r '.["."] // ""' .release-please-manifest.json)
                  if [ -z "$VERSION" ]; then
                    echo "::error::.release-please-manifest.json has no root version"
                    exit 1
                  fi
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Prepared version $VERSION is not MAJOR.MINOR.PATCH"
                    exit 1
                  fi

                  # Even/odd convention: even minor = stable. A prepared main commit
                  # that carries an odd minor is never promotable.
                  MINOR=$(echo "$VERSION" | cut -d. -f2)
                  if (( MINOR % 2 != 0 )); then
                    echo "::error::Prepared version $VERSION has odd minor ($MINOR); stable promotion requires an even minor"
                    exit 1
                  fi

                  for entry in "package.json:.version" "package-lock.json:.version" "extension/templates/package.template.json:.version" ".github/plugin/marketplace.json:.metadata.version"; do
                    file="${entry%%:*}"
                    path="${entry#*:}"
                    actual=$(jq -r "$path" "$file")
                    if [ "$actual" != "$VERSION" ]; then
                      echo "::error::$file $path is $actual but the prepared version is $VERSION"
                      exit 1
                    fi
                  done

                  if ! grep -Eq "^## \[${VERSION}\]" CHANGELOG.md; then
                    echo "::error::CHANGELOG.md has no prepared entry for $VERSION"
                    exit 1
                  fi

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Prepared stable version: $VERSION"

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Setup PowerShell modules
              uses: ./.github/actions/setup-ps-modules

            # The catalog pins an immutable plugins-v<version> source ref. Validating
            # it here keeps a promotion from carrying a catalog whose plugin locator
            # disagrees with the prepared version.
            - name: Validate catalog and plugin locator consistency
              run: |
                  mkdir -p logs
                  npm run lint:marketplace

            - name: Resolve promotion state
              id: promotion
              env:
                  BASE_BRANCH: release/stable
              run: |
                  set -euo pipefail
                  if ! git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null 2>&1; then
                    echo "::notice::$BASE_BRANCH does not exist yet; create and protect it before promotions can open"
                    echo "promote=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
                  main_tree=$(git rev-parse "HEAD^{tree}")
                  base_tree=$(git rev-parse "FETCH_HEAD^{tree}")
                  if [ "$main_tree" = "$base_tree" ]; then
                    echo "::notice::$BASE_BRANCH already matches the prepared main tree; nothing to promote"
                    echo "promote=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "promote=true" >> "$GITHUB_OUTPUT"

    open-promotion-pr:
        name: Open Stable Promotion PR
        needs: [prepare-promotion]
        if: ${{ needs.prepare-promotion.outputs.promote == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            # Auto-merge is deliberately never enabled. A human must review and merge
            # this promotion before release-stable-publish.yml may create a tag.
            - name: Open or update the promotion pull request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPO: ${{ github.repository }}
                  VERSION: ${{ needs.prepare-promotion.outputs.version }}
                  HEAD_BRANCH: main
                  BASE_BRANCH: release/stable
              run: |
                  set -euo pipefail
                  TITLE="chore(release): promote ${VERSION} to ${BASE_BRANCH}"
                  BODY="## Stable promotion ${VERSION}

                  Promotes \`${HEAD_BRANCH}\` into \`${BASE_BRANCH}\`.

                  Merging this pull request is the only trigger for the Stable tag and
                  GitHub release, which \`release-stable-publish.yml\` creates after it
                  re-verifies event identity, promoted-head and merge-tree equality, the
                  even minor version, tag absence, and one-package consistency.

                  ---
                  *Managed automatically by the stable release preparation workflow. Auto-merge is not enabled.*"

                  PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open \
                    --json number --jq '.[0].number // empty' \
                    -R "$REPO")

                  if [ -n "$PR_NUMBER" ]; then
                    gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY" -R "$REPO"
                    echo "Updated promotion PR #$PR_NUMBER for $VERSION"
                  else
                    gh pr create \
                      --head "$HEAD_BRANCH" \
                      --base "$BASE_BRANCH" \
                      --title "$TITLE" \
                      --body "$BODY" \
                      -R "$REPO"
                    echo "Created promotion PR for $VERSION"
                  fi
