name: Plugin Snapshot Publish

# Publishes one generated plugin snapshot from an explicit immutable source.
#
# Disposable mode writes only namespaced validation refs. Reusable production
# mode writes exactly one immutable plugins-v<version> tag and no branch. Both
# modes stage and verify the same orphan snapshot before any unforced push.

on:
  workflow_call:
    inputs:
      source-ref:
        description: "Immutable source to generate from"
        required: true
        type: string
      source-policy:
        description: "Trusted provenance policy for the immutable source"
        required: true
        type: string
      expected-version:
        description: "Version and plugins-v locator to project"
        required: true
        type: string
      production:
        description: "Publish the immutable plugins-v tag instead of disposable refs"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "plugins-snapshot/validate/**"
  workflow_dispatch:
    inputs:
      source-ref:
        description: "Immutable source to generate from (full commit SHA or tag)"
        required: true
        type: string
      expected-version:
        description: "Version the source must carry (leave empty to accept the source version)"
        required: false
        type: string
        default: ""
      snapshot-branch:
        description: "Disposable branch to publish (must start with plugins-snapshot/)"
        required: true
        type: string
      snapshot-tag:
        description: "Disposable tag to publish (must start with plugins-snapshot/)"
        required: true
        type: string
      dry-run:
        description: "Stage and verify only; do not push any reference"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.snapshot-tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DISPOSABLE_PREFIX: plugins-snapshot/

jobs:
  publish-snapshot:
    name: Stage and Verify Plugin Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      locator: ${{ steps.source.outputs.locator }}
      should-publish: ${{ steps.source.outputs.should-publish }}
      snapshot-branch: ${{ steps.source.outputs.snapshot-branch }}
      snapshot-mode: ${{ steps.source.outputs.snapshot-mode }}
      snapshot-tag: ${{ steps.source.outputs.snapshot-tag }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve source commit and version
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_POLICY: ${{ inputs.source-policy }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          REQUESTED_BRANCH: ${{ inputs.snapshot-branch || format('plugins-snapshot/dryrun-{0}', github.run_id) }}
          REQUESTED_TAG: ${{ inputs.snapshot-tag || format('plugins-snapshot/dryrun-{0}-tag', github.run_id) }}
          REQUESTED_DRY_RUN: ${{ github.event_name == 'push' || inputs.dry-run }}
          PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail

          validate_ref_value() {
            local name=$1
            local value=$2
            if [[ -n "${value}" && ! "${value}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }
          source_policy=${SOURCE_POLICY:-}
          if [ -z "${source_policy}" ]; then
            case "${GITHUB_EVENT_NAME}" in
              push)
                source_policy='direct-event'
                SOURCE_REF=${EVENT_SHA}
                ;;
              workflow_dispatch)
                source_policy='manual-authorized'
                ;;
              *)
                echo "::error::Unsupported direct event '${GITHUB_EVENT_NAME}'"
                exit 1
                ;;
            esac
          fi

          if [ -z "${SOURCE_REF}" ]; then
            echo "::error::source-ref is required and must not be blank"
            exit 1
          fi
          validate_ref_value 'source-ref' "${SOURCE_REF}"
          if [ -n "${EXPECTED_VERSION}" ] &&
            [[ ! "${EXPECTED_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::expected-version must use MAJOR.MINOR.PATCH form"
            exit 1
          fi

          case "${source_policy}" in
            'main-ancestor')
              if [[ ! "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::main-ancestor requires a full 40-character lowercase commit SHA"
                exit 1
              fi
              if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
                git fetch --quiet --unshallow --no-tags origin \
                  '+refs/heads/main:refs/remotes/origin/main'
              else
                git fetch --quiet --no-tags origin \
                  '+refs/heads/main:refs/remotes/origin/main'
              fi
              if ! git merge-base --is-ancestor "${SOURCE_REF}" refs/remotes/origin/main; then
                echo "::error::source-ref is not contained in main"
                exit 1
              fi
              source_commit=${SOURCE_REF}
              ;;
            'release-tag')
              if [[ ! "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::release-tag requires a full 40-character lowercase commit SHA"
                exit 1
              fi
              if [ -z "${EXPECTED_VERSION}" ]; then
                echo "::error::release-tag requires expected-version"
                exit 1
              fi
              git fetch --quiet --no-tags origin \
                "refs/tags/hve-core-v${EXPECTED_VERSION}:refs/tags/hve-core-v${EXPECTED_VERSION}"
              source_commit=$(git rev-parse --verify --end-of-options \
                "refs/tags/hve-core-v${EXPECTED_VERSION}^{commit}")
              if [ "${source_commit}" != "${SOURCE_REF}" ]; then
                echo "::error::release tag does not resolve to source-ref"
                exit 1
              fi
              ;;
            'direct-event')
              if [[ ! "${EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::direct-event requires a full event SHA"
                exit 1
              fi
              source_commit=$(git rev-parse HEAD)
              if [ "${source_commit}" != "${EVENT_SHA}" ] || [ "${SOURCE_REF}" != "${EVENT_SHA}" ]; then
                echo "::error::Direct event checkout does not match github.sha"
                exit 1
              fi
              ;;
            'manual-authorized')
              if [[ "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
                git fetch --quiet --no-tags origin "${SOURCE_REF}"
                source_commit=$(git rev-parse --verify --end-of-options 'FETCH_HEAD^{commit}')
                if [ "${source_commit}" != "${SOURCE_REF}" ]; then
                  echo "::error::Manual SHA did not resolve to the requested commit"
                  exit 1
                fi
              else
                if [[ "${SOURCE_REF}" == refs/* ]] ||
                  ! git check-ref-format "refs/tags/${SOURCE_REF}"; then
                  echo "::error::Manual tag is invalid or ambiguous"
                  exit 1
                fi
                git fetch --quiet --no-tags origin \
                  "refs/tags/${SOURCE_REF}:refs/tags/${SOURCE_REF}"
                source_commit=$(git rev-parse --verify --end-of-options \
                  "refs/tags/${SOURCE_REF}^{commit}")
              fi
              ;;
            *)
              echo "::error::Unsupported source policy '${source_policy}'"
              exit 1
              ;;
          esac

          git checkout --quiet --detach "${source_commit}"
          if [ "$(git rev-parse HEAD)" != "${source_commit}" ]; then
            echo "::error::Verified source checkout does not match resolved commit"
            exit 1
          fi

          committed_version=$(jq -r .version package.json)
          if [ "${PRODUCTION}" = 'true' ]; then
            if ! printf '%s' "${EXPECTED_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Production snapshot requires an expected MAJOR.MINOR.PATCH version"
              exit 1
            fi
            version=${EXPECTED_VERSION}
            snapshot_mode=Production
            snapshot_branch=''
            snapshot_tag="plugins-v${version}"
            dry_run=false
          else
            version=${committed_version}
            snapshot_mode=Disposable
            snapshot_branch=${REQUESTED_BRANCH}
            snapshot_tag=${REQUESTED_TAG}
            dry_run=${REQUESTED_DRY_RUN}
            if [ -n "${EXPECTED_VERSION}" ] && [ "${EXPECTED_VERSION}" != "${version}" ]; then
              echo "::error::Source ${SOURCE_REF} carries version ${version} but the caller requires ${EXPECTED_VERSION}"
              exit 1
            fi
          fi

          validate_ref_value 'snapshot-branch' "${snapshot_branch}"
          validate_ref_value 'snapshot-tag' "${snapshot_tag}"

          should_publish=false
          if [ "${snapshot_mode}" = 'Production' ] ||
            { [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ] && [ "${dry_run}" != 'true' ]; }; then
            should_publish=true
          fi
          {
            echo "commit=${source_commit}"
            echo "version=${version}"
            echo "locator=plugins-v${version}"
            echo "source-ref=${SOURCE_REF}"
            echo "snapshot-mode=${snapshot_mode}"
            echo "snapshot-branch=${snapshot_branch}"
            echo "snapshot-tag=${snapshot_tag}"
            echo "dry-run=${dry_run}"
            echo "should-publish=${should_publish}"
          } >> "$GITHUB_OUTPUT"
          echo "Source ref:    ${SOURCE_REF}"
          echo "Source commit: ${source_commit}"
          echo "Version:       ${version}"

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Validate publication target
        shell: bash
        env:
          SNAPSHOT_BRANCH: ${{ steps.source.outputs.snapshot-branch }}
          SNAPSHOT_TAG: ${{ steps.source.outputs.snapshot-tag }}
          SNAPSHOT_MODE: ${{ steps.source.outputs.snapshot-mode }}
        run: |
          set -euo pipefail
          export EXISTING_REFS_FILE="${RUNNER_TEMP}/existing-refs.txt"
          git ls-remote --heads --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            | awk '{print $2}' > "${EXISTING_REFS_FILE}"

          # Written to a file rather than piped: pwsh reading a script from
          # stdin stops silently at a line continuation and still exits 0.
          cat > "${RUNNER_TEMP}/validate-snapshot-target.ps1" <<'PWSH'
          $ErrorActionPreference = 'Stop'
          Import-Module ./scripts/plugins/Modules/PluginHelpers.psm1 -Force
          $existing = @(Get-Content -LiteralPath $env:EXISTING_REFS_FILE | Where-Object { $_ })
          $target = Assert-PluginSnapshotTarget `
            -Mode $env:SNAPSHOT_MODE `
            -Branch $env:SNAPSHOT_BRANCH `
            -Tag $env:SNAPSHOT_TAG `
            -ExistingRefs $existing `
            -DisposablePrefix $env:DISPOSABLE_PREFIX
          Write-Host "Approved snapshot refspecs: $($target.RefSpecs -join ' ')"
          PWSH

          pwsh -NoProfile -File "${RUNNER_TEMP}/validate-snapshot-target.ps1"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot and tag-pinned catalog
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.source.outputs.locator }}
        run: |
          set -euo pipefail
          mkdir -p logs
          # Locator mode refuses to write the production catalog, so the
          # tag-pinned catalog is emitted to a separate snapshot path.
          pwsh -NoProfile -File scripts/plugins/Generate-Plugins.ps1 \
            -Refresh \
            -ReleaseTag "${RELEASE_TAG}" \
            -MarketplaceOutputPath logs/marketplace-snapshot.json
          npm run plugin:postprocess

      - name: Verify generated roots match the projected catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/extension/Get-MarketplacePackageMatrix.ps1
          $expected = [string[]]@((Get-MarketplacePackageMatrixCore -Channel PreRelease -CatalogPath 'logs/marketplace-snapshot.json').Names)
          $actual = [string[]]@(Get-ChildItem -LiteralPath plugins -Directory | ForEach-Object { $_.Name })
          [array]::Sort($expected, [System.StringComparer]::Ordinal)
          [array]::Sort($actual, [System.StringComparer]::Ordinal)
          if ([string]::Join(',', $expected) -cne [string]::Join(',', $actual)) {
            throw "Generated package roots do not match the projected catalog package set: expected [$($expected -join ', ')], actual [$($actual -join ', ')]"
          }
          Write-Host "Verified $($actual.Count) generated package roots"

      - name: Record deterministic evidence
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ steps.source.outputs.locator }}
          EFFECTIVE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/plugins/Assert-PluginReleaseEvidence.ps1 \
            -SourceCommit "${SOURCE_COMMIT}" \
            -Version "${EFFECTIVE_VERSION}" \
            -ReleaseTag "${RELEASE_TAG}" \
            -OutputPath logs/plugin-release-evidence.json

      - name: Assert snapshot contains no symbolic links
        shell: bash
        run: |
          set -euo pipefail
          links=$(find plugins -type l | head -20)
          if [ -n "${links}" ]; then
            echo "::error::Generated snapshot contains symbolic links"
            echo "${links}"
            exit 1
          fi

      - name: Stage orphan snapshot commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ steps.source.outputs.locator }}
          EFFECTIVE_VERSION: ${{ steps.source.outputs.version }}
          SNAPSHOT_TAG: ${{ steps.source.outputs.snapshot-tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          snapshot_dir="${RUNNER_TEMP}/plugin-snapshot"
          rm -rf "${snapshot_dir}"
          mkdir -p "${snapshot_dir}"

          # Packages keep their plugins/<name> layout so the staged tree matches
          # the catalog locator path exactly.
          cp -R plugins "${snapshot_dir}/plugins"
          cp logs/plugin-release-evidence.json "${snapshot_dir}/plugin-release-evidence.json"
          cp logs/marketplace-snapshot.json "${snapshot_dir}/marketplace.json"

          # Orphan history: the snapshot repository shares no ancestry with the
          # source, so publishing can never rewrite or advance a source branch.
          git -C "${snapshot_dir}" init --initial-branch=snapshot --quiet
          git -C "${snapshot_dir}" add -A
          git -C "${snapshot_dir}" commit --quiet -m "chore(plugins): snapshot ${RELEASE_TAG} from ${SOURCE_COMMIT}"
          git -C "${snapshot_dir}" tag "${SNAPSHOT_TAG}"

          echo "Staged snapshot commit: $(git -C "${snapshot_dir}" rev-parse HEAD)"

      - name: Verify staged snapshot from a fresh clone
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ steps.source.outputs.locator }}
          EFFECTIVE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          snapshot_dir="${RUNNER_TEMP}/plugin-snapshot"
          verify_dir="${RUNNER_TEMP}/snapshot-verify"
          rm -rf "${verify_dir}"
          git clone --quiet --no-local "${snapshot_dir}" "${verify_dir}"

          links=$(find "${verify_dir}/plugins" -type l | head -20)
          if [ -n "${links}" ]; then
            echo "::error::Cloned snapshot contains symbolic links"
            echo "${links}"
            exit 1
          fi

          pwsh -NoProfile -File scripts/plugins/Assert-PluginReleaseEvidence.ps1 \
            -PluginsDir "${verify_dir}/plugins" \
            -SourceCommit "${SOURCE_COMMIT}" \
            -Version "${EFFECTIVE_VERSION}" \
            -ReleaseTag "${RELEASE_TAG}" \
            -ExpectedEvidencePath logs/plugin-release-evidence.json \
            -OutputPath logs/plugin-snapshot-verification.json

      - name: Archive verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir="${RUNNER_TEMP}/plugin-snapshot"
          tar --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf logs/plugin-snapshot.tar.gz \
            -C "${snapshot_dir}" .

      - name: Assert production catalog is unchanged
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .github/plugin/marketplace.json; then
            echo "::error::Production marketplace catalog was modified; publication is refused"
            git --no-pager diff --stat -- .github/plugin/marketplace.json
            exit 1
          fi

      - name: Summarize snapshot
        if: always()
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.source-ref }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          RELEASE_TAG: ${{ steps.source.outputs.locator }}
          SNAPSHOT_BRANCH: ${{ steps.source.outputs.snapshot-branch }}
          SNAPSHOT_TAG: ${{ steps.source.outputs.snapshot-tag }}
          DRY_RUN: ${{ steps.source.outputs.dry-run }}
          SNAPSHOT_MODE: ${{ steps.source.outputs.snapshot-mode }}
        run: |
          {
            echo "## Plugin Snapshot"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Source ref | \`${SOURCE_REF}\` |"
            echo "| Source commit | \`${SOURCE_COMMIT}\` |"
            echo "| Catalog locator | \`${RELEASE_TAG}\` |"
            echo "| Mode | \`${SNAPSHOT_MODE}\` |"
            echo "| Snapshot branch | \`${SNAPSHOT_BRANCH}\` |"
            echo "| Snapshot tag | \`${SNAPSHOT_TAG}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-snapshot-evidence
          path: |
            logs/plugin-release-evidence.json
            logs/plugin-snapshot-verification.json
            logs/marketplace-snapshot.json
            logs/plugin-snapshot.tar.gz
          if-no-files-found: warn

  push-snapshot:
    name: Publish Verified Plugin Snapshot
    needs: publish-snapshot
    if: ${{ needs.publish-snapshot.outputs.should-publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-snapshot-evidence
          path: ${{ runner.temp }}/snapshot-evidence

      - name: Publish verified snapshot
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish-snapshot.outputs.locator }}
          SNAPSHOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_BRANCH: ${{ needs.publish-snapshot.outputs.snapshot-branch }}
          SNAPSHOT_MODE: ${{ needs.publish-snapshot.outputs.snapshot-mode }}
          SNAPSHOT_TAG: ${{ needs.publish-snapshot.outputs.snapshot-tag }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/snapshot-evidence/plugin-snapshot.tar.gz"
          snapshot_dir="${RUNNER_TEMP}/plugin-snapshot"
          if [ ! -f "${archive}" ]; then
            echo "::error::Verified snapshot archive is missing"
            exit 1
          fi
          rm -rf "${snapshot_dir}"
          mkdir -p "${snapshot_dir}"
          tar -xzf "${archive}" -C "${snapshot_dir}"

          auth_header=$(printf 'x-access-token:%s' "${SNAPSHOT_TOKEN}" | base64 -w0)
          git -C "${snapshot_dir}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${snapshot_dir}" config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth_header}"

          if [ "${SNAPSHOT_MODE}" = 'Production' ]; then
            git -C "${snapshot_dir}" push --quiet origin "refs/tags/${RELEASE_TAG}"
            echo "Published immutable production snapshot ${RELEASE_TAG}"
          elif [ "${SNAPSHOT_MODE}" = 'Disposable' ]; then
            # Atomic and unforced: an existing tag rejects both reference updates.
            git -C "${snapshot_dir}" push --atomic --quiet origin \
              "HEAD:refs/heads/${SNAPSHOT_BRANCH}" \
              "refs/tags/${SNAPSHOT_TAG}"
            echo "Published disposable branch ${SNAPSHOT_BRANCH} and tag ${SNAPSHOT_TAG}"
          else
            echo "::error::Unsupported snapshot mode ${SNAPSHOT_MODE}"
            exit 1
          fi
