name: Pytest Tests

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing the Python skill to test'
        required: true
        type: string
      soft-fail:
        description: 'Whether to continue on test failures'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only run tests if Python files changed in this directory'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pytest:
    name: Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Codecov OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set artifact name
        id: artifact-name
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          echo "name=pytest-results-$(echo "$INPUT_WORKING_DIRECTORY" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Check for Python files
        id: check-python
        if: inputs.changed-files-only
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Check if any Python files changed in the working directory
          if git diff --name-only "$BASE_SHA" HEAD | grep -q "^${INPUT_WORKING_DIRECTORY}/.*\.py$"; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Python files changed in $INPUT_WORKING_DIRECTORY"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Python files changed in $INPUT_WORKING_DIRECTORY"
          fi

      - name: Install uv
        if: "!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true'"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Set up Python
        if: "!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true'"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: "!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true'"
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f "pyproject.toml" ]; then
            echo "Installing dependencies with uv sync --locked"
            uv sync --locked --dev
          else
            echo "No pyproject.toml found in $INPUT_WORKING_DIRECTORY"
            echo "Skipping dependency installation"
          fi

      - name: Set up Node for skill-local runtimes
        if: "!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true'"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install skill-local Node dependencies
        if: "!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true'"
        shell: bash
        env:
          SEARCH_ROOT: ${{ inputs.working-directory }}
        run: ./scripts/ci/install-skill-node-deps.sh

      - name: Run pytest with coverage
        if: "!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true'"
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pyproject.toml" ]; then
            echo "Running pytest with coverage"
            uv run pytest --cov --cov-report=xml:coverage.xml --cov-report=term-missing -v
          else
            echo "No pyproject.toml found - skipping tests"
          fi
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload test results
        if: always() && (!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.working-directory }}/coverage.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload to Codecov
        if: success() && (!inputs.changed-files-only || steps.check-python.outputs.has_changes == 'true')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ inputs.working-directory }}/coverage.xml
          use_oidc: true
          fail_ci_if_error: false
          verbose: true
          flags: pytest
          name: pytest-coverage-${{ inputs.working-directory }}
        continue-on-error: true
