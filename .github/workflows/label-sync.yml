name: Label Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
      - '.github/workflows/label-sync.yml'
      - 'scripts/ci/Sync-RepositoryLabels.ps1'
      - '.github/actions/setup-ps-modules/**'
      - 'scripts/security/Install-PSModules.ps1'
      - 'scripts/security/ps-module-versions.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-labels:
    name: Sync Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Sync labels
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/ci/Sync-RepositoryLabels.ps1
