name: Action Pin Provenance Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Verify Action Pins Against Upstream
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Required for SARIF upload to Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every SHA-pinned action must carry a comment naming a release tag that
      # points at the pinned commit, and the commit must be on an upstream tag or
      # in the default branch history. Findings are reported to code scanning
      # before the step fails. The read-only job token only raises the compare
      # API rate limit.
      - name: Verify action pins against upstream tags and history
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/security/Test-ActionPinProvenance.ps1 -SarifPath logs/action-pin-provenance.sarif

      # Uploading needs security-events: write, which a fork pull request never
      # receives. Skip the step for forks rather than attempt it; the check above
      # still gates every pull request.
      - name: Upload SARIF to Security tab
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: logs/action-pin-provenance.sarif
          category: action-pin-provenance
