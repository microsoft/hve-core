name: Stable Release Publish

# Runs release-please on release/stable after a reviewed pull request merges.
# A main promotion creates the managed release PR. Merging that managed PR lets
# release-please create the draft Stable release and emit the immutable release
# identity consumed by the artifact and publication gates below.

on:
    pull_request:
        types: [closed]
        branches:
            - release/stable

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        name: Release Please on release/stable
        if: >
            github.event.pull_request.merged == true
            && github.event.pull_request.base.ref == 'release/stable'
            && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release-pr-branch: ${{ steps.release-pr.outputs.branch }}
            release_created: ${{ steps.release-pr.outputs.release_created }}
            tag_name: ${{ steps.release-pr.outputs.tag_name }}
            version: ${{ steps.release-pr.outputs.version }}
            sha: ${{ steps.release-pr.outputs.sha }}
            body: ${{ steps.release.outputs.body }}
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Run release-please
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
                  target-branch: release/stable

            - name: Validate release-please outputs
              id: release-pr
              env:
                  PRS_CREATED: ${{ steps.release.outputs.prs_created }}
                  RELEASE_PR: ${{ steps.release.outputs.pr }}
                  RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
                  RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
                  RELEASE_VERSION: ${{ steps.release.outputs.version }}
                  RELEASE_SHA: ${{ steps.release.outputs.sha }}
                  RELEASE_BODY: ${{ steps.release.outputs.body }}
              run: |
                  set -euo pipefail

                  branch=''
                  if [ "$PRS_CREATED" = 'true' ]; then
                    branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName // ""')
                    if ! printf '%s' "$branch" | grep -Eq '^release-please--[A-Za-z0-9._/-]+$'; then
                      echo "::error::release-please reported an unexpected preparation branch"
                      exit 1
                    fi
                  fi

                  if [ "$RELEASE_CREATED" = 'true' ]; then
                    if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::release-please reported an invalid version"
                      exit 1
                    fi
                    if [ "$RELEASE_TAG" != "hve-core-v$RELEASE_VERSION" ]; then
                      echo "::error::release-please tag $RELEASE_TAG does not match version $RELEASE_VERSION"
                      exit 1
                    fi
                    if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
                      echo "::error::release-please reported an invalid release SHA"
                      exit 1
                    fi
                    if [ -z "$RELEASE_BODY" ]; then
                      echo "::error::release-please reported an empty release body"
                      exit 1
                    fi
                  fi

                  {
                    echo "branch=$branch"
                    echo "release_created=$RELEASE_CREATED"
                    echo "tag_name=$RELEASE_TAG"
                    echo "version=$RELEASE_VERSION"
                    echo "sha=$RELEASE_SHA"
                  } >> "$GITHUB_OUTPUT"

    sync-release-pr:
        name: Sync Release Preparation Versions
        needs: [release-please]
        if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release-pr-branch != '' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Checkout trusted release updater
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  sparse-checkout: scripts/release/Update-VersionFiles.ps1
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            # Data-only checkout: executable tooling comes from the trusted github.sha checkout.
            - name: Checkout release preparation data
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.release-please.outputs.release-pr-branch }}
                  path: release-preparation
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: true

            - name: Update committed version fields and the plugin locator
              env:
                  RELEASE_BRANCH: ${{ needs.release-please.outputs.release-pr-branch }}
              run: |
                  set -euo pipefail
                  RELEASE_REPO="$GITHUB_WORKSPACE/release-preparation"
                  VERSION=$(jq -r '.["."] // ""' "$RELEASE_REPO/.release-please-manifest.json")
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    echo "::error::.release-please-manifest.json has no MAJOR.MINOR.PATCH root version"
                    exit 1
                  fi

                  pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/release/Update-VersionFiles.ps1" \
                      -Version "$VERSION" \
                      -RepoRoot "$RELEASE_REPO" \
                      -SkipPluginGenerate

                  cd "$RELEASE_REPO"
                  if git diff --quiet; then
                    echo "Preparation already carries $VERSION and locator plugins-v$VERSION"
                    exit 0
                  fi

                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add --update
                  git commit -m "chore(release): sync committed versions and plugin locator to $VERSION"
                  git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

    validate-release:
        name: Validate release-please Stable output
        needs: [release-please]
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            version: ${{ needs.release-please.outputs.version }}
            tag_name: ${{ needs.release-please.outputs.tag_name }}
            sha: ${{ github.sha }}
        steps:
            - name: Verify trusted release identity
              env:
                  EVENT_SHA: ${{ github.sha }}
                  RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
              run: |
                  set -euo pipefail
                  if [ "$RELEASE_SHA" != "$EVENT_SHA" ]; then
                    echo "::error::release-please SHA does not match the merged release/stable commit"
                    exit 1
                  fi

            - name: Checkout released commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Verify release version and committed state
              env:
                  RELEASE_SHA: ${{ github.sha }}
                  RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
                  RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
              run: |
                  set -euo pipefail
                  if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
                    echo "::error::Checked-out commit does not match the release-please SHA"
                    exit 1
                  fi

                  MINOR=$(printf '%s' "$RELEASE_VERSION" | cut -d. -f2)
                  if (( MINOR % 2 != 0 )); then
                    echo "::error::Stable version $RELEASE_VERSION has an odd minor"
                    exit 1
                  fi

                  for entry in "package.json:.version" "package-lock.json:.version" ".release-please-manifest.json:.\".\"" "extension/templates/package.template.json:.version" ".github/plugin/marketplace.json:.metadata.version"; do
                    file="${entry%%:*}"
                    path="${entry#*:}"
                    actual=$(jq -r "$path" "$file")
                    if [ "$actual" != "$RELEASE_VERSION" ]; then
                      echo "::error::$file $path is $actual but release-please reported $RELEASE_VERSION"
                      exit 1
                    fi
                  done

                  if ! jq -e --arg version "$RELEASE_VERSION" '
                    all(.plugins[]; .version == $version and .source.ref == ("plugins-v" + $version))
                  ' .github/plugin/marketplace.json >/dev/null; then
                    echo "::error::Catalog versions or immutable plugin locators are inconsistent"
                    exit 1
                  fi

                  if ! grep -Eq "^## \[${RELEASE_VERSION}\]" CHANGELOG.md; then
                    echo "::error::CHANGELOG.md has no release entry for $RELEASE_VERSION"
                    exit 1
                  fi

            - name: Setup PowerShell modules
              uses: ./.github/actions/setup-ps-modules

            - name: Verify cross-channel package-set consistency
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  . ./scripts/extension/Get-MarketplacePackageMatrix.ps1
                  $catalogPath = './.github/plugin/marketplace.json'
                  $sets = @{}
                  foreach ($channel in @('Stable', 'PreRelease')) {
                    $names = [string[]]@((Get-MarketplacePackageMatrixCore -Channel $channel -CatalogPath $catalogPath).Names)
                    if ($names.Count -eq 0) {
                      throw "No $channel packages are eligible in $catalogPath"
                    }
                    [array]::Sort($names, [System.StringComparer]::Ordinal)
                    $sets[$channel] = $names
                  }
                  if ([string]::Join(',', $sets['Stable']) -cne [string]::Join(',', $sets['PreRelease'])) {
                    throw "Stable and PreRelease package sets differ: Stable [$($sets['Stable'] -join ', ')] versus PreRelease [$($sets['PreRelease'] -join ', ')]"
                  }
                  Write-Host "Verified $($sets['Stable'].Count) packages in both channels: $($sets['Stable'] -join ', ')"

    close-milestone:
        name: Close Release Milestone
        needs: [validate-release, publish-release]
        runs-on: ubuntu-latest
        permissions:
            issues: write
        steps:
            - name: Close milestone for released version
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  VERSION: ${{ needs.validate-release.outputs.version }}
              run: |
                  set -euo pipefail
                  MAJOR=$(echo "$VERSION" | cut -d. -f1)
                  MINOR=$(echo "$VERSION" | cut -d. -f2)
                  TITLE="v${MAJOR}.${MINOR}.0"
                  NUMBER=$(gh api "/repos/$REPOSITORY/milestones?state=open&per_page=100" \
                    --jq ".[] | select(.title == \"$TITLE\") | .number")
                  if [ -n "$NUMBER" ]; then
                    gh api "/repos/$REPOSITORY/milestones/$NUMBER" \
                      -X PATCH -f state=closed
                    echo "✅ Closed milestone $TITLE (#$NUMBER)"
                  else
                    echo "ℹ️ No open milestone found matching '$TITLE' — skipping"
                  fi

    extension-provenance:
        name: Package and Attest VS Code Extensions (Release)
        needs: [validate-release, generate-dependency-sbom]
        uses: ./.github/workflows/extension-provenance.yml
        with:
            source-ref: ${{ needs.validate-release.outputs.sha }}
            version: ${{ needs.validate-release.outputs.version }}
            channel: Stable
            release-tag: ${{ needs.validate-release.outputs.tag_name }}
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write

    plugin-package-release:
        name: Package Plugins (Release)
        needs: [validate-release]
        uses: ./.github/workflows/plugin-package.yml
        with:
            source-ref: ${{ needs.validate-release.outputs.sha }}
            source-policy: release-tag
            version: ${{ needs.validate-release.outputs.version }}
        permissions:
            contents: read

    plugin-snapshot-production:
        name: Publish Immutable Plugin Snapshot (Stable)
        needs: [validate-release, plugin-package-release]
        uses: ./.github/workflows/plugin-snapshot-publish.yml
        with:
            source-ref: ${{ needs.validate-release.outputs.sha }}
            source-policy: release-tag
            expected-version: ${{ needs.validate-release.outputs.version }}
            production: true
        permissions:
            contents: write

    generate-dependency-sbom:
        name: Generate Dependency SBOM
        needs: [validate-release]
        runs-on: ubuntu-latest
        permissions:
            # write required for gh release upload to attach SBOM to the release
            contents: write
        steps:
            - name: Checkout dependency manifests
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.validate-release.outputs.sha }}
                  sparse-checkout: |
                      package.json
                      package-lock.json
                      .syft.yaml
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Generate dependency SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  path: .
                  format: spdx-json
                  output-file: dependencies.spdx.json
                  upload-release-assets: false
                  upload-artifact: false
                  config: .syft.yaml
                  dependency-snapshot: true

            - name: Upload dependency SBOM artifact
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: sbom-dependencies
                  path: dependencies.spdx.json

            - name: Upload dependency SBOM to release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.validate-release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  gh release upload "$TAG" \
                    "dependencies.spdx.json" \
                    --clobber -R "$REPOSITORY"

    upload-plugin-packages:
        name: Attest and Upload Plugin (${{ matrix.id }})
        needs:
            [validate-release, plugin-package-release, generate-dependency-sbom]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.plugin-package-release.outputs.packages-matrix) }}
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write
        steps:
            - name: Checkout Syft config
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.validate-release.outputs.sha }}
                  sparse-checkout: .syft.yaml
                  sparse-checkout-cone-mode: false
                  persist-credentials: false

            - name: Download dependency SBOM
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: sbom-dependencies
                  path: ./sbom

            - name: Download plugin artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: plugin-package-${{ matrix.id }}
                  path: ./dist/plugins

            - name: Verify plugin archive exists
              run: |
                  PLUGIN_ARCHIVE="dist/plugins/${{ matrix.id }}.zip"
                  if [ ! -f "$PLUGIN_ARCHIVE" ]; then
                    echo "::error::Plugin archive not found for package ${{ matrix.id }}"
                    exit 1
                  fi

            - name: Generate SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
              with:
                  file: dist/plugins/${{ matrix.id }}.zip
                  format: spdx-json
                  output-file: dist/plugins/${{ matrix.id }}.zip.spdx.json
                  artifact-name: sbom-plugin-${{ matrix.id }}
                  upload-release-assets: false
                  upload-artifact: true
                  config: .syft.yaml

            - name: Verify SBOM files exist
              run: |
                  test -f "dist/plugins/${{ matrix.id }}.zip.spdx.json" \
                    || { echo "::error::Per-plugin SBOM not found: dist/plugins/${{ matrix.id }}.zip.spdx.json"; exit 1; }
                  test -f "sbom/dependencies.spdx.json" \
                    || { echo "::error::Dependency SBOM not found: sbom/dependencies.spdx.json"; exit 1; }

            - name: Attest build provenance
              id: attest
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: dist/plugins/${{ matrix.id }}.zip

            - name: Attest SBOM
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: dist/plugins/${{ matrix.id }}.zip
                  sbom-path: dist/plugins/${{ matrix.id }}.zip.spdx.json

            - name: Attest dependency SBOM
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: dist/plugins/${{ matrix.id }}.zip
                  sbom-path: sbom/dependencies.spdx.json

            - name: Upload assets to GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.validate-release.outputs.tag_name }}
                  BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
              run: |
                  set -euo pipefail
                  cp "$BUNDLE_PATH" \
                    "dist/plugins/${{ matrix.id }}.zip.sigstore.json"
                  jq -c '.dsseEnvelope' "$BUNDLE_PATH" > \
                    "dist/plugins/${{ matrix.id }}.zip.intoto.jsonl"
                  gh release upload "$TAG" \
                    "dist/plugins/${{ matrix.id }}.zip" \
                    "dist/plugins/${{ matrix.id }}.zip.spdx.json" \
                    "dist/plugins/${{ matrix.id }}.zip.sigstore.json" \
                    "dist/plugins/${{ matrix.id }}.zip.intoto.jsonl" \
                    --clobber -R "$REPOSITORY"

    vex-attest:
        name: Attest and Upload VEX
        needs: [validate-release, generate-dependency-sbom]
        uses: ./.github/workflows/vex-attest.yml
        with:
            version: ${{ needs.validate-release.outputs.tag_name }}
            sbom-artifact: sbom-dependencies
        permissions:
            contents: write
            id-token: write
            attestations: write
            artifact-metadata: write

    verify-provenance:
        name: Verify Provenance
        needs:
            [
                validate-release,
                extension-provenance,
                upload-plugin-packages,
                plugin-snapshot-production,
                vex-attest,
            ]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            attestations: read
        steps:
            - name: Checkout verification script
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.validate-release.outputs.sha }}
                  persist-credentials: false

            - name: Download release artifacts
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  mkdir -p ./artifacts
                  gh release download "$RELEASE_TAG" \
                    -R "$REPOSITORY" \
                    -p '*.vsix' \
                    -p '*.zip' \
                    -p 'hve-core.openvex.json' \
                    -D ./artifacts

            - name: Verify build provenance
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  ARTIFACT_DIRECTORY: ./artifacts
                  REPOSITORY: ${{ github.repository }}
              run: |
                  & ./scripts/release/Invoke-ProvenanceVerification.ps1 -ArtifactDirectory $env:ARTIFACT_DIRECTORY -Repository $env:REPOSITORY

    sbom-diff:
        name: SBOM Dependency Diff
        needs: [validate-release, generate-dependency-sbom]
        runs-on: ubuntu-latest
        continue-on-error: true
        permissions:
            contents: write
        steps:
            - name: Download current dependency SBOM
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: sbom-dependencies
                  path: ./current

            - name: Verify current dependency SBOM
              run: |
                  test -f "current/dependencies.spdx.json" \
                    || { echo "::error::Current dependency SBOM not found in artifact"; exit 1; }

            - name: Download previous release dependency SBOM
              id: previous
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  PREV_TAG=$(gh api "/repos/$REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
                  if [ -z "$PREV_TAG" ]; then
                    echo "No previous release found"
                    echo "found=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "Previous release: $PREV_TAG"
                  echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
                  mkdir -p previous
                  if gh release download "$PREV_TAG" -R "$REPOSITORY" -p "dependencies.spdx.json" -D previous 2>/dev/null; then
                    echo "found=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Previous release has no dependency SBOM"
                    echo "found=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Generate dependency diff
              if: ${{ steps.previous.outputs.found == 'true' }}
              run: |
                  python3 <<'PYTHON'
                  import json
                  import pathlib

                  def load_packages(path):
                      with open(path) as f:
                          data = json.load(f)
                      root_ids = set(data.get('documentDescribes', []))
                      pkgs = {}
                      for p in data.get('packages', []):
                          if p.get('SPDXID', '') in root_ids:
                              continue
                          name = p.get('name', 'unknown')
                          version = p.get('versionInfo', 'unknown')
                          pkgs[name] = version
                      return pkgs

                  current = load_packages('current/dependencies.spdx.json')
                  previous = load_packages('previous/dependencies.spdx.json')

                  added = {k: v for k, v in current.items() if k not in previous}
                  removed = {k: v for k, v in previous.items() if k not in current}
                  changed = {
                      k: (previous[k], current[k])
                      for k in current
                      if k in previous and current[k] != previous[k]
                  }

                  lines = ['# Dependency SBOM Diff', '']
                  if not added and not removed and not changed:
                      lines.append('No dependency changes detected.')
                  else:
                      if added:
                          lines.extend(['## Added', '', '| Package | Version |', '|---------|---------|'])
                          for name in sorted(added):
                              lines.append(f'| {name} | {added[name]} |')
                          lines.append('')
                      if removed:
                          lines.extend(['## Removed', '', '| Package | Version |', '|---------|---------|'])
                          for name in sorted(removed):
                              lines.append(f'| {name} | {removed[name]} |')
                          lines.append('')
                      if changed:
                          lines.extend([
                              '## Version Changes', '',
                              '| Package | Previous | Current |',
                              '|---------|----------|---------|',
                          ])
                          for name in sorted(changed):
                              old, new = changed[name]
                              lines.append(f'| {name} | {old} | {new} |')
                          lines.append('')

                  lines.extend(['', '_Generated from SPDX JSON dependency SBOMs._', ''])
                  pathlib.Path('dependency-diff.md').write_text('\n'.join(lines))
                  count = len(added) + len(removed) + len(changed)
                  print(f'Diff: {len(added)} added, {len(removed)} removed, {len(changed)} changed')
                  PYTHON

            - name: Upload diff to GitHub Release
              if: ${{ steps.previous.outputs.found == 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.validate-release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  gh release upload "$TAG" \
                    "dependency-diff.md" \
                    --clobber -R "$REPOSITORY"

    append-verification-notes:
        name: Append Verification Instructions
        needs:
            [
                validate-release,
                extension-provenance,
                upload-plugin-packages,
                verify-provenance,
            ]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Append verification section to release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.validate-release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  gh release view "$TAG" --json body --jq '.body' -R "$REPOSITORY" > notes.md
                  cat >> notes.md <<'EOF'

                  ## Verifying Downloads

                  All release assets include [Sigstore](https://www.sigstore.dev/) build-provenance
                  attestations generated by GitHub Actions. Verify any downloaded asset with the
                  GitHub CLI:

                  ```bash
                  # Verify a VSIX extension package
                  gh attestation verify <file>.vsix --repo microsoft/hve-core

                  # Verify a plugin ZIP package
                  gh attestation verify <file>.zip --repo microsoft/hve-core
                  ```

                  ## VEX (Vulnerability Exploitability eXchange)

                  This release includes a foundational [OpenVEX](https://openvex.dev/) document
                  (`hve-core.openvex.json`). It establishes the signed, attested VEX artifact that future
                  releases populate with per-CVE exploitability statements. Until statements are added, the
                  document carries no vulnerability assessments and is not authoritative triage. Once
                  populated, use it alongside the SBOM to filter false positives in vulnerability scanners:

                  ```bash
                  # Verify VEX attestation
                  gh attestation verify hve-core.openvex.json --repo microsoft/hve-core
                  ```

                  See [SECURITY.md](https://github.com/microsoft/hve-core/blob/main/SECURITY.md)
                  for full supply-chain verification details including SBOM and VEX validation.
                  EOF
                  gh release edit "$TAG" --notes-file notes.md -R "$REPOSITORY"

    publish-release:
        name: Publish GitHub Release
        needs:
            [
                validate-release,
                extension-provenance,
                upload-plugin-packages,
                plugin-snapshot-production,
                vex-attest,
                verify-provenance,
                sbom-diff,
                append-verification-notes,
            ]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.validate-release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  # Promote draft to published. The release becomes immutable
                  # after publish with all assets already attached.
                  gh release edit "$TAG" --draft=false -R "$REPOSITORY"

    open-main-sync-pr:
        name: Open Stable Metadata Sync PR
        needs: [validate-release, publish-release]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Generate GitHub App Token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Open or update the Stable metadata synchronization pull request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  REPOSITORY: ${{ github.repository }}
                  VERSION: ${{ needs.validate-release.outputs.version }}
                  HEAD_BRANCH: release/stable
                  BASE_BRANCH: main
              run: |
                  set -euo pipefail
                  TITLE="chore(release): sync ${VERSION} metadata to main"
                  BODY="## Stable release metadata synchronization

                  Synchronizes release-please version, changelog, manifest, and immutable
                  plugin locator state from \`${HEAD_BRANCH}\` to \`${BASE_BRANCH}\` after
                  Stable publication.

                  ---
                  *Managed automatically by the Stable release workflow. Auto-merge is not enabled.*"

                  PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open \
                    --json number --jq '.[0].number // empty' -R "$REPOSITORY")
                  if [ -n "$PR_NUMBER" ]; then
                    gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY" -R "$REPOSITORY"
                  else
                    gh pr create \
                      --head "$HEAD_BRANCH" \
                      --base "$BASE_BRANCH" \
                      --title "$TITLE" \
                      --body "$BODY" \
                      -R "$REPOSITORY"
                  fi
