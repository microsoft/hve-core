name: Stable Release Preparation

# Runs release-please after an approved promotion or managed release pull
# request merges into release/stable. The promotion prepares release metadata;
# the managed release pull request creates the draft and immutable tag.

on:
  pull_request:
    types: [closed]
    branches:
      - release/stable

concurrency:
  group: ${{ github.workflow }}-release/stable
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-trigger:
    name: Validate Stable Release Trigger
    if: >
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'release/stable'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.head.ref == 'release-please--branches--release/stable'
        || startsWith(github.event.pull_request.head.ref, 'release-promotion--release-prerelease--to--release-stable--prerelease-v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.identity.outputs.mode }}
      release-tag: ${{ steps.managed.outputs.release-tag }}
      release-version: ${{ steps.managed.outputs.release-version }}
      source-tag: ${{ steps.identity.outputs.source-tag }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Validate merged head identity
        id: identity
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MANAGED_HEAD: release-please--branches--release/stable
          MERGED: ${{ github.event.pull_request.merged }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$MERGED" != 'true' ] || [ "$BASE_REF" != 'release/stable' ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "::error::Stable release trigger is not a merged same-repository pull request into release/stable"
            exit 1
          fi
          if [ "$MERGE_SHA" != "$EVENT_SHA" ]; then
            echo "::error::Pull request merge commit $MERGE_SHA does not match event SHA $EVENT_SHA"
            exit 1
          fi

          SOURCE_TAG=''
          if [ "$HEAD_REF" = "$MANAGED_HEAD" ]; then
            MODE='managed'
          elif [[ "$HEAD_REF" =~ ^release-promotion--release-prerelease--to--release-stable--(prerelease-v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            MODE='promotion'
            SOURCE_TAG=${BASH_REMATCH[1]}
            SOURCE_VERSION=${SOURCE_TAG#prerelease-v}
            SOURCE_MINOR=${SOURCE_VERSION#*.}
            SOURCE_MINOR=${SOURCE_MINOR%%.*}
            if (( 10#$SOURCE_MINOR % 2 == 0 )); then
              echo "::error::Stable promotion source $SOURCE_TAG has an even minor"
              exit 1
            fi
          else
            echo "::error::Merged head $HEAD_REF is not an authorized Stable release head"
            exit 1
          fi

          {
            echo "mode=$MODE"
            echo "source-tag=$SOURCE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate selected promotion source and intent
        id: source
        if: ${{ steps.identity.outputs.mode == 'promotion' }}
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_TAG: ${{ steps.identity.outputs.source-tag }}
        run: |
          set -euo pipefail

          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Stable promotion event carries an invalid commit SHA"
            exit 1
          fi
          SOURCE_VERSION=${SOURCE_TAG#prerelease-v}

          # Annotated tags peel to a commit through the API, bounded by a hop
          # limit and a visited set so a malformed chain cannot loop.
          tag_object=$(gh api "/repos/$REPOSITORY/git/ref/tags/$SOURCE_TAG" --jq '.object.type + " " + .object.sha')
          object_type=${tag_object%% *}
          object_sha=${tag_object##* }
          visited=''
          SOURCE_SHA=''
          hop=0
          while [ "$hop" -lt 10 ]; do
            hop=$((hop + 1))
            if [ "$object_type" = 'commit' ]; then
              SOURCE_SHA="$object_sha"
              break
            fi
            if [ "$object_type" != 'tag' ]; then
              echo "::error::$SOURCE_TAG resolves to unsupported object type $object_type"
              exit 1
            fi
            case " $visited " in
              *" $object_sha "*)
                echo "::error::$SOURCE_TAG tag chain revisits $object_sha"
                exit 1
                ;;
            esac
            visited="$visited $object_sha"
            tag_object=$(gh api "/repos/$REPOSITORY/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')
            object_type=${tag_object%% *}
            object_sha=${tag_object##* }
          done
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$SOURCE_TAG did not peel to a commit within the allowed hops"
            exit 1
          fi

          release_state=$(gh api "/repos/$REPOSITORY/releases/tags/$SOURCE_TAG" \
            --jq '[.draft, .prerelease, (.published_at != null), .tag_name] | @tsv' 2>/dev/null || true)
          if [ "$release_state" != $'false\ttrue\ttrue\t'"$SOURCE_TAG" ]; then
            echo "::error::$SOURCE_TAG is not a published, non-draft GitHub PreRelease"
            exit 1
          fi

          MANIFEST_VERSION=$(gh api -H 'Accept: application/vnd.github.raw' \
            "/repos/$REPOSITORY/contents/.release-please-prerelease-manifest.json?ref=$SOURCE_SHA" \
            | jq -r '.["."] // ""')
          if [ "$MANIFEST_VERSION" != "$SOURCE_VERSION" ]; then
            echo "::error::$SOURCE_TAG resolves to $SOURCE_SHA but the PreRelease manifest carries $MANIFEST_VERSION"
            exit 1
          fi

          # Mutable release branches are resolved once, and containment is proved
          # against the resolved immutable commits through the compare API.
          PRERELEASE_SHA=$(gh api "/repos/$REPOSITORY/git/ref/heads/release/prerelease" --jq '.object.sha')
          STABLE_SHA=$(gh api "/repos/$REPOSITORY/git/ref/heads/release/stable" --jq '.object.sha')
          for resolved in "release/prerelease:$PRERELEASE_SHA" "release/stable:$STABLE_SHA"; do
            if [[ ! "${resolved#*:}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${resolved%%:*} did not resolve to a commit SHA"
              exit 1
            fi
          done

          CONTAINMENT=$(gh api "/repos/$REPOSITORY/compare/$SOURCE_SHA...$PRERELEASE_SHA" --jq '.status')
          if [ "$CONTAINMENT" != 'ahead' ] && [ "$CONTAINMENT" != 'identical' ]; then
            echo "::error::$SOURCE_TAG commit $SOURCE_SHA is not contained in release/prerelease"
            exit 1
          fi

          # The event head SHA is immutable, so the promotion head is compared
          # directly rather than fetched.
          HEAD_CONTAINMENT=$(gh api "/repos/$REPOSITORY/compare/$SOURCE_SHA...$HEAD_SHA" --jq '.status')
          if [ "$HEAD_CONTAINMENT" != 'ahead' ] && [ "$HEAD_CONTAINMENT" != 'identical' ]; then
            echo "::error::Promotion head $HEAD_SHA does not contain selected source $SOURCE_SHA"
            exit 1
          fi

          CANDIDATE=$(gh api -H 'Accept: application/vnd.github.raw' \
            "/repos/$REPOSITORY/contents/release-please-config.json?ref=$EVENT_SHA" \
            | jq -r '.packages["."]["release-as"] // ""')
          BASELINE=$(gh api -H 'Accept: application/vnd.github.raw' \
            "/repos/$REPOSITORY/contents/.release-please-manifest.json?ref=$STABLE_SHA" \
            | jq -r '.["."] // ""')
          for entry in "candidate:$CANDIDATE" "baseline:$BASELINE"; do
            value=${entry#*:}
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* || ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${entry%%:*} Stable version is not canonical MAJOR.MINOR.PATCH"
              exit 1
            fi
          done
          CANDIDATE_MINOR=${CANDIDATE#*.}
          CANDIDATE_MINOR=${CANDIDATE_MINOR%%.*}
          if (( 10#$CANDIDATE_MINOR % 2 != 0 )); then
            echo "::error::Stable candidate $CANDIDATE has an odd minor"
            exit 1
          fi
          if [ "$CANDIDATE" = "$BASELINE" ] || [ "$(printf '%s\n%s\n' "$CANDIDATE" "$BASELINE" | sort -V | tail -1)" = "$BASELINE" ]; then
            echo "::error::Stable promotion proposes $CANDIDATE but release/stable already carries $BASELINE"
            exit 1
          fi

          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate managed release intent was consumed
        id: managed
        if: ${{ steps.identity.outputs.mode == 'managed' }}
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          INTENT=$(gh api -H 'Accept: application/vnd.github.raw' \
            "/repos/$REPOSITORY/contents/release-please-config.json?ref=$EVENT_SHA" \
            | jq -r '.packages["."]["release-as"] // ""')
          if [ -n "$INTENT" ]; then
            echo "::error::Managed Stable merge still carries release-as $INTENT"
            exit 1
          fi

          VERSION=$(gh api -H 'Accept: application/vnd.github.raw' \
            "/repos/$REPOSITORY/contents/.release-please-manifest.json?ref=$EVENT_SHA" \
            | jq -r '.["."] // ""')
          if [[ "$VERSION" == *$'\n'* || "$VERSION" == *$'\r'* || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.release-please-manifest.json at $EVENT_SHA is not canonical MAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION_MINOR=${VERSION#*.}
          VERSION_MINOR=${VERSION_MINOR%%.*}
          if (( 10#$VERSION_MINOR % 2 != 0 )); then
            echo "::error::Managed Stable release $VERSION has an odd minor"
            exit 1
          fi
          {
            echo "release-tag=v$VERSION"
            echo "release-version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  release-please:
    name: Release Please on release/stable
    needs: [validate-trigger]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-pr-branch: ${{ steps.release-pr.outputs.branch }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: release/stable
          # Only the managed release pull request tags. The reviewed
          # promotion merge prepares metadata without creating a tag.
          skip-github-release: ${{ needs.validate-trigger.outputs.mode != 'managed' }}
          skip-github-pull-request: ${{ needs.validate-trigger.outputs.mode == 'managed' }}

      - name: Verify managed release identity
        if: ${{ needs.validate-trigger.outputs.mode == 'managed' }}
        shell: bash
        env:
          CREATED_SHA: ${{ steps.release.outputs.sha }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          EXPECTED_CHANNEL: Stable
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ needs.validate-trigger.outputs.release-tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          ROOT_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ANY_RELEASE_CREATED: ${{ steps.release.outputs.releases_created }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$ROOT_RELEASE_CREATED" ] && [ "$ROOT_RELEASE_CREATED" != 'true' ] && [ "$ROOT_RELEASE_CREATED" != 'false' ]; then
            echo "::error::release-please returned invalid root release_created state"
            exit 1
          fi
          if [ "$ANY_RELEASE_CREATED" != 'true' ] && [ "$ANY_RELEASE_CREATED" != 'false' ]; then
            echo "::error::release-please returned invalid releases_created state"
            exit 1
          fi
          if ! printf '%s' "$PATHS_RELEASED" | jq -e 'type == "array"' >/dev/null; then
            echo "::error::release-please returned malformed paths_released"
            exit 1
          fi
          if [ "$ROOT_RELEASE_CREATED" = 'true' ]; then
            if [ "$ANY_RELEASE_CREATED" != 'true' ] \
              || ! printf '%s' "$PATHS_RELEASED" | jq -e 'length == 1 and .[0] == "."' >/dev/null \
              || [ "$CREATED_TAG" != "$EXPECTED_TAG" ] \
              || [ "$CREATED_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::release-please created an unexpected managed release identity"
              exit 1
            fi
          elif [ "$ANY_RELEASE_CREATED" != 'false' ] \
            || ! printf '%s' "$PATHS_RELEASED" | jq -e 'length == 0' >/dev/null \
            || [ -n "$CREATED_TAG" ] \
            || [ -n "$CREATED_SHA" ]; then
            echo "::error::release-please returned inconsistent empty managed release outputs"
            exit 1
          fi

          tag_object=$(gh api "/repos/$REPOSITORY/git/ref/tags/$EXPECTED_TAG" --jq '.object.type + " " + .object.sha')
          object_type=${tag_object%% *}
          object_sha=${tag_object##* }
          visited=''
          tag_sha=''
          for _ in $(seq 1 10); do
            if [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$EXPECTED_TAG resolved to an invalid Git object"
              exit 1
            fi
            if [ "$object_type" = 'commit' ]; then
              tag_sha="$object_sha"
              break
            fi
            if [ "$object_type" != 'tag' ]; then
              echo "::error::$EXPECTED_TAG resolved to unsupported object type $object_type"
              exit 1
            fi
            case " $visited " in
              *" $object_sha "*)
                echo "::error::$EXPECTED_TAG tag chain revisits $object_sha"
                exit 1
                ;;
            esac
            visited="$visited $object_sha"
            tag_object=$(gh api "/repos/$REPOSITORY/git/tags/$object_sha" --jq '.object.type + " " + .object.sha')
            object_type=${tag_object%% *}
            object_sha=${tag_object##* }
          done
          if [ "$tag_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::$EXPECTED_TAG does not resolve to managed merge $EXPECTED_SHA"
            exit 1
          fi

          release_file="$RUNNER_TEMP/managed-release.json"
          gh api "/repos/$REPOSITORY/releases/tags/$EXPECTED_TAG" > "$release_file"
          if ! jq -e 'type == "object"' "$release_file" >/dev/null; then
            echo "::error::$EXPECTED_TAG release lookup returned a malformed response"
            exit 1
          fi
          release_tag=$(jq -er '.tag_name | select(type == "string")' "$release_file")
          release_target=$(jq -er '.target_commitish | select(type == "string")' "$release_file")
          release_draft=$(jq -er '.draft | select(type == "boolean") | tostring' "$release_file")
          release_prerelease=$(jq -er '.prerelease | select(type == "boolean") | tostring' "$release_file")
          if [ "$release_tag" != "$EXPECTED_TAG" ] || [ "$release_target" != "$EXPECTED_SHA" ]; then
            echo "::error::$EXPECTED_TAG release does not target managed merge $EXPECTED_SHA"
            exit 1
          fi
          if [ "$EXPECTED_CHANNEL" = 'Stable' ] && [ "$release_prerelease" != 'false' ]; then
            echo "::error::$EXPECTED_TAG is unexpectedly marked as a PreRelease"
            exit 1
          fi
          if [ "$EXPECTED_CHANNEL" = 'PreRelease' ] && [ "$release_draft" != 'true' ] && [ "$release_prerelease" != 'true' ]; then
            echo "::error::Published $EXPECTED_TAG is not marked as a PreRelease"
            exit 1
          fi
          if [ "$EXPECTED_CHANNEL" != 'Stable' ] && [ "$EXPECTED_CHANNEL" != 'PreRelease' ]; then
            echo "::error::Unsupported managed release channel $EXPECTED_CHANNEL"
            exit 1
          fi

      - name: Capture release preparation branch
        id: release-pr
        env:
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          VALIDATED_MODE: ${{ needs.validate-trigger.outputs.mode }}
        run: |
          set -euo pipefail
          branch=''
          if [ "$PRS_CREATED" = 'true' ]; then
            branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName // ""')
            if ! printf '%s' "$branch" | grep -Eq '^release-please--[A-Za-z0-9._/-]+$'; then
              echo "::error::release-please reported an unexpected preparation branch"
              exit 1
            fi
          fi
          if [ "$VALIDATED_MODE" = 'promotion' ] && [ -z "$branch" ]; then
            echo "::error::release-please prepared no release pull request for the reviewed promotion"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  sync-release-pr:
    name: Sync Release Preparation Versions
    needs: [release-please]
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release-pr-branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout trusted release updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            scripts/release/Set-RepositoryVersion.ps1
            scripts/plugins/Sync-PluginManifest.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The managed branch is resolved to one immutable commit and fetched over a
      # credential-free remote, so no write token exists while the tree is
      # transformed.
      - name: Resolve and fetch the release preparation commit
        id: preparation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ needs.release-please.outputs.release-pr-branch }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_BRANCH" =~ ^release-please--[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::$RELEASE_BRANCH is not a managed release preparation branch"
            exit 1
          fi

          resolved_object=$(gh api "/repos/$REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')
          if [[ ! "$resolved_object" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$RELEASE_BRANCH did not resolve to a commit SHA"
            exit 1
          fi

          RELEASE_REPO="$GITHUB_WORKSPACE/release-preparation"
          mkdir -p "$RELEASE_REPO"
          git -C "$RELEASE_REPO" init --quiet
          git -C "$RELEASE_REPO" -c credential.helper= fetch --no-tags --depth 1 \
            "$SERVER_URL/$REPOSITORY.git" \
            "+refs/heads/$RELEASE_BRANCH:refs/remotes/preparation/head"
          fetched_object=$(git -C "$RELEASE_REPO" rev-parse refs/remotes/preparation/head)
          if [ "$fetched_object" != "$resolved_object" ]; then
            echo "::error::$RELEASE_BRANCH moved from $resolved_object to $fetched_object during preparation"
            exit 1
          fi
          git -C "$RELEASE_REPO" checkout --quiet --detach refs/remotes/preparation/head

          echo "commit=$resolved_object" >> "$GITHUB_OUTPUT"

      - name: Update committed version fields and retire the promotion intent
        id: transform
        run: |
          set -euo pipefail
          RELEASE_REPO="$GITHUB_WORKSPACE/release-preparation"
          VERSION=$(jq -r '.["."] // ""' "$RELEASE_REPO/.release-please-manifest.json")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.release-please-manifest.json has no MAJOR.MINOR.PATCH root version"
            exit 1
          fi

          # The promotion wrote exact release intent. It must describe
          # this managed release, and it is retired here so it can never
          # survive the merge into a later release-please run on the
          # branch.
          CONFIG="$RELEASE_REPO/release-please-config.json"
          INTENT=$(jq -r '.packages["."]["release-as"] // ""' "$CONFIG")
          if [ "$INTENT" != "$VERSION" ]; then
            echo "::error::release-please-config.json carries release-as '$INTENT' but the managed release is $VERSION"
            exit 1
          fi
          jq 'del(.packages["."]["release-as"])' "$CONFIG" > "$CONFIG.sync"
          mv "$CONFIG.sync" "$CONFIG"

          # Component membership is resynchronized from this preparation tree
          # and every version field is normalized to the managed release
          # version. Neither step transforms a source ref or records a
          # release candidate.
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/plugins/Sync-PluginManifest.ps1" \
              -RepoRoot "$RELEASE_REPO"
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/release/Set-RepositoryVersion.ps1" \
              -Version "$VERSION" \
              -RepoRoot "$RELEASE_REPO"

          cd "$RELEASE_REPO"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo "Preparation already carries $VERSION and its synchronized plugin manifest"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): sync committed versions and plugin manifest to $VERSION"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The write credential exists only for this push, and the lease binds the
      # update to the exact commit the tree was built from.
      - name: Push the synchronized release preparation commit
        if: ${{ steps.transform.outputs.committed == 'true' }}
        env:
          EXPECTED_COMMIT: ${{ steps.preparation.outputs.commit }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: ${{ needs.release-please.outputs.release-pr-branch }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$GITHUB_WORKSPACE/release-preparation"
          push_host=${SERVER_URL#https://}
          git -C "$RELEASE_REPO" -c credential.helper= push \
            --force-with-lease="refs/heads/$RELEASE_BRANCH:$EXPECTED_COMMIT" \
            "https://x-access-token:$GH_APP_TOKEN@$push_host/$REPOSITORY.git" \
            "HEAD:refs/heads/$RELEASE_BRANCH"
