name: ms.date Freshness Check

on:
  workflow_call:
    inputs:
      change-mode:
        description: 'Use an exact immutable range or run full validation'
        required: false
        type: string
        default: full
      base-sha:
        description: 'Immutable base commit used in range mode'
        required: false
        type: string
        default: ''
      head-sha:
        description: 'Immutable head commit used in range mode'
        required: false
        type: string
        default: ''
      staleness-threshold-days:
        description: 'Number of days before a document is considered stale'
        required: false
        type: number
        default: 90
      changed-files-only:
        description: 'Only check files changed in the PR'
        required: false
        type: boolean
        default: false
      soft-fail:
        description: 'Whether to continue when stale files are found'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  msdate-freshness:
    name: Check ms.date Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify resolved head commit
        if: inputs.change-mode == 'range'
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          $actualHeadSha = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_HEAD_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' -or $actualHeadSha -cne $env:EXPECTED_HEAD_SHA) {
            Write-Output "::error::Checked-out commit $actualHeadSha does not match the resolved head commit."
            exit 1
          }

      - name: Create logs directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Run ms.date freshness check
        shell: pwsh
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_CHANGE_MODE: ${{ inputs.change-mode }}
          THRESHOLD_DAYS: ${{ inputs.staleness-threshold-days }}
          CHANGED_FILES_ONLY: ${{ inputs.changed-files-only }}
        run: |
          $params = @{
            ThresholdDays = [int]$env:THRESHOLD_DAYS
          }
          if ($env:INPUT_CHANGE_MODE -notin @('full', 'range')) { throw 'Unsupported change mode.' }
          if ($env:CHANGED_FILES_ONLY -eq 'true' -and $env:INPUT_CHANGE_MODE -eq 'full') {
            Write-Output '::warning::No verified change range; reporting repository-wide ms.date freshness as advisory.'
            & scripts/linting/Invoke-MsDateFreshnessCheck.ps1 @params
            exit 0
          }
          if ($env:CHANGED_FILES_ONLY -eq 'true') {
            if (-not $env:INPUT_BASE_SHA) { throw 'Range mode requires an immutable base commit ID.' }
            $params['ChangedFilesOnly'] = $true
            $params['BaseBranch'] = $env:INPUT_BASE_SHA
          }
          & scripts/linting/Invoke-MsDateFreshnessCheck.ps1 @params
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload freshness results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msdate-freshness-results
          path: logs/msdate-freshness-results.json
          retention-days: 30

