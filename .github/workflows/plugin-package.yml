name: Package Plugins

on:
  workflow_call:
    inputs:
      source-ref:
        description: "Immutable source to package from (full commit SHA)"
        required: true
        type: string
      source-policy:
        description: "Trusted provenance policy for the immutable source"
        required: true
        type: string
      version:
        description: "Release version the packaged plugin must carry"
        required: true
        type: string
      project-release-catalog:
        description: "Project the requested version and immutable locator without changing the committed catalog"
        required: false
        default: false
        type: boolean
    outputs:
      packages-matrix:
        description: "JSON matrix of plugin packages that were packaged"
        value: ${{ jobs.discover-packages.outputs.matrix }}

permissions:
  contents: read

jobs:
  discover-packages:
    name: Discover Plugin Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      names: ${{ steps.discover.outputs.names }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and checkout plugin source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_POLICY: ${{ inputs.source-policy }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REF}" ]; then
            echo "::error::source-ref is required and must not be blank"
            exit 1
          fi
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source-ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if [ -z "${INPUT_VERSION}" ]; then
            echo "::error::version is required and must not be blank"
            exit 1
          fi
          if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH form"
            exit 1
          fi

          case "${SOURCE_POLICY}" in
            'main-ancestor')
              if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
                git fetch --quiet --unshallow --no-tags origin \
                  '+refs/heads/main:refs/remotes/origin/main'
              else
                git fetch --quiet --no-tags origin \
                  '+refs/heads/main:refs/remotes/origin/main'
              fi
              if ! git merge-base --is-ancestor "${SOURCE_REF}" refs/remotes/origin/main; then
                echo "::error::source-ref is not contained in main"
                exit 1
              fi
              ;;
            'release-tag')
              git fetch --quiet --no-tags origin \
                "refs/tags/hve-core-v${INPUT_VERSION}:refs/tags/hve-core-v${INPUT_VERSION}"
              tag_commit=$(git rev-parse --verify --end-of-options \
                "refs/tags/hve-core-v${INPUT_VERSION}^{commit}")
              if [ "${tag_commit}" != "${SOURCE_REF}" ]; then
                echo "::error::release tag does not resolve to source-ref"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported source policy '${SOURCE_POLICY}'"
              exit 1
              ;;
          esac

          git checkout --quiet --detach "${SOURCE_REF}"
          if [ "$(git rev-parse HEAD)" != "${SOURCE_REF}" ]; then
            echo "::error::Verified source checkout does not match source-ref"
            exit 1
          fi

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Verify version and committed catalog
        shell: pwsh
        env:
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
          INPUT_VERSION: ${{ inputs.version }}
          PROJECT_RELEASE_CATALOG: ${{ inputs.project-release-catalog }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROJECT_RELEASE_CATALOG -ne 'true') {
            # Stable packaging requires committed release state. PreRelease uses
            # the explicit projection step below because its odd version is ephemeral.
            $catalog = Get-Content -LiteralPath '.github/plugin/marketplace.json' -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
            $catalogVersion = [string]$catalog['metadata']['version']
            if ($catalogVersion -cne $env:INPUT_VERSION) {
              throw "Catalog version $catalogVersion does not match requested version $env:INPUT_VERSION"
            }
            foreach ($entry in @($catalog['plugins'])) {
              $expectedRef = "plugins-v$env:INPUT_VERSION"
              if ([string]$entry['source']['ref'] -cne $expectedRef) {
                throw "Catalog plugin '$($entry['name'])' pins source ref '$($entry['source']['ref'])' but the release requires '$expectedRef'"
              }
            }
          }

      # Plugin packages ship every non-deprecated, non-removed catalog
      # entry, which is the PreRelease eligibility policy. Discovery runs
      # through the same script the extension lanes use so the two lanes
      # cannot drift apart.
      - name: Discover marketplace packages
        id: discover
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PROJECT_RELEASE_CATALOG: ${{ inputs.project-release-catalog }}
        run: |
          $ErrorActionPreference = 'Stop'
          $catalogPath = '.github/plugin/marketplace.json'
          if ($env:PROJECT_RELEASE_CATALOG -eq 'true') {
            $catalogPath = 'logs/projected-marketplace.json'
            & ./scripts/plugins/Generate-Plugins.ps1 `
              -Channel PreRelease `
              -ReleaseTag "plugins-v$env:INPUT_VERSION" `
              -MarketplaceOutputPath $catalogPath
            if ($LASTEXITCODE -ne 0) {
              throw "Generate-Plugins.ps1 failed with exit code $LASTEXITCODE"
            }
          }
          & ./scripts/extension/Get-MarketplacePackageMatrix.ps1 -Channel 'PreRelease' -CatalogPath $catalogPath

  package:
    name: Package Plugin ${{ matrix.id }}
    needs: discover-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-packages.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and checkout plugin source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
          SOURCE_POLICY: ${{ inputs.source-policy }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_REF}" ]; then
            echo "::error::source-ref is required and must not be blank"
            exit 1
          fi
          if [[ ! "${SOURCE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source-ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if [ -z "${INPUT_VERSION}" ]; then
            echo "::error::version is required and must not be blank"
            exit 1
          fi
          if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must use MAJOR.MINOR.PATCH form"
            exit 1
          fi

          case "${SOURCE_POLICY}" in
            'main-ancestor')
              if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
                git fetch --quiet --unshallow --no-tags origin \
                  '+refs/heads/main:refs/remotes/origin/main'
              else
                git fetch --quiet --no-tags origin \
                  '+refs/heads/main:refs/remotes/origin/main'
              fi
              if ! git merge-base --is-ancestor "${SOURCE_REF}" refs/remotes/origin/main; then
                echo "::error::source-ref is not contained in main"
                exit 1
              fi
              ;;
            'release-tag')
              git fetch --quiet --no-tags origin \
                "refs/tags/hve-core-v${INPUT_VERSION}:refs/tags/hve-core-v${INPUT_VERSION}"
              tag_commit=$(git rev-parse --verify --end-of-options \
                "refs/tags/hve-core-v${INPUT_VERSION}^{commit}")
              if [ "${tag_commit}" != "${SOURCE_REF}" ]; then
                echo "::error::release tag does not resolve to source-ref"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported source policy '${SOURCE_POLICY}'"
              exit 1
              ;;
          esac

          git checkout --quiet --detach "${SOURCE_REF}"
          if [ "$(git rev-parse HEAD)" != "${SOURCE_REF}" ]; then
            echo "::error::Verified source checkout does not match source-ref"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Generate committed plugins
        if: ${{ !inputs.project-release-catalog }}
        run: npm run plugin:generate

      - name: Generate plugins and projected release catalog
        if: ${{ inputs.project-release-catalog }}
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/plugins/Generate-Plugins.ps1 `
            -Channel PreRelease `
            -ReleaseTag "plugins-v$env:INPUT_VERSION" `
            -MarketplaceOutputPath 'logs/projected-marketplace.json'
          if ($LASTEXITCODE -ne 0) {
            throw "Generate-Plugins.ps1 failed with exit code $LASTEXITCODE"
          }

      - name: Record plugin release evidence
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/plugins/Assert-PluginReleaseEvidence.ps1 `
            -Version $env:INPUT_VERSION `
            -OutputPath logs/plugin-release-evidence.json

      - name: Verify generated roots match discovered packages
        shell: bash
        env:
          DISCOVERED_NAMES: ${{ needs.discover-packages.outputs.names }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$DISCOVERED_NAMES" | jq -r '.[]' | sort)
          actual=$(find plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Generated package roots do not match the discovered package set"
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "Verified $(printf '%s\n' "$actual" | grep -c .) generated package roots"

      - name: Package plugin directory
        shell: bash
        env:
          PACKAGE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          plugin_dir="plugins/${PACKAGE_ID}"
          if [ ! -d "$plugin_dir" ]; then
            echo "::error::Expected plugin directory not found: $plugin_dir"
            exit 1
          fi

          mkdir -p dist/plugins
          zip -r "dist/plugins/${PACKAGE_ID}.zip" "$plugin_dir"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-package-${{ matrix.id }}
          path: dist/plugins/${{ matrix.id }}.zip
          retention-days: 30
