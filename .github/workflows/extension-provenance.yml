name: Extension Provenance

on:
  workflow_call:
    inputs:
      source-ref:
        description: "Immutable source commit to package and attest (full commit SHA of this run)"
        required: true
        type: string
      version:
        description: "Full version to package (e.g., 1.0.0)"
        required: true
        type: string
      channel:
        description: "Release channel (Stable or PreRelease) controlling the pre-release packaging flag"
        required: true
        type: string
      release-tag:
        description: "GitHub release tag to upload the attestation assets to"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  package:
    name: Package hve-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate source ref
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source-ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if [ "$INPUT_SOURCE_REF" != "$EVENT_SHA" ]; then
            echo "::error::source-ref $INPUT_SOURCE_REF is not the packaging source commit $EVENT_SHA"
            exit 1
          fi

      - name: Checkout code
        # The sole caller validates a protected release-tag push before this job.
        # poutine:ignore untrusted_checkout_exec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate packaging inputs
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be canonical MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ "$INPUT_CHANNEL" != 'Stable' ] && [ "$INPUT_CHANNEL" != 'PreRelease' ]; then
            echo "::error::channel must be Stable or PreRelease"
            exit 1
          fi
          template_version=$(jq -r .version extension/templates/package.template.json)
          if [ "$INPUT_VERSION" != "$template_version" ]; then
            echo "::error::extension/templates/package.template.json is $template_version but the caller requested $INPUT_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Prepare extension resources
        shell: pwsh
        run: ./scripts/extension/Prepare-Extension.ps1

      - name: Package extension
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $Arguments = @{
            Version = $env:INPUT_VERSION
          }
          if ($env:INPUT_CHANNEL -eq 'PreRelease') {
            $Arguments['PreRelease'] = $true
          }
          if (Test-Path './CHANGELOG.md') {
            $Arguments['ChangelogPath'] = './CHANGELOG.md'
          }
          ./scripts/extension/Package-Extension.ps1 @Arguments

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest hve-core
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Verify attestation source commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_SOURCE_REF// }" ]; then
            echo "::error::source-ref is required and must not be blank"
            exit 1
          fi
          # Attestation records this run's commit, so the packaged source must be
          # that same commit rather than any other resolvable ref.
          if ! printf '%s' "$INPUT_SOURCE_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source-ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          if [ "$INPUT_SOURCE_REF" != "$EVENT_SHA" ]; then
            echo "::error::source-ref $INPUT_SOURCE_REF is not the attestation source commit $EVENT_SHA"
            exit 1
          fi

      - name: Checkout code
        # The sole caller validates a protected release-tag push before this job.
        # poutine:ignore untrusted_checkout_exec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download dependency SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-dependencies
          path: ./sbom
          digest-mismatch: error

      - name: Download built VSIX
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-vsix
          path: ./extension
          digest-mismatch: error

      - name: Resolve VSIX filename
        id: vsix
        shell: pwsh
        env:
          VSIX_DIRECTORY: ./extension
        run: |
          $vsixPath = & ./scripts/extension/Resolve-VsixFile.ps1 -DirectoryPath $env:VSIX_DIRECTORY
          $vsixName = Split-Path -Path $vsixPath -Leaf
          "file=$vsixPath" >> $env:GITHUB_OUTPUT
          "name=$vsixName" >> $env:GITHUB_OUTPUT

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.vsix.outputs.file }}
          format: spdx-json
          output-file: extension/${{ steps.vsix.outputs.name }}.spdx.json
          artifact-name: sbom-hve-core
          upload-release-assets: false
          upload-artifact: true
          config: .syft.yaml

      - name: Verify SBOM files exist
        shell: bash
        env:
          VSIX_NAME: ${{ steps.vsix.outputs.name }}
        run: |
          set -euo pipefail
          test -f "extension/${VSIX_NAME}.spdx.json" \
            || { echo "::error::Per-VSIX SBOM not found: extension/${VSIX_NAME}.spdx.json"; exit 1; }
          test -f "sbom/dependencies.spdx.json" \
            || { echo "::error::Dependency SBOM not found: sbom/dependencies.spdx.json"; exit 1; }

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.vsix.outputs.file }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.vsix.outputs.file }}
          sbom-path: extension/${{ steps.vsix.outputs.name }}.spdx.json

      - name: Attest dependency SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.vsix.outputs.file }}
          sbom-path: sbom/dependencies.spdx.json

      - name: Upload assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          REPOSITORY: ${{ github.repository }}
          VSIX_FILE: ${{ steps.vsix.outputs.file }}
          VSIX_NAME: ${{ steps.vsix.outputs.name }}
          SIGSTORE_PATH: extension/${{ steps.vsix.outputs.name }}.sigstore.json
          INTOTO_PATH: extension/${{ steps.vsix.outputs.name }}.intoto.jsonl
        run: |
          $tag = "$env:RELEASE_TAG".Trim()
          if (-not $tag) {
            $tag = "$env:GITHUB_REF_NAME"
          }

          & ./scripts/extension/Export-AttestationBundle.ps1 -BundlePath $env:BUNDLE_PATH -SigstorePath $env:SIGSTORE_PATH -IntotoPath $env:INTOTO_PATH

          gh release upload $tag `
            $env:VSIX_FILE `
            "extension/$env:VSIX_NAME.spdx.json" `
            $env:SIGSTORE_PATH `
            $env:INTOTO_PATH `
            --clobber -R $env:REPOSITORY
