name: Asset Docs Validation

on:
  workflow_call:
    inputs:
      change-mode:
        description: 'Use an exact immutable range or run full validation'
        required: false
        type: string
        default: full
      base-sha:
        description: 'Immutable base commit used in range mode'
        required: false
        type: string
        default: ''
      head-sha:
        description: 'Immutable head commit used in range mode'
        required: false
        type: string
        default: ''
      changed-files-only:
        description: 'Only validate assets and documentation affected by changed files'
        required: false
        type: boolean
        default: true
      soft-fail:
        description: 'Whether to continue on asset documentation validation failures'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Asset Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.change-mode == 'range' && inputs.head-sha || github.sha }}

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Run asset documentation validation
        shell: pwsh
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_CHANGE_MODE: ${{ inputs.change-mode }}
          INPUT_CHANGED_FILES_ONLY: ${{ inputs.changed-files-only }}
        run: |
          $params = @{
            FailOnMissing = $true
            CheckSync     = $true
          }
          if ($env:INPUT_CHANGE_MODE -notin @('full', 'range')) { throw 'Unsupported change mode.' }
          if ($env:INPUT_CHANGED_FILES_ONLY -eq 'true' -and $env:INPUT_CHANGE_MODE -eq 'range') {
            if (-not $env:INPUT_BASE_SHA) { throw 'Range mode requires an immutable base commit ID.' }
            $params['ChangedFilesOnly'] = $true
            $params['BaseBranch'] = $env:INPUT_BASE_SHA
          }
          & './scripts/linting/Validate-AssetDocs.ps1' @params
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-docs-validation-results
          path: logs/asset-docs-validation-results.json
          retention-days: 30
          if-no-files-found: ignore
