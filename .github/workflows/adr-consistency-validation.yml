name: ADR Consistency Validation

on:
  workflow_call:
    inputs:
      change-mode:
        description: 'Use an exact immutable range or run full validation'
        required: false
        type: string
        default: full
      base-sha:
        description: 'Immutable base commit used in range mode'
        required: false
        type: string
        default: ''
      head-sha:
        description: 'Immutable head commit used in range mode'
        required: false
        type: string
        default: ''
      soft-fail:
        description: 'Whether to continue on ADR consistency violations'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'Only run validation when ADR markdown files changed'
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: 'Whether to upload SARIF results to Security tab'
        required: false
        type: boolean
        default: false
      upload-artifact:
        description: 'Whether to upload validation results as artifact'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect ADR Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-adr-changes: ${{ steps.detect.outputs.has-adr-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify resolved head commit
        if: inputs.change-mode == 'range'
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          $actualHeadSha = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_HEAD_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' -or $actualHeadSha -cne $env:EXPECTED_HEAD_SHA) {
            Write-Output "::error::Checked-out commit $actualHeadSha does not match the resolved head commit."
            exit 1
          }

      - name: Check ADR changes
        id: detect
        shell: pwsh
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_CHANGE_MODE: ${{ inputs.change-mode }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          if ('${{ inputs.changed-files-only }}' -ne 'true' -or $env:INPUT_CHANGE_MODE -eq 'full') {
            'has-adr-changes=true' >> $env:GITHUB_OUTPUT
            Write-Output 'ADR validation requested for all configured ADR files.'
          } else {
            if ($env:INPUT_CHANGE_MODE -ne 'range' -or -not $env:INPUT_BASE_SHA -or -not $env:INPUT_HEAD_SHA) {
              throw 'Range mode requires immutable base and head commit IDs.'
            }
            $changed = @(git diff --name-only --diff-filter=ACMR "$env:INPUT_BASE_SHA..$env:INPUT_HEAD_SHA" -- docs/planning/adrs |
              Where-Object { $_ -match '^docs/planning/adrs/.+\.md$' })
            if ($LASTEXITCODE -ne 0) { throw 'Unable to compute the immutable workflow range.' }

            if ($changed.Count -gt 0) {
              'has-adr-changes=true' >> $env:GITHUB_OUTPUT
              Write-Output "Detected $($changed.Count) changed ADR file(s)"
              $changed | ForEach-Object { Write-Output "- $_" }
            } else {
              'has-adr-changes=false' >> $env:GITHUB_OUTPUT
              Write-Output 'No ADR markdown changes detected under docs/planning/adrs'
            }
          }

  report-skipped:
    name: Report Skipped ADR Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    if: inputs.changed-files-only && needs.detect-changes.outputs.has-adr-changes != 'true'
    permissions:
      contents: read
    steps:
      - name: Report skipped validation
        shell: pwsh
        run: |
          @(
            '## ADR Consistency Validation',
            '',
            'No ADR markdown changes detected under docs/planning/adrs. Validation skipped.'
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

  validate:
    name: Validate ADR Consistency
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has-adr-changes == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify resolved head commit
        if: inputs.change-mode == 'range'
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          $actualHeadSha = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_HEAD_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' -or $actualHeadSha -cne $env:EXPECTED_HEAD_SHA) {
            Write-Output "::error::Checked-out commit $actualHeadSha does not match the resolved head commit."
            exit 1
          }

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Run ADR consistency validation
        shell: pwsh
        continue-on-error: ${{ inputs.soft-fail }}
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_CHANGE_MODE: ${{ inputs.change-mode }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $params = @{
            Paths = @('docs/planning/adrs')
            OutputPath = 'logs/adr-consistency-results.json'
          }

          if ('${{ inputs.changed-files-only }}' -eq 'true' -and $env:INPUT_CHANGE_MODE -eq 'range') {
            $params['ChangedFilesOnly'] = $true
            $params['BaseBranch'] = $env:INPUT_BASE_SHA
          }

          if ('${{ inputs.upload-sarif }}' -eq 'true') {
            $params['SarifOutputPath'] = 'logs/adr-consistency-results.sarif'
          }

          & scripts/linting/Validate-AdrConsistency.ps1 @params

      - name: Upload SARIF handoff
        if: inputs.upload-sarif && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adr-consistency-sarif
          path: logs/adr-consistency-results.sarif
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload validation report
        if: inputs.upload-artifact && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adr-consistency-results
          path: |
            logs/adr-consistency-results.json
            logs/adr-consistency-results.sarif
          retention-days: 90
          if-no-files-found: ignore

  upload-sarif:
    name: Upload ADR SARIF
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.upload-sarif && always() && needs.validate.result != 'skipped'
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
    steps:
      - name: Download SARIF handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adr-consistency-sarif
          path: logs

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@ce729e4d353d580e6cacd6a8cf2921b72e5e310a # v3.27.0
        with:
          sarif_file: logs/adr-consistency-results.sarif
          category: adr-consistency
        continue-on-error: true
