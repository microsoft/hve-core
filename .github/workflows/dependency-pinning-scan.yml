name: Dependency Pinning Scan

on:
  workflow_call:
    inputs:
      threshold:
        description: 'Compliance threshold percentage (0-100) for the reported is-compliant output; the gate fails on any unexcepted unpinned dependency'
        required: false
        type: number
        default: 100
      dependency-types:
        description: 'Comma-separated list of dependency types to check'
        required: false
        type: string
        default: 'github-actions,npm,pip,workflow-npm-commands,shell-downloads,setup-action-versions,python-tool-runs,container-images,install-hints'
      soft-fail:
        description: 'Whether to skip the gate and only report'
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: 'Whether to upload SARIF results to Security tab'
        required: false
        type: boolean
        default: false
      upload-artifact:
        description: 'Whether to upload results as artifact'
        required: false
        type: boolean
        default: true
    outputs:
      compliance-score:
        description: 'Compliance score percentage'
        value: ${{ jobs.scan.outputs.compliance-score }}
      unpinned-count:
        description: 'Number of unpinned dependencies found'
        value: ${{ jobs.scan.outputs.unpinned-count }}
      is-compliant:
        description: 'Whether repository meets compliance threshold'
        value: ${{ jobs.scan.outputs.is-compliant }}

permissions:
  contents: read

jobs:
  scan:
    name: Validate SHA Pinning Compliance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
    outputs:
      compliance-score: ${{ steps.pinning.outputs.compliance-score }}
      unpinned-count: ${{ steps.pinning.outputs.unpinned-count }}
      is-compliant: ${{ steps.pinning.outputs.is-compliant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Dependency Pinning Validation
        id: pinning
        shell: pwsh
        env:
          INPUT_SOFT_FAIL: ${{ inputs.soft-fail }}
          INPUT_DEPENDENCY_TYPES: ${{ inputs.dependency-types }}
          INPUT_THRESHOLD: ${{ inputs.threshold }}
          INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |
          Write-Host "Validating dependency SHA pinning compliance..."
          
          # Ensure logs directory exists
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          
          # Build parameter list for JSON output (always generate)
          $params = @{
            Path = '.'
            Format = 'json'
            OutputPath = 'logs/dependency-pinning-results.json'
          }
          

          # Pass dependency types filter to script
          if ($env:INPUT_DEPENDENCY_TYPES) {
            $params['IncludeTypes'] = $env:INPUT_DEPENDENCY_TYPES
          }
          
          # Pass compliance threshold to script (reported in is-compliant; the gate step enforces)
          if ($env:INPUT_THRESHOLD) {
            $params['Threshold'] = [int]$env:INPUT_THRESHOLD
          }
          
          # Run validation script (JSON format)
          & scripts/security/Test-DependencyPinning.ps1 @params
          $jsonExitCode = $LASTEXITCODE
          
          # SARIF feeds the exception-aware gate and, when requested, the Security tab
          $params['Format'] = 'sarif'
          $params['OutputPath'] = 'logs/dependency-pinning-results.sarif'
          & scripts/security/Test-DependencyPinning.ps1 @params
          if (-not (Test-Path -LiteralPath logs/dependency-pinning-results.sarif)) {
            Write-Error "Failed to generate dependency pinning SARIF"
            exit 1
          }
          
          # Extract metrics from JSON report
          if (Test-Path logs/dependency-pinning-results.json) {
            $report = Get-Content logs/dependency-pinning-results.json | ConvertFrom-Json
            $complianceScore = $report.ComplianceScore
            $unpinnedCount = $report.UnpinnedDependencies
            
            # Extract threshold from report metadata (script calculated compliance)
            $threshold = $report.Metadata.ComplianceThreshold
            $isCompliant = $complianceScore -ge $threshold
            
            "compliance-score=$complianceScore" >> $env:GITHUB_OUTPUT
            "unpinned-count=$unpinnedCount" >> $env:GITHUB_OUTPUT
            "is-compliant=$($isCompliant.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            
            Write-Host "Compliance Score: $complianceScore%"
            Write-Host "Unpinned Dependencies: $unpinnedCount"
            Write-Host "Is Compliant (>=$threshold%): $isCompliant"
          }
          else {
            Write-Error "Failed to generate dependency pinning report"
            exit 1
          }

      # Uploading needs security-events: write, which a fork pull request never
      # receives. Skip the step for forks rather than attempt it; the gate below
      # still decides every pull request.
      - name: Upload SARIF to Security tab
        if: inputs.upload-sarif && always() && hashFiles('logs/dependency-pinning-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: logs/dependency-pinning-results.sarif
          category: dependency-pinning

      # Every unpinned dependency fails unless a tracked exception in
      # security/code-scanning-exceptions.yml excuses it. Soft-fail callers only report.
      - name: Gate on findings
        if: ${{ !inputs.soft-fail }}
        shell: pwsh
        run: ./scripts/security/Test-CodeQLSarifThreshold.ps1 -SarifPath logs/dependency-pinning-results.sarif -Threshold All

      - name: Upload validation report
        if: inputs.upload-artifact && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-pinning-results
          path: logs/dependency-pinning-results.json
          retention-days: 90

      - name: Add job summary
        if: always()
        shell: pwsh
        run: |
          $complianceScore = $env:STEPS_PINNING_OUTPUTS_COMPLIANCE_SCORE
          $unpinnedCount = $env:STEPS_PINNING_OUTPUTS_UNPINNED_COUNT
          $isCompliant = $env:STEPS_PINNING_OUTPUTS_IS_COMPLIANT
          
          @"
          ## Dependency Pinning Scan Results
          
          | Metric | Value |
          |--------|-------|
          | Compliance Score | $complianceScore% |
          | Unpinned Dependencies | $unpinnedCount |
          | Status | $(if ($isCompliant -eq 'true') { '✅ Compliant' } else { '⚠️ Non-Compliant' }) |
          
          $(if ($unpinnedCount -ne '0') {
            @"
          
          ### ⚠️ Action Required
          
          **$unpinnedCount dependencies are not properly pinned.**
          
          Review the warnings in the workflow log and pin dependencies to specific SHA commits.
          
          "@
          } else {
            @"
          
          ### ✅ All Dependencies Pinned
          
          All dependencies are properly pinned.
          
          "@
          })
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
        env:
          STEPS_PINNING_OUTPUTS_COMPLIANCE_SCORE: ${{ steps.pinning.outputs.compliance-score }}
          STEPS_PINNING_OUTPUTS_UNPINNED_COUNT: ${{ steps.pinning.outputs.unpinned-count }}
          STEPS_PINNING_OUTPUTS_IS_COMPLIANT: ${{ steps.pinning.outputs.is-compliant }}
