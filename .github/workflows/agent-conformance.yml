name: Agent Conformance

on:
  workflow_call:
    secrets:
      copilot-github-token:
        description: "GitHub credential exported as COPILOT_GITHUB_TOKEN for the Copilot CLI used by vally eval"
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Conformance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite:
          - agent-conformance-accessibility-planner
          - agent-conformance-dt-coach
          - agent-conformance-privacy-planner
          - agent-conformance-rai-planner
          - agent-conformance-security-planner
          - agent-conformance-sssc-planner
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run behavioral conformance suite
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-github-token }}
        run: npx vally eval --suite ${{ matrix.suite }}

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ github.run_id }}
          # Raw agent transcripts are withheld because artifacts on a public repository
          # are readable by anyone and a transcript can contain anything the agent
          # printed, including job environment.
          path: |
            evals/results/
            !evals/results/**/results.jsonl
          retention-days: 30
