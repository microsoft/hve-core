name: Agent Conformance

on:
  workflow_call:
    inputs:
      suites:
        description: "JSON array of Vally conformance suite names to run"
        required: false
        type: string
        default: '["agent-conformance-accessibility-planner","agent-conformance-dt-coach","agent-conformance-privacy-planner","agent-conformance-rai-planner","agent-conformance-security-planner","agent-conformance-sssc-planner"]'
    secrets:
      copilot-github-token:
        description: "GitHub credential exported as COPILOT_GITHUB_TOKEN for the Copilot CLI used by vally eval"
        required: true
  workflow_dispatch:
    inputs:
      suites:
        description: "JSON array of Vally conformance suite names to run"
        required: false
        type: string
        default: '["agent-conformance-accessibility-planner","agent-conformance-dt-coach","agent-conformance-privacy-planner","agent-conformance-rai-planner","agent-conformance-security-planner","agent-conformance-sssc-planner"]'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Conformance (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run behavioral conformance suite
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-github-token }}
          MATRIX_SUITE: ${{ matrix.suite }}
        run: npx vally eval --suite "${MATRIX_SUITE}"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ github.run_id }}
          # Raw agent transcripts are withheld because artifacts on a public repository
          # are readable by anyone and a transcript can contain anything the agent
          # printed, including job environment.
          path: |
            evals/results/
            !evals/results/**/results.jsonl
          retention-days: 30
