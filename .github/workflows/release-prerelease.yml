name: Pre-Release Pipeline
# Prepares and publishes the odd-minor pre-release channel from release/prerelease.
#
# Merging the reviewed main -> release/prerelease promotion runs release-please in
# pull-request-only mode against the dedicated pre-release config and manifest, so
# the version change is reviewed before any tag exists. Merging that managed
# release pull request runs release-please in tag-only mode, which creates the tag
# and draft release at the merge commit. Publication marks the draft as a
# pre-release with the release App token so the Marketplace workflow receives the
# published event, and the immutable snapshot advances the main catalog.
on:
  pull_request:
    types: [closed]
    branches:
      - release/prerelease
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-please:
    name: Release Please on release/prerelease
    if: >
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'release/prerelease'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.head.ref == 'release-promotion--main--to--release-prerelease'
        || github.event.pull_request.head.ref == 'release-please--branches--release/prerelease'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-pr-branch: ${{ steps.release-pr.outputs.branch }}
      release_created: ${{ steps.release-pr.outputs.release_created }}
      tag_name: ${{ steps.release-pr.outputs.tag_name }}
      version: ${{ steps.release-pr.outputs.version }}
      sha: ${{ steps.release-pr.outputs.sha }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-prerelease-config.json
          manifest-file: .release-please-prerelease-manifest.json
          target-branch: release/prerelease
          # Only the managed release pull request tags. The reviewed promotion
          # merge prepares metadata without creating a tag.
          skip-github-release: ${{ github.event.pull_request.head.ref != 'release-please--branches--release/prerelease' }}
          skip-github-pull-request: ${{ github.event.pull_request.head.ref == 'release-please--branches--release/prerelease' }}
      - name: Validate release-please outputs
        id: release-pr
        env:
          MERGED_HEAD: ${{ github.event.pull_request.head.ref }}
          PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          set -euo pipefail

          branch=''
          if [ "$PRS_CREATED" = 'true' ]; then
            branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName // ""')
            if ! printf '%s' "$branch" | grep -Eq '^release-please--[A-Za-z0-9._/-]+$'; then
              echo "::error::release-please reported an unexpected preparation branch"
              exit 1
            fi
          fi

          # A promotion merge exists to prepare a release. No managed pull
          # request means either nothing changelog-visible was promoted or a
          # pending release interlock blocked preparation.
          if [ "$MERGED_HEAD" != 'release-please--branches--release/prerelease' ] && [ -z "$branch" ]; then
            echo "::error::release-please prepared no release pull request for merged promotion $MERGED_HEAD; check for changelog-visible commits and any pending release interlock"
            exit 1
          fi

          if [ "$RELEASE_CREATED" = 'true' ]; then
            if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::release-please reported an invalid version"
              exit 1
            fi
            if [ "$RELEASE_TAG" != "hve-core-v$RELEASE_VERSION" ]; then
              echo "::error::release-please tag $RELEASE_TAG does not match version $RELEASE_VERSION"
              exit 1
            fi
            if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::release-please reported an invalid release SHA"
              exit 1
            fi
            if [ -z "$RELEASE_BODY" ]; then
              echo "::error::release-please reported an empty release body"
              exit 1
            fi
          fi

          {
            echo "branch=$branch"
            echo "release_created=$RELEASE_CREATED"
            echo "tag_name=$RELEASE_TAG"
            echo "version=$RELEASE_VERSION"
            echo "sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
  sync-release-pr:
    name: Sync Release Preparation Versions
    needs:
      - release-please
    if: ${{ !cancelled() && !failure() && needs.release-please.outputs.release-pr-branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Checkout trusted release updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/release/Update-VersionFiles.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Data-only checkout: executable tooling comes from the trusted github.sha checkout.
      - name: Checkout release preparation data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release-pr-branch }}
          path: release-preparation
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - name: Update committed version fields and retire the promotion intent
        env:
          RELEASE_BRANCH: ${{ needs.release-please.outputs.release-pr-branch }}
        run: |
          set -euo pipefail
          RELEASE_REPO="$GITHUB_WORKSPACE/release-preparation"
          VERSION=$(jq -r '.["."] // ""' "$RELEASE_REPO/.release-please-prerelease-manifest.json")
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.release-please-prerelease-manifest.json has no MAJOR.MINOR.PATCH root version"
            exit 1
          fi

          # The promotion wrote exact release intent. It must describe this
          # managed release, and it is retired here so it can never survive the
          # merge into a later release-please run on the branch.
          CONFIG="$RELEASE_REPO/release-please-prerelease-config.json"
          INTENT=$(jq -r '.packages["."]["release-as"] // ""' "$CONFIG")
          if [ "$INTENT" != "$VERSION" ]; then
            echo "::error::release-please-prerelease-config.json carries release-as '$INTENT' but the managed release is $VERSION"
            exit 1
          fi
          jq 'del(.packages["."]["release-as"])' "$CONFIG" > "$CONFIG.sync"
          mv "$CONFIG.sync" "$CONFIG"

          pwsh -NoProfile -File "$GITHUB_WORKSPACE/scripts/release/Update-VersionFiles.ps1" \
              -Version "$VERSION" \
              -CatalogRefMode Exact \
              -RepoRoot "$RELEASE_REPO" \
              -ManifestPath .release-please-prerelease-manifest.json \
              -SkipPluginGenerate

          cd "$RELEASE_REPO"
          if git diff --quiet; then
            echo "Preparation already carries $VERSION and locator hve-core-v$VERSION"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --update
          git commit -m "chore(release): sync committed versions and plugin locator to $VERSION"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
  validate-release:
    name: Validate release-please Pre-Release output
    needs:
      - release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ needs.release-please.outputs.version }}
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ github.sha }}
    steps:
      - name: Verify trusted release identity
        env:
          EVENT_SHA: ${{ github.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$MERGE_SHA" != "$EVENT_SHA" ]; then
            echo "::error::Pull request merge commit $MERGE_SHA does not match event SHA $EVENT_SHA"
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$EVENT_SHA" ]; then
            echo "::error::release-please SHA $RELEASE_SHA does not match the merged release/prerelease commit $EVENT_SHA"
            exit 1
          fi
      - name: Verify pre-release version and tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Pre-release version $RELEASE_VERSION is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          MINOR=$(printf '%s' "$RELEASE_VERSION" | cut -d. -f2)
          if (( MINOR % 2 == 0 )); then
            echo "::error::Pre-release version $RELEASE_VERSION has an even minor"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "hve-core-v$RELEASE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match hve-core-v$RELEASE_VERSION"
            exit 1
          fi
      - name: Checkout release/prerelease history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/prerelease
          fetch-depth: 0
          persist-credentials: false
      # Containment rather than branch HEAD equality, so a later merge on
      # release/prerelease cannot fail a valid release.
      - name: Check out the released commit contained in release/prerelease
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$RELEASE_SHA" HEAD; then
            echo "::error::Release commit $RELEASE_SHA is not contained in release/prerelease"
            exit 1
          fi
          git checkout --detach "$RELEASE_SHA"
      - name: Verify committed pre-release state
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          for entry in "package.json:.version" "package-lock.json:.version" ".release-please-prerelease-manifest.json:.\".\"" "extension/templates/package.template.json:.version" ".github/plugin/marketplace.json:.metadata.version"; do
            file="${entry%%:*}"
            path="${entry#*:}"
            actual=$(jq -r "$path" "$file")
            if [ "$actual" != "$RELEASE_VERSION" ]; then
              echo "::error::$file $path is $actual but release-please reported $RELEASE_VERSION"
              exit 1
            fi
          done

          if ! jq -e --arg version "$RELEASE_VERSION" '
            all(.plugins[]; .version == $version and .source.ref == ("hve-core-v" + $version))
          ' .github/plugin/marketplace.json >/dev/null; then
            echo "::error::Catalog versions or immutable plugin locators are inconsistent"
            exit 1
          fi

          if ! grep -Eq "^## \[${RELEASE_VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no release entry for $RELEASE_VERSION"
            exit 1
          fi

          # Promotion intent is consumed by the managed release pull request. A
          # survivor would silently pin the next release to a stale version.
          STALE_INTENT=$(jq -r '.packages["."]["release-as"] // ""' release-please-prerelease-config.json)
          if [ -n "$STALE_INTENT" ]; then
            echo "::error::release-please-prerelease-config.json still carries release-as $STALE_INTENT"
            exit 1
          fi
  close-milestone:
    name: Close Pre-Release Milestone
    needs:
      - validate-release
      - publish-release
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close milestone for pre-release version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          TITLE="v${MAJOR}.${MINOR}.0"
          NUMBER=$(gh api "/repos/$REPOSITORY/milestones?state=open&per_page=100" \
            --jq ".[] | select(.title == \"$TITLE\") | .number")
          if [ -n "$NUMBER" ]; then
            gh api "/repos/$REPOSITORY/milestones/$NUMBER" \
              -X PATCH -f state=closed
            echo "✅ Closed milestone $TITLE (#$NUMBER)"
          else
            echo "ℹ️ No open milestone found matching '$TITLE' — skipping"
          fi
  extension-package-prerelease:
    name: Package VS Code Extensions (Pre-Release)
    needs:
      - validate-release
    uses: ./.github/workflows/extension-package.yml
    with:
      source-ref: ${{ needs.validate-release.outputs.sha }}
      version: ${{ needs.validate-release.outputs.version }}
      channel: PreRelease
    permissions:
      contents: read
  plugin-package-prerelease:
    name: Package Plugins (Pre-Release)
    needs:
      - validate-release
    uses: ./.github/workflows/plugin-package.yml
    with:
      source-ref: ${{ needs.validate-release.outputs.sha }}
      source-policy: release-tag
      version: ${{ needs.validate-release.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
  generate-dependency-sbom:
    name: Generate Dependency SBOM
    needs:
      - validate-release
    runs-on: ubuntu-latest
    permissions:
      # write required for gh release upload to attach SBOM to the release
      contents: write
    steps:
      - name: Checkout dependency manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          sparse-checkout: |
            package.json
            package-lock.json
            .syft.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Generate dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dependencies.spdx.json
          upload-release-assets: false
          upload-artifact: false
          config: .syft.yaml
          dependency-snapshot: true
      - name: Upload dependency SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-dependencies
          path: dependencies.spdx.json
      - name: Upload dependency SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dependencies.spdx.json" \
            --clobber -R "$REPOSITORY"
  attest-and-upload:
    name: Attest and Upload (${{ matrix.id }})
    needs:
      - validate-release
      - extension-package-prerelease
      - generate-dependency-sbom
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.extension-package-prerelease.outputs.packages-matrix) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout Syft config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          sparse-checkout: .syft.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download dependency SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-dependencies
          path: ./sbom
      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-vsix-${{ matrix.id }}
          path: ./dist
      - name: Resolve VSIX filename
        id: vsix
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No VSIX file found in dist/"
            exit 1
          fi
          if [[ ${#files[@]} -gt 1 ]]; then
            echo "::error::Expected exactly one VSIX file but found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          VSIX_FILE="${files[0]}"
          VSIX_NAME=$(basename "$VSIX_FILE")
          echo "file=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.vsix.outputs.file }}
          format: spdx-json
          output-file: dist/${{ steps.vsix.outputs.name }}.spdx.json
          artifact-name: sbom-${{ matrix.id }}
          upload-release-assets: false
          upload-artifact: true
          config: .syft.yaml
      - name: Verify SBOM files exist
        run: |
          test -f "dist/${{ steps.vsix.outputs.name }}.spdx.json" \
            || { echo "::error::Per-VSIX SBOM not found: dist/${{ steps.vsix.outputs.name }}.spdx.json"; exit 1; }
          test -f "sbom/dependencies.spdx.json" \
            || { echo "::error::Dependency SBOM not found: sbom/dependencies.spdx.json"; exit 1; }
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.vsix.outputs.file }}
      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.vsix.outputs.file }}
          sbom-path: dist/${{ steps.vsix.outputs.name }}.spdx.json
      - name: Attest dependency SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.vsix.outputs.file }}
          sbom-path: sbom/dependencies.spdx.json
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" \
            "dist/${{ steps.vsix.outputs.name }}.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > \
            "dist/${{ steps.vsix.outputs.name }}.intoto.jsonl"
          gh release upload "$TAG" \
            "${{ steps.vsix.outputs.file }}" \
            "dist/${{ steps.vsix.outputs.name }}.spdx.json" \
            "dist/${{ steps.vsix.outputs.name }}.sigstore.json" \
            "dist/${{ steps.vsix.outputs.name }}.intoto.jsonl" \
            --clobber -R "$REPOSITORY"
  upload-plugin-packages:
    name: Attest and Upload Plugin (${{ matrix.id }})
    needs:
      - validate-release
      - plugin-package-prerelease
      - generate-dependency-sbom
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plugin-package-prerelease.outputs.packages-matrix) }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout Syft config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          sparse-checkout: .syft.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download dependency SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-dependencies
          path: ./sbom
      - name: Download plugin artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-package-${{ matrix.id }}
          path: ./dist/plugins
      - name: Verify plugin archive exists
        run: |
          PLUGIN_ARCHIVE="dist/plugins/${{ matrix.id }}.zip"
          if [ ! -f "$PLUGIN_ARCHIVE" ]; then
            echo "::error::Plugin archive not found for package ${{ matrix.id }}"
            exit 1
          fi
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/plugins/${{ matrix.id }}.zip
          format: spdx-json
          output-file: dist/plugins/${{ matrix.id }}.zip.spdx.json
          artifact-name: sbom-plugin-${{ matrix.id }}
          upload-release-assets: false
          upload-artifact: true
          config: .syft.yaml
      - name: Verify SBOM files exist
        run: |
          test -f "dist/plugins/${{ matrix.id }}.zip.spdx.json" \
            || { echo "::error::Per-plugin SBOM not found: dist/plugins/${{ matrix.id }}.zip.spdx.json"; exit 1; }
          test -f "sbom/dependencies.spdx.json" \
            || { echo "::error::Dependency SBOM not found: sbom/dependencies.spdx.json"; exit 1; }
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/plugins/${{ matrix.id }}.zip
      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/plugins/${{ matrix.id }}.zip
          sbom-path: dist/plugins/${{ matrix.id }}.zip.spdx.json
      - name: Attest dependency SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/plugins/${{ matrix.id }}.zip
          sbom-path: sbom/dependencies.spdx.json
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" \
            "dist/plugins/${{ matrix.id }}.zip.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > \
            "dist/plugins/${{ matrix.id }}.zip.intoto.jsonl"
          gh release upload "$TAG" \
            "dist/plugins/${{ matrix.id }}.zip" \
            "dist/plugins/${{ matrix.id }}.zip.spdx.json" \
            "dist/plugins/${{ matrix.id }}.zip.sigstore.json" \
            "dist/plugins/${{ matrix.id }}.zip.intoto.jsonl" \
            --clobber -R "$REPOSITORY"
  verify-provenance:
    name: Verify Provenance
    needs:
      - validate-release
      - attest-and-upload
      - upload-plugin-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release artifacts
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          gh release download "$RELEASE_TAG" \
            -R "$REPOSITORY" \
            -p '*.vsix' \
            -p '*.zip' \
            -D ./artifacts
      - name: Verify build provenance
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(./artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release artifacts downloaded for provenance verification"
            exit 1
          fi
          for f in "${files[@]}"; do
            gh attestation verify "$f" --repo "$REPOSITORY"
          done
  publish-release:
    name: Publish Pre-Release
    needs:
      - validate-release
      - attest-and-upload
      - upload-plugin-packages
      - verify-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      # release-please cannot mark a numeric version as a pre-release, so
      # one edit sets the flag and drops the draft together. The App token
      # makes the resulting published event reach the Marketplace workflow.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.validate-release.outputs.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --prerelease --draft=false -R "$REPOSITORY"
  main-catalog-sync:
    name: Sync Main Development Catalog
    needs:
      - validate-release
      - plugin-package-prerelease
      - publish-release
    uses: ./.github/workflows/release-main-catalog-sync.yml
    with:
      version: ${{ needs.validate-release.outputs.version }}
      release-sha: ${{ needs.validate-release.outputs.sha }}
    secrets:
      release-app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: write
