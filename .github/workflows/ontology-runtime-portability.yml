name: Ontology Runtime Portability

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full source commit SHA to provision and verify'
        required: true
        type: string
  push:
    branches:
      - feat/ontology-builder-agent
    paths:
      - '.github/skills/ontology/ontology-authoring/**'
      - '.github/workflows/ontology-runtime-portability.yml'

concurrency:
  group: ontology-runtime-portability-${{ github.event_name == 'push' && github.sha || inputs.source_commit }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Portable Runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ontology-runtime-portability-${{ github.event_name == 'push' && github.sha || inputs.source_commit }}
      CONTROLS_REF: ${{ github.event_name == 'push' && github.sha || github.event.repository.default_branch }}
      EVIDENCE_DIR: runtime-portability-evidence
      PYTHON_VERSION: '3.11'
      SOURCE_COMMIT: ${{ github.event_name == 'push' && github.sha || inputs.source_commit }}
      UV_VERSION: '0.10.8'
    steps:
      - name: Validate execution authority
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a full lowercase 40-character SHA"
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${WORKFLOW_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::Manual dispatch must use the default-branch definition"
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "push" && "${WORKFLOW_REF}" != "refs/heads/feat/ontology-builder-agent" ]]; then
            echo "::error::Bootstrap pushes are restricted to feat/ontology-builder-agent"
            exit 1
          fi

      - name: Checkout trusted portability controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: portability-controls
          persist-credentials: false
          ref: ${{ env.CONTROLS_REF }}

      - name: Checkout requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: requested-source
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install integrity-verified uv
        env:
          UV_AARCH64_SHA256: 661860e954f87dcd823251191866af3486484d1a9df60eed56f4586ed7559e3d
          UV_X86_64_SHA256: f0c566b55683395a62fefb9261a060fa09824914b5682c3b9629fa154762ae2f
        run: |
          set -euo pipefail
          architecture="$(uname -m)"
          if [[ "${architecture}" == "x86_64" ]]; then
            uv_arch="x86_64-unknown-linux-gnu"
            uv_sha256="${UV_X86_64_SHA256}"
          elif [[ "${architecture}" == "aarch64" ]]; then
            uv_arch="aarch64-unknown-linux-gnu"
            uv_sha256="${UV_AARCH64_SHA256}"
          else
            echo "::error::Unsupported architecture for uv: ${architecture}"
            exit 1
          fi
          archive="${RUNNER_TEMP}/uv.tar.gz"
          curl --fail --location --proto '=https' --silent --show-error \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${uv_arch}.tar.gz" \
            --output "${archive}"
          echo "${uv_sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/uv-bin"
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}/uv-bin" \
            --strip-components=1 "uv-${uv_arch}/uv" "uv-${uv_arch}/uvx"
          echo "${RUNNER_TEMP}/uv-bin" >> "${GITHUB_PATH}"

      - name: Provision clean public runtime
        env:
          PIP_EXTRA_INDEX_URL: ''
          PIP_INDEX_URL: ''
          UV_DEFAULT_INDEX: ''
          UV_EXTRA_INDEX_URL: ''
          UV_FIND_LINKS: ''
          UV_INDEX: ''
          UV_INDEX_URL: ''
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          python portability-controls/.github/skills/ontology/ontology-authoring/scripts/ontology_authoring/runtime_provisioning.py \
            --project-root requested-source/.github/skills/ontology/ontology-authoring \
            --environment "${RUNNER_TEMP}/ontology-runtime" \
            --evidence-output "${EVIDENCE_DIR}/runtime-provisioning-evidence.json"

      - name: Validate runtime evidence
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/ontology-runtime/bin/python" - <<'PY'
          import json
          from pathlib import Path

          import jsonschema

          workspace = Path.cwd()
          schema = json.loads(
              (
                  workspace
                  / "portability-controls/.github/skills/ontology/ontology-authoring/assets/schemas/runtime-provisioning-evidence.schema.json"
              ).read_text(encoding="utf-8")
          )
          evidence = json.loads(
              (workspace / "runtime-portability-evidence/runtime-provisioning-evidence.json").read_text(
                  encoding="utf-8"
              )
          )
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(
              evidence
          )
          if evidence["restoreClass"] != "canonical-public-index":
              raise RuntimeError("Hosted portability proof did not use canonical public PyPI")
          PY

      - name: Upload portability evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_DIR }}/runtime-provisioning-evidence.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Record retrieval identity
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo "## Runtime portability retrieval identity"
            echo ""
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Source commit: ${SOURCE_COMMIT}"
            echo "- Workflow run ID: ${GITHUB_RUN_ID}"
            echo "- Artifact name: ${ARTIFACT_NAME}"
            echo "- Artifact ID: ${ARTIFACT_ID}"
            echo "- Artifact URL: ${ARTIFACT_URL}"
            echo "- GitHub artifact digest: ${ARTIFACT_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"