name: Gitleaks Secret Scan

on:
  workflow_call:
    inputs:
      change-mode:
        description: 'Use an exact immutable range or scan full repository history'
        required: false
        type: string
        default: full
      base-sha:
        description: 'Immutable base commit used in range mode'
        required: false
        type: string
        default: ''
      head-sha:
        description: 'Immutable head commit used in range mode'
        required: false
        type: string
        default: ''
      soft-fail:
        description: 'Whether to continue on secret detection'
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: 'Whether to upload SARIF results to Security tab'
        required: false
        type: boolean
        default: false
      upload-artifact:
        description: 'Whether to upload results as artifact'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify resolved head commit
        if: inputs.change-mode == 'range'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          if [[ ! "${EXPECTED_HEAD_SHA}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ || "${actual_head_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Checked-out commit ${actual_head_sha} does not match the resolved head commit."
            exit 1
          fi

      - name: Download and verify gitleaks
        shell: bash
        run: |
          set -euo pipefail

          GITLEAKS_VERSION="8.30.0"
          GITLEAKS_SHA256="79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_TARBALL="gitleaks.tar.gz"

          echo "Downloading gitleaks v${GITLEAKS_VERSION}..."
          curl -fsSL -o "${GITLEAKS_TARBALL}" "${GITLEAKS_URL}"

          echo "Verifying SHA256 checksum..."
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_TARBALL}" | sha256sum -c -

          echo "Extracting gitleaks binary..."
          tar -xzf "${GITLEAKS_TARBALL}" gitleaks
          chmod +x gitleaks

          echo "Gitleaks version:"
          ./gitleaks version

      - name: Run gitleaks scan
        id: gitleaks
        shell: bash
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_CHANGE_MODE: ${{ inputs.change-mode }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
          INPUT_SOFT_FAIL: ${{ inputs.soft-fail }}
        run: |
          set -euo pipefail

          mkdir -p logs

          SCAN_ARGS=(
            "git"
            "--report-format" "sarif"
            "--report-path" "logs/gitleaks-results.sarif"
            "--redact"
            "--log-level" "info"
          )

          if [ "$INPUT_CHANGE_MODE" = 'range' ]; then
            if [ -z "$INPUT_BASE_SHA" ] || [ -z "$INPUT_HEAD_SHA" ]; then
              echo '::error::Range mode requires immutable base and head commit IDs.'
              exit 1
            fi
            SCAN_ARGS+=("--log-opts=--diff-merges=first-parent ${INPUT_BASE_SHA}..${INPUT_HEAD_SHA}")
            echo 'Scanning the verified immutable workflow range, including first-parent merge-commit patches.'
          elif [ "$INPUT_CHANGE_MODE" = 'full' ]; then
            SCAN_ARGS+=("--log-opts=--full-history --diff-filter=tuxdb --diff-merges=first-parent HEAD")
            echo 'Full validation mode selected; scanning the full history of the checked-out commit, including first-parent merge-commit patches.'
          else
            echo "::error::Unsupported change mode: $INPUT_CHANGE_MODE"
            exit 1
          fi

          # Respect .gitleaksignore for pre-existing secrets
          if [ -f ".gitleaksignore" ]; then
            echo "Found .gitleaksignore — known secrets will be suppressed."
          fi

          echo "Running gitleaks scan..."
          EXIT_CODE=0
          ./gitleaks "${SCAN_ARGS[@]}" || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "No secrets detected."
            echo "leaks-found=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -eq 1 ]; then
            echo "::warning::Gitleaks detected secrets in the repository."
            echo "leaks-found=true" >> "$GITHUB_OUTPUT"
            if [ "$INPUT_SOFT_FAIL" != "true" ]; then
              echo "::error::Secret scanning failed. Review detected secrets in logs/gitleaks-results.sarif"
              exit 1
            fi
          else
            echo "::error::Gitleaks encountered an unexpected error (exit code: $EXIT_CODE)"
            exit "$EXIT_CODE"
          fi

      - name: Upload SARIF to Security tab
        if: inputs.upload-sarif && always()
        uses: github/codeql-action/upload-sarif@ce729e4d353d580e6cacd6a8cf2921b72e5e310a # v3.27.0
        with:
          sarif_file: logs/gitleaks-results.sarif
          category: gitleaks
        continue-on-error: true

      - name: Upload scan results
        if: inputs.upload-artifact && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results
          path: logs/gitleaks-results.sarif
          retention-days: 90

      - name: Add job summary
        if: always()
        shell: bash
        env:
          GITLEAKS_LEAKS_FOUND: ${{ steps.gitleaks.outputs.leaks-found }}
        run: |
          LEAKS_FOUND="$GITLEAKS_LEAKS_FOUND"
          if [ "$LEAKS_FOUND" = "true" ]; then
            STATUS="⚠️ Secrets Detected"
          else
            STATUS="✅ No Secrets Found"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Gitleaks Secret Scan Results

          | Metric | Value |
          |--------|-------|
          | Status | $STATUS |

          EOF
