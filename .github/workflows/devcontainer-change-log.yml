name: "Devcontainer Change Log"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.devcontainer/**'
      - '.github/workflows/copilot-setup-steps.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  log-changes:
    name: Log Infrastructure Changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write infrastructure change summary
        shell: pwsh
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $params = @{
            EventName = $env:GITHUB_EVENT_NAME
          }
          if ($env:GITHUB_SHA) {
            $params['CommitSha'] = $env:GITHUB_SHA
          }
          if ($env:GITHUB_REF_NAME) {
            $params['BranchName'] = $env:GITHUB_REF_NAME
          }
          if ($env:EVENT_BEFORE_SHA) {
            $params['BeforeSha'] = $env:EVENT_BEFORE_SHA
          }
          & scripts/devcontainer/Write-DevcontainerChangeLog.ps1 @params

