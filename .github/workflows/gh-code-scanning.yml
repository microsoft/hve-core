name: GitHub Code Scanning

on:
  workflow_call:

permissions:
  contents: read
  security-events: read
  actions: read

jobs:
  watch-targets:
    name: Resolve Upstream Watch Targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      runner-labels: ${{ steps.labels.outputs.runner-labels }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: List runner labels to probe
        id: labels
        shell: pwsh
        run: |
          $labels = & ./scripts/security/Get-UpstreamWatchStatus.ps1 -ListRunnerLabels
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "runner-labels=$labels" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  # Each probe job only needs to start: the runner writes its version to the job
  # log at setup, and the scan job reads it from there.
  runner-probe:
    name: Runner probe (${{ matrix.label }})
    needs: [watch-targets]
    if: needs.watch-targets.outputs.runner-labels != '[]'
    runs-on: ${{ matrix.label }}
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON(needs.watch-targets.outputs.runner-labels) }}
    steps:
      - name: Report runner start
        run: echo "Runner probe started."

  scan:
    name: Fetch Code Scanning Alerts
    needs: [watch-targets, runner-probe]
    if: ${{ !cancelled() && needs.watch-targets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      # Dismissed alerts that are still detected are reported too: a dismissal
      # never resolves an alert, so they get an issue that asks for a reopen.
      - name: Fetch code scanning alerts
        shell: pwsh
        run: |
          $alerts = & .github/skills/security/gh-code-scanning/scripts/Get-CodeScanningAlerts.ps1 `
            -Owner $env:OWNER `
            -Repo $env:REPO `
            -OutputFormat Json `
            -IncludeDismissedStillDetected
          $alerts | Set-Content alerts.json -Encoding utf8

      - name: Report tracked exception status
        shell: pwsh
        run: |
          $status = & ./scripts/security/Get-CodeScanningExceptionStatus.ps1 -Owner $env:OWNER -Repo $env:REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status | Set-Content exceptions.json -Encoding utf8

      - name: Evaluate upstream watches
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          $status = & ./scripts/security/Get-UpstreamWatchStatus.ps1 -Owner $env:OWNER -Repo $env:REPO -RunId $env:RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status | Set-Content watches.json -Encoding utf8

      - name: Upload alerts artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-code-scanning-alerts
          path: |
            alerts.json
            exceptions.json
            watches.json
          retention-days: 30
