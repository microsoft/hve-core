name: Tool Version Consistency Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Validate Tool Version Consistency
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # Required for SARIF upload to Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every hard-coded tool version and checksum must match the single source in
      # scripts/security/tool-checksums.json. The check exits 1 on findings and
      # writes them to SARIF, which the gate below decides on. No SARIF means the
      # check itself failed.
      - name: Check tool versions against the manifest
        shell: pwsh
        run: |
          Remove-Item -LiteralPath logs/tool-version-consistency.sarif -ErrorAction Ignore
          ./scripts/security/Test-ToolVersionConsistency.ps1 -SarifPath logs/tool-version-consistency.sarif
          if (-not (Test-Path -LiteralPath logs/tool-version-consistency.sarif)) {
            throw 'The tool version check produced no SARIF.'
          }
          exit 0

      # Uploading needs security-events: write, which a fork pull request never
      # receives. Skip the step for forks rather than attempt it; the gate below
      # still decides every pull request.
      - name: Upload SARIF to Security tab
        if: always() && hashFiles('logs/tool-version-consistency.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: logs/tool-version-consistency.sarif
          category: tool-version-consistency

      # The gate reads the exception register with powershell-yaml.
      - name: Setup PowerShell modules
        uses: $/.github/actions/setup-ps-modules

      # Every finding fails unless a tracked exception in
      # security/code-scanning-exceptions.yml excuses it.
      - name: Gate on findings
        shell: pwsh
        run: ./scripts/security/Test-CodeQLSarifThreshold.ps1 -SarifPath logs/tool-version-consistency.sarif -Threshold All
