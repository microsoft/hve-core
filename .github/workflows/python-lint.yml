name: Python Lint

on:
  workflow_call:
    inputs:
      change-mode:
        description: 'Use an exact immutable range or run full validation'
        required: false
        type: string
        default: full
      base-sha:
        description: 'Immutable base commit used in range mode'
        required: false
        type: string
        default: ''
      head-sha:
        description: 'Immutable head commit used in range mode'
        required: false
        type: string
        default: ''
      soft-fail:
        description: 'When true, linting warnings do not fail the build'
        required: false
        type: boolean
        default: false
      changed-files-only:
        description: 'When true, lint only changed Python files'
        required: false
        type: boolean
        default: true
      working-directory:
        description: 'Directory containing pyproject.toml with ruff config'
        required: true
        type: string

permissions:
  contents: read

jobs:
  python-lint:
    name: Ruff Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify resolved head commit
        if: inputs.change-mode == 'range'
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          $actualHeadSha = (git rev-parse HEAD).Trim()
          if ($env:EXPECTED_HEAD_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$' -or $actualHeadSha -cne $env:EXPECTED_HEAD_SHA) {
            Write-Output "::error::Checked-out commit $actualHeadSha does not match the resolved head commit."
            exit 1
          }

      - name: Derive artifact name
        id: meta
        env:
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          $name = $env:INPUT_WORKING_DIRECTORY -replace '/', '-' -replace '^\.', '' -replace '^-', ''
          "artifact-name=python-lint-$name" >> $env:GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.9"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: ${{ inputs.working-directory }}

      - name: Detect changed Python files
        if: inputs.changed-files-only
        env:
          INPUT_BASE_SHA: ${{ inputs.base-sha }}
          INPUT_CHANGE_MODE: ${{ inputs.change-mode }}
          INPUT_HEAD_SHA: ${{ inputs.head-sha }}
          INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if ($env:INPUT_CHANGE_MODE -eq 'full') {
            "HAS_CHANGES=true" >> $env:GITHUB_ENV
            Write-Output 'Full validation mode selected.'
            return
          }
          if ($env:INPUT_CHANGE_MODE -ne 'range' -or -not $env:INPUT_BASE_SHA -or -not $env:INPUT_HEAD_SHA) {
            throw 'Range mode requires immutable base and head commit IDs.'
          }
          $workingDir = $env:INPUT_WORKING_DIRECTORY
          $changed = git diff --name-only --diff-filter=ACMR "$env:INPUT_BASE_SHA..$env:INPUT_HEAD_SHA" -- $workingDir |
            Where-Object { $_ -match '\.pyi?$' }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compute the immutable workflow range.' }
          if ($changed) {
            "HAS_CHANGES=true" >> $env:GITHUB_ENV
            $fileCount = @($changed).Count
            Write-Output "Detected $fileCount changed Python file(s)"
          } else {
            Write-Output "No Python file changes detected under $workingDir"
          }

      - name: Run ruff check
        id: ruff-check
        if: "!inputs.changed-files-only || env.HAS_CHANGES == 'true'"
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/logs" -Force | Out-Null
          # JSON output -> file only; stderr flows to CI log to preserve valid JSON
          uv run ruff check . --output-format json > "$env:GITHUB_WORKSPACE/logs/python-lint-results.json"
          if ($LASTEXITCODE -ne 0) { "RUFF_CHECK_FAILED=true" >> $env:GITHUB_ENV }
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { "RUFF_CHECK_FAILED=true" >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Run ruff format check
        id: ruff-format
        if: "!inputs.changed-files-only || env.HAS_CHANGES == 'true'"
        run: |
          # Stderr flows to CI log; no file redirect so output stays readable
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { "RUFF_FORMAT_FAILED=true" >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0
        working-directory: ${{ inputs.working-directory }}
        continue-on-error: ${{ inputs.soft-fail }}

      - name: Upload lint results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && (!inputs.changed-files-only || env.HAS_CHANGES == 'true')
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: logs/python-lint-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Check results
        if: "!inputs.soft-fail && (!inputs.changed-files-only || env.HAS_CHANGES == 'true')"
        run: |
          if ($env:RUFF_CHECK_FAILED -eq 'true' -or $env:RUFF_FORMAT_FAILED -eq 'true') {
            Write-Output '::error::Python linting failed'
            if ($env:RUFF_CHECK_FAILED -eq 'true') { Write-Output '  - ruff check failed' }
            if ($env:RUFF_FORMAT_FAILED -eq 'true') { Write-Output '  - ruff format check failed' }
            exit 1
          }
          Write-Output 'All Python lint checks passed'
