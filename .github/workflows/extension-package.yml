name: Package Extension

on:
  workflow_call:
    inputs:
      source-ref:
        description: "Immutable source to package from (full commit SHA or tag)"
        required: true
        type: string
      version:
        description: "Full version to package (e.g., 1.0.0)"
        required: true
        type: string
      channel:
        description: "Release channel (Stable or PreRelease) controlling the pre-release packaging flag"
        required: false
        type: string
        default: "Stable"

permissions:
  contents: read

jobs:
  package:
    name: Package hve-core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate source ref
        shell: bash
        env:
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          set -euo pipefail
          source_ref="$INPUT_SOURCE_REF"
          if [ -z "${source_ref//[[:space:]]/}" ]; then
            echo "::error::source-ref is required and must not be blank"
            exit 1
          fi
          if printf '%s' "$source_ref" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            exit 0
          fi
          if git check-ref-format --branch "$source_ref" >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$source_ref" == refs/* ]] && git check-ref-format "$source_ref" >/dev/null 2>&1; then
            exit 0
          fi
          echo "::error::source-ref must be a full commit SHA or valid Git ref"
          exit 1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      # The gate runs before any dependency install, so a mismatched caller
      # never reaches lifecycle scripts.
      - name: Validate packaging inputs
        shell: bash
        env:
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION// }"
          if [ -z "$version" ]; then
            echo "::error::version is required and must not be blank"
            exit 1
          fi
          # The packaged source and the caller-supplied version must agree so a
          # release can never ship a VSIX built from a different commit.
          template_version=$(jq -r .version extension/templates/package.template.json)
          if [ "$version" != "$template_version" ]; then
            echo "::error::extension/templates/package.template.json is $template_version but the caller requested $version"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Opt back into dependency lifecycle scripts (the repo .npmrc sets
      # ignore-scripts=true for dev safety). Packaging needs vsce's native
      # install hooks (@vscode/vsce-sign, keytar) to run.
      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Prepare extension resources
        id: prepare
        shell: pwsh
        run: |
          Write-Host "🔧 Preparing extension resources..."
          ./scripts/extension/Prepare-Extension.ps1

      - name: Package extension
        id: package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $version = "$env:INPUT_VERSION".Trim()
          $channel = "$env:INPUT_CHANNEL".Trim()
          if (-not $channel) { $channel = 'Stable' }

          Write-Host "📦 Packaging extension for $channel channel..."

          $arguments = @{}

          if ($channel -ieq 'PreRelease') {
            $arguments['PreRelease'] = $true
          }

          if ($version) {
            $arguments['Version'] = $version
          }

          if (Test-Path "./CHANGELOG.md") {
            $arguments['ChangelogPath'] = "./CHANGELOG.md"
          }

          ./scripts/extension/Package-Extension.ps1 @arguments

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix
          path: extension/*.vsix
          retention-days: 30
