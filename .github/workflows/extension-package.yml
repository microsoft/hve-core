name: Package Extension

on:
  workflow_call:
    inputs:
      source-ref:
        description: "Immutable source to package from (full commit SHA or tag)"
        required: true
        type: string
      version:
        description: "Full version to package (e.g., 1.0.0)"
        required: true
        type: string
      dev-patch-number:
        description: "Dev patch number to append (creates version like 1.0.0-dev.123)"
        required: false
        type: string
        default: ""
      use-changelog:
        description: "Whether to download and use changelog artifact"
        required: false
        type: boolean
        default: false
      channel:
        description: "Release channel (Stable or PreRelease) controlling agent maturity filtering"
        required: false
        type: string
        default: "Stable"
    outputs:
      version:
        description: "Version that was packaged"
        value: ${{ jobs.discover-packages.outputs.version }}
      packages-matrix:
        description: "JSON matrix of packages that were actually packaged (filtered by channel and maturity)"
        value: ${{ jobs.discover-packages.outputs.matrix }}

permissions:
  contents: read

jobs:
  discover-packages:
    name: Discover Marketplace Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Resolve effective version
        id: read-version
        shell: bash
        env:
          INPUT_SOURCE_REF: ${{ inputs.source-ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DEV_PATCH: ${{ inputs.dev-patch-number }}
        run: |
          set -euo pipefail
          if [ -z "${INPUT_SOURCE_REF// }" ]; then
            echo "::error::source-ref is required and must not be blank"
            exit 1
          fi
          version="${INPUT_VERSION// }"
          if [ -z "$version" ]; then
            echo "::error::version is required and must not be blank"
            exit 1
          fi
          # The packaged source and the caller-supplied version must agree so a
          # release can never ship a VSIX built from a different commit.
          template_version=$(jq -r .version extension/templates/package.template.json)
          dev_patch="$INPUT_DEV_PATCH"
          if [ -z "$dev_patch" ] && [ "$version" != "$template_version" ]; then
            echo "::notice::Packaging $version from a source whose committed template version is $template_version"
          fi
          if [ -n "$dev_patch" ]; then
            version="${version}-dev.${dev_patch}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Discover marketplace packages
        id: discover
        shell: pwsh
        run: |
          & ./scripts/extension/Get-MarketplacePackageMatrix.ps1 -Channel '${{ inputs.channel }}'

  package:
    name: Package ${{ matrix.id }}
    needs: discover-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-packages.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Opt back into dependency lifecycle scripts (the repo .npmrc sets
      # ignore-scripts=true for dev safety). Packaging needs vsce's native
      # install hooks (@vscode/vsce-sign, keytar) to run.
      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Setup PowerShell modules
        uses: ./.github/actions/setup-ps-modules

      - name: Download changelog artifact
        if: inputs.use-changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog
          path: ./
        continue-on-error: true

      - name: Prepare extension resources
        id: prepare
        shell: pwsh
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $channel = "$env:INPUT_CHANNEL".Trim()
          if (-not $channel) { $channel = 'Stable' }
          $packageId = "${{ matrix.id }}"

          Write-Host "🔧 Preparing extension for $channel channel (package: ${{ matrix.id }})..."
          ./scripts/extension/Prepare-Extension.ps1 -Channel $channel -PackageId $packageId

      - name: Package extension
        id: package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DEV_PATCH: ${{ inputs.dev-patch-number }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          $version = "$env:INPUT_VERSION".Trim()
          $devPatch = "$env:INPUT_DEV_PATCH".Trim()
          $channel = "$env:INPUT_CHANNEL".Trim()
          if (-not $channel) { $channel = 'Stable' }
          $packageId = "${{ matrix.id }}"

          Write-Host "📦 Packaging extension for $channel channel (package: ${{ matrix.id }})..."

          $arguments = @{
            PackageId = $packageId
          }

          if ($channel -ieq 'PreRelease') {
            $arguments['PreRelease'] = $true
          }

          if ($version) {
            $arguments['Version'] = $version
          }

          if ($devPatch) {
            $arguments['DevPatchNumber'] = $devPatch
          }

          if (Test-Path "./CHANGELOG.md") {
            $arguments['ChangelogPath'] = "./CHANGELOG.md"
          }

          ./scripts/extension/Package-Extension.ps1 @arguments

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-vsix-${{ matrix.id }}
          path: extension/*.vsix
          retention-days: 30
