# Docusaurus documentation site deployment
# Prerequisite: Enable GitHub Pages in repo Settings → Pages → Source: GitHub Actions
# and allow the target branch in Settings → Environments → github-pages → Deployment branches

name: Deploy Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  # Backlog Grooming Publisher and Demo Material Render dispatch this with their
  # run ID after they produce new content; a manual run leaves it empty.
  workflow_dispatch:
    inputs:
      source-run-id:
        description: 'Publisher or render run that requested this deploy (optional)'
        required: false
        type: string
        default: ''

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Docusaurus Tests
    uses: $/.github/workflows/docusaurus-tests.yml
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC in the reusable workflow
    with:
      soft-fail: false

  build:
    name: Build Docusaurus
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      actions: read # read producer runs and download their artifacts
      contents: read
      pages: write # configure GitHub Pages for the site build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/docusaurus/package-lock.json

      - name: Install dependencies
        working-directory: docs/docusaurus
        run: npm ci

      - name: Build site
        working-directory: docs/docusaurus
        run: npm run build

      # A producer dispatches this deploy from its last job, so its run is still
      # finishing; wait for it, then accept only a successful default-branch run
      # of one of the two producers.
      - name: Wait for the requesting run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source-run-id != '' }}
        id: requester
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        with:
          script: |
            const waitForRun = async (runId) => {
              const deadline = Date.now() + 30 * 60 * 1000;
              for (;;) {
                const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
                if (run.status === "completed") return run;
                if (Date.now() > deadline) throw new Error(`Run ${runId} did not complete within 30 minutes`);
                await new Promise((resolve) => setTimeout(resolve, 15000));
              }
            };
            const runId = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error("source-run-id must be a positive safe integer");
            const run = await waitForRun(runId);
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            const producers = [".github/workflows/backlog-groom-publisher.yml", ".github/workflows/demo-material-render.yml"];
            if (!producers.includes(run.path) || run.head_branch !== repository.default_branch || run.conclusion !== "success") {
              throw new Error("A deploy request must come from a successful default-branch publisher or render run");
            }
            core.setOutput("path", run.path);
            core.setOutput("run-id", String(run.id));
            core.setOutput("run-attempt", String(run.run_attempt));
            core.setOutput("head-sha", run.head_sha);

      - name: Authenticate publisher provenance artifact
        if: ${{ steps.requester.outputs.path == '.github/workflows/backlog-groom-publisher.yml' }}
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLISHER_RUN_ID: ${{ steps.requester.outputs.run-id }}
        with:
          script: |
            const run = { id: Number(process.env.PUBLISHER_RUN_ID) };
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: run.id, per_page: 100 },
            );
            const expectedName = `backlog-grooming-pages-provenance-${run.id}`;
            const provenance = artifacts.filter(
              (artifact) => !artifact.expired && artifact.name === expectedName,
            );
            if (provenance.length !== 1) {
              throw new Error("Publisher run must contain exactly one immutable Pages provenance artifact");
            }
            core.setOutput("artifact-id", String(provenance[0].id));
            core.setOutput("run-id", String(run.id));

      - name: Download exact publisher provenance
        if: ${{ steps.reports.outputs.artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.reports.outputs.artifact-id }}
          path: pages-provenance
          github-token: ${{ github.token }}
          run-id: ${{ steps.reports.outputs.run-id }}

      - name: Validate immutable publisher provenance
        if: ${{ steps.reports.outputs.artifact-id != '' }}
        id: provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLISHER_RUN_ID: ${{ steps.requester.outputs.run-id }}
          PUBLISHER_RUN_ATTEMPT: ${{ steps.requester.outputs.run-attempt }}
          PUBLISHER_HEAD_SHA: ${{ steps.requester.outputs.head-sha }}
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const provenance = JSON.parse(
              fs.readFileSync("pages-provenance/provenance.json", "utf8"),
            );
            const { provenance_digest: recordedDigest, ...material } = provenance;
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const computedDigest = crypto.createHash("sha256").update(canonicalize(material)).digest("hex");
            const run = {
              id: Number(process.env.PUBLISHER_RUN_ID),
              run_attempt: Number(process.env.PUBLISHER_RUN_ATTEMPT),
              head_sha: process.env.PUBLISHER_HEAD_SHA,
            };
            const exactKeys = (value, keys) => value && typeof value === "object" && !Array.isArray(value) &&
              Object.keys(value).sort().join("|") === [...keys].sort().join("|");
            if (!exactKeys(provenance, [
              "schema_version", "publisher_run_id", "publisher_run_attempt",
              "publisher_source_sha", "repository_id", "report_commit_sha", "provenance_digest",
            ]) || provenance.schema_version !== "backlog-grooming-pages-provenance/v1" ||
                provenance.publisher_run_id !== String(run.id) ||
                provenance.publisher_run_attempt !== run.run_attempt ||
                provenance.publisher_source_sha !== run.head_sha ||
                !/^[a-f0-9]{40}$/.test(provenance.publisher_source_sha) ||
                provenance.repository_id !== String(context.payload.repository.id) ||
                !/^[a-f0-9]{40}$/.test(provenance.report_commit_sha) ||
                !/^[a-f0-9]{64}$/.test(recordedDigest) || recordedDigest !== computedDigest) {
              throw new Error("Pages provenance is not bound to the requesting publisher run");
            }
            await github.rest.git.getCommit({
              ...context.repo,
              commit_sha: provenance.report_commit_sha,
            });
            core.setOutput("ref", provenance.report_commit_sha);

      - name: Checkout backlog grooming report history
        if: ${{ steps.provenance.outputs.ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.provenance.outputs.ref }}
          path: report-history
          persist-credentials: false
          sparse-checkout: backlog-grooming

      - name: Stage backlog grooming reports
        if: ${{ steps.provenance.outputs.ref != '' }}
        run: |
          mkdir -p docs/docusaurus/build/backlog-grooming
          cp -R report-history/backlog-grooming/. docs/docusaurus/build/backlog-grooming/

      # Pages replaces the whole site on each deploy, so every deploy restages
      # the latest bundle rather than only deploys triggered by a render.
      - name: Find the latest demo material bundle
        id: demo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/skills/experimental/hve-demo-material/scripts/artifact_lookup.py find \
            --workflow demo-material-render.yml --artifact-prefix demo-material-site \
            --github-output "${GITHUB_OUTPUT}"

      - name: Download the demo material bundle
        if: ${{ steps.demo.outputs.artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.demo.outputs.artifact-id }}
          run-id: ${{ steps.demo.outputs.run-id }}
          github-token: ${{ github.token }}
          path: demo-material-bundle

      # Without an artifact, keep what is published; a failed recovery fails the
      # deploy instead of removing the material from the site.
      - name: Recover the published demo material
        id: recovered
        if: ${{ steps.demo.outputs.artifact-id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/skills/experimental/hve-demo-material/scripts/artifact_lookup.py recover \
            --target demo-material-bundle --github-output "${GITHUB_OUTPUT}"

      - name: Stage demo material
        if: ${{ steps.demo.outputs.artifact-id != '' || steps.recovered.outputs.status == 'recovered' }}
        run: |
          python3 - <<'PY'
          import json, re, shutil
          from pathlib import Path

          bundle = Path("demo-material-bundle")
          target = Path("docs/docusaurus/build/demo-material")
          allowed = re.compile(
              r"^(index\.json|L[1-4]00/(hve-demo-L[1-4]00\.(pptx|mp4|vtt|html)|index\.html|render-result\.json|source-register\.md))$"
          )
          for path in bundle.rglob("*"):
              if path.is_symlink() or (path.is_file() and not allowed.match(path.relative_to(bundle).as_posix())):
                  raise SystemExit(f"unexpected file in demo material bundle: {path}")
          index = json.loads((bundle / "index.json").read_text(encoding="utf-8"))
          if index.get("schema_version") != "demo-material-site/v1":
              raise SystemExit("demo material bundle has an unknown schema")
          shutil.copytree(bundle, target, dirs_exist_ok=True)
          print(f"Staged demo material levels: {sorted(index.get('levels', {}))}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/docusaurus/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write # deploy the site to GitHub Pages
      id-token: write # OIDC token that actions/deploy-pages requires
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

