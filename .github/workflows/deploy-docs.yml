# Docusaurus documentation site deployment
# Prerequisite: Enable GitHub Pages in repo Settings → Pages → Source: GitHub Actions
# and allow the target branch in Settings → Environments → github-pages → Deployment branches

name: Deploy Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Backlog Grooming Publisher
      - Demo Material Render
    branches:
      - main
    types:
      - completed

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Docusaurus Tests
    uses: ./.github/workflows/docusaurus-tests.yml
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC in the reusable workflow
    with:
      soft-fail: false

  build:
    name: Build Docusaurus
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/docusaurus/package-lock.json

      - name: Install dependencies
        working-directory: docs/docusaurus
        run: npm ci

      - name: Build site
        working-directory: docs/docusaurus
        run: npm run build

      - name: Authenticate publisher provenance artifact
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.path == '.github/workflows/backlog-groom-publisher.yml' }}
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            if (run.path !== ".github/workflows/backlog-groom-publisher.yml" ||
                run.head_branch !== repository.default_branch || run.conclusion !== "success") {
              throw new Error("Report staging requires a successful default-branch publisher run");
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: run.id, per_page: 100 },
            );
            const expectedName = `backlog-grooming-pages-provenance-${run.id}`;
            const provenance = artifacts.filter(
              (artifact) => !artifact.expired && artifact.name === expectedName,
            );
            if (provenance.length !== 1) {
              throw new Error("Publisher run must contain exactly one immutable Pages provenance artifact");
            }
            core.setOutput("artifact-id", String(provenance[0].id));
            core.setOutput("run-id", String(run.id));

      - name: Download exact publisher provenance
        if: ${{ steps.reports.outputs.artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.reports.outputs.artifact-id }}
          path: pages-provenance
          github-token: ${{ github.token }}
          run-id: ${{ steps.reports.outputs.run-id }}

      - name: Validate immutable publisher provenance
        if: ${{ steps.reports.outputs.artifact-id != '' }}
        id: provenance
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const provenance = JSON.parse(
              fs.readFileSync("pages-provenance/provenance.json", "utf8"),
            );
            const { provenance_digest: recordedDigest, ...material } = provenance;
            const canonicalize = (value) => {
              if (Array.isArray(value)) return `[${value.map(canonicalize).join(",")}]`;
              if (value !== null && typeof value === "object") return `{${Object.keys(value).sort().map(
                (key) => `${JSON.stringify(key)}:${canonicalize(value[key])}`,
              ).join(",")}}`;
              return JSON.stringify(value);
            };
            const computedDigest = crypto.createHash("sha256").update(canonicalize(material)).digest("hex");
            const run = context.payload.workflow_run;
            const exactKeys = (value, keys) => value && typeof value === "object" && !Array.isArray(value) &&
              Object.keys(value).sort().join("|") === [...keys].sort().join("|");
            if (!exactKeys(provenance, [
              "schema_version", "publisher_run_id", "publisher_run_attempt",
              "publisher_source_sha", "repository_id", "report_commit_sha", "provenance_digest",
            ]) || provenance.schema_version !== "backlog-grooming-pages-provenance/v1" ||
                provenance.publisher_run_id !== String(run.id) ||
                provenance.publisher_run_attempt !== run.run_attempt ||
                provenance.publisher_source_sha !== run.head_sha ||
                !/^[a-f0-9]{40}$/.test(provenance.publisher_source_sha) ||
                provenance.repository_id !== String(context.payload.repository.id) ||
                !/^[a-f0-9]{40}$/.test(provenance.report_commit_sha) ||
                !/^[a-f0-9]{64}$/.test(recordedDigest) || recordedDigest !== computedDigest) {
              throw new Error("Pages provenance is not bound to the triggering publisher run");
            }
            await github.rest.git.getCommit({
              ...context.repo,
              commit_sha: provenance.report_commit_sha,
            });
            core.setOutput("ref", provenance.report_commit_sha);

      - name: Checkout backlog grooming report history
        if: ${{ steps.provenance.outputs.ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.provenance.outputs.ref }}
          path: report-history
          persist-credentials: false
          sparse-checkout: backlog-grooming

      - name: Stage backlog grooming reports
        if: ${{ steps.provenance.outputs.ref != '' }}
        run: |
          mkdir -p docs/docusaurus/build/backlog-grooming
          cp -R report-history/backlog-grooming/. docs/docusaurus/build/backlog-grooming/

      # Pages replaces the whole site on each deploy, so every deploy restages
      # the latest bundle rather than only deploys triggered by a render.
      - name: Find the latest demo material bundle
        id: demo
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            let runs = [];
            try {
              ({ data: { workflow_runs: runs } } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: "demo-material-render.yml",
                branch: repository.default_branch,
                status: "success",
                per_page: 20,
              }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (const run of runs) {
              if (run.path !== ".github/workflows/demo-material-render.yml") continue;
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: run.id, per_page: 100 },
              );
              const bundle = artifacts.filter(
                (artifact) => !artifact.expired && artifact.name === `demo-material-site-${run.id}`,
              );
              if (bundle.length === 1) {
                core.setOutput("artifact-id", String(bundle[0].id));
                core.setOutput("run-id", String(run.id));
                return;
              }
            }
            core.notice("No demo material bundle is available; the demo material page links stay empty.");

      - name: Download the demo material bundle
        if: ${{ steps.demo.outputs.artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.demo.outputs.artifact-id }}
          run-id: ${{ steps.demo.outputs.run-id }}
          github-token: ${{ github.token }}
          path: demo-material-bundle

      - name: Stage demo material
        if: ${{ steps.demo.outputs.artifact-id != '' }}
        run: |
          python3 - <<'PY'
          import json, re, shutil
          from pathlib import Path

          bundle = Path("demo-material-bundle")
          target = Path("docs/docusaurus/build/demo-material")
          allowed = re.compile(
              r"^(index\.json|L[1-4]00/(hve-demo-L[1-4]00\.(pptx|mp4|vtt)|index\.html|render-result\.json|source-register\.md))$"
          )
          for path in bundle.rglob("*"):
              if path.is_symlink() or (path.is_file() and not allowed.match(path.relative_to(bundle).as_posix())):
                  raise SystemExit(f"unexpected file in demo material bundle: {path}")
          index = json.loads((bundle / "index.json").read_text(encoding="utf-8"))
          if index.get("schema_version") != "demo-material-site/v1":
              raise SystemExit("demo material bundle has an unknown schema")
          shutil.copytree(bundle, target, dirs_exist_ok=True)
          print(f"Staged demo material levels: {sorted(index.get('levels', {}))}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/docusaurus/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

