name: Weekly Security Maintenance

on:
  schedule:
    - cron: '0 2 * * 0' # Sundays at 2 AM UTC
  workflow_dispatch:
    inputs:
      max-age-days:
        description: 'Maximum SHA age in days before considered stale'
        required: false
        type: number
        default: 30

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
    # Job 1: Validate dependency pinning
  validate-pinning:
    name: Validate Dependency Pinning Compliance
    uses: $/.github/workflows/dependency-pinning-scan.yml
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
    with:
      threshold: 100
      dependency-types: 'github-actions,npm,pip,workflow-npm-commands,shell-downloads,setup-action-versions,python-tool-runs,container-images,install-hints'
      soft-fail: true
      upload-sarif: true
      upload-artifact: true

  # Job 2: Check for stale SHA pins
  check-staleness:
    name: Check SHA Staleness
    uses: $/.github/workflows/sha-staleness-check.yml
    permissions:
      contents: read
    with:
      max-age-days: ${{ inputs.max-age-days || 30 }}

  # Job 3: Run CodeQL security analysis
  codeql-analysis:
    name: CodeQL Security Analysis
    uses: $/.github/workflows/codeql-analysis.yml
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
      actions: read # codeql-action reads workflow run metadata

  # Reuse the advisory hybrid scan for default-branch coverage.
  dangerous-workflow-scan:
    name: Dangerous Workflow and Poutine Scan
    uses: $/.github/workflows/dangerous-workflow-scan.yml
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload to Security tab
    with:
      soft-fail: true
      poutine-soft-fail: true
      upload-sarif: true
      upload-artifact: true

  # Generate consolidated summary.
  summary:
    name: Security Maintenance Summary
    needs: [validate-pinning, check-staleness, codeql-analysis, dangerous-workflow-scan]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write # create or update the weekly maintenance issue
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate summary
        shell: pwsh
        env:
          THRESHOLD_DAYS: ${{ inputs.max-age-days || 30 }}
          PINNING_SCORE: ${{ needs.validate-pinning.outputs.compliance-score }}
          UNPINNED_COUNT: ${{ needs.validate-pinning.outputs.unpinned-count }}
          FAILING_COUNT: ${{ needs.validate-pinning.outputs.failing-count }}
          EXCEPTED_COUNT: ${{ needs.validate-pinning.outputs.excepted-count }}
          EXCEPTION_ERROR_COUNT: ${{ needs.validate-pinning.outputs.exception-error-count }}
          GATE_ERROR: ${{ needs.validate-pinning.outputs.gate-error }}
          STALE_COUNT: ${{ needs.check-staleness.outputs.stale-count }}
          CODEQL_RESULT: ${{ needs.codeql-analysis.result }}
          WORKFLOW_SCAN_RESULT: ${{ needs.dangerous-workflow-scan.result }}
          EVENT_NAME: ${{ github.event_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          Import-Module ./scripts/lib/Modules/CIHelpers.psm1 -Force

          $pinningScore = $env:PINNING_SCORE
          $gateError = $env:GATE_ERROR -eq 'true'
          # Registered exceptions are tracked findings, not new risks. Fall back to the raw
          # scanner count only when the gate completed without producing a count.
          $unpinnedCount = if ($gateError) { 'unknown' } elseif ($env:FAILING_COUNT) { $env:FAILING_COUNT } else { $env:UNPINNED_COUNT }
          $exceptedCount = if ($gateError) { 'unknown' } elseif ($env:EXCEPTED_COUNT) { $env:EXCEPTED_COUNT } else { '0' }
          $exceptionErrorCount = if ($gateError) { 'unknown' } elseif ($env:EXCEPTION_ERROR_COUNT) { $env:EXCEPTION_ERROR_COUNT } else { '0' }
          $staleCount = $env:STALE_COUNT
          $codeqlResult = $env:CODEQL_RESULT
          $workflowScanResult = $env:WORKFLOW_SCAN_RESULT
          $thresholdDays = $env:THRESHOLD_DAYS
          
          # Determine overall status
          $hasIssues = $gateError
          if ($unpinnedCount -ne '0') { $hasIssues = $true }
          if ($exceptionErrorCount -ne '0') { $hasIssues = $true }
          if ($staleCount -ne '0') { $hasIssues = $true }
          if ($codeqlResult -ne 'success') { $hasIssues = $true }
          if ($workflowScanResult -ne 'success') { $hasIssues = $true }
          
          @"
          # 🔐 Weekly Security Maintenance Report
          
          **Execution Time:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          **Trigger:** $env:EVENT_NAME
          
          ## 📊 Dependency Health
          
          | Metric | Status | Details |
          |--------|--------|---------|
          | Dependency Pinning Gate | $(if ($gateError) { '❌ Failed' } else { '✅ Evaluated' }) | $(if ($gateError) { 'Review the validate-pinning job logs' } else { 'Exception register evaluated' }) |
          | Dependency Pinning Compliance | $(if ($gateError) { '❌ Unavailable' } elseif ($unpinnedCount -eq '0') { '✅ Pass' } else { '⚠️ Warning' }) | Score: $pinningScore% |
          | Unpinned Dependencies (not excepted) | $(if ($gateError) { '❌ Unknown' } elseif ($unpinnedCount -eq '0') { '✅ None' } else { "⚠️ $unpinnedCount found" }) | $(if ($gateError) { 'Gate did not produce a trusted count' } elseif ($unpinnedCount -ne '0') { 'Review warnings above' } else { 'All pinned or tracked' }) |
          | Tracked Exceptions | $(if ($gateError) { '❌ Unknown' } elseif ($exceptionErrorCount -eq '0') { "✅ $exceptedCount excused" } else { "⚠️ $exceptionErrorCount register error(s)" }) | security/code-scanning-exceptions.yml |
          | Stale SHAs (>$thresholdDays days) | $(if ($staleCount -eq '0') { '✅ None' } else { "⚠️ $staleCount found" }) | $(if ($staleCount -ne '0') { 'Review warnings above' } else { 'All current' }) |
          
          ## 🛡️ Security Analysis
          
          | Component | Status |
          |-----------|--------|
          | CodeQL Analysis | $(if ($codeqlResult -eq 'success') { '✅ Complete' } else { '⚠️ See details' }) |
          | Dangerous Workflow / Poutine | $(if ($workflowScanResult -eq 'success') { '✅' } else { '⚠️' }) $workflowScanResult (advisory; review logs and SARIF) |
          | Secret Scanning | ✅ Enabled (GitHub native) |
          | Dependabot Alerts | ✅ Enabled (GitHub native) |

          Advisory job success does not establish zero findings or a successful Poutine analysis.
          Review the scanner step logs, Security tab, and poutine-results artifact for scan evidence.

          $(if ($gateError) {
            @"

          ## ❌ Action Required: Dependency Gate Failure

          The exception-aware dependency gate failed before it could produce trusted finding and exception counts. Review the `validate-pinning` job logs and rerun the workflow after correcting the gate failure.

          "@
          })

          $(if (!$gateError -and $unpinnedCount -ne '0') {
            @"
          
          ## ⚠️ Action Required: Unpinned Dependencies
          
          **$unpinnedCount dependencies are not properly pinned.** This is a security risk.
          
          **To fix:**
          ``````powershell
          # Review the warnings above, then pin each dependency to a SHA
          # Example: Change 'actions/checkout@v4' to 'actions/checkout@<commit-sha> # v4.2.2'
          ``````
          
          "@
          })
          
          $(if ($staleCount -ne '0') {
            # Load the staleness report to show details
            # Note: Artifacts are not automatically shared between jobs
            # This will only work if the file exists in the runner's filesystem
            # Consider using job outputs or downloading artifacts explicitly
            $stalenessReport = if (Test-Path 'logs/sha-staleness-results.json') {
              Get-Content 'logs/sha-staleness-results.json' | ConvertFrom-Json
            }
            
            $staleThreshold = [int]$env:THRESHOLD_DAYS
            $staleDetails = ""
            if ($stalenessReport -and $stalenessReport.Dependencies) {
              foreach ($staleDep in $stalenessReport.Dependencies) {
                if ($staleDep.DaysOld -gt $staleThreshold) {
                  $staleDetails += (Format-StaleDependencyLine -Dependency $staleDep -Style Summary) + "`n"
                }
              }
            }
            
            @"
          
          ## ℹ️ Recommended: Update Stale SHAs
          
          **$staleCount SHA pins are outdated (>$thresholdDays days old).** Consider updating them.
          
          $staleDetails
          
          **To update:**
          ``````powershell
          # Run the update script to get latest SHAs
          scripts/security/Update-ActionSHAPinning.ps1 -Path .github/workflows -UpdateStale
          ``````
          
          "@
          })
          
          $(if (!$hasIssues) {
            @"
          
          ## ✅ Dependency Checks Clear
          
          Dependency checks are clear and analysis jobs completed:
          - All dependencies are properly pinned
          - All SHAs are current (< $thresholdDays days old)
          - CodeQL analysis completed successfully
          - Advisory workflow scan job completed; findings still require review
          - GitHub Secret Scanning and Dependabot actively monitoring
          
          "@
          })
          
          ---
          
          📥 **Detailed Reports:** Download artifacts from this workflow run  
          🔗 **Workflow Run:** $env:SERVER_URL/$env:REPO/actions/runs/$env:RUN_ID
          
          $(if ($hasIssues) {
            @"
          
          ### 📋 Next Steps
          
          * Review the build warnings generated in this workflow run
          $(if ($gateError) { "* Correct the dependency gate failure before trusting the pinning and exception counts`n" })
          * For unpinned dependencies: Pin them to SHAs immediately (security risk)
          * For stale SHAs (>$thresholdDays days): Update them when convenient (maintenance task)
          * Download the JSON report artifacts for detailed analysis
          $(if ($codeqlResult -ne 'success') { "* CodeQL analysis result was $codeqlResult; review the codeql-analysis job logs`n" })
          $(if ($workflowScanResult -ne 'success') { "* Dangerous workflow scan result was $workflowScanResult; review the dangerous-workflow-scan job's scanner step logs and confirm the poutine-results artifact exists`n" })
          
          "@
          })
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Set workflow conclusion
        shell: pwsh
        env:
          THRESHOLD_DAYS: ${{ inputs.max-age-days || 30 }}
          UNPINNED_COUNT: ${{ needs.validate-pinning.outputs.unpinned-count }}
          FAILING_COUNT: ${{ needs.validate-pinning.outputs.failing-count }}
          EXCEPTED_COUNT: ${{ needs.validate-pinning.outputs.excepted-count }}
          EXCEPTION_ERROR_COUNT: ${{ needs.validate-pinning.outputs.exception-error-count }}
          GATE_ERROR: ${{ needs.validate-pinning.outputs.gate-error }}
          STALE_COUNT: ${{ needs.check-staleness.outputs.stale-count }}
        run: |
          $gateError = $env:GATE_ERROR -eq 'true'
          $unpinnedCount = if ($gateError) { 'unknown' } elseif ($env:FAILING_COUNT) { $env:FAILING_COUNT } else { $env:UNPINNED_COUNT }
          $exceptionErrorCount = if ($gateError) { 'unknown' } elseif ($env:EXCEPTION_ERROR_COUNT) { $env:EXCEPTION_ERROR_COUNT } else { '0' }
          $staleCount = $env:STALE_COUNT
          $thresholdDays = $env:THRESHOLD_DAYS
          
          # Informational output - workflow succeeds but logs warnings
          if ($gateError) {
            Write-Warning "Dependency pinning gate failed before producing trusted counts. Review the validate-pinning job logs."
          }

          if (!$gateError -and $unpinnedCount -ne '0') {
            Write-Output "::warning::Found $unpinnedCount unpinned dependencies that no tracked exception excuses. Review build warnings for details."
          }

          if (!$gateError -and $exceptionErrorCount -ne '0') {
            Write-Output "::warning::Found $exceptionErrorCount stale, expired, or mismatched exception entries. Review the dependency pinning gate output."
          }
          
          if ($staleCount -ne '0') {
            Write-Output "::warning::Found $staleCount stale SHA pins (>$thresholdDays days old). Consider updating them."
          }
          
          if (!$gateError -and $unpinnedCount -eq '0' -and $exceptionErrorCount -eq '0' -and $staleCount -eq '0') {
            Write-Output "::notice::All dependencies are properly pinned and up-to-date!"
          }
      - name: Download staleness report
        if: ${{ !cancelled() && needs.check-staleness.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha-staleness-results
          path: logs
        continue-on-error: true

      - name: Create or Update Staleness Issue
        if: ${{ !cancelled() && needs.check-staleness.result == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_COUNT: ${{ needs.check-staleness.outputs.stale-count }}
          THRESHOLD_DAYS: ${{ inputs.max-age-days || 30 }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          Import-Module ./scripts/lib/Modules/CIHelpers.psm1 -Force

          $staleCount = [int]$env:STALE_COUNT
          $thresholdDays = $env:THRESHOLD_DAYS
          $automationMarker = '<!-- automation:sha-staleness -->'

          $searchQuery = "repo:$env:REPO is:issue is:open in:body `"automation:sha-staleness`""
          $existingIssue = gh issue list `
            --repo $env:REPO `
            --search $searchQuery `
            --limit 1 `
            --json number `
            --jq '.[0].number // empty'

          $existingIssue = if ($existingIssue) { $existingIssue.Trim() } else { $null }

          # Build stale dependency details from the report artifact
          $staleDetails = ''
          $resultsPath = 'logs/sha-staleness-results.json'
          if (Test-Path $resultsPath) {
            $report = Get-Content $resultsPath | ConvertFrom-Json
            foreach ($dep in $report.Dependencies) {
              if ($dep.DaysOld -gt [int]$thresholdDays) {
                $staleDetails += (Format-StaleDependencyLine -Dependency $dep -Style Issue) + "`n"
              }
            }
          }

          $issueTitle = 'Security: Stale dependency SHAs detected'
          $issueBody = @"
          ## Stale GitHub Action SHAs Detected

          **$staleCount** dependencies have SHA pins older than **$thresholdDays** days.

          ### Stale Dependencies

          $staleDetails

          ---

          **Workflow Run:** $env:SERVER_URL/$env:REPO/actions/runs/$env:RUN_ID
          **Detection Date:** $(Get-Date -Format 'yyyy-MM-dd' -AsUTC)

          ### Action Required

          - [ ] Run ``pwsh scripts/security/Test-SHAStaleness.ps1`` to review current state
          - [ ] Update outdated SHAs: ``scripts/security/Update-ActionSHAPinning.ps1 -Path .github/workflows -UpdateStale``
          - [ ] Close this issue manually after fixes are merged

          $automationMarker
          "@

          if ($staleCount -gt 0) {
            if ($existingIssue) {
              Write-Host "Updating existing issue #$existingIssue"
              gh issue edit $existingIssue `
                --repo $env:REPO `
                --body $issueBody

              $updateDate = Get-Date -Format 'yyyy-MM-dd' -AsUTC
              gh issue comment $existingIssue `
                --repo $env:REPO `
                --body "🔄 **Weekly staleness update:** $staleCount stale SHAs detected as of $updateDate"
            } else {
              Write-Host "Creating new staleness issue"
              gh issue create `
                --repo $env:REPO `
                --title $issueTitle `
                --body $issueBody `
                --label "security,staleness,automated,needs-triage"
            }
          } elseif ($existingIssue) {
            gh issue comment $existingIssue `
              --repo $env:REPO `
              --body "✅ All action SHAs are now within the $thresholdDays-day freshness threshold. Closing automatically."

            gh issue close $existingIssue `
              --repo $env:REPO
          } else {
            Write-Host "No stale SHAs and no existing issue — nothing to do"
          }
