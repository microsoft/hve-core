#
# Renders demo-material content authored by the Demo Material Author agentic
# workflow into decks and silent MP4s, then publishes a site bundle artifact
# that the documentation deployment stages under /demo-material/.

name: Demo Material Render

on:
  schedule:
    # Daily: render the oldest successful author run the render index has not recorded.
    - cron: '47 3 * * *'
    # Weekly, after Monday's pickup: force authoring for failed or unpublished levels.
    - cron: '47 5 * * 1'
  workflow_dispatch:
    inputs:
      author-run-id:
        description: 'Demo Material Author run to render (default: refresh the latest bundle)'
        required: false
        type: string

concurrency:
  group: demo-material-render
  cancel-in-progress: false

permissions: {}

env:
  VSCODE_CLI_URL: https://vscode.download.prss.microsoft.com/dbazure/download/stable/2242ebbb54efeeb0129e08e919e7e8d43033cd83/vscode_cli_linux_x64_cli.tar.gz
  VSCODE_CLI_SHA256: 651bc54695531375589c837b907a4e784bc2892076592e2464da12ead994d4bd
  # A bundle older than this is re-uploaded so it never reaches the 90-day artifact expiry.
  REFRESH_AFTER_DAYS: 60
  LOOKUP: .github/skills/experimental/hve-demo-material/scripts/artifact_lookup.py

jobs:
  resolve:
    name: Resolve render inputs
    runs-on: ubuntu-24.04
    permissions:
      actions: read # find author runs and their content artifacts
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      levels: ${{ steps.levels.outputs.levels || '[]' }}
      retry-levels: ${{ steps.resolve.outputs.retry-levels }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}
      author-run-id: ${{ steps.resolve.outputs.author-run-id }}
      content-artifact-id: ${{ steps.resolve.outputs.content-artifact-id }}
      previous-artifact-id: ${{ steps.previous.outputs.artifact-id }}
      previous-run-id: ${{ steps.previous.outputs.run-id }}
    steps:
      - name: Checkout the lookup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/skills/experimental/hve-demo-material/scripts

      - name: Find the previous bundle
        id: previous
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "${LOOKUP}" find --workflow demo-material-render.yml \
            --artifact-prefix demo-material-site-v2 \
            --exclude-run-id "${GITHUB_RUN_ID}" --github-output "${GITHUB_OUTPUT}"

      - name: Find the latest render index
        id: retry-index
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "${LOOKUP}" find --workflow demo-material-render.yml \
            --artifact-prefix demo-material-index-v2 \
            --exclude-run-id "${GITHUB_RUN_ID}" --github-output "${GITHUB_OUTPUT}"

      - name: Download the latest render index
        if: ${{ github.event_name == 'schedule' && steps.retry-index.outputs.artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.retry-index.outputs.artifact-id }}
          run-id: ${{ steps.retry-index.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retry-index

      - name: Recover the published render index
        if: ${{ github.event_name == 'schedule' && steps.retry-index.outputs.artifact-id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${LOOKUP}" recover --index-only \
            --target "${RUNNER_TEMP}/retry-index"

      - name: Select failed or unpublished levels
        id: retry
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '47 5 * * 1' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${LOOKUP}" retry-levels \
            --index "${RUNNER_TEMP}/retry-index/index.json" \
            --github-output "${GITHUB_OUTPUT}"

      # Pages keeps the last published bundle after every artifact has expired.
      - name: Check for a published bundle to recover
        id: published
        if: ${{ steps.previous.outputs.artifact-id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${LOOKUP}" recover --index-only \
            --target "${RUNNER_TEMP}/published" --github-output "${GITHUB_OUTPUT}"

      - name: Resolve author run and render mode
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_AUTHOR_RUN_ID: ${{ inputs.author-run-id }}
          PREVIOUS_CREATED_AT: ${{ steps.previous.outputs.created-at }}
          PUBLISHED_STATUS: ${{ steps.published.outputs.status }}
          RETRY_LEVELS: ${{ steps.retry.outputs.levels }}
          SCHEDULE: ${{ github.event.schedule }}
          RENDER_INDEX: ${{ runner.temp }}/retry-index/index.json
        with:
          script: |
            const refreshAfterMs = Number(process.env.REFRESH_AFTER_DAYS) * 86400000;
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            const defaultBranch = repository.default_branch;

            const findArtifact = async (runId, name) => {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { ...context.repo, run_id: runId, per_page: 100 },
              );
              const matches = artifacts.filter((a) => !a.expired && a.name === name);
              return matches.length === 1 ? matches[0] : null;
            };

            const findPendingAuthorRun = async () => {
              const fs = require("fs");
              const index = fs.existsSync(process.env.RENDER_INDEX)
                ? JSON.parse(fs.readFileSync(process.env.RENDER_INDEX, "utf8"))
                : {};
              const entries = index && typeof index.levels === "object" && index.levels
                ? Object.values(index.levels)
                : [];
              const recorded = entries
                .flatMap((entry) => [entry?.author_run_id, entry?.last_failed_attempt?.author_run_id])
                .concat(index?.latest_attempted_author_run_id)
                .filter((id) => /^[0-9]+$/.test(String(id ?? "")))
                .map(Number);
              const lastRecorded = recorded.length ? Math.max(...recorded) : 0;
              const since = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: "demo-material-author.lock.yml",
                branch: defaultBranch,
                status: "success",
                created: `>=${since}`,
                per_page: 100,
              });
              // Oldest first so no authored run is skipped; without recorded history, newest first.
              const pending = data.workflow_runs
                .filter((run) => run.id > lastRecorded)
                .sort((a, b) => (lastRecorded ? a.id - b.id : b.id - a.id));
              for (const run of pending) {
                if (await findArtifact(run.id, `demo-material-content-v2-${run.id}`)) {
                  return run;
                }
              }
              return null;
            };

            const previousCreatedAt = process.env.PREVIOUS_CREATED_AT;
            const stale = previousCreatedAt
              ? Date.now() - Date.parse(previousCreatedAt) > refreshAfterMs
              : process.env.PUBLISHED_STATUS === "recovered";

            let authorRun = null;
            if (context.eventName === "schedule" && process.env.SCHEDULE === "47 3 * * *") {
              authorRun = await findPendingAuthorRun();
            } else if (context.eventName === "workflow_dispatch" && process.env.DISPATCH_AUTHOR_RUN_ID) {
              if (!/^[0-9]+$/.test(process.env.DISPATCH_AUTHOR_RUN_ID)) {
                throw new Error("author-run-id must be a numeric run ID");
              }
              ({ data: authorRun } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: Number(process.env.DISPATCH_AUTHOR_RUN_ID),
              }));
            }

            if (authorRun) {
              if (authorRun.conclusion !== "success" ||
                  authorRun.path !== ".github/workflows/demo-material-author.lock.yml" ||
                  authorRun.head_branch !== defaultBranch ||
                  !/^[0-9a-f]{40}$/.test(authorRun.head_sha)) {
                core.notice("Author run is not a successful default-branch Demo Material Author run; nothing to render.");
                core.setOutput("mode", "skip");
                return;
              }
              const content = await findArtifact(authorRun.id, `demo-material-content-v2-${authorRun.id}`);
              if (!content) {
                core.notice("Author run produced no content artifact; nothing to render.");
                core.setOutput("mode", "skip");
                return;
              }
              core.setOutput("mode", "render");
              core.setOutput("source-sha", authorRun.head_sha);
              core.setOutput("author-run-id", String(authorRun.id));
              core.setOutput("content-artifact-id", String(content.id));
              return;
            }

            const retryLevels = process.env.RETRY_LEVELS.trim();
            if (context.eventName === "schedule" && retryLevels) {
              if (!/^L[1-4]00(?: L[1-4]00)*$/.test(retryLevels)) {
                throw new Error(`invalid retry levels: ${retryLevels}`);
              }
              core.setOutput("retry-levels", retryLevels);
              core.setOutput("mode", stale ? "refresh" : "skip");
              return;
            }

            // Without an artifact, a published bundle is recovered from the site and re-uploaded.
            if (!previousCreatedAt) {
              core.setOutput("mode", process.env.PUBLISHED_STATUS === "recovered" ? "refresh" : "skip");
              return;
            }
            const manual = context.eventName === "workflow_dispatch";
            core.setOutput("mode", stale || manual ? "refresh" : "skip");

      - name: Download authored content
        if: ${{ steps.resolve.outputs.mode == 'render' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.resolve.outputs.content-artifact-id }}
          run-id: ${{ steps.resolve.outputs.author-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/content

      - name: Validate authored content
        id: levels
        if: ${{ steps.resolve.outputs.mode == 'render' }}
        shell: bash
        env:
          CONTENT: ${{ runner.temp }}/content
          AUTHOR_RUN_ID: ${{ steps.resolve.outputs.author-run-id }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source-sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          root = Path(os.environ["CONTENT"])
          allowed = re.compile(
              r"^(provenance\.json|L[1-4]00/(content/slide-\d{3}/content\.yaml"
              r"|content/global/style\.yaml|research/source-register\.md"
              r"|capture-plan\.yml|manifest\.yml))$"
          )
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"symlink in authored content: {path}")
              if path.is_file() and (not allowed.fullmatch(path.relative_to(root).as_posix()) or path.stat().st_size > 1048576):
                  raise SystemExit(f"unexpected file in authored content: {path}")
          provenance = json.loads((root / "provenance.json").read_text(encoding="utf-8"))
          if (provenance.get("schema_version") != "demo-material-content/v2"
                  or provenance.get("author_run_id") != os.environ["AUTHOR_RUN_ID"]
                  or provenance.get("source_sha") != os.environ["SOURCE_SHA"]):
              raise SystemExit("content provenance is not bound to the author run")
          levels = provenance.get("levels", [])
          if not isinstance(levels, list) or not levels or not all(isinstance(level, str) for level in levels) or len(levels) != len(set(levels)) or not all(re.fullmatch(r"L[1-4]00", level) and (root / level / "content").is_dir()
                     for level in levels):
              raise SystemExit(f"invalid level list in provenance: {levels}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"levels={json.dumps(levels)}\n")
          print(f"Levels to render: {levels}")
          PY

  dispatch-retry:
    name: Dispatch forced authoring for failed levels
    needs: resolve
    if: ${{ github.event_name == 'schedule' && needs.resolve.outputs.retry-levels != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write # start Demo Material Author for failed or unpublished levels
    steps:
      - name: Dispatch forced authoring
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RETRY_LEVELS: ${{ needs.resolve.outputs.retry-levels }}
        with:
          script: |
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "demo-material-author.lock.yml",
              ref: repository.default_branch,
              inputs: { levels: process.env.RETRY_LEVELS, force: "true" },
            });

  render:
    name: Render ${{ matrix.level }}
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'render' && needs.resolve.outputs.levels != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # download the author content artifact
      contents: read
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJSON(needs.resolve.outputs.levels) }}
    env:
      LEVEL: ${{ matrix.level }}
      LEVEL_DIR: ${{ github.workspace }}/../demo-level/${{ matrix.level }}
    steps:
      # Scripts come from the trusted default branch; the authored commit only
      # supplies the content artifact, which is validated as data.
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download authored content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.content-artifact-id }}
          run-id: ${{ needs.resolve.outputs.author-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/content

      - name: Stage the level directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${LEVEL_DIR}")"
          cp -R "${RUNNER_TEMP}/content/${LEVEL}" "${LEVEL_DIR}"

      # uv honors the root .python-version; install that exact interpreter
      # rather than letting uv download a managed one.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: $/.github/actions/setup-uv
        with:
          enable-cache: 'false'

      - name: Setup Node.js for the HTML slide deck
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Chromium for the HTML deck check and live capture
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.LEVEL_DIR }}/.venv/vscode-playwright
        run: |
          set -euo pipefail
          uv sync --frozen --directory .github/skills/experimental/vscode-playwright
          uv run --frozen --directory .github/skills/experimental/vscode-playwright \
            playwright install --with-deps chromium

      - name: Install VS Code CLI for live capture
        if: ${{ matrix.level == 'L300' || matrix.level == 'L400' }}
        shell: bash
        run: |
          set -euo pipefail
          cli_dir="${RUNNER_TEMP}/vscode-cli"
          mkdir -p "${cli_dir}"
          curl --fail --location --silent --show-error \
            --output "${cli_dir}/cli.tar.gz" "${VSCODE_CLI_URL}"
          printf '%s  %s\n' "${VSCODE_CLI_SHA256}" "${cli_dir}/cli.tar.gz" | sha256sum --check
          tar -xzf "${cli_dir}/cli.tar.gz" -C "${cli_dir}"
          sudo install -m 0755 -t /usr/local/bin "${cli_dir}/code"
          if [[ "$(command -v code || true)" != '/usr/local/bin/code' ]]; then
            echo "::error::code does not resolve to the verified /usr/local/bin/code."
            exit 1
          fi

      - name: Render ${{ matrix.level }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/skills/experimental/hve-demo-material/scripts/render-level.sh \
            --level "${LEVEL}" \
            --level-dir "${LEVEL_DIR}" \
            --workspace "${GITHUB_WORKSPACE}" \
            --narration none \
            --slides-skill-root "${GITHUB_WORKSPACE}/.github/skills/experimental/hve-slides"

      - name: Collect render outputs
        if: ${{ always() }}
        shell: bash
        env:
          OUT: ${{ runner.temp }}/render-out
        run: |
          set -euo pipefail
          mkdir -p "${OUT}/${LEVEL}"
          for rel in \
            "output/hve-demo-${LEVEL}.mp4" \
            "output/hve-demo-${LEVEL}.raw.mp4" \
            "output/hve-demo-${LEVEL}.vtt" \
            "output/hve-demo-${LEVEL}.html" \
            output/index.html \
            output/render-result.json \
            output/captures.json \
            output/html-deck-check.json \
            output/html-deck-build.json \
            output/open-captions.json \
            output/manifest.yml \
            research/source-register.md; do
            if [[ -L "${LEVEL_DIR}/${rel}" ]]; then
              echo "::error::Symlink in render output: ${rel}"
              exit 1
            fi
            if [[ -f "${LEVEL_DIR}/${rel}" ]]; then
              cp "${LEVEL_DIR}/${rel}" "${OUT}/${LEVEL}/$(basename "${rel}")"
            fi
          done

      - name: Upload render outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-material-level-v2-${{ matrix.level }}-${{ github.run_id }}
          path: ${{ runner.temp }}/render-out
          retention-days: 7
          if-no-files-found: warn

  bundle:
    name: Publish site bundle
    needs:
      - resolve
      - render
    if: ${{ always() && (needs.resolve.outputs.mode == 'render' || needs.resolve.outputs.mode == 'refresh') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read # download render outputs and the previous bundle
    steps:
      - name: Checkout the lookup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/skills/experimental/hve-demo-material/scripts

      - name: Download the previous bundle
        if: ${{ needs.resolve.outputs.previous-artifact-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.previous-artifact-id }}
          run-id: ${{ needs.resolve.outputs.previous-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/site

      - name: Recover the published bundle
        if: ${{ needs.resolve.outputs.previous-artifact-id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "${LOOKUP}" recover --target "${RUNNER_TEMP}/site"

      - name: Download this run's renders
        if: ${{ needs.resolve.outputs.mode == 'render' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: demo-material-level-v2-*-${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/renders

      - name: Assemble the bundle
        shell: bash
        env:
          SITE: ${{ runner.temp }}/site
          RENDERS: ${{ runner.temp }}/renders
          SOURCE_SHA: ${{ needs.resolve.outputs.source-sha }}
          AUTHOR_RUN_ID: ${{ needs.resolve.outputs.author-run-id }}
          RENDER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "${SITE}" "${RENDERS}"
            python3 "${LOOKUP}" assemble-site --target "${SITE}" --renders "${RENDERS}"
          mkdir -p "${RUNNER_TEMP}/index"
          cp "${SITE}/index.json" "${RUNNER_TEMP}/index/index.json"

      - name: Upload the site bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-material-site-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/site
          retention-days: 90
          if-no-files-found: error

      - name: Upload the site index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-material-index-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/index
          retention-days: 90
          if-no-files-found: error

  # Hands the new bundle to the documentation deploy in a separate run, which
  # waits for this run to finish before it looks up the newest bundle.
  dispatch-deploy:
    name: Start the documentation deploy
    needs: bundle
    if: ${{ needs.bundle.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write # start Deploy Documentation Site on the default branch
    steps:
      - name: Dispatch the documentation deploy for this run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: repository } = await github.rest.repos.get({ ...context.repo });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "deploy-docs.yml",
              ref: repository.default_branch,
              inputs: { "source-run-id": String(context.runId) },
            });
