updates:
- commit-message:
    include: scope
    prefix: chore
  directories:
  - /
  - /docs/docusaurus
  - /scripts/extension/marketplace-publisher
  # Each slide deck pins reveal.js in its own lockfile, and new decks copy the
  # starter's lockfile. A deck update changes its embedded library, so rebuild
  # that deck's bundle with `npm run slides:build` before merging.
  - /slides/*
  - /.github/skills/hve-slides/templates/deck
  groups:
    npm-dependencies:
      patterns:
      - "*"
  ignore:
  # Hold eslint on 9.x deliberately. The docs accessibility lint plugin
  # (eslint-plugin-jsx-a11y-x) supports eslint 10, but adopting eslint 10 is a
  # separate migration. Remove this entry when that migration is planned.
  - dependency-name: "eslint"
    versions:
    - ">=10"
  labels:
  - dependencies
  - npm
  open-pull-requests-limit: 10
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
- commit-message:
    include: scope
    prefix: chore
  cooldown:
    default-days: 7
  directory: /
  # Agentic Workflows lock files are generated by `gh aw compile`; update the
  # source `.md` workflow instead of accepting direct Dependabot edits here.
  exclude-paths:
  - ".github/workflows/*.lock.yml"
  groups:
    github-actions:
      exclude-patterns:
      - github/gh-aw-actions/*
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  - dependency-name: "github/gh-aw-actions/**"
  # The extension provenance signer revision is pinned by the caller, the
  # release and Marketplace verifiers, the extension tests, and the SBOM
  # verification docs. Update it deliberately in one coordinated change.
  - dependency-name: "microsoft/hve-core/.github/workflows/extension-provenance-signer.yml"
  labels:
  - dependencies
  - github-actions
  open-pull-requests-limit: 5
  package-ecosystem: github-actions
  schedule:
    day: monday
    interval: weekly
- commit-message:
    include: scope
    prefix: chore
  directories:
  - /.github/skills/**
  - /scripts/evals/moderation
  groups:
    security-updates:
      applies-to: security-updates
      patterns:
      - "*"
    version-updates:
      applies-to: version-updates
      patterns:
      - "*"
  labels:
  - dependencies
  - python
  open-pull-requests-limit: 10
  package-ecosystem: uv
  schedule:
    day: monday
    interval: weekly
version: 2
