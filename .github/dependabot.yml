updates:
- commit-message:
    include: scope
    prefix: chore
  directories:
  - /
  - /docs/docusaurus
  groups:
    npm-dependencies:
      patterns:
      - "*"
  ignore:
  # eslint-plugin-jsx-a11y declares a peer range that stops at eslint ^9, so an
  # eslint 10 bump breaks `npm ci` in docs/docusaurus with ERESOLVE. Remove this
  # entry once a jsx-a11y release supports eslint 10.
  - dependency-name: "eslint"
    versions:
    - ">=10"
  labels:
  - dependencies
  - npm
  open-pull-requests-limit: 10
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
- commit-message:
    include: scope
    prefix: chore
  directory: /
  # Agentic Workflows lock files are generated by `gh aw compile`; update the
  # source `.md` workflow instead of accepting direct Dependabot edits here.
  exclude-paths:
  - ".github/workflows/*.lock.yml"
  groups:
    github-actions:
      exclude-patterns:
      - github/gh-aw-actions/*
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  - dependency-name: "github/gh-aw-actions/**"
  labels:
  - dependencies
  - github-actions
  open-pull-requests-limit: 5
  package-ecosystem: github-actions
  schedule:
    day: monday
    interval: weekly
- commit-message:
    include: scope
    prefix: chore
  directories:
  - /.github/skills/**
  - /scripts/evals/moderation
  groups:
    security-updates:
      applies-to: security-updates
      patterns:
      - "*"
    version-updates:
      applies-to: version-updates
      patterns:
      - "*"
  labels:
  - dependencies
  - python
  open-pull-requests-limit: 10
  package-ecosystem: uv
  schedule:
    day: monday
    interval: weekly
version: 2
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
