# Tracked code-scanning exceptions read by scripts/security/Test-CodeQLSarifThreshold.ps1.
#
# An entry lets the threshold gate pass while one tool keeps reporting a rule in
# one file. It never dismisses or hides the alert: the alert stays open on GitHub,
# the gate lists the excused results, and the weekly code-scanning job keeps the
# linked issue current. The gate applies to every SARIF-producing tool.
#
# Allowed kinds:
#   false-positive       the analyzer is demonstrably wrong
#   generated-code       output of a generator this repository does not author
#   third-party          code or behavior this repository cannot patch
#   platform-limitation  the platform cannot yet support the fix
# Every kind needs an upstream report filed before the entry is added.
# See docs/security/code-scanning-alert-lifecycle.md for the full policy.
#
# Each entry needs every field below and is reviewed like any other change:
#
#   - tool: zizmor                         # exact SARIF tool.driver.name
#     rule: self-repository                # exact SARIF ruleId
#     path: .github/workflows/example.yml  # exact repository-relative path
#     count: 2                             # exact number of matching results
#     kind: platform-limitation            # one of the kinds above
#     upstream: https://github.com/org/repo/issues/123
#     issue: 1234                          # open issue tracking the real fix
#     owner: github-login-or-team
#     reason: one-line explanation
#     expires: 2026-12-31                  # ISO date, at most 90 days after the check date
#
# The gate fails on an expired entry, an entry more than 90 days out, a missing or
# unknown field, a count that differs from the matching results in either
# direction, or an entry that no longer matches a result (remove it).
exceptions:
