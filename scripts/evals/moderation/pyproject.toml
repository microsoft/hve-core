[project]
name = "hve-core-moderation"
version = "1.0.0"
description = "Content moderation tooling for eval input/output screening"
requires-python = ">=3.11"
dependencies = [
    "detoxify==0.5.2",
    # Transitive via torch and huggingface-hub; GHSA-27vj-qcqg-25rc fixed in 2026.6.0.
    "fsspec>=2026.6.0",
    "torch==2.14.0",
    "transformers>=5.15.0,<6",
    # Transitive security floors: certifi GHSA-6q48-6c7w-9gw2 (2026.10.19 restores
    # roots removed by 2026.10.18), three filelock advisories fixed in 4.2.1, and
    # setuptools GHSA-xmj3-9gf7-h52w fixed in 84.1.0.
    "certifi>=2026.10.19",
    "filelock>=4.2.1,<5.0",
    "setuptools>=84.1.0,<85.0",
]

# Resolve torch from the CPU-only wheel index. This eval is a CPU-bound
# Detoxify toxicity classifier with no GPU code path, so the default PyPI
# torch wheel's nvidia-*-cu12 CUDA runtime dependencies are unnecessary.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# Atheris 3.1 publishes no Python 3.11 wheels; scope only fuzzing to 3.12+ so
# the application keeps supporting Python 3.11.
[tool.uv.dependency-groups]
fuzz = { requires-python = ">=3.12" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "fuzz_harness.py"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pytest-mock>=3.14",
    "ruff>=0.16.3",
]
fuzz = [
    "atheris>=3.1.0",
]
