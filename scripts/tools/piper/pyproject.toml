# Locked environment for the Piper text-to-speech engine used by
# demo-material-render.yml. uv.lock pins every transitive dependency with
# hashes; install with `uv sync --locked --project scripts/tools/piper`.
# The piper-tts version must match scripts/security/tool-checksums.json.
[project]
name = "hve-core-piper"
version = "0.0.0"
description = "Locked Piper text-to-speech environment for demo material rendering"
requires-python = ">=3.12"
dependencies = [
    "piper-tts==1.8.0",
]

[tool.uv]
package = false
