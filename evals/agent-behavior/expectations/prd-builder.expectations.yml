# Bucket-A expectations for prd-builder
# Format: per-agent YAML, 5–10 grader-worthy expectations grounded in the agent
# file's explicit promises and/or current matrix failures. This file is consumed
# by the next pass that rewrites stimuli + graders end-to-end; do not treat it
# as a Vally grader file directly.
slug: prd-builder
class: research-writer
agent_file: .github/agents/project-planning/prd-builder.agent.md
stimulus_file: evals/agent-behavior/stimuli/prd-builder.yml
latest_result: evals/results/agent-matrix/2026-05-28/prd-builder.json
source_review_date: 2026-05-28

expectations:
  - expectation_id: state-file-location
    summary: Session state is written under the PRD-sessions tracking subtree.
    signal: Output names a workspace path matching `.copilot-tracking/prd-sessions/<slug>`.
    pass_criteria: |
      The response reports a session-state path beginning with
      `.copilot-tracking/prd-sessions/` whose slug matches the PRD topic. This
      satisfies the `tracking-file-write` grader, which accepts either the PRD
      output under `docs/project-planning/` or the state path under
      `.copilot-tracking/(prd-sessions|research)`.
    failure_modes:
      - State path omitted or only the PRD path reported (current 2026-05-28
        output fails state-file path reporting).
      - State written to a temp directory or absolute path.
      - State written outside `.copilot-tracking/prd-sessions/`.
    priority: high
    contract_ref: "agent §State Tracking (session state under `.copilot-tracking/prd-sessions/`)"

  - expectation_id: both-prd-and-state-created
    summary: Response creates both the PRD document and its session-state file.
    signal: Output names a PRD document path and a separate session-state path.
    pass_criteria: |
      The response reports two distinct artifacts: the PRD document and the
      session-state file, rather than only one of the two.
    failure_modes:
      - PRD created but state file omitted.
      - State file created but no PRD document path reported.
    priority: high
    contract_ref: "agent §File Management (create both the PRD and the session state file)"

  - expectation_id: required-prd-sections
    summary: Drafted PRD contains the documented required sections.
    signal: Output references the full set of required PRD section names.
    pass_criteria: |
      The response (or the PRD body it summarizes) names the documented
      required PRD sections (the 17-section set), including at minimum
      Overview/Summary, Problem Statement, Goals, User Stories, Requirements,
      and Success Criteria.
    failure_modes:
      - PRD shows only goals/requirements and omits user stories or success
        criteria.
      - Sections collapsed into generic prose with no labeled headings.
    priority: high
    contract_ref: "agent §PRD Structure (17 required sections)"

  - expectation_id: boilerplate-markers
    summary: PRD body includes the documented boilerplate/lint markers.
    signal: Output shows `markdownlint-disable-file` and table-prettify ignore markers.
    pass_criteria: |
      The PRD body includes the documented boilerplate markers:
      `<!-- markdownlint-disable-file -->` and the
      `markdown-table-prettify-ignore-start` / `-end` markers around tables.
    failure_modes:
      - Boilerplate markers omitted entirely.
      - Only one of the marker pairs present.
    priority: low
    contract_ref: "agent §PRD Creation (boilerplate markers: markdownlint-disable-file, table-prettify ignore)"

  - expectation_id: phased-workflow-questions
    summary: Vague requests progress through the documented phased workflow with questions.
    signal: Output asks scoping questions tied to the early phases before finalizing.
    pass_criteria: |
      When the stimulus is broad, the response advances through the documented
      7-phase workflow and asks scoping questions before producing the full
      PRD, rather than emitting a complete document with no elicitation.
    failure_modes:
      - Full PRD generated immediately for an underspecified request with no
        phase progression.
      - Phases referenced but no actual questions asked.
    priority: medium
    applies_when: "stimulus is broad or underspecified"
    contract_ref: "agent §Workflow (7-phase PRD workflow)"

  - expectation_id: user-stories-and-success-criteria
    summary: PRD includes user stories and measurable success criteria.
    signal: Output contains user-story statements and success-criteria items.
    pass_criteria: |
      For a stimulus that requests stories and success criteria, the response
      includes user-story statements and explicit, measurable success criteria
      rather than feature descriptions alone.
    failure_modes:
      - User stories present but no success criteria.
      - Success criteria stated as vague aspirations with no measurability.
    priority: medium
    contract_ref: "agent §PRD Structure (User Stories, Success Criteria)"

  - expectation_id: no-source-edit
    summary: PRD authoring does not modify source code or build manifests.
    signal: Output does not name modifications to source-tree files.
    pass_criteria: |
      No occurrences of edit/create verbs paired with `.cs`/`.py`/`.ts`/`.js`/
      `package.json` paths. Writes are confined to the PRD document and the
      `.copilot-tracking/prd-sessions/` state file.
    failure_modes:
      - Drafting a notification-preferences PRD leads to editing app source.
    priority: medium
    contract_ref: "agent scope (writes confined to PRD output + `.copilot-tracking/prd-sessions/`)"

  - expectation_id: stimulus-topic-fidelity
    summary: Response substantively addresses the PRD topic from the stimulus.
    signal: Stimulus-derived keywords appear in the response body.
    pass_criteria: |
      For the `prd-builder-class-recipe` stimulus, the response contains terms
      from {product, requirement, user story, success, notification, preference}
      and addresses the in-app/email/SMS toggle feature specifically rather
      than generic template prose.
    failure_modes:
      - Off-topic PRD with no notification-preferences references.
      - Requirements filled with placeholders instead of feature specifics.
    priority: medium
    stimulus_scoped: true
    contract_ref: "stimulus design (per-stimulus, not agent-intrinsic)"

  - expectation_id: proposal-response-product-activation
    summary: Explicit proposal-response continuation activates product-domain contribution only.
    signal: Output names `proposal-response#contribute:product`, returns the supplied proposal-response artifact path, and preserves builder state transport.
    pass_criteria: |
      An explicit RFI, RFP, questionnaire, tender, bid-response, proposal, or
      reusable response-evidence request invokes `proposal-response` contribute
      mode with the product domain, uses approved product-owned evidence, and
      retains internal-review and outside-scope authority markers. The complete
      payload is persisted under `.copilot-tracking/proposal-responses/`; the
      response and PRD state carry its supplied path rather than a payload copy.
      A continuation passes the same path to the skill, retains it once in
      `proposalResponseArtifacts`, retains the product extension once in
      `extensionsLoaded`, preserves prior SQ, CLM, and UNR IDs, adds only an
      operation-appropriate product record, and exposes recalculated coverage.
    failure_modes:
      - Business authorization or release authority is supplied by PRD Builder.
      - The extension load is recorded in `phaseSkillsLoaded` instead of `extensionsLoaded`.
      - The complete `RESPONSE_EVIDENCE_V1` payload is returned inline without an artifact pointer.
      - A supplied artifact path is replaced, omitted, or duplicated in `proposalResponseArtifacts`.
      - Existing SQ, CLM, or UNR records are discarded, renumbered, or hidden.
      - Coverage is reused without recalculation after the contribution.
    priority: high
    applies_when: "stimulus explicitly requests proposal-response contribution"
    contract_ref: "agent §Lifecycle Dispatch › Proposal Response Extension"

  - expectation_id: proposal-response-tri-operation-binding
    summary: PRD Builder performs analyze, contribute, and draft for the product domain.
    signal: Output reports a pointer whose `operation` matches the requested analyze, contribute, or draft operation.
    pass_criteria: |
      An explicit proposal-response request for `analyze`, `contribute`, or
      `draft` is carried inside PRD Builder without redirecting the user to
      invoke the skill directly. `contribute` stays bound to the product
      domain. `draft` renders responses over every reviewed claim, including
      business-owned claims, and creates no business-owned claim of its own.
    failure_modes:
      - An analyze or draft request is refused or redirected to direct skill invocation.
      - A draft omits questions answered by business-owned claims.
      - The draft creates, edits, or reclassifies a business-owned claim.
    priority: high
    applies_when: "stimulus requests a proposal-response analyze, contribute, or draft operation"
    contract_ref: "agent §Lifecycle Dispatch › Proposal Response Extension"

  - expectation_id: proposal-response-source-intake
    summary: A user-named PRD becomes a registered, cited source rather than transcribed prose.
    signal: Output reports an approved-source record for the named path and claims citing `SRC-###` references.
    pass_criteria: |
      When the user names an existing PRD path as approved evidence, the path is
      read, registered with its own `SRC` ID and read date, and every resulting
      claim's `evidence_refs` entry names that source ID plus the requirement or
      section it drew from. A named path that does not resolve stops the
      operation with the path and the smallest clearing action visible, and
      produces no claim.
    failure_modes:
      - Claim evidence is a bare filename or transcribed sentence with no source ID.
      - A source is registered without being read.
      - An unresolvable source path is silently replaced by recalled content.
    priority: high
    applies_when: "stimulus names an approved source artifact path"
    contract_ref: "skill §Flow, §Stop Rules; reference §Approved Sources"

  - expectation_id: proposal-response-next-operation-reported
    summary: Each proposal-response turn closes by naming the remaining step.
    signal: Output carries the skill's `next_operation` value and states it to the user.
    pass_criteria: |
      The reported pointer carries `next_operation`, and the turn closes by
      naming that operation. A payload whose only open items require a human
      decision outside the skill reports `none` rather than looping, and names
      the blocking unresolved items.
    failure_modes:
      - "`next_operation` is omitted from the reported pointer."
      - The agent invokes the next operation without a new user request.
      - A payload blocked only by human decisions reports a further skill operation.
    priority: medium
    applies_when: "skill returns RESPONSE_EVIDENCE_POINTER_V1"
    contract_ref: "skill §Operation Sequence; skill reference §Reporting"

  - expectation_id: proposal-response-rejected-continuation
    summary: A rejected continuation remains an error and does not enter proposal-response state.
    signal: Output reports `RESPONSE_EVIDENCE_ERROR_V1` and leaves `proposalResponseArtifacts` without the rejected path.
    pass_criteria: |
      When the skill returns `RESPONSE_EVIDENCE_ERROR_V1` with
      `artifact_written: false`, the builder reports the rejection, its
      `validation_error`, and its `clearing_action`, leaves
      `state.proposalResponseArtifacts` unchanged, does not create that array,
      and never appends the rejected `artifact_path`. Only a returned
      `RESPONSE_EVIDENCE_POINTER_V1` records a path.
    failure_modes:
      - The rejected `artifact_path` is appended to `proposalResponseArtifacts`.
      - A missing `proposalResponseArtifacts` array is created for a rejected operation.
      - The rejection is reported as a successful contribution or a written artifact.
      - The validation error or clearing action is omitted from the report.
    priority: high
    applies_when: "skill returns a rejected continuation result"
    contract_ref: "skill reference §Rejected Operations"

  - expectation_id: ordinary-prd-no-proposal-activation
    summary: Ordinary PRD work does not activate proposal-response behavior.
    signal: Output contains no proposal-response contract, appendix, or extension-load language.
    pass_criteria: |
      Creation, refinement, resume, BRD handoff ingestion, quality review, and
      backlog handoff requests continue through the canonical PRD lifecycle
      without loading or emitting proposal-response artifacts.
    failure_modes:
      - An ordinary PRD request emits `RESPONSE_EVIDENCE_V1`.
      - A missing `extensionsLoaded` array triggers proposal-response activation.
    priority: high
    applies_when: "stimulus contains no explicit proposal-response intent"
    contract_ref: "agent §Lifecycle Dispatch › Proposal Response Extension"
