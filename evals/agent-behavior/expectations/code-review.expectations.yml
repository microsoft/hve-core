# Supporting expectations for code-review. The executable graders live in the
# matching stimulus partial.
slug: code-review
class: code-reviewer
agent_file: .github/agents/coding-standards/code-review.agent.md
stimulus_file: evals/agent-behavior/stimuli/code-review.yml
source_review_date: 2026-07-17

expectations:
  - expectation_id: review-target-and-profile
    summary: Review targets and profiles are independent, with standard as the default profile.
    signal: Output distinguishes target kind from profile and findings perspectives.
    pass_criteria: |
      Pull-request, branch-diff, and local-changes reviews default to standard,
      which recommends Functional, Standards, and Readiness and adds specialist
      perspectives from detected signals. Orientation is not a findings perspective.
    failure_modes:
      - The response dispatches a PR findings lane.
      - The response binds the standard profile only to pull-request targets.
      - The response omits Readiness from the standard profile.
    priority: high
    contract_ref: "agent §Review Targets and Profiles"

  - expectation_id: pr-context-conditional-enrichment
    summary: PR enrichment stays conditional on pull-request target context, not on profile.
    signal: Output distinguishes a pull-request target with prContext from a pre-PR target using the same profile.
    pass_criteria: |
      A pull-request target using standard may enrich readiness with PR metadata
      and state checks when prContext is available. A branch-diff or local-changes
      target using standard does not require PR metadata before orientation or review.
    failure_modes:
      - The response requires PR metadata for a branch-diff or local-changes review.
      - The response uses the standard profile alone to trigger PR checks or native emission.
    priority: high
    contract_ref: "agent §Step 1 Tier 0 Context Bootstrap"

  - expectation_id: orientation-and-dispatch-board
    summary: The first response presents factual orientation and a decision-ready dispatch board.
    signal: Output identifies an orientation or walkthrough and a dispatch board with evidence-backed preliminary signals.
    pass_criteria: |
      The response summarizes the supplied diff factually and presents a table
      of coherent review areas with status, preliminary signals, and supporting
      file or symbol references before deeper review.
    failure_modes:
      - Response skips factual orientation.
      - Response omits the dispatch board.
      - The dispatch board is only a numbered list of area names.
    priority: high
    contract_ref: "agent §Step 2 Orientation Floor and Dispatch-Board Confirmation"

  - expectation_id: human-confirmation
    summary: The first response pauses for human confirmation.
    signal: Output asks the user to confirm or adjust the review scope, orientation, or dispatch board.
    pass_criteria: |
      The response invites confirmation or adjustment before deeper analysis.
    failure_modes:
      - Response proceeds directly to deeper review.
      - Response does not ask for confirmation.
    priority: high
    contract_ref: "agent §Step 2 Orientation Floor and Dispatch-Board Confirmation"

  - expectation_id: decision-ready-review-selection
    summary: Perspective and depth recommendations accompany the first dispatch-board confirmation.
    signal: The confirmation surface explains perspective ownership, omissions, and depth rationale.
    pass_criteria: |
      The first confirmation response maps recommended perspectives to board
      item IDs, explains surprising omissions, recommends a depth with a
      scope-based rationale, and lets the human edit or approve all choices in
      one reply.
    failure_modes:
      - Perspective and depth recommendations are deferred until after board confirmation.
      - Recommended perspectives have no board-item ownership or rationale.
      - The depth recommendation has no change-specific rationale.
      - The human must complete two confirmations when approving all defaults.
    priority: high
    contract_ref: "agent §Step 2 Orientation Floor and Dispatch-Board Confirmation"

  - expectation_id: change-risk-evidence
    summary: The first response presents advisory change-risk evidence before depth selection.
    signal: Output identifies checklist evidence or availability and a recommended review depth.
    pass_criteria: |
      The response surfaces change-risk evidence, including relevant tests or
      rollback context, and keeps the depth recommendation subject to human
      confirmation or correction.
    failure_modes:
      - Response omits change-risk evidence.
      - Response selects a depth without human confirmation.
    priority: high
    contract_ref: "agent §Step 2 Orientation Floor and Dispatch-Board Confirmation"

  - expectation_id: no-source-edit
    summary: Orientation does not modify reviewed source files.
    signal: Output does not report source-file edits.
    pass_criteria: |
      The response or tool activity does not claim edits to reviewed source.
    failure_modes:
      - Applies fixes directly to the reviewed source files.
    priority: high
    contract_ref: "agent review scope and stimulus boundary"

  - expectation_id: explicit-plan-context-enters-review-flow
    summary: An explicit Security Planner reference is recognized without premature correlation.
    signal: Orientation or the dispatch board identifies the baseline and recommends the security perspective.
    pass_criteria: |
      For `code-review-security-planning-drift-context`, the first response carries
      the supplied baseline forward, recommends security review, and waits for
      merged findings before running drift correlation.
    failure_modes:
      - Ignores the supplied baseline.
      - Emits final drift counts before perspective findings exist.
      - Replaces the normal orientation and confirmation flow with drift output.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 1 Security plan drift context and Step 7 execution point"

  - expectation_id: no-plan-context-preserves-default
    summary: Code Review does not activate security-plan drift without plan context.
    signal: No `securityPlanContext`, `security_plan_drift`, or drift section appears in the ordinary class recipe.
    pass_criteria: |
      For `code-review-class-recipe`, the response remains the normal
      orientation and dispatch-board flow with no plan-drift state or output.
    failure_modes:
      - Searches for or selects an ambient baseline without a qualifying signal.
      - Emits a drift section or structured drift field.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 1 drift skip behavior"

  - expectation_id: drift-output-is-bounded-and-diff-scoped
    summary: Executed correlation uses the optional structured carrier and preserves diff-scope limits.
    signal: Final connected-workflow output carries `security_plan_drift` and insufficient-evidence reasons for validated and obsolete categories.
    pass_criteria: |
      When confirmed plan context reaches Step 7 after security findings merge,
      output uses the bounded drift section and optional field, treats validated
      controls and obsolete plan items as insufficient evidence, and does not
      add an executed drift result to specialist recommendations.
    failure_modes:
      - Claims a validated control from diff-only findings.
      - Claims an obsolete plan item from absence in the diff.
      - Emits the same drift result as a specialist follow-up.
    priority: high
    applies_when: "confirmed plan context and merged security findings are available"
    contract_ref: "agent §Step 7 security-plan drift correlation"

  - expectation_id: explicit-business-context-enters-review-flow
    summary: An explicit business-source reference is recognized without a premature comparison.
    signal: Orientation or the dispatch board identifies the supplied BRD, PRD, or ADR and defers the comparison to Step 7.
    pass_criteria: |
      For `code-review-business-alignment-context`, the first response carries
      the supplied source forward, keeps the normal orientation and dispatch
      board, and states that the comparison runs at Step 7 before findings are
      validated and merged.
    failure_modes:
      - Ignores the supplied business source.
      - Reads the source or reports alignment results before Step 7.
      - Replaces the normal orientation and confirmation flow with alignment output.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 1 business-source context and Step 7 business-alignment comparison"

  - expectation_id: no-business-context-preserves-default
    summary: Code Review does not activate business alignment without business-source context.
    signal: No `businessAlignmentContext`, `business_alignment`, or business-alignment section appears in an ordinary review.
    pass_criteria: |
      For `code-review-no-business-context-default`, the response remains the
      normal orientation and dispatch-board flow with no business-alignment state
      or output.
    failure_modes:
      - Searches for or selects ambient BRD, PRD, or ADR files without a qualifying signal.
      - Emits a business-alignment section or structured field.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 1 business-source context skip behavior"

  - expectation_id: business-alignment-findings-affect-verdict
    summary: Accepted alignment findings count toward the verdict and stay evidence-backed.
    signal: Critical or High `[Business Alignment]` findings produce `request_changes`, each with a resolution path.
    pass_criteria: |
      When confirmed business-source context reaches Step 7, alignment findings
      are rated with the shared rubric, accepted only with a confirmed source,
      an identifier, and diff evidence, merged and counted like perspective
      findings, and resolved by aligning the code or by the human reviewer
      confirming the owner's acknowledgment. Any note to the owner is offered first, drafted only on
      acceptance, and never included in an emission.
    failure_modes:
      - Reports alignment drift outside the verdict.
      - Accepts an alignment finding without diff evidence.
      - Includes the stakeholder note in the PR Comment Draft or a posted comment.
    priority: high
    applies_when: "confirmed business-source context is available at Step 7"
    contract_ref: "agent §Step 7 business-alignment comparison, verdict, and note offer"

  - expectation_id: in-pr-source-edit-cannot-self-acknowledge
    summary: A PR that edits its own business source cannot hide drift or lower its rating.
    signal: The response compares against the base-branch revision and rates the in-PR edit and the approval claim as developer-confirmed.
    pass_criteria: |
      For `code-review-business-alignment-self-edit`, the response states that
      Step 7 compares against the source as of the base branch, that the in-PR
      source edit and the PR body's approval claim are developer-confirmed, and
      that only the human reviewer can confirm owner acknowledgment.
    failure_modes:
      - Compares against the edited working-tree copy of the source.
      - Treats the in-PR edit or the PR body claim as owner-acknowledged.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 7 business-alignment baseline and awareness; §Step 7 item 11 owner-acknowledgment confirmation"

  - expectation_id: stale-source-uses-latest-copy-and-alerts
    summary: A superseded business source is followed to its successor and reported as a Medium stale-source alert.
    signal: The response names the successor or latest copy and rates the superseded citation as a Medium alert outside the rubric.
    pass_criteria: |
      For `code-review-business-alignment-stale-source`, the response states that
      the comparison uses the latest successor, reports the superseded citation as
      a stale-source alert, and rates it Medium rather than through the drift rubric.
    failure_modes:
      - Compares against the superseded document.
      - Rates the superseded citation Critical or High through the rubric.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 1 latest-copy resolution; reference §Alerts outside the rubric"

  - expectation_id: pr-added-successor-cannot-reroute-comparison
    summary: A supersession link or successor added in the PR does not move the comparison off the base-branch source.
    signal: The response keeps the comparison on the base-branch PRD and reports the added successor and link as a proposed source update.
    pass_criteria: |
      For `code-review-business-alignment-supersession-reroute`, the response
      states that supersession is resolved as it stands on the base branch, that
      the comparison uses the original PRD, and that the PR-added successor and
      supersession link are a proposed, developer-confirmed source update.
    failure_modes:
      - Follows the PR-added supersession link and compares against the new successor.
      - Reports no drift because the PR-added successor matches the code.
    priority: high
    stimulus_scoped: true
    contract_ref: "agent §Step 1 latest-copy resolution on the base branch; §Step 7 item 2 Baseline"

  - expectation_id: stateless-dispatch-contract
    summary: Fresh-context workers receive serialized task identity and exact output paths.
    signal: Dispatch state carries task kind and output path, and retries repeat the complete contract.
    pass_criteria: |
      Orientation and findings workers can determine their role and output path
      from diff-state.json plus the current dispatch without relying on prior
      invocation history.
    failure_modes:
      - A retry refers only to a prior invocation.
      - A worker must infer whether it writes orientation or findings.
      - A failed or no-output invocation is skipped without the complete-contract retry.
    priority: high
    contract_ref: "agent §Step 6 Dispatch Selected Perspectives"

  - expectation_id: grounded-findings-aggregation
    summary: Only findings supported by persisted review evidence affect the merged verdict.
    signal: Merge behavior validates worker citations before counting severity or normalizing the verdict.
    pass_criteria: |
      Source findings resolve to persisted diff or cited untracked-file evidence
      or an explicit serialized requirement. PR-deliverable findings resolve to
      an exact prContext field. Unsupported findings are recorded as rejected
      worker evidence and do not affect severity counts or the verdict.
    failure_modes:
      - The merge trusts a worker verdict independently of accepted findings.
      - A schema-conforming but unsupported finding affects severity counts.
      - Rejected worker evidence is silently discarded.
    priority: high
    contract_ref: "agent §Step 7 Merge, Walk Back, and Persist"
