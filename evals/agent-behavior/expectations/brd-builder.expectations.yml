# Bucket-A expectations for brd-builder
# Format: per-agent YAML, 5–10 grader-worthy expectations grounded in the agent
# file's explicit promises and/or current matrix failures. This file is consumed
# by the next pass that rewrites stimuli + graders end-to-end; do not treat it
# as a Vally grader file directly.
#
# Note: the agent file places the BRD itself at
# `docs/project-planning/<name>-brd.md` and the session state at
# `.copilot-tracking/brd-sessions/<name>.state.json`. The
# `brd-builder-class-recipe` stimulus' `tracking-file-write` grader accepts
# either the BRD output under `docs/project-planning/` or the state path under
# `.copilot-tracking/(brd-sessions|research)/`, matching the agent contract.
# Expectations below ground in the agent file.
slug: brd-builder
class: research-writer
agent_file: .github/agents/project-planning/brd-builder.agent.md
stimulus_file: evals/agent-behavior/stimuli/brd-builder.yml
latest_result: evals/results/agent-matrix/2026-05-28/brd-builder.json
source_review_date: 2026-05-28

expectations:
  - expectation_id: brd-file-location
    summary: BRD file is written to `docs/project-planning/<kebab-case-name>-brd.md`.
    signal: Output names a workspace path matching `docs/project-planning/<slug>-brd.md`.
    pass_criteria: |
      The reported BRD path is workspace-relative, starts with `docs/project-planning/`,
      uses a kebab-case slug derived from the initiative name, and ends with
      `-brd.md`.
    failure_modes:
      - BRD written to a temp directory or absolute path
        (current 2026-05-28 output reports `C:\Users\…\AppData\Local\Temp\vally-eval-…\…-brd.md`).
      - BRD written to repo root with no `docs/project-planning/` prefix.
      - Filename ends with `.md` only (missing `-brd` suffix).
    priority: high
    contract_ref: "agent §File Management › File Locations (BRD file: `docs/project-planning/<kebab-case-name>-brd.md`)"

  - expectation_id: state-file-location
    summary: State file is written under the BRD-sessions tracking subtree.
    signal: Output names a workspace path matching `.copilot-tracking/brd-sessions/<slug>.state.json`.
    pass_criteria: |
      When the agent creates a BRD it also reports a state-file path beginning
      with `.copilot-tracking/brd-sessions/` whose filename ends with
      `.state.json` and whose slug matches the BRD slug.
    failure_modes:
      - State file omitted entirely.
      - State file written next to BRD in `docs/project-planning/`.
      - State file written outside `.copilot-tracking/brd-sessions/`.
    priority: high
    contract_ref: "agent §File Management › File Locations + §State Tracking"

  - expectation_id: required-brd-sections
    summary: Drafted BRD contains all required sections from the agent contract.
    signal: Output references each of the six required section names.
    pass_criteria: |
      The response (or the BRD body it summarizes) names all six required
      sections (case-insensitive): Business Context and Background, Problem
      Statement and Business Drivers, Business Objectives and Success Metrics,
      Stakeholders and Roles, Scope, Business Requirements.
    failure_modes:
      - Response shows only goals/scope/metrics and omits Stakeholders or
        Problem Statement.
      - Conditional sections (Processes, Data, Benefits) substituted for required ones.
    priority: high
    contract_ref: "agent §BRD Structure (Required sections list)"

  - expectation_id: requirement-id-format
    summary: Each requirement has the documented BR-NNN identifier.
    signal: Requirements use `BR-001`, `BR-002`, etc.
    pass_criteria: |
      Listed business requirements use the `BR-<NNN>` ID format documented in
      §BRD Structure › Requirement Quality, with zero-padded three-digit
      numbers. Each requirement also includes a testable description and a
      priority.
    failure_modes:
      - Requirements numbered as `R1`, `Req-01`, `1.`, or unnumbered bullets.
      - IDs present but with no testable description or priority.
    priority: medium
    contract_ref: "agent §BRD Structure › Requirement Quality (unique ID `BR-001`, testable description, priority)"

  - expectation_id: frontmatter-fields
    summary: BRD frontmatter includes the documented metadata fields.
    signal: Output shows YAML frontmatter with `title`, `description`, `author`, `ms.date`, `ms.topic`.
    pass_criteria: |
      The BRD body the agent shows or summarizes includes YAML frontmatter
      with at least `title`, `description`, `author`, `ms.date`, and
      `ms.topic` keys, and does NOT include `<!-- markdownlint-disable-file -->`.
    failure_modes:
      - No frontmatter shown.
      - Frontmatter missing one or more required keys.
      - File begins with `<!-- markdownlint-disable-file -->`.
    priority: medium
    contract_ref: "agent §BRD Creation (Include YAML frontmatter with `title`, `description`, `author`, `ms.date`, `ms.topic`; exclude markdownlint disable comment)"

  - expectation_id: ambiguous-request-clarification
    summary: Vague requests trigger 2–3 initial scope questions before file creation.
    signal: Output asks initial Business Initiative / Scope Boundaries questions.
    pass_criteria: |
      When the stimulus is vague (no initiative name, problem-only statement,
      or multiple unrelated ideas), the response asks 2–3 essential questions
      from the documented Initial Questions list (initiative name, business
      problem, driver, initiative type, primary stakeholders) before creating
      the BRD file.
    failure_modes:
      - Agent immediately creates a BRD file for a vague request with no questioning.
      - Agent asks ten or more questions, ignoring the 2–3 budget.
    priority: medium
    applies_when: "stimulus is vague (no clear initiative name or scope)"
    contract_ref: "agent §Handling Ambiguous Requests + §Questioning Strategy › Initial Questions"

  - expectation_id: explicit-request-immediate-creation
    summary: Clear initiative requests trigger immediate file creation, not extended questioning.
    signal: Output reports a BRD file path on the first turn when the initiative is named.
    pass_criteria: |
      When the user provides an explicit initiative name, clear business change,
      or specific project reference (e.g. "Create a BRD for Claims Automation
      Program" or "Draft a BRD for self-service password reset"), the response
      creates the BRD file on the first turn and reports its path, then asks
      refinement questions afterward.
    failure_modes:
      - Agent asks ten clarifying questions before creating the file for an
        explicit initiative.
      - Agent never reports a file path for a clear initiative request.
    priority: medium
    applies_when: "stimulus names a clear initiative or feature (e.g. `brd-builder-class-recipe`)"
    contract_ref: "agent §Handling Ambiguous Requests (Create files immediately when the user provides an explicit initiative name)"

  - expectation_id: emoji-checklist-questions
    summary: Refinement questions use the documented emoji-checklist format.
    signal: Output uses `[ ] ❓` / `[x] ✅` / `[ ] ❌` markers on numbered question items.
    pass_criteria: |
      When the agent presents refinement questions, items appear as
      `* <id>. [ ] ❓ <question>` (unanswered), `[x] ✅` (answered), or
      `[ ] ❌` (N/A), grouped under emoji-prefixed area headings (`🎯`, `👥`,
      `🔄`, `📊`, `⚡`), per §Questioning Strategy › Refinement Questions Checklist.
    failure_modes:
      - Questions presented as plain numbered list with no checklist or emoji.
      - Question IDs renumbered between turns instead of staying stable.
    priority: low
    applies_when: "refinement / elicitation turn"
    contract_ref: "agent §Questioning Strategy › Refinement Questions Checklist + §Initial Questions"

  - expectation_id: no-source-edit
    summary: BRD authoring does not modify source code or build manifests.
    signal: Output does not name modifications to source-tree files.
    pass_criteria: |
      No occurrences of edit/create verbs paired with `.cs`/`.py`/`.ts`/`.js`/
      `.go`/`.rs`/`.java`/`package.json`/`pyproject.toml`/`Cargo.toml` paths.
    failure_modes:
      - Drafting a password-reset BRD leads to modifying auth service source files.
      - Agent claims to update `package.json` as part of BRD work.
    priority: medium
    contract_ref: "agent scope (writes are confined to `docs/project-planning/` and `.copilot-tracking/brd-sessions/`)"

  - expectation_id: stimulus-topic-fidelity
    summary: Response substantively addresses the BRD topic from the stimulus.
    signal: Stimulus-derived keywords appear in the response body.
    pass_criteria: |
      For the `brd-builder-class-recipe` stimulus, the response contains terms
      from {password, reset, business, requirement, scope, success} and the
      BRD body addresses password-reset specifics (e.g. self-service flow,
      MFA, ticket-volume reduction) rather than generic template prose.
    failure_modes:
      - Off-topic BRD with no password-reset references.
      - Requirements written as placeholders ("BR-001: Describe the feature").
    priority: medium
    stimulus_scoped: true
    contract_ref: "stimulus design (per-stimulus, not agent-intrinsic)"

  - expectation_id: proposal-response-business-activation
    summary: Explicit proposal-response continuation activates business-domain contribution only.
    signal: Output names `proposal-response#contribute:business`, returns the supplied proposal-response artifact path, and preserves builder state transport.
    pass_criteria: |
      An explicit RFI, RFP, questionnaire, tender, bid-response, proposal, or
      reusable response-evidence request invokes `proposal-response` contribute
      mode with the business domain, uses approved business-owned evidence, and
      retains internal-review and outside-scope authority markers. The complete
      payload is persisted under `.copilot-tracking/proposal-responses/`; the
      response and BRD state carry its supplied path rather than a payload copy.
      A continuation passes the same path to the skill, retains it once in
      `proposalResponseArtifacts`, retains the business extension once in
      `extensionsLoaded`, preserves prior SQ, CLM, and UNR IDs, adds only an
      operation-appropriate business record, and exposes recalculated coverage.
    failure_modes:
      - Product-owned proof or release authority is supplied by BRD Builder.
      - The extension load is recorded in `phaseSkillsLoaded` instead of `extensionsLoaded`.
      - The complete `RESPONSE_EVIDENCE_V1` payload is returned inline without an artifact pointer.
      - A supplied artifact path is replaced, omitted, or duplicated in `proposalResponseArtifacts`.
      - Existing SQ, CLM, or UNR records are discarded, renumbered, or hidden.
      - Coverage is reused without recalculation after the contribution.
    priority: high
    applies_when: "stimulus explicitly requests proposal-response contribution"
    contract_ref: "agent §Lifecycle Dispatch › Proposal Response Extension"

  - expectation_id: proposal-response-tri-operation-binding
    summary: BRD Builder performs analyze, contribute, and draft for the business domain.
    signal: Output reports a pointer whose `operation` matches the requested analyze, contribute, or draft operation.
    pass_criteria: |
      An explicit proposal-response request for `analyze`, `contribute`, or
      `draft` is carried inside BRD Builder without redirecting the user to
      invoke the skill directly. `contribute` stays bound to the business
      domain. `draft` renders responses over every reviewed claim, including
      product-owned claims, and creates no product-owned claim of its own.
    failure_modes:
      - An analyze or draft request is refused or redirected to direct skill invocation.
      - A draft omits questions answered by product-owned claims.
      - The draft creates, edits, or reclassifies a product-owned claim.
    priority: high
    applies_when: "stimulus requests a proposal-response analyze, contribute, or draft operation"
    contract_ref: "agent §Lifecycle Dispatch › Proposal Response Extension"

  - expectation_id: proposal-response-source-intake
    summary: A user-named BRD becomes a registered, cited source rather than transcribed prose.
    signal: Output reports an approved-source record for the named path and claims citing `SRC-###` references.
    pass_criteria: |
      When the user names an existing BRD path as approved evidence, the path is
      read, registered with its own `SRC` ID and read date, and every resulting
      claim's `evidence_refs` entry names that source ID plus the requirement or
      section it drew from. A named path that does not resolve stops the
      operation with the path and the smallest clearing action visible, and
      produces no claim.
    failure_modes:
      - Claim evidence is a bare filename or transcribed sentence with no source ID.
      - A source is registered without being read.
      - An unresolvable source path is silently replaced by recalled content.
    priority: high
    applies_when: "stimulus names an approved source artifact path"
    contract_ref: "skill §Flow, §Stop Rules; reference §Approved Sources"

  - expectation_id: proposal-response-next-operation-reported
    summary: Each proposal-response turn closes by naming the remaining step.
    signal: Output carries the skill's `next_operation` value and states it to the user.
    pass_criteria: |
      The reported pointer carries `next_operation`, and the turn closes by
      naming that operation. A payload whose only open items require a human
      decision outside the skill reports `none` rather than looping, and names
      the blocking unresolved items.
    failure_modes:
      - "`next_operation` is omitted from the reported pointer."
      - The agent invokes the next operation without a new user request.
      - A payload blocked only by human decisions reports a further skill operation.
    priority: medium
    applies_when: "skill returns RESPONSE_EVIDENCE_POINTER_V1"
    contract_ref: "skill §Operation Sequence; skill reference §Reporting"

  - expectation_id: proposal-response-rejected-continuation
    summary: A rejected continuation remains an error and does not enter proposal-response state.
    signal: Output reports `RESPONSE_EVIDENCE_ERROR_V1` and leaves `proposalResponseArtifacts` without the rejected path.
    pass_criteria: |
      When the skill returns `RESPONSE_EVIDENCE_ERROR_V1` with
      `artifact_written: false`, the builder reports the rejection, its
      `validation_error`, and its `clearing_action`, leaves
      `state.proposalResponseArtifacts` unchanged, does not create that array,
      and never appends the rejected `artifact_path`. Only a returned
      `RESPONSE_EVIDENCE_POINTER_V1` records a path.
    failure_modes:
      - The rejected `artifact_path` is appended to `proposalResponseArtifacts`.
      - A missing `proposalResponseArtifacts` array is created for a rejected operation.
      - The rejection is reported as a successful contribution or a written artifact.
      - The validation error or clearing action is omitted from the report.
    priority: high
    applies_when: "skill returns a rejected continuation result"
    contract_ref: "skill reference §Rejected Operations"

  - expectation_id: ordinary-brd-no-proposal-activation
    summary: Ordinary BRD work does not activate proposal-response behavior.
    signal: Output contains no proposal-response contract, appendix, or extension-load language.
    pass_criteria: |
      Creation, refinement, resume, quality review, and BRD-to-PRD handoff
      requests continue through the canonical BRD lifecycle without loading or
      emitting proposal-response artifacts.
    failure_modes:
      - An ordinary BRD request emits `RESPONSE_EVIDENCE_V1`.
      - A missing `extensionsLoaded` array triggers proposal-response activation.
    priority: high
    applies_when: "stimulus contains no explicit proposal-response intent"
    contract_ref: "agent §Lifecycle Dispatch › Proposal Response Extension"
