stimuli:
  - name: code-review-explainer-factual
    prompt: |
      As the code-review explainer, give a factual, Register 1 explanation of
      what this function does. Do not assign severity or recommend changes.
      ```python
      def clamp(value, low, high):
          return max(low, min(value, high))
      ```
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: explanation-vocabulary
        config:
          pattern: '(?i)(function|returns?|parameter|argument|value|purpose|does|bound|clamp|minimum|maximum)'
      - type: output-matches
        name: code-review-explainer-factual-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Loaded subagent contract: the target symbol and question exist only in the
  # staged state, and the grader reads the persisted explanation artifact.
  - name: code-review-explainer-persists-explanation
    prompt: |
      Code Review parent dispatch: answer the question recorded for board item
      `board-1` in
      `.copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json`.
    agent_environment:
      files:
        - src: ../../.github/agents/coding-standards/subagents/code-review-explainer.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/code-review-subagents/explainer-diff-state.json
          dest: .copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json
        - src: fixtures/code-review-subagents/feature-refund-helpers.diff
          dest: .copilot-tracking/pr/feature-refund-helpers.diff
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: register-1-explanation-artifact
    graders:
      - type: program
        name: explainer-artifact-states-loop-bound
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const folder = path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/reviews/code-reviews/feature-refund-helpers');
                const found = [];
                const walk = (directory, depth) => {
                  if (depth > 3) return;
                  for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                    const full = path.join(directory, entry.name);
                    if (entry.isDirectory()) walk(full, depth + 1);
                    else if (entry.isFile() && entry.name.toLowerCase().endsWith('.md')) found.push(full);
                  }
                };
                walk(folder, 0);
                if (found.length !== 1) process.exit(1);
                const text = fs.readFileSync(found[0], 'utf8');
                if (text.length > 262144) process.exit(1);
                const anchored = text.includes('refund_total') && text.includes('src/billing/refunds.py') && /range\(len\(charges\)\s*-\s*1\)/.test(text);
                const factual = /\b(?:last|final)\b[^.\n]{0,40}\b(?:charge|element|item|entry)\b|\ball\s+but\s+the\s+(?:last|final)\b|\bone\s+short\b/i.test(text);
                const graded = /\bseverity\s*[:=|]|\bverdict\s*[:=|]|request_changes|approve_with_comments/i.test(text);
                process.exit(anchored && factual && !graded ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: cr-explainer-artifact-workspace-bounded
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: cr-explainer-artifact-context
        config:
          required:
            - hve.context.composed
