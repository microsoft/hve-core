stimuli:
  - name: rpi-agent-class-recipe
    prompt: |
      Research evidence for this task is sufficient. The current lifecycle
      routes planning through the `rpi-plan` skill. Do not call tools. Return
      exactly `rpi-plan`.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: planning-route
        config:
          pattern: '(?i)^\s*[''"]?rpi-plan[''"]?[.!]?\s*$'
  - name: rpi-agent-conformance-3eb62554
    prompt: |
      Close out this session. The existing session-state artifact is `.copilot-tracking/rpi-sessions/2026-07-22/demo-state.json`.
    tags:
      category: agent-behavior
      kind: agent
      target_artifact: ".github/agents/hve-core/rpi-agent.agent.md"
      advisory: "true"
      prompt_sha256: 3eb62554be5f1feed44fb65188c7863cbc0aa6dfa0c6a23c99e8f2e1babae210
    graders:
      - type: output-matches
        name: mentions-session-artifact
        config:
          pattern: '(?i)demo-state\.json'
  - name: rpi-agent-task-recovery-class-recipe
    prompt: |
      Start `/rpi-implement` for issue 2607. The available saved state belongs
      to issue 2628. Do not call tools. Return only the issue number you would
      act on.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: requested-task-selected
        config:
          pattern: '^\s*2607\s*$'
  - name: rpi-agent-first-task-assessment-defaults
    prompt: |
      This is a contained, response-only lifecycle-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. Consider the first task in
      a new automatic session. The user has not skipped either assessment.
      Select the default settings. Return exactly two lines: `Critique: run|skip`
      and `Review: run|skip`. Do not execute phases or write files.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-assessment-policy
      prompt_sha256: 530d7a5de4a0d3daea4823e4e614a235787022c2fcc075a9077bc9aaf6413e04
    graders:
      - type: output-matches
        name: first-task-runs-both-assessments
        config:
          pattern: '(?i)^\s*Critique:[ \t]*run[ \t]*\r?\nReview:[ \t]*run\s*$'
  - name: rpi-agent-child-assessment-defaults
    prompt: |
      This is a contained, response-only lifecycle-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. The first task already
      completed its critique and Review. A required child task is ready, and the
      user has not requested more assessments. Select the child defaults.
      Return exactly two lines: `Critique: run|skip` and `Review: run|skip`.
      Do not execute phases or write files.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-assessment-policy
      prompt_sha256: 66d9ceef6327910cfd5ac7d0e4679186e4a47a395048a5480eb4d96f9fa1c50d
    graders:
      - type: output-matches
        name: child-skips-unrequested-assessments
        config:
          pattern: '(?i)^\s*Critique:[ \t]*skip[ \t]*\r?\nReview:[ \t]*skip\s*$'
  - name: rpi-agent-child-explicit-assessment-override
    prompt: |
      This is a contained, response-only lifecycle-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. The first task already
      completed both assessments. For a required child task the user explicitly
      requests another plan critique and another Review. Select the child
      settings. Return exactly two lines: `Critique: run|skip` and
      `Review: run|skip`. Do not execute phases or write files.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-assessment-policy
      prompt_sha256: ee12bd79d01672080be94606943de3172f0c7e51fb9fcb088179f1262e703bae
    graders:
      - type: output-matches
        name: explicit-child-request-runs-both
        config:
          pattern: '(?i)^\s*Critique:[ \t]*run[ \t]*\r?\nReview:[ \t]*run\s*$'
  - name: rpi-agent-child-review-only-override
    prompt: |
      This is a contained, response-only lifecycle-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. The first task already
      completed both assessments. For a required child task the user requests
      another Review but does not request another critique. Select the child
      settings. Return exactly two lines: `Critique: run|skip` and
      `Review: run|skip`. Do not execute phases or write files.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-assessment-policy
      prompt_sha256: 9ba8a9c38a75a7cba0810614248b34a3ba61b5910deeec6a1ccad77f1a9c0b87
    graders:
      - type: output-matches
        name: review-request-does-not-add-critique
        config:
          pattern: '(?i)^\s*Critique:[ \t]*skip[ \t]*\r?\nReview:[ \t]*run\s*$'
  - name: rpi-agent-interrupted-critique-continuation
    prompt: |
      This is a contained, response-only lifecycle-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md` and
      `policy/rpi-plan.SKILL.md`. In the first task, Critique Disposition is
      started but no result exists after its first interruption. The prerequisite
      is unchanged and the user has not skipped the critique. Classify recovery
      and planning readiness. Return exactly two lines:
      `Recovery: resume-existing|start-additional` and `Readiness: ready|not-ready`.
      Do not execute phases or write files.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
        - src: ../../.github/skills/rpi/rpi-plan/SKILL.md
          dest: policy/rpi-plan.SKILL.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-assessment-policy
      prompt_sha256: 5f517b2ea2bc0c7cc060e9a32b64094c300ce663f2f4dcb870693d33967b9a1c
    graders:
      - type: output-matches
        name: interrupted-critique-keeps-existing-assessment
        config:
          pattern: '(?i)^\s*Recovery:[ \t]*resume-existing[ \t]*\r?\nReadiness:[ \t]*not-ready\s*$'
  - name: rpi-agent-interrupted-review-continuation
    prompt: |
      This is a contained, response-only lifecycle-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md` and
      `policy/rpi-review.SKILL.md`. The first task's canonical Review record is
      started after an interruption. A stale session projection says completed,
      but no finished Review exists. Classify recovery and which evidence
      governs. Return exactly two lines:
      `Recovery: resume-existing|start-additional` and `Evidence: canonical|projection`.
      Do not execute phases or write files.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
        - src: ../../.github/skills/rpi/rpi-review/SKILL.md
          dest: policy/rpi-review.SKILL.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-assessment-policy
      prompt_sha256: 327726be39b55e046a4bfe5e61b86d544bc14a6b0d6e84c29222b2a3ac5916df
    graders:
      - type: output-matches
        name: interrupted-review-keeps-canonical-record
        config:
          pattern: '(?i)^\s*Recovery:[ \t]*resume-existing[ \t]*\r?\nEvidence:[ \t]*canonical\s*$'
  - name: rpi-agent-canvas-provider-ambiguity
    prompt: |
      This is a contained, response-only canvas-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. A capability lookup for
      hve-core-rpi-workflow reports multiple providers:
      plugin:hve-core:rpi-workflow and project:rpi-workflow. No Canvas decision
      exists. Choose the next action and provider arguments for lookup and
      opening. Return exactly three lines: `Action: retry|abandon`,
      `Lookup provider: <id>`, and `Open provider: <id>`. Do not call canvas tools
      or write files. If the file cannot be read, report the task as blocked
      without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-canvas-policy
      prompt_sha256: 4e9662db8c78af95e830da97e750cc317d2fe07a5eaf394d79134ec5fd9382d6
    graders:
      - type: output-matches
        name: retry-with-consistent-project-provider
        config:
          pattern: '(?i)^\s*Action:[ \t]*retry[ \t]*\r?\nLookup provider:[ \t]*project:rpi-workflow[ \t]*\r?\nOpen provider:[ \t]*project:rpi-workflow\s*$'
  - name: rpi-agent-canvas-provider-retention
    prompt: |
      This is a contained, response-only canvas-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. The saved Canvas decision
      records instance rpi-map and extensionId plugin:hve-core:rpi-workflow.
      The user asks to bring that panel back. The host still offers both
      plugin:hve-core:rpi-workflow and project:rpi-workflow. Select the instance
      and provider. Return exactly two lines: `Instance: <id>` and
      `Provider: <id>`. Do not call canvas tools or write files. If the file
      cannot be read, report the task as blocked without inventing its
      declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-canvas-policy
      prompt_sha256: ea2824bb2e721263be27c3d3fb3db6d4765c9fa8ea2b436c0c42eb2f33c332a8
    graders:
      - type: output-matches
        name: reopen-with-retained-provider-and-instance
        config:
          pattern: '(?i)^\s*Instance:[ \t]*rpi-map[ \t]*\r?\nProvider:[ \t]*plugin:hve-core:rpi-workflow\s*$'
  - name: rpi-agent-canvas-provider-failure
    prompt: |
      This is a contained, response-only canvas-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. No Canvas decision exists.
      After resolving provider ambiguity, the provider-qualified open fails
      because the extension is disconnected; the host recommends reloading the
      extension. There is no new evidence for another attempt. Decide whether
      to retry immediately, what the user must hear, whether RPI work can
      continue, and whether to record a current Canvas decision. Return exactly
      four lines: `Retry: yes|no`, `Report: silent|reason-and-recovery`,
      `RPI: continue|stop`, and `Record current canvas: yes|no`. Do not call
      canvas tools or write files. If the file cannot be read, report the task
      as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-canvas-policy
      prompt_sha256: b3193abbfdedfdeba7d6274247d6b988a13eb0e49b6335a6532d5dd4db25a5ae
    graders:
      - type: output-matches
        name: report-failure-without-blocking-or-false-success
        config:
          pattern: '(?i)^\s*Retry:[ \t]*no[ \t]*\r?\nReport:[ \t]*reason-and-recovery[ \t]*\r?\nRPI:[ \t]*continue[ \t]*\r?\nRecord current canvas:[ \t]*no\s*$'
  - name: rpi-agent-canvas-plugin-only
    prompt: |
      This is a contained, response-only canvas-policy regression, not native
      RPI execution. Read `policy/rpi-agent.agent.md`. In a downstream workspace
      the only host-reported provider for hve-core-rpi-workflow is
      plugin:hve-core:rpi-workflow. A saved Canvas decision from another host
      names project:rpi-workflow, which is not offered here. Choose the provider
      for opening and the evidence to retain after success. Return exactly two
      lines: `Open provider: <id>` and `Saved provider: <id>`. Do not call canvas
      tools or write files. If the file cannot be read, report the task as
      blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/hve-core/rpi-agent.agent.md
          dest: policy/rpi-agent.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
      shape: rpi-canvas-policy
      prompt_sha256: e9f059c3abbe570fc7c077c04a7605c246affb8277e25c3f44c5b5eddf82dbc5
    graders:
      - type: output-matches
        name: use-offered-plugin-instead-of-stale-project
        config:
          pattern: '(?i)^\s*Open provider:[ \t]*plugin:hve-core:rpi-workflow[ \t]*\r?\nSaved provider:[ \t]*plugin:hve-core:rpi-workflow\s*$'
