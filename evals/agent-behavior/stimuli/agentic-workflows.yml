# cspell:ignore bcompil
stimuli:
  - name: agentic-workflows-class-recipe
    prompt: |
      Plan an agentic workflow for "automated nightly dependency upgrade PRs". Break it into phases with success criteria. Write the plan under `.copilot-tracking/` and report the path you wrote it to.
      In your response, list the phase headings and their success criteria before reporting the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: agentic-workflows-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: agentic-workflows-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]'
      - type: output-matches
        name: agentic-workflows-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Loaded agent contract: a real agentic workflow and its generated lock file
  # are staged, and the gh-aw CLI is simulated as unavailable. The agent must
  # check the CLI version, edit only the canonical source, leave the lock file
  # untouched, and report that compilation is still outstanding.
  - name: agentic-workflows-keeps-generated-lock-unedited
    prompt: |
      Raise the timeout of the `issue-implement` agentic workflow from 30 to 45
      minutes.
    agent_environment:
      files:
        - src: ../../.github/agents/agentic-workflows.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/workflows/issue-implement.md
          dest: .github/workflows/issue-implement.md
        - src: ../../.github/workflows/issue-implement.lock.yml
          dest: .github/workflows/issue-implement.lock.yml
    simulation:
      tool_overrides:
        powershell:
          patterns:
            - match: '\bgh\s+aw\b'
              output: 'unknown command "aw" for "gh"'
              is_error: true
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: canonical-source-edit-without-compiler
    graders:
      - type: tool-calls
        name: aw-version-checked
        config:
          required:
            - name: '^(bash|shell|powershell)$'
              command: '(?i)\bgh\s+aw\b[^\r\n]*?(?:--version|\bversion\b)'
      - type: file-matches
        name: aw-canonical-source-updated
        config:
          path: .github/workflows/issue-implement.md
          pattern: '(?m)^timeout-minutes:\s*45\s*$'
      - type: output-matches
        name: aw-reports-compile-outstanding
        config:
          pattern: '(?is)^(?=[\s\S]*(?:\block(?:\s+file)?\b|\.lock\.yml\b|\bcompil\w*))(?=[\s\S]*(?:\bnot\s+(?:been\s+)?(?:re)?(?:compiled|generated|regenerated|validated|run|available|installed)\b|\b(?:unavailable|unknown\s+command)\b|\bcould\s*(?:not|n[\x27\u2019]t)\b|\bcannot\b|\bcan[\x27\u2019]t\b|\bunable\b|\bstill\s+needs?\b|\bpending\b|\boutstanding\b|\bstale\b))(?![\s\S]*\b(?:successfully|cleanly)\s+(?:re)?compiled\b)(?![\s\S]*\bcompil\w*\s+(?:succeeded|passed|completed\s+successfully)\b)(?![\s\S]*(?<!\bnot\s|n[\x27\u2019]t\s)\b(?:regenerated|updated|recompiled)\s+(?:the\s+)?(?:[\w.-]*\.)?lock(?:\.yml|\s+file)\b)'
      - type: system-event
        name: aw-workspace-bounded
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: aw-keeps-lock-context
        config:
          required:
            - hve.context.composed
