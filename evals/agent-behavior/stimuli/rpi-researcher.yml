stimuli:
  - name: rpi-researcher-return-only-suggestions
    prompt: |
      You found three documentation pages that answer the caller's bounded
      question. The caller owns the research artifact at
      `.copilot-tracking/research/2026-07-17/cache-policy-research.md`. You
      may return suggestions only and write nothing. Do not call tools.
      Return exactly `Return source pointers; write nothing.`
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: return-only-no-write
        config:
          pattern: '(?i)^\s*return\s+source\s+pointers;\s*write\s+nothing[.!]?\s*$'
