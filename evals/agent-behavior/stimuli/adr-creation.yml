# cspell:ignore cand FEFF madr
stimuli:
  - name: adr-creation-class-recipe
    prompt: |
      Start an ADR planning session for "Adopt PostgreSQL for the primary data store" using entry mode `capture`, project slug `adopt-postgresql`, and the default long-form output template. Initialize `.copilot-tracking/adr-plans/adopt-postgresql/state.json` with current phase `frame`, then report the tracking path and phase. Do not modify source code.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: adr-creation-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]adr-plans[-/\\]adopt-postgresql'
      - type: output-matches
        name: frame-phase
        config:
          pattern: '(?i)\bframe\b'
      - type: output-matches
        name: adr-creation-class-recipe-topic-coverage
        config:
          pattern: '(?i)postgres(?:ql)?'
      - type: output-matches
        name: adr-creation-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Advisory candidate for adr-creation-class-recipe: the agent, its standards
  # and the adr-author skill are loaded, and the prompt no longer names the
  # starting phase. The initialized state file, not the reply, must carry the
  # contract's Frame phase, its long-form template id and a disclaimer stamp.
  - name: adr-creation-class-recipe-candidate
    prompt: |
      Start an ADR planning session for "Adopt PostgreSQL for the primary data
      store" using entry mode `capture`, project slug `adopt-postgresql`, and
      the default long-form output template. Initialize the session state, then
      report the tracking path and the phase the session is in. Do not modify
      source code.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/adr-creation.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/project-planning/adr-standards.instructions.md
          dest: .github/instructions/project-planning/adr-standards.instructions.md
      skills:
        - ../../.github/skills/project-planning/adr-author
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: adr-session-bootstrap
    graders:
      - type: output-matches
        name: adr-reports-frame-tracking-path-cand
        config:
          pattern: '(?is)^(?=[\s\S]*\.copilot-tracking[-/\\]adr-plans[-/\\]adopt-postgresql\b)(?=[\s\S]*\bframe\b)(?![\s\S]*\bphase\b[^.\n]{0,20}\b(?:is|:|=)\s*`?(?:decide|govern)\b)'
      - type: program
        name: adr-state-initialized-at-frame-cand
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const text = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/adr-plans/adopt-postgresql/state.json'), 'utf8');
                if (text.length > 262144) process.exit(1);
                const state = JSON.parse(text.replace(/^\uFEFF/, ''));
                const stamped = typeof state.disclaimerShownAt === 'string' && !Number.isNaN(Date.parse(state.disclaimerShownAt));
                const initialized = state.projectSlug === 'adopt-postgresql' && state.entryMode === 'capture' &&
                  state.outputTemplate === 'madr-v4' && state.phase === 'frame';
                process.exit(initialized && stamped ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: adr-bootstrap-workspace-bounded-cand
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: adr-bootstrap-context-cand
        config:
          required:
            - hve.context.composed
