  - name: data-science-engineering-coach-produces-rpi-pipeline-delivery
    prompt: |
      Resume the staged `synthetic-pipeline` session. The active pipeline job
      and episodic class are confirmed, and the staged DataOps design is
      accepted. I separately confirm Plan, Implement, and Review for substantial
      delivery task `synthetic-pipeline-delivery` using synthetic date
      `2026-09-21`. Run the confirmed segments in order now, scan the exact
      candidate customer summary before writing it, then reconcile the produced
      Plan, Changes, and Review pointers into coach state without changing jobs
      or adopting planner state.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/rpi-depth/ds-session-state.md
          dest: .copilot-tracking/ds/synthetic-pipeline/session-state.md
        - src: fixtures/rpi-depth/ds-pipeline-design.md
          dest: evidence/synthetic-pipeline-design.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/data-science-engineering/dataops
        - ../../.github/skills/project-planning/adr-author
        - ../../.github/skills/rpi/rpi-plan
        - ../../.github/skills/rpi/rpi-plan-critique
        - ../../.github/skills/rpi/rpi-implement
        - ../../.github/skills/rpi/rpi-review
    simulation:
      tool_overrides:
        powershell:
          patterns:
            - match: 'scan_sensitive_content\.py'
              output: '{"schema_version":"scan-sensitive-content-v1","status":"completed","modes":{"public":false,"data":true,"denylist":false},"denylist_rule_count":0,"findings":[],"summary":{"high":0,"warn":0,"total":0}}'
              is_error: false
    tags:
      category: agent-behavior
      scenario: data-science-rpi-execution-production
    constraints:
      max_agent_duration: 900s
      max_duration: 960s
    graders:
      - type: tool-calls
        name: data-science-rpi-clean-scan-observed
        config:
          required:
            - name: '^(?:bash|shell|powershell)$'
              command: 'scan_sensitive_content\.py'
              result: '\\?"status\\?"\s*:\s*\\?"completed\\?"'
      - type: file-exists
        name: data-science-rpi-plan-produced
        config:
          path: .copilot-tracking/plans/2026-09-21/synthetic-pipeline-delivery-plan.md
      - type: file-exists
        name: data-science-rpi-changes-produced
        config:
          path: .copilot-tracking/changes/2026-09-21/synthetic-pipeline-delivery-changes.md
      - type: file-exists
        name: data-science-rpi-review-produced
        config:
          path: .copilot-tracking/reviews/logs/2026-09-21/synthetic-pipeline-delivery-review.md
      - type: file-matches
        name: data-science-rpi-customer-output-produced
        config:
          path: docs/data/synthetic-pipeline-output.md
          pattern: '(?is)event identifier.*quarantine.*invalid.*rejected-record count'
      - type: program
        name: data-science-rpi-produced-pointers-preserve-job
        config:
          program: pwsh
          args:
            - -NoProfile
            - -Command
            - |
              $ErrorActionPreference = 'Stop'
              $codes = [System.Collections.Generic.List[string]]::new()
              function Get-Scalars($Node, [int]$Depth = 0) {
                if ($Depth -gt 64) { throw 'Nesting limit' }
                if ($Node -is [System.Collections.IDictionary]) { foreach ($key in $Node.Keys) { [string]$key; Get-Scalars $Node[$key] ($Depth + 1) } }
                elseif ($Node -is [System.Collections.IList]) { foreach ($item in $Node) { Get-Scalars $item ($Depth + 1) } }
                elseif ($null -ne $Node) { [string]$Node }
              }
              try {
                & {
                  $item = Get-Item -LiteralPath (Join-Path $env:EVALUATE_WORKSPACE '.copilot-tracking/ds/synthetic-pipeline/session-state.md')
                  if ($item.Length -gt 1MB) { $codes.Add('oversized-input'); return }
                  $blocks = [regex]::Matches([System.IO.File]::ReadAllText($item.FullName), '(?ms)^[ \t]*```[ \t]*ya?ml[ \t]*\r?\n(.*?)^[ \t]*```[ \t]*\r?$')
                  if ($blocks.Count -ne 1) { $codes.Add('ambiguous-input'); return }
                  Import-Module powershell-yaml
                  try { $documents = @(ConvertFrom-Yaml -Yaml $blocks[0].Groups[1].Value -AllDocuments) } catch { $codes.Add('invalid-yaml'); return }
                  if ($documents.Count -ne 1) { $codes.Add('ambiguous-input'); return }
                  $state = $documents[0]
                  if ($state -isnot [System.Collections.IDictionary]) { $codes.Add('invalid-yaml'); return }
                  if (-not ($state.project.slug -is [string] -and $state.project.slug -ceq 'synthetic-pipeline' -and
                    $state.current.job -is [string] -and $state.current.job -ceq 'pipeline' -and
                    $state.current.class -is [string] -and $state.current.class -ceq 'episodic')) { $codes.Add('state-mismatch') }
                  if (-not ($state.synthetic_extension.preserve -is [bool] -and $state.synthetic_extension.preserve)) { $codes.Add('extension-mismatch') }
                  $pointers = @(Get-Scalars $state.artifacts) + @(Get-Scalars $state.jobs.pipeline)
                  foreach ($kind in 'plan', 'changes', 'review') {
                    if (@($pointers -match "(?:^|[\\/])synthetic-pipeline-delivery-$kind\.md$").Count -eq 0) { $codes.Add('pointer-mismatch') }
                  }
                }
              } catch { if ($codes.Count -eq 0) { $codes.Add('read-error') } }
              $passed = $codes.Count -eq 0
              @{ name = 'data-science-rpi-produced-pointers-preserve-job'; kind = 'code'; passed = [bool]$passed; score = [int]$passed; evidence = 'Validate parsed coach state values, extension and delivery artifact pointers.'; metadata = @{ failureCodes = @($codes | Sort-Object -Unique) } } | ConvertTo-Json -Compress -Depth 4

