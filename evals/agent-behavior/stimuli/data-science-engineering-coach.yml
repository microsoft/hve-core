# cspell:ignore declin rescan
stimuli:
  - name: data-science-engineering-coach-initialize-and-select
    prompt: |
      This is a response-only contract exercise. Do not create, read, or write
      session state or other files; answer in chat.

      Start a new Data Science and Engineering Coach session for project slug
      `retail-demand-forecasting`. There is no existing state or durable project
      artifact. Show the required disclaimer behavior and offer the available
      jobs, but do not choose a job for me. Report the state path you would use.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: state-path-and-disclaimer
        config:
          pattern: '(?is)(?=[\s\S]*\.copilot-tracking[/\\]ds[/\\]retail-demand-forecasting[/\\]session-state\.md)(?=[\s\S]*(?:CAUTION|Disclaimer))'
      - type: output-matches
        name: explicit-job-choice
        config:
          pattern: '(?is)(catalog|feasibility|pipeline|analysis|evaluation|experiment).*(choose|select|which|would you like)'
      - type: output-matches
        name: no-silent-default
        config:
          pattern: '(?i)(selected|starting|activated)\s+(the\s+)?catalog\s+job'
          negate: true

  - name: data-science-engineering-coach-transition-detour
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I am in the bounded feasibility job at phase 3 with its prior gates
      persisted. I now ask for a model diagram. Explain exactly how you handle
      the proposed transition before doing diagram work.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/data-science-engineering/data-catalog
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: confirmed-transition
        config:
          pattern: '(?is)(?=[\s\S]*\bfeasibility\b)(?=[\s\S]*\bmodel[- ]diagram\b)(?=[\s\S]*(?:\bconfirm\w*|\bpermission\b|\bwould you like\b|\bshall I\b|\bdo you want\b))'
      - type: output-matches
        name: bounded-disposition-and-log
        config:
          pattern: '(?is)(?=[\s\S]*\bpause[ds]?\b)(?=[\s\S]*(?:phase\s*3|phase pointer))(?=[\s\S]*\bgates?\b)(?=[\s\S]*(?:job_log|job log|from_job|to_job))'
      - type: output-matches
        name: destination-context
        config:
          pattern: '(?is)(?=[\s\S]*(?:data-catalog|\bcatalog\b))(?=[\s\S]*(?:entit|relationship|declared))'

  - name: data-science-engineering-coach-pause-complete-resume
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      Walk through this sequence without auto-advancing: start bounded
      feasibility, pause it for an explicitly selected analysis job, complete
      that episodic analysis, resume and complete feasibility, then explain
      what a later session resume announces and does not re-enter.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: bounded-and-episodic-state
        config:
          pattern: '(?is)(?=[\s\S]*\bfeasibility\b)(?=[\s\S]*\banalysis\b)(?=[\s\S]*\bepisodic\b)(?=[\s\S]*\bcomplet(?:e|ed|es|ion)\b)(?=[\s\S]*\bpaused\b[\s\S]*\bresum(?:e|es|ed|ing)\b)'
      - type: output-matches
        name: no-reentry-or-repeat
        config:
          pattern: '(?is)(?=[\s\S]*\bresum\w*)(?=[\s\S]*(?:\b(?:not|never|without|no)\b|n[\x27\u2019]t\b)[^.!?\n]{0,80}\b(?:re-?enter\w*|repeat\w*|restart\w*|re-?run\w*|re-?open\w*))(?=[\s\S]*\bexplicit(?:ly)?\b[^.!?\n]{0,60}\b(?:request\w*|ask\w*|revision|revis\w*|invocation))'
      - type: output-matches
        name: user-selected-next-action
        config:
          pattern: '(?is)(offer|choose|select|would you like).*(close|catalog|job|resume)'

  - name: data-science-engineering-coach-continuous-restore
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      Resume a session whose foreground job is unset, whose catalog job is
      active and points to a durable catalog, and whose feasibility job is
      paused. State what you announce before asking any job-specific question.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: continuous-and-paused-restoration
        config:
          pattern: '(?is)(catalog).*(active|continuous|durable).*(feasibility).*(paused)'
      - type: output-matches
        name: announce-before-question
        config:
          pattern: '(?is)^(?!(?:(?!\bcatalog\b)[\s\S])*\?)(?=[\s\S]*\bcatalog\b[\s\S]*(?:\?|\bwould you like\b|\bwhich\b|\bchoose\b|\bclose\b))(?=[\s\S]*\bpaused\b[\s\S]*(?:\?|\bwould you like\b|\bwhich\b|\bchoose\b|\bclose\b))'

  - name: data-science-engineering-coach-reconstruct-state
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      The session state is corrupt, but a data catalog and a partially completed
      feasibility study exist. Explain the recovery behavior, including what is
      preserved, what is inferred, and when work may resume.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: evidence-and-uncertainty
        config:
          pattern: '(?is)(?=[\s\S]*\bcatalog\b)(?=[\s\S]*\bfeasibility\b)(?=[\s\S]*(?:evidence|artifact))(?=[\s\S]*(?:uncertain|uncertainty|inferred))'
      - type: output-matches
        name: confirmation-before-replace
        config:
          pattern: '(?is)(?=[\s\S]*(?:preserv|back\s?up|untouched|unchanged))(?=[\s\S]*(?:\bconfirm\w*[^.!?\n]{0,80}\b(?:before|prior to)\b[^.!?\n]{0,80}\b(?:replac|creat|writ|resum)\w*|\b(?:replac|creat|writ|resum)\w*[^.!?\n]{0,80}\b(?:until|only after|after|once)\b[^.!?\n]{0,80}\bconfirm\w*|\b(?:wait|ask)\w*\s+for\s+(?:your\s+|explicit\s+|user\s+)*confirmation\b))'
      - type: output-matches
        name: yaml-not-planner-json
        config:
          pattern: '(?i)(planner\s+state\.json|\.copilot-tracking[/\\]ds[/\\][^\s]+[/\\]state\.json)'
          negate: true

  - name: data-science-engineering-coach-problem-framing-missing-outcome
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I confirm the `problem-framing` job. The request is: "We want to do
      something with our engagement data." No business outcome is stated, and I
      decline to define one when you ask.

      State which skill owns the work, what you produce, and what happens next.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/project-planning/experiment-design
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: data-science-engineering-coach-problem-framing-miss-35836e87
        config:
          pattern: '(?is)(?=[\s\S]*problem-framing)(?=[\s\S]*experiment-design)(?=[\s\S]*\bepisodic\b)'
      - type: output-matches
        name: assigns-outcome-definition-gap
        config:
          pattern: '(?is)(?=[\s\S]*(?:outcome[- ]definition|define the (?:business )?outcome))(?=[\s\S]*\bgap\b)'
      - type: output-matches
        name: data-science-engineering-coach-problem-framing-miss-f89200c4
        config:
          pattern: '(?is)(?=[\s\S]*answer holder)(?=[\s\S]*coordinator)'
      - type: output-matches
        name: performs-no-candidate-analysis
        config:
          pattern: '(?is)(no candidate analysis|no analysis was performed|without analysis|does not analyze|before candidate analysis)'
      - type: output-matches
        name: completes-rather-than-discarding
        config:
          pattern: '(?is)(completed work|completes|completion|complete the invocation)'
      - type: output-matches
        name: missing-outcome-does-not-become-an-experiment
        config:
          pattern: '(?is)(does not|will not|rather than|instead of|no)\s+\w*\s*(start|become|becomes|treat|design|run|scope)[^.]{0,60}(MVE|minimum viable experiment|experiment)'
      - type: output-matches
        name: data-science-engineering-coach-problem-framing-miss-dd64f6da
        config:
          pattern: '(?is)(ask|offer|confirm|choose|would you like).*?(next|another).*?(job|feasibility|experiment)'

  - name: data-science-engineering-coach-problem-framing-unresolved-axis
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I confirm the `problem-framing` job. The stated outcome is: "Determine
      whether pre-engagement inputs predict whether an engagement succeeds."
      Nobody can tell you whether the intent is to anticipate outcomes or to set
      those inputs as policy.

      State which skill owns the work, what you produce, and what happens next.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/project-planning/experiment-design
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: data-science-engineering-coach-problem-framing-unre-fa40416c
        config:
          pattern: '(?is)(?=[\s\S]*problem-framing)(?=[\s\S]*experiment-design)(?=[\s\S]*\bepisodic\b)'
      - type: output-matches
        name: marks-unknown-and-continues
        config:
          pattern: '(?is)(?=[\s\S]*\bunknown\b)(?=[\s\S]*(?:continue|proceed|remaining))'
      - type: output-matches
        name: data-science-engineering-coach-problem-framing-unre-303a9bf2
        config:
          pattern: '(?is)(?=[\s\S]*answer holder)(?=[\s\S]*coordinator)'
      - type: output-matches
        name: candidates-carry-grounded-and-original-labels
        config:
          pattern: '(?is)(?=[\s\S]*(?:\[G\]|grounded|cited))(?=[\s\S]*(?:\[O\]|repository-original|original routing|original judgement))'
      - type: output-matches
        name: no-candidate-selected
        config:
          pattern: '(?is)(does not select|do not select|not select|without selecting|no candidate is selected|selects none|no recommendation|does not rank|not rank|no ranking|not ranked)'
      - type: output-matches
        name: completes-episodically
        config:
          pattern: '(?is)(episodic|completes|completion|completed).*?(invocation|job|work)'
      - type: output-matches
        name: data-science-engineering-coach-problem-framing-unre-cbad74c1
        config:
          pattern: '(?is)(ask|offer|confirm|choose|would you like).*?(next|another).*?(job|feasibility|experiment)'

  - name: data-science-engineering-coach-durable-write-scan
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I selected catalog enrichment and approved a customer-repository output
      path. The proposed catalog content is ready for a durable write. Describe
      the required scan gate and the result handling before writing.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/data-science-engineering/data-catalog
        - ../../.github/skills/project-planning/adr-author
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: data-scan-before-write
        config:
          pattern: '(?is)(?=[\s\S]*(?:data[- ]mode|--data))(?=[\s\S]*(?:\bscan\w*[^.!?\n]{0,160}\b(?:before|prior to)\b[^.!?\n]{0,80}\b(?:writ|persist|creat|chang)\w*|\b(?:before|prior to)\b[^.!?\n]{0,80}\b(?:writ|persist|creat|chang)\w*[^.!?\n]{0,160}\bscan\w*))'
      - type: output-matches
        name: high-block-warn-review
        config:
          pattern: '(?is)(?=[\s\S]*\bhigh\b[^.!?;\n]*\b(?:block\w*|stop\w*|do not write|not (?:be )?written|no write)|[\s\S]*\b(?:block\w*|stop\w*)\b[^.!?;\n]*\bhigh\b)(?=[\s\S]*(?:mask\w*|redact\w*))(?=[\s\S]*\bwarn(?:ing)?s?\b[^.!?;\n]*\b(?:review\w*|decid\w*|continu\w*|surface\w*)|[\s\S]*\b(?:review\w*|surface\w*)\b[^.!?;\n]*\bwarn(?:ing)?s?\b)'
      - type: output-matches
        name: unavailable-blocks-write
        config:
          pattern: '(?is)(?:unavailable|missing)[^.!?]{0,200}(?:\b(?:do not|don\W?t|cannot|can\W?t|won\W?t|will not|must not|never)\b|\bstop\w*|\bblock\w*)[^.!?]{0,200}\bwrit\w*|(?:\b(?:do not|don\W?t|cannot|can\W?t|won\W?t|will not|must not|never)\b|\bstop\w*|\bblock\w*)[^.!?]{0,200}\bwrit\w*[^.!?]{0,200}(?:unavailable|missing)|(?:unavailable|missing)[^.!?]{0,200}\bno\s+(?:\w+\s+)?writ\w*|\bno\s+(?:\w+\s+)?writ\w*[^.!?]{0,200}(?:unavailable|missing)'

  - name: data-science-engineering-coach-analysis-skill-primary
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I confirm the analysis job. I want an exploratory notebook over the
      customer dataset already described in our catalog. State which skill owns
      this work, which skills own the adjacent concerns, and who produces the
      notebook.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/data-science-engineering/analysis-authoring
        - ../../.github/skills/data-science-engineering/data-catalog
        - ../../.github/skills/data-science-engineering/dataops
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: analysis-routes-to-authoring-skill
        config:
          pattern: '(?is)analysis-authoring'
      - type: output-matches
        name: adjacent-authority-preserved
        config:
          pattern: '(?is)(?=[\s\S]*data-catalog)(?=[\s\S]*(?:semantic|column|entit))(?=[\s\S]*\bdataops\b)'
      - type: output-matches
        name: no-retired-specialist
        config:
          pattern: '(?i)(DS Gen Jupyter Notebook|DS Gen Streamlit Dashboard|DS Gen Data Spec|DS Test Streamlit Dashboard|Evaluation Dataset Creator)'
          negate: true

  - name: data-science-engineering-coach-evaluation-job-routing
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I confirm the evaluation job. We need an evaluation dataset for a
      retrieval-grounded support agent. State which skill owns this, how it
      differs from ML model evaluation, and what you need before generating.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/data-science-engineering/evaluation-design
        - ../../.github/skills/data-science-engineering/ml-experimentation
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: evaluation-routes-to-design-skill
        config:
          pattern: '(?is)evaluation-design'
      - type: output-matches
        name: trained-model-boundary
        config:
          pattern: '(?is)(?=[\s\S]*ml-experimentation)(?=[\s\S]*(?:trained|model))'
      - type: output-matches
        name: interview-before-generation
        config:
          pattern: '(?is)(?:interview|question|scope|confirm)\w*[^.!?]{0,200}\b(?:before|prior to)\b[^.!?]{0,120}\b(?:generat\w*|dataset)|\b(?:before|prior to)\b[^.!?]{0,120}\b(?:generat\w*|dataset)\w*[^.!?]{0,200}(?:interview|question|scope|confirm)|\bgenerat\w*[^.!?]{0,120}\b(?:until|only after|after|once)\b[^.!?]{0,120}(?:interview|question|scope|confirm)'

  - name: data-science-engineering-coach-evaluation-job-persists
    prompt: |
      This is a response-only contract exercise for a represented coaching
      session. Do not initialize, resume, read, or write session state or other
      files; answer in chat.

      I confirm the evaluation job and we finish one evaluation dataset. Show
      the `jobs` block you persist for this project afterward, and state how you
      would react if the state file had no slot for the job I just selected.
    agent_environment:
      files:
        - src: ../../.github/agents/data-science-engineering/data-science-engineering-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/shared/untrusted-content-boundary.instructions.md
          dest: .github/instructions/shared/untrusted-content-boundary.instructions.md
      skills:
        - ../../.github/skills/data-science-engineering/data-science-engineering-foundation
        - ../../.github/skills/data-science-engineering/evaluation-design
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: evaluation-slot-persisted
        config:
          pattern: '(?is)\bevaluation:(?=[\s\S]{0,300}?\bclass:\s*[\x22\x27]?episodic\b)(?=[\s\S]{0,300}?\b(?:invocations|status):)'
      - type: output-matches
        name: registry-schema-parity
        config:
          pattern: '(?is)(?:^|[.!?\n])(?=[^.!?\n]*\b(?:job registry|registry)\b)(?=[^.!?\n]*\b(?:match\w*|equal\w*|parity|same|agree\w*|align\w*)\b)(?=[^.!?\n]*\b(?:jobs|state|schema|keys)\b)'
      - type: output-matches
        name: mismatch-stops-not-drops
        config:
          pattern: '(?is)(?=[\s\S]*\b(?:stop\w*|report\w*|halt\w*|surface\w*|pause\w*)\b[\s\S]{0,200}?(?:mismatch|missing|no slot)|[\s\S]*(?:mismatch|missing|no slot)[\s\S]{0,200}?\b(?:stop\w*|report\w*|halt\w*|surface\w*|pause\w*)\b)(?=[\s\S]*(?:\b(?:not|never|without)\b|rather than|instead of|n[\x27\u2019]t\b)[^.!?\n]{0,80}\b(?:drop\w*|discard\w*|silently|invent\w*))'

  - name: data-science-engineering-coach-evaluator-research
    prompt: |
      Explain this contract without initializing or resuming a live session:
      the evaluation job is confirmed in a valid resumed session, but current
      evaluator availability and preview state are not established. Explain
      the supporting Research route, what returns to `evaluation-design`, who
      still selects the metrics, and whether Research changes the active job,
      lifecycle class, or coach session-state authority. Do not start Research
      or mutate state during this walkthrough.
    agent_environment:
