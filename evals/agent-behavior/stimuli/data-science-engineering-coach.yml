      - type: program
        name: data-science-rpi-produced-pointers-preserve-job-cand
        config:
          program: pwsh
          args:
            - -NoProfile
            - -Command
            - |
              $ErrorActionPreference = 'Stop'
              $codes = [System.Collections.Generic.List[string]]::new()
              function Get-Scalars($Node, [int]$Depth = 0) {
                if ($Depth -gt 64) { throw 'Nesting limit' }
                if ($Node -is [System.Collections.IDictionary]) { foreach ($key in $Node.Keys) { [string]$key; Get-Scalars $Node[$key] ($Depth + 1) } }
                elseif ($Node -is [System.Collections.IList]) { foreach ($item in $Node) { Get-Scalars $item ($Depth + 1) } }
                elseif ($null -ne $Node) { [string]$Node }
              }
              try {
                & {
                  $item = Get-Item -LiteralPath (Join-Path $env:EVALUATE_WORKSPACE '.copilot-tracking/ds/synthetic-pipeline/session-state.md')
                  if ($item.Length -gt 1MB) { $codes.Add('oversized-input'); return }
                  $blocks = [regex]::Matches([System.IO.File]::ReadAllText($item.FullName), '(?ms)^[ \t]*```[ \t]*ya?ml[ \t]*\r?\n(.*?)^[ \t]*```[ \t]*\r?$')
                  if ($blocks.Count -ne 1) { $codes.Add('ambiguous-input'); return }
                  Import-Module powershell-yaml
                  try { $documents = @(ConvertFrom-Yaml -Yaml $blocks[0].Groups[1].Value -AllDocuments) } catch { $codes.Add('invalid-yaml'); return }
                  if ($documents.Count -ne 1) { $codes.Add('ambiguous-input'); return }
                  $state = $documents[0]
                  if ($state -isnot [System.Collections.IDictionary]) { $codes.Add('invalid-yaml'); return }
                  if (-not ($state.project.slug -is [string] -and $state.project.slug -ceq 'synthetic-pipeline' -and
                    $state.current.job -is [string] -and $state.current.job -ceq 'pipeline' -and
                    $state.current.class -is [string] -and $state.current.class -ceq 'episodic')) { $codes.Add('state-mismatch') }
                  if (-not ($state.synthetic_extension.preserve -is [bool] -and $state.synthetic_extension.preserve)) { $codes.Add('extension-mismatch') }
                  $pointers = @(Get-Scalars $state.artifacts) + @(Get-Scalars $state.jobs.pipeline)
                  foreach ($kind in 'plan', 'changes', 'review') {
