# cspell:ignore FEFF
stimuli:
  - name: code-review-accessibility-lens
    prompt: |
      As the accessibility code-review perspective, review this markup for
      conformance issues and cite the relevant success criteria.
      ```html
      <button><img src="trash.png"></button>
      <input type="text">
      ```
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: accessibility-finding-vocabulary
        config:
          pattern: '(?i)(accessibility|alt text|label|aria|WCAG|success criteria|contrast|finding|issue)'
      - type: output-matches
        name: code-review-accessibility-lens-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Loaded subagent contract: the parent's dispatch brief points at a staged
  # perspective batch, and the grader reads the structured findings file the
  # subagent is contracted to write rather than its reply.
  - name: code-review-accessibility-writes-batch-findings
    prompt: |
      Code Review parent dispatch: run the Accessibility perspective for the
      serialized perspective batch in
      `.copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json`.
      Write your structured JSON findings to
      `.copilot-tracking/reviews/code-reviews/feature-refund-helpers/accessibility-findings.json`
      and do not write a markdown report.
    agent_environment:
      files:
        - src: ../../.github/agents/coding-standards/subagents/code-review-accessibility.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/code-review-subagents/perspective-diff-state.json
          dest: .copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json
        - src: fixtures/code-review-subagents/feature-refund-helpers.diff
          dest: .copilot-tracking/pr/feature-refund-helpers.diff
      skills:
        - ../../.github/skills/coding-standards/code-review
        - ../../.github/skills/accessibility/accessibility
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: perspective-batch-findings
    graders:
      - type: program
        name: accessibility-findings-cite-seeded-barrier
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const relative = '.copilot-tracking/reviews/code-reviews/feature-refund-helpers/accessibility-findings.json';
                const text = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, relative), 'utf8');
                if (text.length > 262144) process.exit(1);
                const report = JSON.parse(text.replace(/^\uFEFF/, ''));
                const findings = report && Array.isArray(report.findings) ? report.findings : [];
                const describe = finding => [finding.title, finding.category, finding.problem, finding.skill].map(value => String(value ?? '')).join(' ');
                const onFile = finding => typeof finding.file === 'string' && finding.file.replace(/\\/g, '/').replace(/^\.\//, '').endsWith('web/refund-button.html');
                const matched = findings.some(finding => finding !== null && typeof finding === 'object' && onFile(finding) &&
                  /^(?:Critical|High|Medium|Low)$/.test(String(finding.severity)) &&
                  /keyboard|\balt\b|text alternative|alternative text|non-text content|\bfocus|\brole\b|1\.1\.1|2\.1\.1|4\.1\.2/i.test(describe(finding)));
                process.exit(matched ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: cr-accessibility-batch-workspace-bounded
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: cr-accessibility-batch-context
        config:
          required:
            - hve.context.composed
