stimuli:
  - name: brd-builder-class-recipe
    prompt: |
      Without editing files, briefly outline the business goals, scope, and
      success metrics for a self-service password reset BRD. State the paths
      where the BRD and its session state would be written.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: brd-builder-class-recipe-tracking-file-write
        config:
          pattern: '(?i)(docs[/\\]project-planning|\.copilot-tracking[/\\]brd-sessions)'
      - type: output-matches
        name: brd-builder-class-recipe-topic-coverage
        config:
          pattern: '(?i)(business|requirement|scope|success|password|reset)'
      - type: output-matches
        name: brd-builder-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true
  - name: brd-builder-ordinary-request-no-proposal-extension
    prompt: |
      Without editing files, briefly state which BRD sections you would refine
      for customer onboarding stakeholder roles and measurable business goals.
    tags:
      category: agent-behavior
      scenario: brd-proposal-negative
    graders:
      - type: output-matches
        name: ordinary-brd-work
        config:
          pattern: '(?i)(BRD|business goal|stakeholder|Discover|Define|Govern)'
      - type: output-matches
        name: brd-builder-ordinary-request-no-proposal-extension-283db964
        config:
          pattern: '(?i)(proposal-response|RESPONSE_EVIDENCE_V1|extensionsLoaded)'
          negate: true

  - name: brd-builder-rejects-invalid-proposal-continuation
    prompt: |
      Continue the business proposal-response contribution from
      `.copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml`.
      The current BRD session has no `proposalResponseArtifacts` field. Read
      and validate the supplied evidence artifact, report the skill result and
      the BRD extension state, and do not replace the invalid artifact.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
        - src: ../behavior-conformance/fixtures/proposal-response-atlas-rfp-invalid-evidence.txt
          dest: .copilot-tracking/proposal-responses/atlas-rfp/response-evidence.yml
      skills:
        - ../../.github/skills/project-planning/proposal-response
    tags:
      category: agent-behavior
      scenario: brd-proposal-rejected
    graders:
      - type: output-matches
        name: brd-builder-rejects-invalid-proposal-continuation-r-3f24ffd8
        config:
          pattern: '(?i)schema:\s*RESPONSE_EVIDENCE_ERROR_V1'
      - type: output-matches
        name: brd-builder-rejects-invalid-proposal-continuation-r-a0b8c5d8
        config:
          pattern: '(?is)validation_error:\s*unknown_schema.*clearing_action:'
      - type: output-matches
        name: brd-builder-rejects-invalid-proposal-continuation-r-31b6d88f
        config:
          pattern: '(?is)proposalResponseArtifacts.{0,100}(absent|not (?:created|added)|unchanged|\[\s*\])'
      - type: output-matches
        name: brd-builder-rejects-invalid-proposal-continuation-n-1cddfa96
        config:
          pattern: '(?i)next_operation'
          negate: true

  - name: brd-builder-research-receipt
    prompt: |
      Discover has a named regulatory gap that the BRD and supplied references
      do not answer. Research returned artifact
      `.copilot-tracking/research/2026-09-18/atlas-research.md` with Q1 and C1.
      Explain the state receipt, BRD disposition record, and authority boundary.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/project-planning/requirements-author
        - ../../.github/skills/rpi/rpi-research
    tags:
      category: agent-behavior
      scenario: brd-research-receipt
    graders:
      - type: output-matches
        name: brd-research-receipt-state
        config:
          pattern: '(?is)(?=.*rpiInvocations)(?=.*capability.{0,80}rpi-research)(?=.*artifactPaths.{0,160}research.{0,160}atlas-research\.md)(?=.*questionIds.{0,80}Q1)(?=.*evidenceIds.{0,80}C1)(?=.*findingDispositions).*'
      - type: output-matches
        name: brd-research-receipt-document
        config:
          pattern: '(?is)(Research Finding Dispositions).*(incorporated|revised|rejected|deferred|retained-assumption)'
      - type: output-matches
        name: brd-research-receipt-authority
        config:
          pattern: '(?is)(research artifact|Research).*(evidence|question).*(BRD).*(authoritative|authority|decision)'

  - name: brd-builder-research-blocked
    prompt: |
      Discover depends on a bounded market question, but Research returned
      `Blocked`. Can that result clear the Discover gate? Explain the durable
      state and the smallest work that stops.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/project-planning/requirements-author
        - ../../.github/skills/rpi/rpi-research
    tags:
      category: agent-behavior
      scenario: brd-research-blocked
    graders:
      - type: output-matches
        name: brd-research-blocked-no-gate
        config:
          pattern: '(?is)(Blocked|unresolved).*(cannot|does not|must not).*(Discover|gate|exit)'
      - type: output-matches
        name: brd-research-blocked-gap
        config:
          pattern: '(?is)(open question|unvalidated assumption).*(dependent|evidence-dependent|affected).*(stop|pause|blocked)'
      - type: output-matches
        name: brd-research-blocked-no-gate-exit
        config:
          pattern: '(?i)(discover|the gate)\s+(is|can be|may now be)\s+(complete|cleared|satisfied|exited)'
          negate: true

  - name: brd-builder-executes-research-segment
    prompt: |
      Resume the staged Atlas BRD in Discover. I approve Research segment
      `discover-01` with task slug `atlas-brd-discover-01` for gap `REG-01`.
      The persisted synthetic session date is `2026-09-21`; preserve it in paths.
      Use only the staged requirements evidence. Perform the segment now:
      write its primary artifact under the BRD session evidence root, then
      update state and the BRD disposition table. Do not merely explain it.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/rpi-depth/brd-state.json
          dest: .copilot-tracking/brd-sessions/atlas.state.json
        - src: fixtures/rpi-depth/atlas-brd.md
          dest: docs/project-planning/atlas-brd.md
        - src: fixtures/rpi-depth/requirements-evidence.md
          dest: evidence/requirements-evidence.md
      skills:
        - ../../.github/skills/project-planning/requirements-author
        - ../../.github/skills/rpi/rpi-research
    tags:
      category: agent-behavior
      scenario: brd-rpi-research-execution
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: file-exists
        name: brd-research-primary-artifact-exists
        config:
          path: .copilot-tracking/brd-sessions/atlas/research/2026-09-21/atlas-brd-discover-01-research.md
      - type: file-matches
        name: brd-research-primary-artifact-has-evidence
        config:
          path: .copilot-tracking/brd-sessions/atlas/research/2026-09-21/atlas-brd-discover-01-research.md
          pattern: '(?is)(REG-01|retention).*(Q1|Research Question).*(C1|seven-year)'
      - type: program
        name: brd-research-invocation-state-recorded
        config:
          program: pwsh
          args:
            - -NoProfile
            - -Command
            - |
              $ErrorActionPreference = 'Stop'
              $passed = $false
              $document = $null
              try {
                $path = Join-Path $env:EVALUATE_WORKSPACE '.copilot-tracking/brd-sessions/atlas.state.json'
                if ((Get-Item $path).Length -gt 1MB) { throw 'Oversized state' }
                $raw = Get-Content -Raw -LiteralPath $path
                $document = [System.Text.Json.JsonDocument]::Parse($raw)
                $pending = [System.Collections.Generic.Stack[System.Text.Json.JsonElement]]::new()
                $pending.Push($document.RootElement)
                while ($pending.Count) {
                  $element = $pending.Pop()
                  if ($element.ValueKind -eq 'Object') {
                    $keys = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
                    foreach ($property in $element.EnumerateObject()) {
                      if (-not $keys.Add($property.Name)) { throw 'Duplicate state field' }
                      $pending.Push($property.Value)
                    }
                  } elseif ($element.ValueKind -eq 'Array') {
                    foreach ($item in $element.EnumerateArray()) { $pending.Push($item) }
                  }
                }
                $state = $raw | ConvertFrom-Json -AsHashtable
                $receipts = @($state.rpiInvocations | Where-Object { $_.invocationId -ceq 'discover-01' })
                if (-not ($state.rpiInvocations -is [array]) -or $receipts.Count -ne 1) { throw 'Invalid invocation set' }
                $receipt = $receipts[0]
                $artifactRelativePath = '.copilot-tracking/brd-sessions/atlas/research/2026-09-21/atlas-brd-discover-01-research.md'
                $artifact = Get-Content -Raw -LiteralPath (Join-Path $env:EVALUATE_WORKSPACE $artifactRelativePath)
                $questionIds = @($receipt.questionIds)
                $evidenceIds = @($receipt.evidenceIds)
                $sourceQuestions = @([regex]::Matches($artifact, '(?<![A-Za-z0-9_-])Q[0-9]+(?![A-Za-z0-9_-])').Value | Sort-Object -Unique)
                $sourceEvidence = @([regex]::Matches($artifact, '(?<![A-Za-z0-9_-])[CW][0-9]+(?![A-Za-z0-9_-])').Value | Sort-Object -Unique)
                $validQuestions = $questionIds.Count -gt 0 -and
                  @($questionIds | Where-Object { -not ($_ -is [string]) -or -not [regex]::IsMatch([string]$_, '^Q[0-9]+$') }).Count -eq 0 -and
                  @($questionIds | Sort-Object -Unique).Count -eq $questionIds.Count -and
                  $questionIds.Count -eq $sourceQuestions.Count -and
                  @($questionIds | Where-Object { -not $sourceQuestions.Contains($_) }).Count -eq 0
                $validEvidence = $evidenceIds.Count -gt 0 -and
                  @($evidenceIds | Where-Object { -not ($_ -is [string]) -or -not [regex]::IsMatch([string]$_, '^[CW][0-9]+$') }).Count -eq 0 -and
                  @($evidenceIds | Sort-Object -Unique).Count -eq $evidenceIds.Count -and
                  $evidenceIds.Count -eq $sourceEvidence.Count -and
                  @($evidenceIds | Where-Object { -not $sourceEvidence.Contains($_) }).Count -eq 0
                if (-not ($receipt.findingDispositions -is [array]) -or $receipt.findingDispositions.Count -eq 0) {
                  throw 'Missing finding dispositions'
                }
                foreach ($finding in $receipt.findingDispositions) {
                  if (-not ($finding.evidenceIds -is [array]) -or $finding.evidenceIds.Count -eq 0 -or
                    @($finding.evidenceIds | Where-Object { -not $evidenceIds.Contains($_) }).Count -gt 0 -or
                    @($finding.evidenceIds | Sort-Object -Unique).Count -ne $finding.evidenceIds.Count -or
                    -not ($finding.affectedTargets -is [array]) -or $finding.affectedTargets.Count -eq 0 -or
                    @($finding.affectedTargets | Where-Object { -not ($_ -is [string]) -or [string]::IsNullOrWhiteSpace($_) }).Count -gt 0 -or
                    -not ($finding.rationale -is [string]) -or [string]::IsNullOrWhiteSpace($finding.rationale) -or
                    -not [regex]::IsMatch([string]$finding.disposition, '^(incorporated|revised|rejected|deferred|retained-assumption)$')) {
                    throw 'Invalid finding disposition'
                  }
                }
                $passed = $receipt.taskSlug -ceq 'atlas-brd-discover-01' -and
                  $receipt.questionIds -is [array] -and $validQuestions -and
                  $receipt.evidenceIds -is [array] -and $validEvidence -and
                  $receipt.artifactPaths.research -ceq $artifactRelativePath -and
                  $receipt.segmentStatus -ceq 'completed' -and $receipt.userDisposition -ceq 'pending' -and
                  $receipt.gateEffect -ceq 'does-not-satisfy' -and
                  $state.syntheticExtension.preserve -is [bool] -and $state.syntheticExtension.preserve
              } catch { $passed = $false } finally { if ($null -ne $document) { $document.Dispose() } }
              @{ name = 'brd-research-invocation-state-recorded'; kind = 'code'; passed = [bool]$passed; score = [int]$passed; evidence = 'Validate invocation values and preserved extension in unambiguous JSON.' } | ConvertTo-Json -Compress
      - type: file-matches
        name: brd-research-disposition-projected
        config:
          path: docs/project-planning/atlas-brd.md
          pattern: '(?im)^(?=[\s\S]*^#{1,6}\s+Research Finding Dispositions\s*$)[\s\S]*^\|(?=[^\r\n]*\bREG-01\b)(?=[^\r\n]*\bC1\b)(?=[^\r\n]*\|\s*(?:incorporated|revised|rejected|deferred|retained-assumption)\s*\|)(?=[^\r\n]*atlas-brd-discover-01-research\.md)[^\r\n]+\|'

  - name: brd-builder-records-blocked-research-segment
    prompt: |
      Resume the staged Atlas BRD in Discover. Research segment `discover-01`
      for `REG-01` returned `Blocked` before producing usable evidence, and I
      defer it. Update the durable invocation state and BRD open question now.
      The blocked segment must not satisfy or clear Discover.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/rpi-depth/brd-state.json
          dest: .copilot-tracking/brd-sessions/atlas.state.json
        - src: fixtures/rpi-depth/atlas-brd.md
          dest: docs/project-planning/atlas-brd.md
      skills:
        - ../../.github/skills/project-planning/requirements-author
    tags:
      category: agent-behavior
      scenario: brd-rpi-research-blocked-state
    graders:
      - type: file-matches
        name: brd-blocked-segment-has-binding-values
        config:
          path: .copilot-tracking/brd-sessions/atlas.state.json
          pattern: '(?is)rpiInvocations.*invocationId"?\s*:\s*"discover-01".*segmentStatus"?\s*:\s*"blocked".*userDisposition"?\s*:\s*"deferred".*gateEffect"?\s*:\s*"does-not-satisfy".*REG-01'
      - type: file-matches
        name: brd-blocked-gap-remains-open
        config:
          path: docs/project-planning/atlas-brd.md
          pattern: '(?is)REG-01.*(Open|Blocked|unvalidated)'
      - type: output-matches
        name: brd-blocked-segment-does-not-clear-gate
        config:
          pattern: '(?is)(blocked|does-not-satisfy).*(Discover).*(not|cannot|does not).*(clear|satisfy|exit)'

  - name: brd-builder-records-skipped-research-segment
    prompt: |
      Resume the staged Atlas BRD in Discover. A Research segment was proposed
      for `REG-01`, but the staged requirements evidence already answers it, so
      I skip Research as not required. Record invocation `discover-01` with the
      exact skipped disposition and continue on the direct builder path. Do not
      create a Research artifact. Preserve the synthetic session date
      `2026-09-21` in paths.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/rpi-depth/brd-state.json
          dest: .copilot-tracking/brd-sessions/atlas.state.json
        - src: fixtures/rpi-depth/atlas-brd.md
          dest: docs/project-planning/atlas-brd.md
        - src: fixtures/rpi-depth/requirements-evidence.md
          dest: evidence/requirements-evidence.md
      skills:
        - ../../.github/skills/project-planning/requirements-author
    tags:
      category: agent-behavior
      scenario: brd-rpi-research-skipped-state
    graders:
      - type: file-matches
        name: brd-skipped-segment-has-binding-values
        config:
          path: .copilot-tracking/brd-sessions/atlas.state.json
          pattern: '(?is)rpiInvocations.*invocationId"?\s*:\s*"discover-01".*segmentStatus"?\s*:\s*"skipped".*userDisposition"?\s*:\s*"not-required".*gateEffect"?\s*:\s*"not-applicable"'
      - type: file-not-exists
        name: brd-skipped-segment-creates-no-research-artifact
        config:
          path: .copilot-tracking/brd-sessions/atlas/research/2026-09-21/atlas-brd-discover-01-research.md

  - name: brd-builder-ordinary-session-keeps-rpi-state-absent
    prompt: |
      Resume the staged Atlas BRD in Discover. The supplied local evidence is
      adequate, no RPI segment has been proposed, and no external gap remains.
      Record that direct-path assessment in `nextActions` and preserve all
      other state. Do not initialize optional RPI invocation state.
    environment:
      files:
        - src: ../../.github/agents/project-planning/brd-builder.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/rpi-depth/brd-state.json
          dest: .copilot-tracking/brd-sessions/atlas.state.json
        - src: fixtures/rpi-depth/requirements-evidence.md
          dest: evidence/requirements-evidence.md
      skills:
        - ../../.github/skills/project-planning/requirements-author
    tags:
      category: agent-behavior
      scenario: brd-rpi-lazy-state-initialization
    graders:
      - type: file-matches
        name: brd-ordinary-session-records-direct-path
        config:
          path: .copilot-tracking/brd-sessions/atlas.state.json
          pattern: '(?is)nextActions.*(direct path|local evidence|adequate evidence)'
      - type: file-matches
        name: brd-ordinary-session-has-no-rpi-invocations
        config:
          path: .copilot-tracking/brd-sessions/atlas.state.json
          pattern: 'rpiInvocations'
          negate: true
