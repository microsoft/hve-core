stimuli:
  - name: hve-demo-material-class-recipe
    prompt: |
      Read `.github/agents/experimental/hve-demo-material.agent.md` and the
      staged hve-demo-material skill, including its curriculum. Using those
      contracts, plan the L100 demo deck and narrated video for HVE Core.
      List the phases from sourcing to the finished MP4, and state the
      narration engine and duration contract for a later narrated run.
      This task is planning only: do not build a deck, synthesize audio,
      launch a browser or service, install packages, edit source, or publish.
      Write only `.copilot-tracking/demo-material/synthetic-l100-plan.md`.
      Return the plan prose and its path, without claiming delivery occurred.
    rubric:
      - The returned plan coherently sequences source gathering, storyboard and content, deck build and validation, deck-export visuals, narration, MP4 assembly, and final duration validation. Future production steps are a plan, not completed work.
      - It specifies the L100 duration as 4 to 6 minutes and Azure AI Speech through tts-voiceover for the later narrated run. It remains planning-only and makes no unsupported delivery or execution claim.
      - All criteria are mandatory. Fail wrong duration or engine, missing or incoherent phases, prompt echoes, generic vocabulary without a usable plan, path-only answers, and claims that the staged policy is unavailable. Accept equivalent wording and formatting.
    agent_environment:
      files:
        - src: ../../.github/agents/experimental/hve-demo-material.agent.md
          dest: .github/agents/experimental/hve-demo-material.agent.md
        - src: ../../.github/instructions/shared/plain-language.instructions.md
          dest: .github/instructions/shared/plain-language.instructions.md
      skills:
        - ../../.github/skills/experimental/hve-demo-material
    tags:
      category: agent-behavior
    graders:
      - type: prompt
        name: hve-demo-material-class-recipe-content
        config:
          scoring: binary
          threshold: 0.85
      - type: file-exists
        name: hve-demo-material-class-recipe-plan-exists
        config:
          path: .copilot-tracking/demo-material/synthetic-l100-plan.md
      - type: output-matches
        name: hve-demo-material-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true
