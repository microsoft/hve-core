stimuli:
  - name: outlook-drafter-approved-html-create
    prompt: |
      The approved report path, validated recipient and subject configuration,
      and immutable confirmation of separate Outlook draft approval are
      supplied. The report contains a Markdown table, and draft creation
      succeeds with a review link. Describe the result without sending.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: created-with-link
        config:
          pattern: '(?is)Draft created.{0,240}https?://'
      - type: output-matches
        name: outlook-review-action
        config:
          pattern: '(?is)(review|inspect).{0,120}Outlook'

  - name: outlook-drafter-ambiguous-create-attempt
    prompt: |
      The approved report path, validated recipient and subject configuration,
      and immutable confirmation of separate Outlook draft approval are
      supplied. The create request returns a connectivity error after
      submission. Explain the result and next action without retrying or
      sending.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: ambiguous-outcome
        config:
          pattern: '(?is)(Draft status unknown|unknown).{0,120}(inspect|check).{0,80}Outlook'
      - type: output-matches
        name: no-retry-or-send
        config:
          pattern: '(?is)(do not|never|without).{0,80}(retry|send)'

  - name: outlook-drafter-table-conversion-failure
    prompt: |
      The approved report contains a Markdown table, but faithful HTML
      conversion cannot preserve it as a table. Separate Outlook draft approval
      and all other required inputs are supplied. Explain the result.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: conversion-skipped
        config:
          pattern: '(?is)Distribution skipped.{0,160}(HTML|table|conversion)'
      - type: output-matches
        name: no-create-fallback
        config:
          pattern: '(?is)(do not|never|without).{0,100}(create|flatten|plain.text)'
