stimuli:
  - name: hve-builder-review-return-only-suggestions
    prompt: |
      HVE Builder Reviewer returns severity-graded findings as suggestions and
      never edits the artifact it reviews. Which agent applies the corrections?
      Do not call tools. Return exactly `parent`.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: parent-owns-corrections
        config:
          pattern: '(?i)^\s*[''"`]?(?:the\s+)?(?:calling\s+|hve\s+builder\s+)?parent[''"`]?[.!]?\s*$'
