# cspell:ignore cand
stimuli:
  - name: meeting-analyst-class-recipe
    prompt: |
      Analyze this meeting transcript snippet: "We agreed to ship login by Friday, marketing will publish the blog Monday, and Sam will own analytics." Produce an action items document under `.copilot-tracking/` and report the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: meeting-analyst-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]'
      - type: output-matches
        name: meeting-analyst-class-recipe-topic-coverage
        config:
          pattern: '(?i)(action item|owner|due|decision|deadline)'
      - type: output-matches
        name: meeting-analyst-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Advisory candidate for meeting-analyst-class-recipe: WorkIQ is replaced by
  # a staged transcript export. The loaded handoff format, not the prompt,
  # requires an unconfirmed owner or due date when the meeting did not state
  # one, and the action items must land in the contracted analysis file.
  - name: meeting-analyst-class-recipe-candidate
    prompt: |
      WorkIQ is not available in this session. Analyze the exported meeting
      transcript at `transcripts/launch-sync-2026-09-18.md` instead. The data
      classification is Internal, the planning intent is create, and the
      participant roles in the transcript header are confirmed. Produce an
      action items document under `.copilot-tracking/` without waiting for
      further confirmation, and report the path.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/meeting-analyst.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/planning-intake/launch-sync-transcript.txt
          dest: transcripts/launch-sync-2026-09-18.md
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: meeting-action-items
    graders:
      - type: program
        name: meeting-action-items-unconfirmed-cand
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const folder = path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/prd-sessions');
                const names = fs.readdirSync(folder).filter(name => /^[a-z0-9-]+-transcript-analysis\.md$/.test(name));
                if (names.length !== 1) process.exit(1);
                const reply = String(input.trajectory.output || '').replace(/\\/g, '/');
                if (!reply.includes('.copilot-tracking/prd-sessions/' + names[0])) process.exit(1);
                const text = fs.readFileSync(path.join(folder, names[0]), 'utf8');
                if (text.length > 262144) process.exit(1);
                const cells = line => line.replace(/[*_`]/g, '').split('|').slice(1, -1).map(cell => cell.trim());
                const lines = text.split(/\r?\n/);
                const header = lines.findIndex(line => /^\s*\|/.test(line) && /\bOwner\b/i.test(line) && /\bDue\b/i.test(line));
                if (header < 0) process.exit(1);
                const columns = cells(lines[header]);
                const owner = columns.findIndex(cell => /\bOwner\b/i.test(cell));
                const due = columns.findIndex(cell => /\bDue\b/i.test(cell));
                const rows = [];
                for (let index = header + 1; index < lines.length && /^\s*\|/.test(lines[index]); index++) {
                  if (!/^\s*\|[\s:|-]+\|\s*$/.test(lines[index])) rows.push(cells(lines[index]));
                }
                const row = pattern => rows.find(values => pattern.test(values.join(' ')));
                const unconfirmed = value => /\bunconfirmed\b/i.test(value || '');
                const login = row(/\blog\s?-?in\b/i);
                const blog = row(/\bblog\b/i);
                const analytics = row(/\banalytics\b/i);
                const ok = login && blog && analytics &&
                  unconfirmed(login[owner]) && /\bFriday\b/i.test(login[due] || '') &&
                  /\b(?:marketing|Jordan)\b/i.test(blog[owner] || '') && !unconfirmed(blog[owner]) && /\bMonday\b/i.test(blog[due] || '') &&
                  /\b(?:Sam|data\s+engineer)\b/i.test(analytics[owner] || '') && !unconfirmed(analytics[owner]) && unconfirmed(analytics[due]);
                process.exit(ok ? 0 : 1);
              } catch { process.exit(1); }
      - type: output-matches
        name: meeting-shows-sensitivity-notice-cand
        config:
          pattern: '(?is)Data Sensitivity Notice[\s\S]{0,600}\bunencrypted\b'
      - type: tool-calls
        name: meeting-makes-no-workiq-call-cand
        config:
          disallowed:
            - name: '(?i)workiq'
            - name: '^(?:bash|shell|powershell|pwsh|run_in_terminal)$'
              command: '(?i)graph\.microsoft\.com|workiq'
      - type: system-event
        name: meeting-workspace-bounded-cand
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: meeting-context-cand
        config:
          required:
            - hve.context.composed
