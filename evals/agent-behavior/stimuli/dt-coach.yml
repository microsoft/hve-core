# cspell:ignore declin
stimuli:
  - name: dt-coach-class-recipe
    prompt: |
      Coach me through scoping a Design Thinking project (use the project slug `cafeteria-night-shift`) on "improving cafeteria experience for night-shift workers." Lay out the next 2-3 methods as phases. Write the coaching state under `.copilot-tracking/dt/` and tell me the path you wrote it to.
    agent_environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: dt-coach-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: dt-coach-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]dt[-/\\]'
      - type: output-matches
        name: dt-coach-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  - name: dt-coach-no-premature-deck-offer
    prompt: |
      Start a new Design Thinking project (use the project slug `clinic-intake-redesign`) on "reducing patient intake wait times." We have not run any methods yet. Set the project up and tell me what happens first.
    agent_environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: no-canonical-deck-offer
        config:
          pattern: '(?i)(canonical deck|customer[- ]card|generate (a |the )?deck|slide deck).{0,80}\?'
          negate: true
      - type: output-matches
        name: no-opt-in-language
        config:
          pattern: '(?i)(opt[- ]in|would you like|do you want|shall I).{0,60}(canonical deck|customer[- ]card)'
          negate: true

  - name: dt-coach-asset-ready-deck-offer
    prompt: |
      This is a response-only coaching simulation. Read the staged foundation
      skill's canonical-deck reference, but do not inspect or update real coaching
      state or generate artifacts. Use this preloaded synthetic state for
      `clinic-intake-redesign`: Method 3 is complete; no snapshot or deck offer
      has occurred; the following method outputs are available in the represented
      project. The persona describes an intake nurse who needs fewer repeated
      demographic questions. The journey map records repeated form entry at
      arrival and handoff. The validated point of view identifies repeated entry
      as the source of avoidable intake delay. These outputs map to persona and
      problem-statement canonical entries.
      What should we do next? Explain the readiness basis and optional next
      decision in chat, distinguishing a proposed snapshot from a completed one.
    agent_environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: readiness-gated-response
        config:
          pattern: '(?i)(canonical deck|customer[- ]card|snapshot|missing|not yet available|no .{0,30}artifacts)'
      - type: output-matches
        name: dt-coach-asset-ready-deck-offer-readiness-evidence-afea0142
        config:
          pattern: '(?i)(persona|journey map|point[- ]of[- ]view|method 3 output|artifacts? (we|you) have|what.{0,20}(exists|available)|based on)'

  - name: dt-coach-method-5-deck-offer
    prompt: |
      This is a response-only coaching simulation. Read the staged foundation
      skill's canonical-deck reference, but do not inspect or update real coaching
      state or generate artifacts. Use this preloaded synthetic state for
      `clinic-intake-redesign`: Method 5 is complete; no prior offer was declined;
      no snapshot has been generated. Selected concept: a pre-arrival intake form
      with optional desk assistance, represented as a use-case artifact. The
      three-lens evaluation records desirability from the team's interview
      synthesis, feasibility from an existing forms service, and viability from
      reducing duplicate entry without adding staff. These are simulated method
      outputs, not externally validated evidence.
      Where does that leave us? Explain the readiness basis and optional next
      decision in chat without claiming a snapshot or customer-card build ran.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: method-5-offer-or-gap
        config:
          pattern: '(?i)(canonical deck|customer[- ]card|snapshot|refresh|missing|not yet)'
      - type: output-matches
        name: dt-coach-method-5-deck-offer-readiness-evidence-pre-1f8e8a50
        config:
          pattern: '(?i)(concept|three[- ]lens|evaluation|method 5 output|artifacts? (we|you) have|based on)'

  - name: dt-coach-explicit-deck-request-anytime
    prompt: |
      We are in Method 2 for project slug `clinic-intake-redesign`, and I want the canonical deck snapshot now even if assets are thin. Please do it and tell me what information is missing.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: honors-explicit-request
        config:
          pattern: '(?i)(canonical deck|snapshot|customer[- ]card|requested)'
      - type: output-matches
        name: does-not-refuse-out-of-hand
        config:
          pattern: '(?i)(cannot|can''t|won''t|will not|refuse).{0,80}(method 3|method 5|not allowed)'
          negate: true
      - type: output-matches
        name: names-missing-evidence-when-thin
        config:
          pattern: '(?i)(missing|not yet|thin|need|questions to ask|insufficient)'

  - name: dt-coach-method-5-first-decline-no-reoffer
    prompt: |
      At the Method 5 exit for `clinic-intake-redesign`, the team already declined the customer-card offer at this same checkpoint. Should we ask again later in this run?
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: no-reoffer-after-method-5-decline
        config:
          pattern: '(?is)^(?!.*\b(?:will|i[\x27\u2019]ll|ill|can|could|might|plan to|intend to)\s+(?:re-?offer|offer|ask|raise|prompt|bring)\b[^.]{0,40}\b(?:again|later|next)\b).*(?:(?:no|not|never|avoid|refrain|n[\x27\u2019]t)[^.]{0,40}(?:re-?offer|ask again|offer again|raise (?:it|this) again|bring (?:it|this) up again|re-?prompt|further[^.]{0,25}(?:offer|prompt))|leave[^.]{0,30}alone|respect[^.]{0,30}declin)'
      - type: output-matches
        name: continue-transition-guidance
        config:
          pattern: '(?i)(continue|move|transition).{0,40}(method 6|implementation)'

  - name: dt-coach-not-ready-no-offer
    prompt: |
      This is a response-only coaching simulation. Read the staged foundation
      skill's canonical-deck reference, but do not inspect or update real coaching
      state or generate artifacts. Preloaded synthetic state for
      `clinic-intake-redesign`: the Method 3 session ended, but synthesis is
      incomplete. Only raw interview notes exist; no persona, journey map,
      problem statement or other canonical-ready method output is available.
      No snapshot was requested. What should we do next? Explain the missing
      evidence in chat without treating unavailable artifacts as verified ready.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: names-what-is-missing
        config:
          pattern: '(?i)(missing|not yet|nothing.{0,20}(complete|written)|raw|before .{0,30}(deck|snapshot|render)|need)'
      - type: output-matches
        name: no-ungated-generation-promise
        config:
          pattern: "(?i)(i'?ll (generate|build|create).{0,30}(deck|card)|generating the (deck|snapshot) now)"
          negate: true

  - name: dt-coach-lifecycle-continuity
    prompt: |
      Resume the staged project `synthetic-agent-lifecycle`. Preserve its
      observed, simulated, and conflicting evidence labels and its extension
      block. The team explicitly chooses the documented backward transition
      from Method 5 to Method 3 for re-synthesis. Record the transition in the
      coaching state and continue with one Method 3 coaching question.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
        - '../../.github/skills/design-thinking/dt-methods'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/dt-lifecycle/coaching-state.txt
          dest: .copilot-tracking/dt/synthetic-agent-lifecycle/coaching-state.md
    tags:
      category: agent-behavior
      lifecycle: continuity
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: output-matches
        name: backward-transition-and-coaching-question
        config:
          pattern: '(?is)(?=.*method\s*5)(?=.*method\s*3)(?=.*(?:backward|re-synthesis))(?=.*\?)'
      - type: file-matches
        name: coach-state-transitioned-to-method-three
        config:
          path: .copilot-tracking/dt/synthetic-agent-lifecycle/coaching-state.md
          pattern: '(?is)current:.*method:\s*3.*space:\s*[\"]?problem.*transition_log:.*from_method:\s*5.*to_method:\s*3'
      - type: file-matches
        name: coach-extension-and-labels-preserved
        config:
          path: .copilot-tracking/dt/synthetic-agent-lifecycle/coaching-state.md
          pattern: '(?is)synthetic_extension:.*board_intent:\s*[\"]?declined.*observed.*simulated.*conflicting.*preserve_on_update:\s*true'

  - name: dt-coach-denied-board-intent
    prompt: |
      Resume the staged project `synthetic-agent-lifecycle`. The durable state
      records that the team declined every Mural and Figma board destination.
      Respect that decision, make no destination call or board file, and
      continue the recorded Method 5 coaching conversation without changing
      state.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/dt-lifecycle/coaching-state.txt
          dest: .copilot-tracking/dt/synthetic-agent-lifecycle/coaching-state.md
    tags:
      category: agent-behavior
      lifecycle: denied-board
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: output-matches
        name: denied-board-decision-respected
        config:
          pattern: '(?i)(declin|respect|no board|without).{0,160}(Mural|Figma|board|destination)'
      - type: tool-calls
        name: no-destination-tool-call
        config:
          disallowed:
            - name: '(?i)(mural|figma)'
      - type: file-not-exists
        name: no-board-artifact
        config:
          path: .copilot-tracking/dt/synthetic-agent-lifecycle/board-export.json
      - type: diff-empty
        name: denied-board-workspace-unchanged

  - name: dt-coach-state-write-failure-recovery
    prompt: |
      Resume the staged project `synthetic-agent-lifecycle`. The team chooses a
      backward transition from Method 5 to Method 3. After reading the staged
      state, immediately attempt the normal state update with PowerShell
      `Set-Content` before loading any optional method references. Attempt the
      write exactly once, do not retry through another command or tool, and
      return a final response after observing the command result. Do not inspect
      file attributes or load method references before the attempt, and do not
      use an editor tool. If that configured write fails, report the failure,
      preserve the last durable Method 5 state and unrelated extension data,
      and explain that a later resume must start from that durable state.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
        - '../../.github/skills/design-thinking/dt-methods'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/dt-lifecycle/coaching-state.txt
          dest: .copilot-tracking/dt/synthetic-agent-lifecycle/coaching-state.md
    simulation:
      tool_overrides:
        powershell:
          patterns:
            - match: '(Set-Content|Out-File|WriteAllText|\btee\b|\bprintf\b|>>?\s*\S*coaching-state)'
              output: Synthetic DT Coach state write failure
              is_error: false
    tags:
      category: agent-behavior
      lifecycle: write-failure
    constraints:
      max_agent_duration: 180s
      max_duration: 240s
    graders:
      - type: tool-calls
        name: coach-state-writer-failure-observed
        config:
          required:
            - name: '^(bash|shell|powershell)$'
              command: '(?is)(Set-Content|Out-File|WriteAllText|\btee\b|\bprintf\b|>>?\s*\S*coaching-state)'
              result: '(?i)Synthetic DT Coach state write failure'
      - type: file-matches
        name: coach-failure-preserves-durable-state
        config:
          path: .copilot-tracking/dt/synthetic-agent-lifecycle/coaching-state.md
          pattern: '(?is)current:.*method:\s*5.*space:\s*[\"]?solution.*synthetic_extension:.*preserve_on_update:\s*true'
      - type: diff-empty
        name: coach-failed-write-workspace-unchanged

  - name: dt-coach-mural-scope-upgrade-stops-seeding
    prompt: |
      The team confirmed facilitator mode and approved seeding the synthetic
      Method 3 board. The local Mural readiness check for the intended write
      sequence returned `needs_scope_upgrade`. State what happens next. Do not
      run another Mural command or claim that the board changed.
    environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
        - '../../.github/skills/experimental/mural'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
      scenario: mural-needs-scope-upgrade
    graders:
      - type: output-matches
        name: dt-mural-scope-remediation
        config:
          pattern: '(?is)^(?=[\s\S]*(?:needs_scope_upgrade|missing\s+(?:write\s+)?scope|reauthorize))(?=[\s\S]*(?<!\b(?:not|never|no|without|don[\x27\u2019]t|won[\x27\u2019]t)\s)\b(?:pause|paused|stop|stopped|halt|hold|wait|waiting|blocked)\b)(?![\s\S]*(?<!\b(?:not|never|without|don[\x27\u2019]t|won[\x27\u2019]t)\s)\b(?:continue|proceed|publish|seed)\s+(?:now|immediately)\b)'
      - type: program
        name: dt-mural-scope-no-call
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                if (!Array.isArray(input.trajectory.events)) process.exit(1);
                const forbidden = input.trajectory.events.some(event => {
                  if (event.type !== 'tool_call') return false;
                  const name = event.data?.toolName || '';
                  if (/mural/i.test(name)) return true;
                  const command = event.data?.arguments?.command || event.data?.arguments?.code || '';
                  const simpleRead = /^(?:Get-Content|cat|type)\s+[^;&|`$()\r\n]+$/i.test(command);
                  return /(?:shell|terminal|exec|python|node|bash)/i.test(name) && /\bmural\b/i.test(command) && !simpleRead;
                });
                process.exit(forbidden ? 1 : 0);
              } catch { process.exit(1); }
      - type: output-matches
        name: dt-mural-scope-no-false-change
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\bsuccessfully\b|\bI (?:just )?(?:seeded|created|updated)\b|\bboard (?:was|is)\s+(?!not\b)(?:seeded|updated)\b'
          negate: true

  - name: dt-coach-mural-declined-write-keeps-coaching
    prompt: |
      The synthetic Method 5 concept cards are ready, but the team declined the
      proposed Mural write after seeing the target and payload preview. Respect
      that decision and explain the next coaching action without changing a
      board or reporting publication success.
    agent_environment:
      skills:
        - '../../.github/skills/design-thinking/dt-coaching-foundation'
        - '../../.github/skills/experimental/mural'
      files:
        - src: ../../.github/agents/design-thinking/dt-coach.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
      scenario: mural-write-declined
    graders:
      - type: output-matches
        name: dt-mural-decline-respected
        config:
          pattern: '(?i)(declin|no board change|without.{0,30}Mural|continue.{0,60}coaching)'
      - type: tool-calls
        name: dt-mural-decline-no-call
        config:
          disallowed:
            - name: '(?i)mural'
      - type: output-matches
        name: dt-mural-decline-no-false-publish
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\bsuccessfully\b|\bI (?:just )?(?:published|seeded|updated)\b|\bboard (?:was|is)\s+(?!not\b)updated\b'
          negate: true
