# cspell:ignore cand
#
# Conformance checks emitted per the vally-tests agent reference.
# Applicable to this top-level agent: Check 1 (required frontmatter),
# Check 6 (handoff pattern), Check 7 (tool restrictions), Check 9 (phase and
# step heading consistency). Checks 4 and 5 are subagent-only and do not apply.
stimuli:
  - name: backlog-manager-frontmatter-name-and-description
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

      Report the human-readable agent name declared in its frontmatter, then restate its declared description verbatim. Do not paraphrase the description and do not describe the file itself.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/backlog-manager.agent.md
          dest: .github/agents/project-planning/backlog-manager.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: backlog-manager-frontmatter-name-and-description-re-0abf8590
        config:
          pattern: '(?i)\bBacklog Manager\b'
      - type: output-matches
        name: backlog-manager-frontmatter-name-and-description-re-b84f6c83
        config:
          pattern: '(?i)Read-only\s+backlog\s+orchestrator\s+for\s+Azure\s+DevOps,\s+GitHub,\s+and\s+Jira\.\s+Classifies,\s+plans,\s+and\s+grooms\s+requests,\s+and\s+dispatches\s+every\s+mutation\s+to\s+a\s+per-platform\s+executor\.'
      - type: output-matches
        name: backlog-manager-frontmatter-name-and-description-do-951e3479
        config:
          pattern: '(?i)name\s*(is|:)\s*.{0,3}backlog-manager'
          negate: true

  - name: backlog-manager-handoff-targets-and-labels
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

      List every agent it can hand off to and the label each handoff entry carries. Identify each target agent the way the artifact identifies it.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/backlog-manager.agent.md
          dest: .github/agents/project-planning/backlog-manager.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: names-cross-agent-handoff-target
        config:
          pattern: '(?i)\bFunctional Planner\b'
      - type: output-matches
        name: reports-declared-labels
        config:
          pattern: '(?is)^(?=[\s\S]*\bDiscover\b)(?=[\s\S]*\bTriage\b)(?=[\s\S]*\bSprint\b)(?=[\s\S]*\bMy Work\b)(?=[\s\S]*\bTask Plan\b)(?=[\s\S]*\bResume\b)(?=[\s\S]*\bAdd Item\b)(?=[\s\S]*\bExecute\b)(?=[\s\S]*\bPRD to Hierarchy\b)(?=[\s\S]*\bBacklog Manager\b)(?=[\s\S]*\bFunctional Planner\b)'
      - type: output-matches
        name: identifies-targets-by-name-not-path
        config:
          pattern: '(?i)agent\s*:\s*.{0,3}[\w/-]*\.agent\.md'
          negate: true

  - name: backlog-manager-tool-restriction-fit
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

      Read its declared `tools:` list together with its declared description. Assess whether that restriction set is appropriate for the role the description states, and name any tool whose presence or absence you consider inconsistent with that role. Justify the assessment from the artifact rather than from general expectations.
      Distinguish the declared capability grants from what can actually be
      concluded about host enforcement. Address direct tracker operations,
      local artifact writes, and delegated mutations separately.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/backlog-manager.agent.md
          dest: .github/agents/project-planning/backlog-manager.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    rubric:
      - >
        Assess the artifact's declared tools against its stated read-only tracker
        orchestration and dispatch-every-mutation role. Ground claims in the
        supplied declarations, do not invent tools, and do not claim that a tool
        grant enforces a boundary the host does not enforce.
    graders:
      - type: prompt
        name: backlog-manager-tool-restriction-fit-tool-restricti-94768515
        config:
          prompt: |
            The response assesses whether an agent's declared tool set fits its
            stated purpose. Score high when the response reasons from the
            artifact's own declared tools and description, recognizes that the
            declared tracker surface is read-only, and connects that to the
            description's dispatch-every-mutation role. Score low when the
            response invents tools, ignores the declared description, or asserts
            that a tool grant enforces a boundary the host does not enforce.
          threshold: 0.6
      - type: output-matches
        name: backlog-manager-tool-restriction-fit-does-not-claim-1a3d8722
        config:
          pattern: '(?i)(this (test|check|eval) (proves|demonstrates|verifies))'
          negate: true

  - name: backlog-manager-protocol-heading-consistency
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

      List the headings that carry its workflow protocol, in order and exactly as written in the artifact.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/backlog-manager.agent.md
          dest: .github/agents/project-planning/backlog-manager.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: reports-first-protocol-heading
        config:
          pattern: '(?i)Phase\s+1:\s*Platform and Intent Classification'
      - type: output-matches
        name: reports-last-protocol-heading
        config:
          pattern: '(?i)Phase\s+3:\s*Summary and Handoff'
      - type: output-matches
        name: does-not-report-step-headings
        config:
          pattern: '(?i)Step\s+\d+:\s*(Platform and Intent|Workflow Dispatch|Summary and Handoff)'
          negate: true

  - name: backlog-manager-performs-workflow-neutral-github-grooming
    prompt: |
      Classify this request as GitHub Grooming, then assess the supplied ordinary
      issue inventory directly through the reusable grooming policy. Do not
      invoke a workflow-bound worker, require automation inputs, or execute a
      GitHub mutation.

      Inventory scope: open issues selected by a maintainer for this review.

      Issue #2558 requests a workflow-neutral grooming policy. Repository
      evidence shows that
      `.github/instructions/project-planning/github-backlog-grooming.instructions.md`
      defines evidence-backed advisory assessment and that Backlog Manager
      applies it directly. Treat the issue as Distinct and Likely completed.

      Issue #2601 requests automatic closure of inactive issues. Repository
      evidence contains no implementation and the grooming policy keeps closure
      advisory and maintainer-owned. Treat the issue as Distinct and Still
      needed.

      Produce the compact issue index with this exact header:

      | Issue | Similarity | Disposition | Status | Recommended next step |

      Follow it with `Issue #2558` and `Issue #2601` headings in that order.
      Under each heading, include the exact labels `Repository evidence`,
      `Similarity outcome`, `Disposition`, `Grooming finding`, `Recommended
      next step`, and `Assessment status`.

      Explain the handoff using these exact sentences: "Allowed operations are
      Update and Comment; Close is prohibited." and "Writeback requires
      per-field approval and a fresh Expected Updated At value; stale approval
      must stop execution." Do not claim that any issue was changed.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: grooming-classification
        config:
          pattern: '(?i)\bGitHub Grooming\b|\bGrooming\b'
      - type: output-matches
        name: backlog-manager-performs-workflow-neutral-github-gr-3ee1f21a
        config:
          pattern: '(?i)\|\s*Issue\s*\|\s*Similarity\s*\|\s*Disposition\s*\|\s*Status\s*\|\s*Recommended next step\s*\|'
      - type: output-matches
        name: backlog-manager-performs-workflow-neutral-github-gr-9ddd19b7
        config:
          pattern: '(?is)Issue #?2558.{0,800}Repository evidence.{0,800}Issue #?2601'
      - type: output-matches
        name: non-closing-handoff
        config:
          pattern: '(?is)(Update|Comment).{0,200}(Close.{0,80}(never|not|prohibit|exclude)|(never|not|prohibit|exclude).{0,80}Close)'
      - type: output-matches
        name: approval-freshness
        config:
          pattern: '(?i)per-field approval|Expected Updated At|updated_at|fresh|stale approval'
      - type: output-matches
        name: no-github-mutation
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\b(?:updated|closed|commented on)\s+(?:github\s+)?issue\s*#?\d+'
          negate: true
      - type: output-matches
        name: no-aw-contract-dependency
        config:
          pattern: '(?i)shard[_ -]?id|manifest[_ -]?digest|ordered_candidate_ids|safe[- ]output|publish-backlog-grooming-result'
          negate: true

  # Advisory candidate for backlog-manager-performs-workflow-neutral-github-grooming:
  # the manager and its imported grooming policy are loaded and the selected
  # inventory moves into a staged file without the classification, the
  # similarity and disposition answers, or the handoff sentences. The loaded
  # contract must route to GitHub Grooming, derive each disposition, and
  # describe a non-closing, freshness-checked handoff without any tracker call.
  - name: backlog-manager-performs-workflow-neutral-github-grooming-candidate
    prompt: |
      Review the backlog health of the open issues a maintainer selected in
      `review/selected-issues.md`, using the repository evidence recorded
      there. Then explain what a writeback handoff for your findings would be
      allowed to contain and what it would need before execution; do not
      prepare or run one. Do not execute any GitHub mutation.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/backlog-manager.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/planning-intake/maintainer-selected-issues.txt
          dest: review/selected-issues.md
      skills:
        - ../../.github/skills/project-planning/backlog-management
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: backlog-manager-workflow-neutral-grooming
    graders:
      - type: output-matches
        name: manager-classifies-grooming-cand
        config:
          pattern: '(?i)\bGitHub\s+Grooming\b|\b(?:classif\w*|intent|workflow|request)\b[^.\n]{0,40}\bGrooming\b|\bGrooming\b[^.\n]{0,20}\b(?:workflow|intent|classification)\b'
      - type: program
        name: manager-grooming-report-cand
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const lines = String(input.trajectory.output || '').replace(/[`*]/g, '').split(/\r?\n/);
                const cells = line => line.split('|').slice(1, -1).map(cell => cell.trim());
                const header = lines.findIndex(line => /^\s*\|/.test(line) &&
                  cells(line).join('|').toLowerCase() === 'issue|similarity|disposition|status|recommended next step');
                if (header < 0) process.exit(1);
                const rows = [];
                for (let index = header + 1; index < lines.length && /^\s*\|/.test(lines[index]); index++) {
                  if (!/^\s*\|[\s:|-]+\|\s*$/.test(lines[index])) rows.push(cells(lines[index]));
                }
                const row = id => rows.find(values => (/\d+/.exec(values[0] || '') || [])[0] === id);
                const completed = row('2558');
                const open = row('2601');
                const indexed = rows.length === 2 && completed && open && /^Likely completed\b/i.test(completed[2] || '') &&
                  /^(?:Still needed|Uncertain|Needs correction)\b/i.test(open[2] || '');
                let previous = -1;
                const detailed = ['2558', '2601'].every(id => {
                  const start = lines.findIndex(line => new RegExp('^#{2,6}\\s*Issue\\s*#?' + id + '\\b', 'i').test(line));
                  if (start <= previous) return false;
                  previous = start;
                  const next = lines.findIndex((line, index) => index > start && /^#{1,6}\s/.test(line));
                  const section = lines.slice(start + 1, next < 0 ? lines.length : next).join('\n');
                  return /\bRepository evidence\s*:/i.test(section) && /\bAssessment status\s*:/i.test(section);
                });
                process.exit(indexed && detailed ? 0 : 1);
              } catch { process.exit(1); }
      - type: output-matches
        name: manager-handoff-excludes-close-cand
        config:
          pattern: '(?is)^(?=[\s\S]*\b(?:Update|Comment)\b)(?=[\s\S]*(?:\bClose\b[^.\n]{0,80}\b(?:never|not|prohibit\w*|(?:exclude|excludes|excluded|excluding)|disallow\w*|forbid\w*)\b|\b(?:never|not|no|prohibit\w*|(?:exclude|excludes|excluded|excluding)|disallow\w*|forbid\w*)\b[^.\n]{0,80}\bClose\b|\bclos(?:e|ing|ure)\b[^.\n]{0,40}\b(?:never|not)\s+(?:allowed|permitted|included)\b))(?![\s\S]*\b(?:allowed|permitted)\s+operations?\b[^.;\n]{0,40}(?<!\b(?:not|never|no)\s)\bClose\b)'
      - type: output-matches
        name: manager-handoff-freshness-cand
        config:
          pattern: '(?i)\bExpected Updated At\b|\bupdated_at\b|\bper-field approval\b|\bfresh(?:ness)?\b[^.\n]{0,60}\b(?:approval|value|check|timestamp)\b|\bstale\b[^.\n]{0,60}\bapproval\b'
      - type: output-matches
        name: manager-no-mutation-claim-cand
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s)\b(?:updated|closed|commented on)\s+(?:github\s+)?issue\s*#?\d+'
          negate: true
      - type: output-matches
        name: manager-no-aw-contract-cand
        config:
          pattern: '(?i)(?<!(?:\b(?:not|no|never|without)|n[\x27\u2019]t)\s+(?:[\w-]+\s+){0,6})\b(?:shard[_ -]?id|manifest[_ -]?digest|ordered_candidate_ids|safe[- ]output|publish-backlog-grooming-result)\b'
          negate: true
      - type: tool-calls
        name: manager-makes-no-tracker-call-cand
        config:
          disallowed:
            - name: '(?i)issue_write|add_issue_comment|sub_issue_write|wit_create|wit_update|wit_add|work_items_link'
            - name: '^(?:bash|shell|powershell|pwsh|run_in_terminal)$'
              command: '(?i)\bgh\s+(?:issue|pr|api|label|project)\b|api\.github\.com|\baz\s+boards\b|\bjira(?:\.py)?\b|atlassian\.(?:net|com)'
      - type: system-event
        name: manager-grooming-workspace-bounded-cand
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: manager-grooming-context-cand
        config:
          required:
            - hve.context.composed
