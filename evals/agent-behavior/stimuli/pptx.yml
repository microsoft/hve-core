stimuli:
  - name: pptx-class-recipe
    prompt: |
      Plan a 5-slide PowerPoint deck about "Q1 engineering velocity highlights." List the three phases of the deck build. Write the plan under `.copilot-tracking/ppt/` and report the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: pptx-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: pptx-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\](ppt|plans)'
      - type: output-matches
        name: pptx-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true
