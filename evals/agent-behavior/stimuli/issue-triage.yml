stimuli:
  - name: issue-triage-class-recipe
    prompt: |
      This is a prompt-visible smoke scenario, not a native tracker operation.
      Triage this synthetic issue: "App is super slow on iPhone." Suggest labels,
      priority and an assignee role, and identify information still needed.
      Return the triage decision in chat with an intended record path under
      `.copilot-tracking/github-issues/`. Do not invent a real person's identity,
      write files, mutate GitHub or claim that an issue was assigned.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: field-vocab-present
        config:
          pattern: '(?i)(title|description|acceptance criteria|priority|label|story|epic)'
      - type: output-matches
        name: issue-triage-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]'
      - type: output-matches
        name: issue-triage-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true
