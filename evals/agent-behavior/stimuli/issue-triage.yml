stimuli:
  - name: issue-triage-class-recipe
    prompt: |
      This is a prompt-visible smoke scenario, not a native tracker operation.
      Triage this synthetic issue: "App is super slow on iPhone." Suggest labels,
      priority and an assignee role, and identify information still needed.
      Return the triage decision in chat with an intended record path under
      `.copilot-tracking/github-issues/`. Do not invent a real person's identity,
      write files, mutate GitHub or claim that an issue was assigned.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: field-vocab-present
        config:
          pattern: '(?i)(title|description|acceptance criteria|priority|label|story|epic)'
      - type: output-matches
        name: issue-triage-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]'
      - type: output-matches
        name: issue-triage-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true
  - name: issue-triage-code-scanning-alert
    prompt: |
      This is a prompt-visible smoke scenario, not a native tracker operation.
      Read `policy/issue-triage.agent.md` for the triage rules and label
      taxonomy, then triage this synthetic human-filed issue:

      Title: CodeQL reports js/path-injection in scripts/tools/render.js
      Body: GitHub Code Scanning shows an open CodeQL alert for rule
      js/path-injection in scripts/tools/render.js. Please label and route the
      issue so maintainers follow the repository alert lifecycle.

      Return the triage decision in chat. Do not mutate GitHub, write files, or
      claim that labels or comments were applied.
    agent_environment:
      files:
        - src: ../../.github/agents/issue-triage.agent.md
          dest: policy/issue-triage.agent.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: code-scanning-labels
        config:
          pattern: '(?is)\bsecurity\b.{0,300}\bcode-scanning\b|\bcode-scanning\b.{0,300}\bsecurity\b'
      - type: output-matches
        name: lifecycle-page-linked
        config:
          pattern: 'https://github\.com/microsoft/hve-core/blob/main/docs/security/code-scanning-alert-lifecycle\.md'
      - type: output-matches
        name: no-dismissal-recommended
        config:
          pattern: '(?i)(?<!\b(?:do not|don\x27t|never|must not|cannot|should not)\s)(?:recommend|suggest|advise|propose).{0,80}\bdismiss'
          negate: true
  - name: issue-triage-dismissal-request
    prompt: |
      This is a prompt-visible smoke scenario, not a native tracker operation.
      Read `policy/issue-triage.agent.md` for the triage rules and label
      taxonomy, then triage this synthetic human-filed issue:

      Title: Dismiss CodeQL false positive for generated parser
      Body: Please ask maintainers to dismiss the open CodeQL alert for
      js/unsafe-deserialization as a false positive. We do not want to change
      code or create a tracked exception.

      Return the triage decision in chat. Do not mutate GitHub, write files, or
      claim that labels or comments were applied.
    agent_environment:
      files:
        - src: ../../.github/agents/issue-triage.agent.md
          dest: policy/issue-triage.agent.md
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: dismissal-flagged-contrary-policy
        config:
          pattern: '(?is)(dismiss|dismissal).{0,200}(contrary to|against|violates|not allowed|not permitted).{0,200}polic'
      - type: output-matches
        name: dismissal-lifecycle-page-linked
        config:
          pattern: 'https://github\.com/microsoft/hve-core/blob/main/docs/security/code-scanning-alert-lifecycle\.md'
      - type: output-matches
        name: dismissal-not-recommended
        config:
          pattern: '(?i)(?<!\b(?:do not|don\x27t|never|must not|cannot|should not)\s)(?:recommend|suggest|advise|propose).{0,80}\bdismiss'
          negate: true
