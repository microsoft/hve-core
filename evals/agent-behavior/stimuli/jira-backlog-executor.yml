#
# Conformance checks emitted per the vally-tests agent reference.
# Applicable to this subagent: Check 1 (required frontmatter), Check 4
# (user-invocable flag), Check 5 (subagent structural template), Check 7 (tool
# restrictions). Check 6 does not apply: this subagent declares no handoffs.
# Check 9 does not apply: it carries no phase or step headings, and the artifact
# is not edited to make an inapplicable check pass.
stimuli:
  - name: jira-backlog-executor-frontmatter-name-and-description
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/subagents/jira-backlog-executor.agent.md`.

      Report the human-readable agent name declared in its frontmatter, then restate its declared description verbatim. Do not paraphrase the description and do not describe the file itself.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/subagents/jira-backlog-executor.agent.md
          dest: .github/agents/project-planning/subagents/jira-backlog-executor.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: jira-backlog-executor-frontmatter-name-and-descript-39c4e919
        config:
          pattern: '(?i)\bJira Backlog Executor\b'
      - type: output-matches
        name: jira-backlog-executor-frontmatter-name-and-descript-d1a8f441
        config:
          pattern: '(?i)Runs the Jira skill CLI in one confirmed project'
      - type: output-matches
        name: jira-backlog-executor-frontmatter-name-and-descript-e1b92f51
        config:
          pattern: '(?i)(?<!file\s?)\bname\s*(?:is|:)\s*.{0,3}jira-backlog-executor\b(?!\.agent\.md)'
          negate: true

  - name: jira-backlog-executor-user-invocable-flag
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/subagents/jira-backlog-executor.agent.md`.

      Report the value its frontmatter declares for `user-invocable`, and explain how a user reaches this artifact given that value.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/subagents/jira-backlog-executor.agent.md
          dest: .github/agents/project-planning/subagents/jira-backlog-executor.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: jira-backlog-executor-user-invocable-flag-reports-d-faabdd22
        config:
          pattern: '(?im)(?<![\s\S])(?![\s\S]*(?:\b(?:not|never|no|omits?|omitted|lacks?)\b|\b\w+n[\x27\u2019]t\b)[\s`*_~]+(?:(?!(?:true|because|since|as|so|given|hence|thus)\b)\w+[\s`*_~]+){0,2}(?:user-invocable[\s`*_~]*:[\s`*_~]*)?\bfalse\b)[\s\S]*?(?:^|[.!?](?=\s|$))(?=(?:[^.!?\n]|[.!?](?=\S))*(?:\buser-invocable\b(?:[^.!?\n]|[.!?](?=\S)){0,40}\bfalse\b|\bfalse\b(?:[^.!?\n]|[.!?](?=\S)){0,60}\buser-invocable\b))(?!(?:[^.!?\n]|[.!?](?=\S))*\bfalse\b[\s`*_~]*(?:is|are)\s+(?:absent|not\s+(?:set|declared|present))\b)(?:[^.!?\n]|[.!?](?=\S))*'
      - type: output-matches
        name: jira-backlog-executor-user-invocable-flag-reaches-t-3a1c6be6
        config:
          pattern: '(?i)(dispatch|Backlog Manager|parent agent|orchestrator)'
      - type: output-matches
        name: jira-backlog-executor-user-invocable-flag-not-descr-e4fadcaa
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never)|n[\x27\u2019]t)\s+(?:\w+\s+){0,2})(?:appears in|select(?:able)? from|choose it in) the (?:agent )?picker'
          negate: true

  - name: jira-backlog-executor-structural-template
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/subagents/jira-backlog-executor.agent.md`.

      List every level-one and level-two section heading in order, exactly as written, and state whether its first heading matches the name declared in its frontmatter.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/subagents/jira-backlog-executor.agent.md
          dest: .github/agents/project-planning/subagents/jira-backlog-executor.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: jira-backlog-executor-structural-template-reports-p-46d00f78
        config:
          pattern: '\bPurpose\b'
      - type: output-matches
        name: jira-backlog-executor-structural-template-reports-i-d241804d
        config:
          pattern: '\bInputs\b'
      - type: output-matches
        name: jira-backlog-executor-structural-template-reports-r-985aa9ef
        config:
          pattern: '(?i)Required\s+Steps'
      - type: output-matches
        name: jira-backlog-executor-structural-template-reports-r-6df1887d
        config:
          pattern: '(?i)Response\s+Format'
      - type: output-matches
        name: jira-backlog-executor-structural-template-confirms-2cdab238
        config:
          pattern: '(?i)(match(es|ing)?|same as|identical)'

  - name: jira-backlog-executor-tool-restriction-fit
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/subagents/jira-backlog-executor.agent.md`.

      Read its declared `tools:` list together with its declared description and the boundary its body states for that grant. Assess whether the restriction set is appropriate for the role the description states, and state which part of the boundary the tool list enforces and which part it does not. Justify the assessment from the artifact rather than from general expectations.
      Distinguish what the declared grant makes possible from what the host enforces.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/subagents/jira-backlog-executor.agent.md
          dest: .github/agents/project-planning/subagents/jira-backlog-executor.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    rubric:
      - Grounds the tool-fit assessment in the artifact's declared tools, description, and stated boundary without inventing tools.
      - Identifies the grant as a general terminal rather than a Jira-specific tool family and relates it to the declared Jira execution role.
      - Explains that prose narrows usage to the Jira CLI invocation shape while the host and tool list do not enforce that narrowing.
    graders:
      - type: prompt
        name: jira-backlog-executor-tool-restriction-fit-tool-res-2ae1d4c5
        config:
          prompt: |
            The response assesses whether a subagent's declared tool set fits its
            stated purpose. Score high when it reasons from the artifact's own
            declared tools, description, and stated boundary; observes that the
            grant is a general terminal rather than a Jira-specific tool family;
            and reports that the artifact narrows it to the Jira CLI invocation
            shape in prose while the host does not enforce that narrowing. Score
            low when it invents tools, ignores the declared description, or
            asserts that the tool list itself confines the agent to the Jira CLI.
          threshold: 0.6
      - type: output-matches
        name: does-not-claim-host-enforces-cli-only
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|nor|neither)|n[\x27\u2019]t)\s+(?:\w+\s+){0,3})\bthe (?:tool (?:list|grant)|host|frontmatter) (?:enforces|prevents|blocks|guarantees).{0,60}(?:only the Jira CLI|CLI[- ]only)'
          negate: true
