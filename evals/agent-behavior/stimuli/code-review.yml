# cspell:ignore merg ambig deprioriti exclud
stimuli:
  - name: code-review-class-recipe
    prompt: |
      Begin an interactive review of this diff. Return a factual orientation and a short dispatch board, then ask me to confirm the review scope before deeper analysis. Do not modify source code.
      ```diff
      -def get_user(user_id):
      -    return db.query(f"SELECT * FROM users WHERE id = {user_id}")
      +def get_user(user_id):
      +    return db.query("SELECT * FROM users WHERE id = ?", user_id)
      ```
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: orientation-and-board
        config:
          pattern: '(?is)(orientation|walkthrough).{0,4000}(dispatch\s+board|recommended dispatch)|(dispatch\s+board|recommended dispatch).{0,4000}(orientation|walkthrough)'
      - type: output-matches
        name: human-confirmation
        config:
          pattern: '(?is)(confirm|adjust|edit).{0,100}(scope|orientation|walkthrough|dispatch\s+board|board|perspective|depth)|(scope|orientation|walkthrough|dispatch\s+board|board|perspective|depth).{0,100}(confirm|adjust|edit)'
      - type: output-matches
        name: change-risk-evidence
        config:
          pattern: '(?is)(?=.*(?:change[- ]risk|evidence\s+checklist))(?=.*(?:observed|unavailable|qualitative|change[- ]scope|path[- ]criticality|history|test[- ]presence|coverage|rollback))(?=.*recommended\s+depth)(?=.*(?:confirm|adjust|correct|select)).+'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
      - type: output-matches
        name: no-unsolicited-plan-drift
        config:
          pattern: '(?i)(securityPlanContext|security_plan_drift|security plan drift)'
          negate: true

  # Skill merge behavior tests. These stimuli assert the coding-
  # standards merge contract through the parent Code Review matrix slug.
  - name: code-review-standards-merge-happy-no-conflict
    prompt: |
      As the standards code-review perspective, evaluate this merge-policy
      scenario. Treat the inline skill summaries below as the discovered
      candidate set; do not inspect or rely on real workspace skill files.

      Two distinct skills are available for this Python change:

      Skill A (hve-core baseline) has name python-foundational and requires
      public functions to declare type hints.
      Skill B (repository, .github/skills/) has name python-enterprise and
      requires every request handler to include a correlation_id in its log
      calls.

      Review this diff. The two skills do not overlap or contradict. For every
      finding, cite the exact skill name that surfaced it. Apply both skills.

      ```python
      def handle_request(payload):
          log.info("processing")
          return payload
      ```

    tags:
      category: agent-behavior
      advisory: "true"
      scenario: merge-no-conflict
    graders:
      - type: output-matches
        name: both-distinct-skills-cited
        config:
          pattern: '(?is)(python-foundational.*python-enterprise|python-enterprise.*python-foundational)'
      - type: output-matches
        name: findings-trace-to-skill
        config:
          pattern: '(?i)(skill|python-foundational|python-enterprise)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
  - name: code-review-standards-merge-name-collision
    prompt: |
      As the standards code-review perspective, evaluate this merge-policy
      scenario. Treat the inline skill summaries below as the discovered
      candidate set; do not inspect or rely on real workspace skill files.

      Two skills share the same name "python-foundational":

      Version 1 (hve-core baseline, packaged under skills/) requires
      Google-style docstrings.
      Version 2 (repository, .github/skills/) requires NumPy-style docstrings.

      Their checks differ but do not otherwise contradict. State which single
      version you load and why, then review the diff accordingly. Do not load or
      apply both copies of the same-named skill. The active repository check is
      the NumPy-style docstring requirement.

      ```python
      def compute(x):
          return x * 2
      ```

    tags:
      category: agent-behavior
      advisory: "true"
      scenario: merge-name-collision
    graders:
      - type: output-matches
        name: repository-version-takes-precedence
        config:
          pattern: '(?i)(repository|repo|\.github/skills|customer|version\s*2)'
      - type: output-matches
        name: single-copy-loaded-baseline-shadowed
        config:
          pattern: '(?i)(precedence|override|shadow|dedup|suppressed|not\s+loaded|not\s+load|not\s+both|only\s+one|single\s+(copy|version)|one\s+(copy|version))'
      - type: output-matches
        name: repository-check-applied
        config:
          pattern: '(?i)numpy'
  - name: code-review-standards-merge-content-contradiction
    prompt: |
      As the standards code-review perspective, evaluate this merge-policy
      scenario. Treat the inline skill summaries below as the discovered
      candidate set; do not inspect or rely on real workspace skill files.

      Two differently named skills are available and their checks contradict
      each other:

      The hve-core baseline skill has name python-foundational and requires
      httpx for HTTP clients; it says not to use requests.
      The repository skill under .github/skills/ has name python-legacy and
      requires requests for HTTP clients as an internal standard.

      Review the diff and report standards findings. Explain how you handle the
      contradiction between the two skills.

      ```python
      import requests
      def fetch(url):
          return requests.get(url).json()
      ```

    tags:
      category: agent-behavior
      advisory: "true"
      scenario: merge-content-contradiction
    graders:
      - type: output-matches
        name: both-contradicting-skills-surfaced
        config:
          pattern: '(?is)(python-foundational.*python-legacy|python-legacy.*python-foundational)'
      - type: output-matches
        name: contradiction-acknowledged
        config:
          pattern: '(?i)(contradict|conflict|disagree|inconsistent|tension|both\s+skills|differ)'
      - type: output-matches
        name: no-silent-arbitration
        config:
          pattern: '(?i)(defer|human|reviewer|surface\s+both|both\s+findings|not\s+\S{0,20}(arbitrate|arbitration|arbitrating|resolve|resolved|resolving|decide|decided|deciding)|cannot\s+\S{0,20}(arbitrate|arbitration|arbitrating|resolve|resolved|resolving|decide|decided|deciding)|author\S{0,20}\s+(smell|mistake|fix|issue))'

  # Origin-precedence and stacking coverage for the Workspace/User/Bundled
  # skill-discovery revision (issue #1901). These assert the "Resolve
  # duplicates" and "Load stacked skills" rules of the coding-standards
  # subagent through the parent Code Review matrix slug.
  - name: code-review-standards-user-tier-precedence
    prompt: |
      As the standards code-review perspective, evaluate this merge-policy
      scenario. Treat the inline skill summaries below as the discovered
      candidate set; do not inspect or rely on real workspace skill files.

      Two skills share the same name "python-foundational", and no Workspace
      copy is present:

      Candidate A has a User origin (a user-profile skill) and requires
      public functions to declare type hints.
      Candidate B has a Bundled origin (a packaged extension/plugin skill)
      and forbids type-hint annotations.

      Their checks differ. Given the Workspace > User > Bundled origin
      precedence, state which single copy you load and why, then review the
      diff. Do not load or apply both copies of the same-named skill. The
      User-profile check (type hints required) is the one that must apply.

      ```python
      def compute(x):
          return x * 2
      ```

    tags:
      category: agent-behavior
      advisory: "true"
      scenario: merge-user-tier-precedence
    graders:
      - type: output-matches
        name: user-tier-takes-precedence
        config:
          pattern: '(?i)(user[-\s]?profile|user\s+(origin|tier|copy|version))'
      - type: output-matches
        name: single-copy-loaded-bundled-shadowed
        config:
          pattern: '(?i)(precedence|override|shadow|dedup|suppressed|not\s+loaded|not\s+load|not\s+both|only\s+one|single\s+(copy|version)|one\s+(copy|version))'
      - type: output-matches
        name: user-check-applied
        config:
          pattern: '(?i)(type\s?hint|annotation)'
  - name: code-review-standards-unknown-origin-dedup
    prompt: |
      As the standards code-review perspective, evaluate this merge-policy
      scenario. Treat the inline skill summaries below as the discovered
      candidate set; do not inspect or rely on real workspace skill files.

      Two skills are available and both are named "python-foundational", but
      neither candidate carries a source label or path, so their origin cannot
      be determined and neither can be ranked as Workspace, User, or Bundled.
      Their checks differ.

      Explain how you resolve this duplicate. Load only one same-named skill,
      do not merge or combine the two bodies, and note the ambiguous duplicate
      in your summary.

      ```python
      def compute(x):
          return x * 2
      ```

    tags:
      category: agent-behavior
      advisory: "true"
      scenario: merge-unknown-origin-dedup
    graders:
      - type: output-matches
        name: single-copy-no-merge
        config:
          pattern: '(?i)(only\s+one|single\s+(copy|version)|one\s+(copy|version)|do\s+not\s+merge|not\s+merge|without\s+merging|not\s+combine|no\s+merg)'
      - type: output-matches
        name: ambiguous-duplicate-noted
        config:
          pattern: '(?i)(ambig|unknown\s+origin|cannot\s+determine|undetermined|indeterminate|unclear\s+(origin|source)|flag|note)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
  - name: code-review-standards-stacked-coverage
    prompt: |
      As the standards code-review perspective, evaluate this coverage
      scenario. Treat the inline skill summaries below as the discovered
      candidate set; do not inspect or rely on real workspace skill files.

      The change touches two file groups: a Python file (.py) and a Bash
      script (.sh). Three distinct skills are available:

      Skill python-foundational matches Python by name and covers the .py file.
      Skill bash-standards matches Bash by name and is the only candidate that
      covers the .sh file.
      Skill general-style matches only by a broad description and overlaps the
      Python coverage already provided by python-foundational.

      Select the skills to load so every changed file group is covered. Keep
      the only match for a group even when it is the sole candidate, and drop
      description-only matches that cover no otherwise-uncovered group. State
      which skills you load and which you drop.

      ```text
      # app.py and deploy.sh both changed
      ```

    tags:
      category: agent-behavior
      advisory: "true"
      scenario: stacked-coverage
    graders:
      - type: output-matches
        name: group-skills-stacked
        config:
          pattern: '(?is)(python-foundational.*bash-standards|bash-standards.*python-foundational)'
      - type: output-matches
        name: only-match-retained
        config:
          pattern: '(?i)(bash-standards|bash|\.sh)'
      - type: output-matches
        name: description-only-dropped
        config:
          pattern: '(?i)(general-style|drop|deprioriti|exclud|skip|redundant|already\s+covered|description[-\s]only)'

  - name: code-review-security-planning-drift-context
    prompt: |
      Begin an interactive review with `securityPlanRef=.copilot-tracking/security-plans/sample-service/state.json`. The diff changes authorization behavior in src/auth/policy.ts. Return the factual orientation and dispatch board, recommend the security perspective, and carry the explicitly supplied baseline toward the optional Step 7 drift correlation. Do not run the final correlation before findings exist.
      ```diff
      -return resource.owner_id == user.id
      +return True
      ```
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: plan-context-recognized
        config:
          pattern: '(?is)(security plan|securityPlanRef|sample-service).{0,2000}(security perspective|security review|dispatch board)'
      - type: output-matches
        name: waits-for-findings
        config:
          pattern: '(?is)(confirm|orientation|dispatch board).{0,3000}(before|prior to|then).{0,120}(drift|correlation|correlate|correlated|correlating)|(?:drift|correlation|correlate|correlated|correlating).{0,3000}(after|once).{0,120}(finding|security perspective)'
      - type: output-matches
        name: no-premature-drift-output
        config:
          pattern: '(?is)validated controls:\s*\d+\s*\|\s*control drift:'
          negate: true

  - name: code-review-pull-request-standard-profile
    prompt: |
      This is a behavior-contract scenario, not a live review. Do not call tools
      or resolve provider data. Assume pull request 42 and its PR context are
      already resolved and the checkout matches its head SHA. Present the first
      interactive confirmation for that pull-request target using the standard
      profile. Explain the recommended findings perspectives before asking me to
      confirm the scope. Keep orientation separate from findings.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: pull-request-standard-profile
        config:
          pattern: '(?is)(pull[_ -]?request)(?=.{0,3000}standard)(?=.{0,3000}functional)(?=.{0,3000}standards)(?=.{0,3000}readiness)(?=.{0,3000}(prContext|PR context|metadata|PR description|checks|mergeability|merge readiness))'
      - type: output-matches
        name: orientation-separated
        config:
          pattern: '(?is)(orientation|walkthrough).{0,500}(stage|separate|before|factual|no findings).{0,1000}(finding|perspective|dispatch)'
      - type: output-matches
        name: human-confirmation
        config:
          pattern: '(?is)(confirm|adjust|edit).{0,100}(scope|profile|perspective|dispatch)'

  - name: code-review-branch-diff-standard-profile
    prompt: |
      This is a behavior-contract scenario, not a live review. Do not call tools
      or resolve refs. Assume branch `feature/auth` against `main` is already
      resolved and its checkout SHA matches. Present the first interactive pre-PR
      confirmation using the standard profile, explain the recommended findings
      perspectives, and ask me to confirm the scope. Do not require pull-request
      metadata.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: branch-diff-standard-profile
        config:
          pattern: '(?is)(branch|feature/auth|pre-PR).{0,800}(standard).{0,1200}(functional).{0,1000}(standards).{0,1000}(readiness)'
      - type: output-matches
        name: no-required-pr-metadata
        config:
          pattern: '(?is)(provide|fetch|need|required before|must supply|must provide).{0,120}(pull[- ]?request|PR).{0,120}(metadata|context|number|identifier)'
          negate: true

  - name: code-review-decision-ready-dispatch-board
    prompt: |
      This is a behavior-contract scenario, not a live review. Do not call tools.
      Assume orientation found changes in `src/request-parser.ts`,
      `tests/request-parser.test.ts`, and `docs/deployment.md`. Present the
      orientation handoff and decision-ready dispatch board, then ask for one
      confirmation before dispatch. Make the board, perspective ownership,
      omitted perspectives, and depth recommendation clear enough that I can
      approve or edit them in one reply.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: detailed-board
        config:
          pattern: '(?is)(dispatch board).{0,500}(area).{0,300}(status).{0,300}(preliminary signal).{0,2000}(\.py|\.ts|\.js|\.md|symbol|function)'
      - type: output-matches
        name: perspectives-with-ownership
        config:
          pattern: '(?is)(recommended (perspectives|dispatch)|perspective ownership)(?=.{0,2000}(functional|standards|readiness))(?=.{0,2000}(board items|B\d|item\s*#?\s*\**\d|#\s*\d|items?\s+\**\d))'
      - type: output-matches
        name: omitted-perspective-rationale
        config:
          pattern: '(?is)(not recommended|skip(?:ping)?|omit(?:ted)?).{0,300}(accessibility|security|functional|standards|readiness).{0,500}(because|no |not |without |out of scope)'
      - type: output-matches
        name: depth-with-rationale
        config:
          pattern: '(?is)(recommended depth|depth:).{0,200}(basic|standard|comprehensive|tier [123]).{0,800}(because|change|risk|blast radius|hotspot|validation|ambiguity)'
      - type: output-matches
        name: single-decision-prompt
        config:
          pattern: '(?is)(confirm before dispatch|approve)(?=.{0,400}(board|perspective|depth))(?=.{0,400}(edit|adjust|reply))'

  - name: code-review-target-checkout-mismatch
    prompt: |
      This is a behavior-contract scenario, not a live review.
      Pull request 42 resolves to base `main`, head `feature/auth`, and head SHA
      `abc123`, but checked-out `HEAD` is `def456`. State what must happen before
      diff generation and whether reviewing may continue. Do not call tools.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: mismatch-stops-review
        config:
          pattern: '(?is)(stop|cannot|must not|do not).{0,300}(review|diff)|(review|diff).{0,300}(stop|cannot|must not|do not)'
      - type: output-matches
        name: checkout-target-head
        config:
          pattern: '(?is)(check out|checked out|checkout).{0,400}(feature/auth|abc123|target head)|(feature/auth|abc123|target head).{0,400}(check out|checked out|checkout)'
      - type: output-matches
        name: no-auto-base-substitution
        config:
          pattern: '(?is)(auto[- ]?detect|--base-branch auto|another checkout).{0,180}(continue|review|generate)'
          negate: true

  - name: code-review-orientation-retry-contract
    prompt: |
      This is a behavior-contract scenario, not a live review.
      The orientation worker failed to create its artifact. Describe the one
      allowed retry contract, including the task, state path, expected output,
      and failure detail. Do not call tools.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: complete-orientation-retry
        config:
          pattern: '(?is)(retry.{0,120}once|one allowed retry).{0,500}(orientation).{0,500}(diff-state\.json|state path).{0,500}(orientation-walkthrough\.md|output path).{0,500}(failure|error)'

  - name: code-review-perspective-no-output-retry
    prompt: |
      This is a behavior-contract scenario, not a live review.
      A selected Functional perspective invocation returned no output and did
      not create its expected findings file. Describe the recovery behavior and
      when that perspective may be marked skipped. Do not call tools.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: complete-perspective-retry
        config:
          pattern: '(?is)retry.{0,120}once.{0,500}(complete original|complete.*dispatch).{0,500}(failure|no output|missing).{0,500}(functional-findings\.json|expected (findings[- ](file|path)|output))'
      - type: output-matches
        name: skip-only-after-retry
        config:
          pattern: '(?is)(skip|skipped).{0,250}(retry).{0,120}(fail|failed|unavailable)|(retry).{0,250}(fail|failed|unavailable).{0,120}(skip|skipped)'

  - name: code-review-rejects-unsupported-finding
    prompt: |
      This is a behavior-contract scenario, not a live review.
      During merge, a Functional worker returns well-formed JSON containing one
      High finding, but its cited file and lines are absent from the persisted
      diff and untracked-file evidence, and no serialized requirement supports
      the claim. Explain whether the finding may affect severity counts or the
      final verdict and how the merge records it. Do not call tools.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: unsupported-finding-rejected
        config:
          pattern: '(?is)(reject|exclude)(?=.{0,500}(evidence|support))(?=.{0,800}(severity count|verdict))'
      - type: output-matches
        name: rejected-evidence-recorded
        config:
          pattern: '(?is)(record|report).{0,300}(rejected worker evidence|execution limitation).{0,300}(perspective|title|reason)'

  - name: code-review-native-emission-sha-gate
    prompt: |
      This is a behavior-contract scenario, not a live review.
      A pull-request review draft is ready, but `reviewTarget.headSha` is absent.
      The user has confirmed posting. State whether native emission may proceed
      and state the complete PR identity revalidation contract. Do not call tools.
    environment:
      files:
        - src: ../../.github/agents/coding-standards/code-review.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: missing-sha-blocks-emission
        config:
          pattern: '(?is)((block|stop|cannot|must not|may not).{0,300}(emit|emission|post|proceed).{0,500}(head sha|headSha)|(head sha|headSha).{0,300}(block|stop|cannot|must not|may not).{0,300}(emit|emission|post|proceed))'
      - type: output-matches
        name: complete-pr-state-check
        config:
          pattern: '(?is)(revalidat|validat|check)(?=.{0,600}(open|state))(?=.{0,600}base)(?=.{0,600}head)(?=.{0,600}(sha|commit))'
