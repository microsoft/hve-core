stimuli:
  - name: code-review-class-recipe
    prompt: |
      Begin an interactive review of this diff. Return a factual orientation and a short dispatch board, then ask me to confirm the review scope before deeper analysis. Do not modify source code.
      ```diff
      -def get_user(user_id):
      -    return db.query(f"SELECT * FROM users WHERE id = {user_id}")
      +def get_user(user_id):
      +    return db.query("SELECT * FROM users WHERE id = ?", user_id)
      ```

    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: orientation-and-board
        config:
          pattern: '(?is)(orientation|walkthrough).{0,4000}dispatch\s+board|dispatch\s+board.{0,4000}(orientation|walkthrough)'
      - type: output-matches
        name: human-confirmation
        config:
          pattern: '(?is)(confirm|adjust|edit).{0,80}(scope|orientation|walkthrough|dispatch\s+board)|(scope|orientation|walkthrough|dispatch\s+board).{0,80}(confirm|adjust|edit)'
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true

  - name: code-review-pull-request-standard-profile
    prompt: |
      This is a behavior-contract scenario, not a live review. Do not call tools
      or resolve provider data. Assume pull request 42 and its PR context are
      already resolved and the checkout matches its head SHA. Present the first
      interactive confirmation for that pull-request target using the standard
      profile. Explain the recommended findings perspectives before asking me to
      confirm the scope. Keep orientation separate from findings.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: pull-request-standard-profile
        config:
          pattern: '(?is)(pull[_ -]?request).{0,800}(standard).{0,1200}(functional).{0,1000}(standards).{0,1000}(readiness).{0,800}(prContext|PR context|metadata|PR description|checks|mergeability|readiness)'
      - type: output-matches
        name: orientation-separated
        config:
          pattern: '(?is)(orientation|walkthrough).{0,500}(stage|separate|before).{0,1000}(finding|perspective|dispatch)'
      - type: output-matches
        name: human-confirmation
        config:
          pattern: '(?is)(confirm|adjust|edit).{0,100}(scope|profile|perspective|dispatch)'

  - name: code-review-branch-diff-standard-profile
    prompt: |
      This is a behavior-contract scenario, not a live review. Do not call tools
      or resolve refs. Assume branch `feature/auth` against `main` is already
      resolved and its checkout SHA matches. Present the first interactive pre-PR
      confirmation using the standard profile, explain the recommended findings
      perspectives, and ask me to confirm the scope. Do not require pull-request
      metadata.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: branch-diff-standard-profile
        config:
          pattern: '(?is)(branch|feature/auth|pre-PR).{0,800}(standard).{0,1200}(functional).{0,1000}(standards).{0,1000}(readiness)'
      - type: output-matches
        name: no-required-pr-metadata
        config:
          pattern: '(?is)((pull[- ]?request|PR).{0,120}(metadata|context).{0,120}(not required|not needed|optional|unavailable)|(not require|not need).{0,120}(pull[- ]?request|PR).{0,120}(metadata|context))'

  - name: code-review-decision-ready-dispatch-board
    prompt: |
      This is a behavior-contract scenario, not a live review. Do not call tools.
      Assume orientation found changes in `src/request-parser.ts`,
      `tests/request-parser.test.ts`, and `docs/deployment.md`. Present the
      orientation handoff and decision-ready dispatch board, then ask for one
      confirmation before dispatch. Make the board, perspective ownership,
      omitted perspectives, and depth recommendation clear enough that I can
      approve or edit them in one reply.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: detailed-board
        config:
          pattern: '(?is)(dispatch board).{0,500}(area).{0,300}(status).{0,300}(preliminary signal).{0,2000}(\.py|\.ts|\.js|\.md|symbol|function)'
      - type: output-matches
        name: perspectives-with-ownership
        config:
          pattern: '(?is)(recommended perspectives).{0,1500}(functional|standards|readiness).{0,1000}(B\d|item\s*#?\s*\d|#\s*\d|items\s+\d)'
      - type: output-matches
        name: omitted-perspective-rationale
        config:
          pattern: '(?is)(not recommended|skip(?:ping)?|omit(?:ted)?).{0,300}(accessibility|security|functional|standards|readiness).{0,500}(because|no |not |without |out of scope)'
      - type: output-matches
        name: depth-with-rationale
        config:
          pattern: '(?is)(recommended depth).{0,200}(basic|standard|comprehensive|tier [123]).{0,800}(because|change|risk|blast radius|hotspot|validation|ambiguity)'
      - type: output-matches
        name: single-decision-prompt
        config:
          pattern: '(?is)((edit|adjust).{0,100}(board|perspective|depth).{0,300}(approve|confirm|run|go)|(approve|confirm|run|go).{0,300}(edit|adjust).{0,100}(board|perspective|depth))'

  - name: code-review-target-checkout-mismatch
    prompt: |
      This is a behavior-contract scenario, not a live review.
      Pull request 42 resolves to base `main`, head `feature/auth`, and head SHA
      `abc123`, but checked-out `HEAD` is `def456`. State what must happen before
      diff generation and whether reviewing may continue. Do not call tools.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: mismatch-stops-review
        config:
          pattern: '(?is)(stop|cannot|must not|do not).{0,300}(review|diff)|(review|diff).{0,300}(stop|cannot|must not|do not)'
      - type: output-matches
        name: checkout-target-head
        config:
          pattern: '(?is)(check out|checkout).{0,200}(feature/auth|abc123|target head)|(feature/auth|abc123|target head).{0,200}(check out|checkout)'
      - type: output-matches
        name: no-auto-base-substitution
        config:
          pattern: '(?is)(auto[- ]?detect|--base-branch auto|another checkout).{0,180}(continue|review|generate)'
          negate: true

  - name: code-review-orientation-retry-contract
    prompt: |
      This is a behavior-contract scenario, not a live review.
      The orientation worker failed to create its artifact. Describe the one
      allowed retry contract, including the task, state path, expected output,
      and failure detail. Do not call tools.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: complete-orientation-retry
        config:
          pattern: '(?is)retry.{0,120}once.{0,500}(orientation).{0,500}(diff-state\.json|state path).{0,500}(orientation-walkthrough\.md|output path).{0,500}(failure|error)'

  - name: code-review-perspective-no-output-retry
    prompt: |
      This is a behavior-contract scenario, not a live review.
      A selected Functional perspective invocation returned no output and did
      not create its expected findings file. Describe the recovery behavior and
      when that perspective may be marked skipped. Do not call tools.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: complete-perspective-retry
        config:
          pattern: '(?is)retry.{0,120}once.{0,500}(complete original|complete.*dispatch).{0,500}(failure|no output|missing).{0,500}(functional-findings\.json|expected (findings[- ]file|output))'
      - type: output-matches
        name: skip-only-after-retry
        config:
          pattern: '(?is)(skip|skipped).{0,250}(retry).{0,120}(fail|failed|unavailable)|(retry).{0,250}(fail|failed|unavailable).{0,120}(skip|skipped)'

  - name: code-review-rejects-unsupported-finding
    prompt: |
      This is a behavior-contract scenario, not a live review.
      During merge, a Functional worker returns well-formed JSON containing one
      High finding, but its cited file and lines are absent from the persisted
      diff and untracked-file evidence, and no serialized requirement supports
      the claim. Explain whether the finding may affect severity counts or the
      final verdict and how the merge records it. Do not call tools.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: unsupported-finding-rejected
        config:
          pattern: '(?is)((reject|exclude).{0,300}(unsupported|not supported|unverified)|(unsupported|not supported|unverified).{0,300}(reject|exclude)).{0,500}(severity count|verdict)'
      - type: output-matches
        name: rejected-evidence-recorded
        config:
          pattern: '(?is)(record|report).{0,300}(rejected worker evidence|execution limitation).{0,300}(perspective|title|reason)'

  - name: code-review-native-emission-sha-gate
    prompt: |
      This is a behavior-contract scenario, not a live review.
      A pull-request review draft is ready, but `reviewTarget.headSha` is absent.
      The user has confirmed posting. State whether native emission may proceed
      and what identity must be revalidated. Do not call tools.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: missing-sha-blocks-emission
        config:
          pattern: '(?is)((block|stop|cannot|must not).{0,300}(emit|emission|post).{0,500}(head sha|headSha)|(head sha|headSha).{0,300}(block|stop|cannot|must not).{0,300}(emit|emission|post))'
      - type: output-matches
        name: complete-pr-state-check
        config:
          pattern: '(?is)(open|state).{0,300}(base).{0,300}(head ref|head).{0,300}(sha|commit)'
