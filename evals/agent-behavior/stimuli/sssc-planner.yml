# cspell:ignore cand FEFF
stimuli:
  - name: sssc-planner-class-recipe
    prompt: |
      Start an SSSC planning session for this repository. Outline the six phases of the supply chain assessment. Write the planning state under `.copilot-tracking/sssc-plans/` and report the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: sssc-planner-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: sssc-planner-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]sssc-plans'
      - type: output-matches
        name: sssc-planner-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true
  - name: sssc-planner-disclaimer-startup
    prompt: |
      Use the workspace fixture at `eval-fixtures/sssc-planner-disclaimer-startup.txt` as the startup scenario and required disclaimer text. Start exactly as that fixture requires.
    agent_environment:
      files:
        - src: fixtures/sssc-planner-disclaimer-startup.txt
          dest: eval-fixtures/sssc-planner-disclaimer-startup.txt
    tags:
      category: agent-behavior
      scenario: startup-disclaimer
    graders:
      - type: output-matches
        name: sssc-planner-disclaimer-startup-caution-disclaimer
        config:
          pattern: '(?is)(\[!CAUTION\]|CAUTION).*Disclaimer.*assistive\s+tool\s+only'
      - type: output-matches
        name: sssc-review-scope
        config:
          pattern: '(?i)SSSC|supply\s+chain|OpenSSF|SLSA|qualified\s+human\s+reviewers'
      - type: output-matches
        name: sssc-planner-disclaimer-startup-disclaimer-state
        config:
          pattern: '(?i)disclaimerShownAt|ISO\s*8601'
  - name: sssc-planner-from-security-plan-selection
    prompt: |
      Extend our completed security plans with supply chain coverage. Two Security Planner projects exist, at `.copilot-tracking/security-plans/payments-api/state.json` and `.copilot-tracking/security-plans/ledger-service/state.json`. Follow the startup contract, then explain which entry mode you are using and how you will choose the source security plan before scoping. Reply in chat only.
    agent_environment:
      files:
        - src: ../../.github/agents/security/sssc-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: ../../.github/instructions/security/sssc-planner.instructions.md
          dest: .github/instructions/security/sssc-planner.instructions.md
        - src: fixtures/security-planner-disclaimer-shown-state.json
          dest: .copilot-tracking/security-plans/payments-api/state.json
        - src: fixtures/security-planner-disclaimer-shown-state.json
          dest: .copilot-tracking/security-plans/ledger-service/state.json
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: from-security-plan-selection
    graders:
      - type: output-matches
        name: sssc-planner-from-security-plan-attribution
        config:
          pattern: '(?is)OpenSSF Scorecard[\s\S]{0,12}SLSA Build Levels[\s\S]{0,12}OpenSSF Best Practices Badge[\s\S]{0,12}Sigstore[\s\S]{0,12}SBOM'
      - type: output-matches
        name: sssc-planner-from-security-plan-entry-mode
        config:
          pattern: '(?i)from-security-plan'
      - type: output-matches
        name: sssc-planner-from-security-plan-selection-requested
        config:
          pattern: '(?is)(select|choose|which)[\s\S]{0,240}(payments-api|ledger-service)|(payments-api|ledger-service)[\s\S]{0,240}(select|choose|which)'

  # Advisory candidate for sssc-planner-class-recipe: the agent and the
  # supply-chain-security skill are loaded and the request is unchanged. The
  # disclaimer wording, phase names and state schema come only from the agent.
  - name: sssc-planner-class-recipe-candidate
    prompt: |
      Start an SSSC planning session for this repository. Outline the six phases of the supply chain assessment. Write the planning state under `.copilot-tracking/sssc-plans/` and report the path.
    agent_environment:
      files:
        - src: ../../.github/agents/security/sssc-planner.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/security/supply-chain-security
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: sssc-session-bootstrap
    graders:
      - type: output-matches
        name: sssc-disclaimer-shown-cand
        config:
          pattern: '(?is)\bOpenSSF\s+Scorecard\s+evaluators\b.{0,40}\bSLSA\s+auditors\b'
      - type: output-matches
        name: sssc-six-phases-named-cand
        config:
          pattern: '(?is)^(?=[\s\S]*\bgap\s+analysis\b)(?=[\s\S]*\bstandards\s+mapping\b)(?=[\s\S]*\bbacklog\s+generation\b)'
      - type: output-matches
        name: sssc-reports-state-path-cand
        config:
          pattern: '(?i)\.copilot-tracking[/\\]sssc-plans[/\\][\w.-]+[/\\]state\.json'
      - type: program
        name: sssc-state-initialized-cand
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const root = path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/sssc-plans');
                const slugs = fs.readdirSync(root, { withFileTypes: true }).filter(entry => entry.isDirectory() && fs.existsSync(path.join(root, entry.name, 'state.json'))).map(entry => entry.name);
                if (slugs.length !== 1) process.exit(1);
                const text = fs.readFileSync(path.join(root, slugs[0], 'state.json'), 'utf8');
                if (text.length > 262144) process.exit(1);
                const state = JSON.parse(text.replace(/^\uFEFF/, ''));
                const stamped = typeof state.disclaimerShownAt === 'string' && !Number.isNaN(Date.parse(state.disclaimerShownAt));
                process.exit(stamped && state.projectSlug === slugs[0] && state.entryMode === 'capture' && state.currentPhase === 1 ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: sssc-bootstrap-workspace-bounded-cand
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: sssc-bootstrap-context-cand
        config:
          required:
            - hve.context.composed
