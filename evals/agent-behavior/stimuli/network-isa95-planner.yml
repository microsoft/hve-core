# cspell:ignore cand
stimuli:
  - name: network-isa95-planner-class-recipe
    prompt: |
      Sketch an ISA-95 level-2-to-level-3 network plan for a single packaging line. List zones, conduits, and primary data flows in a structured document. Write the plan under `.copilot-tracking/` and report the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: network-isa95-planner-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]'
      - type: output-matches
        name: network-isa95-planner-class-recipe-topic-coverage
        config:
          pattern: '(?i)(isa.?95|level|zone|conduit|network|plc|scada)'
      - type: output-matches
        name: network-isa95-planner-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Advisory candidate for network-isa95-planner-class-recipe: the agent is
  # loaded and the packaging-line intake is staged without retention and
  # ownership answers. The loaded intake gate, not the prompt, requires the
  # plan file to carry a preliminary zone and conduit summary grounded in the
  # intake, ask the missing questions, and withhold alignment classification.
  - name: network-isa95-planner-class-recipe-candidate
    prompt: |
      Sketch an ISA-95 level-2-to-level-3 network plan for packaging line 3
      from the intake notes in `site/packaging-line-intake.md`. List zones,
      conduits, and primary data flows in a structured document. Write the plan
      under `.copilot-tracking/` and report the path.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/network-isa95-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/planning-intake/packaging-line-intake.txt
          dest: site/packaging-line-intake.md
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: isa95-intake-gate
    graders:
      - type: output-matches
        name: isa95-asks-missing-intake-cand
        config:
          pattern: '(?is)^(?=[\s\S]*\bretention\b[^\n]*\?)(?=[\s\S]*\b(?:change\s+authority|owns?|owners?|ownership)\b[^\n]*\?)'
      - type: output-matches
        name: isa95-withholds-classification-cand
        config:
          pattern: '(?i)(?<!\b(?:not|no|never|before|until|without|pending)\b[^.\n]{0,60})\b(?:Critical Non-Compliance|Material Non-Compliance|Partially Aligned|Baseline Aligned)\b'
          negate: true
      - type: program
        name: isa95-preliminary-plan-written-cand
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const root = path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking');
                const names = fs.readdirSync(root, { recursive: true }).slice(0, 200).map(name => String(name).replace(/\\/g, '/'))
                  .filter(name => name.endsWith('.md') && fs.statSync(path.join(root, name)).isFile());
                if (names.length !== 1) process.exit(1);
                const artifact = fs.readFileSync(path.join(root, names[0]), 'utf8');
                if (artifact.length > 262144) process.exit(1);
                const grounded = /\bzones?\b/i.test(artifact) && /\bconduits?\b/i.test(artifact) && /\b(?:MES|historian)\b/i.test(artifact);
                const classified = /(?<!\b(?:not|no|never|before|until|without|pending)\b[^.\n]{0,60})\b(?:Critical Non-Compliance|Material Non-Compliance|Partially Aligned|Baseline Aligned)\b/i.test(artifact);
                const reported = String(input.trajectory.output || '').replace(/\\/g, '/').includes('.copilot-tracking/' + names[0]);
                process.exit(grounded && !classified && reported ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: isa95-workspace-bounded-cand
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: isa95-context-cand
        config:
          required:
            - hve.context.composed
