stimuli:
  - name: code-review-orientation-stage
    prompt: |
      Build the Register 1 orientation for this pull-request target. Summarize
      changed areas, entry points, blast radius, likely risk surfaces, and
      candidate symbols for the dispatch board. Give every area a factual
      preliminary signal and supporting changed-file or symbol reference so the
      parent can present a decision-ready board. Do not grade findings, recommend
      perspectives or depth, or issue a verdict.
      ```diff
      -return db.query(f"SELECT * FROM users WHERE id = {user_id}")
      +return db.query("SELECT * FROM users WHERE id = ?", user_id)
      ```
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: orientation-vocabulary
        config:
          pattern: '(?is)(orientation|walkthrough).{0,3000}(changed area|entry point|blast radius|risk surface|candidate symbol|dispatch)'
      - type: output-matches
        name: decision-ready-area-evidence
        config:
          pattern: '(?is)(preliminary signal|review area).{0,1000}(\.py|\.ts|\.js|\.cs|symbol|function|line)'
      - type: output-matches
        name: no-findings-verdict
        config:
          pattern: '(?i)(request_changes|approve_with_comments|critical finding|high finding|severity_counts|(?:pr-)?findings\.json)'
          negate: true
      - type: output-matches
        name: code-review-orientation-stage-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Loaded subagent contract: the parent's dispatch brief points at a staged
  # orientation task. The grader reads the walkthrough written to the task's
  # output path, which only the staged state names.
  - name: code-review-orientation-writes-walkthrough
    prompt: |
      Code Review parent dispatch: build the orientation for the serialized
      review target in
      `.copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json`
      and return your one-line summary.
    agent_environment:
      files:
        - src: ../../.github/agents/coding-standards/subagents/code-review-orientation.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/code-review-subagents/orientation-diff-state.json
          dest: .copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json
        - src: fixtures/code-review-subagents/feature-refund-helpers.diff
          dest: .copilot-tracking/pr/feature-refund-helpers.diff
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: orientation-walkthrough-artifact
    graders:
      - type: program
        name: orientation-walkthrough-maps-changed-areas
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const relative = '.copilot-tracking/reviews/code-reviews/feature-refund-helpers/orientation-walkthrough.md';
                const text = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, relative), 'utf8');
                if (text.length > 262144) process.exit(1);
                const files = ['src/billing/refunds.py', 'web/refund-button.html', 'docs/refunds.md'];
                const covered = files.every(file => text.includes(file) || text.includes(path.posix.basename(file)));
                const symbols = /\b(?:refund_total|find_charge|submitRefund)\b/.test(text);
                const signal = /preliminary\s+signal/i.test(text);
                const graded = /\bseverity\s*[:=|]|\bverdict\s*[:=|]|request_changes|approve_with_comments|severity_counts/i.test(text);
                process.exit(covered && symbols && signal && !graded ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: cr-orientation-walkthrough-workspace-bounded
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: cr-orientation-walkthrough-context
        config:
          required:
            - hve.context.composed
