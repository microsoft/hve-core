stimuli:
  - name: code-review-orientation-stage
    prompt: |
      Build the Register 1 orientation for this pull-request target. Summarize
      changed areas, entry points, blast radius, likely risk surfaces, and
      candidate symbols for the dispatch board. Give every area a factual
      preliminary signal and supporting changed-file or symbol reference so the
      parent can present a decision-ready board. Do not grade findings, recommend
      perspectives or depth, or issue a verdict.
      ```diff
      -return db.query(f"SELECT * FROM users WHERE id = {user_id}")
      +return db.query("SELECT * FROM users WHERE id = ?", user_id)
      ```
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: orientation-vocabulary
        config:
          pattern: '(?is)(orientation|walkthrough).{0,3000}(changed area|entry point|blast radius|risk surface|candidate symbol|dispatch)'
      - type: output-matches
        name: decision-ready-area-evidence
        config:
          pattern: '(?is)(preliminary signal|review area).{0,1000}(\.py|\.ts|\.js|\.cs|symbol|function|line)'
      - type: output-matches
        name: no-findings-verdict
        config:
          pattern: '(?i)(request_changes|approve_with_comments|critical finding|high finding|severity_counts|(?:pr-)?findings\.json)'
          negate: true
      - type: output-matches
        name: no-source-edit
        config:
          pattern: '(?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)'
          negate: true
