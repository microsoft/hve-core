# cspell:ignore FEFF
stimuli:
  - name: code-review-readiness-lens
    prompt: |
      As the readiness perspective for a pull-request target, assess the change
      package: scope hygiene, description accuracy, validation evidence,
      follow-up items, and merge readiness. The PR adds a feature flag with no
      tests and includes an unrelated formatting change that its description
      does not mention.
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: readiness-vocabulary
        config:
          pattern: '(?i)(readiness|ready|scope|description|test|coverage|validation|evidence|follow[- ]?up|unrelated|missing|risk|recommend)'
      - type: output-matches
        name: code-review-readiness-lens-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Loaded subagent contract: the parent's dispatch brief points at a staged
  # perspective batch whose changed documentation contradicts the changed code.
  # The grader reads the structured findings file rather than the reply.
  - name: code-review-readiness-writes-batch-findings
    prompt: |
      Code Review parent dispatch: run the Readiness perspective for the
      serialized perspective batch in
      `.copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json`.
      Write your structured JSON findings to
      `.copilot-tracking/reviews/code-reviews/feature-refund-helpers/readiness-findings.json`
      and do not write a markdown report.
    agent_environment:
      files:
        - src: ../../.github/agents/coding-standards/subagents/code-review-readiness.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/code-review-subagents/perspective-diff-state.json
          dest: .copilot-tracking/reviews/code-reviews/feature-refund-helpers/diff-state.json
        - src: fixtures/code-review-subagents/feature-refund-helpers.diff
          dest: .copilot-tracking/pr/feature-refund-helpers.diff
      skills:
        - ../../.github/skills/coding-standards/code-review
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: perspective-batch-findings
    graders:
      - type: program
        name: readiness-findings-cite-stale-documentation
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const relative = '.copilot-tracking/reviews/code-reviews/feature-refund-helpers/readiness-findings.json';
                const text = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, relative), 'utf8');
                if (text.length > 262144) process.exit(1);
                const report = JSON.parse(text.replace(/^\uFEFF/, ''));
                const findings = report && Array.isArray(report.findings) ? report.findings : [];
                const describe = finding => [finding.title, finding.category, finding.problem, finding.current_code].map(value => String(value ?? '')).join(' ');
                const onFile = finding => typeof finding.file === 'string' && finding.file.replace(/\\/g, '/').replace(/^\.\//, '').endsWith('docs/refunds.md');
                const matched = findings.some(finding => finding !== null && typeof finding === 'object' && onFile(finding) &&
                  /^(?:Critical|High|Medium|Low)$/.test(String(finding.severity)) &&
                  /\bfloat\b|\bdecimal\b|every charge|last charge|return(?:s|ed)?\s+(?:type|value)/i.test(describe(finding)));
                process.exit(matched ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: cr-readiness-batch-workspace-bounded
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: cr-readiness-batch-context
        config:
          required:
            - hve.context.composed
