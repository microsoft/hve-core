# cspell:ignore cand FEFF
stimuli:
  - name: privacy-planner-class-recipe
    prompt: |
      Start a privacy planning session for a customer analytics service that ingests account profiles and usage events. Outline the six phases of the privacy assessment, including where the DPIA threshold gate applies. Write the planning state under `.copilot-tracking/privacy-plans/` and report the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: privacy-planner-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: privacy-planner-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]privacy-plans'
      - type: output-matches
        name: privacy-planner-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  # Advisory candidate for privacy-planner-class-recipe: the agent and the
  # privacy-standards skill are loaded and the request is unchanged. The
  # disclaimer wording, phase names and state schema come only from the agent.
  - name: privacy-planner-class-recipe-candidate
    prompt: |
      Start a privacy planning session for a customer analytics service that ingests account profiles and usage events. Outline the six phases of the privacy assessment, including where the DPIA threshold gate applies. Write the planning state under `.copilot-tracking/privacy-plans/` and report the path.
    agent_environment:
      files:
        - src: ../../.github/agents/privacy/privacy-planner.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/project-planning/privacy-standards
    tags:
      category: agent-behavior
      advisory: "true"
      scenario: privacy-session-bootstrap
    graders:
      - type: output-matches
        name: privacy-disclaimer-shown-cand
        config:
          pattern: '(?is)\bdata\s+protection\s+officers\b.{0,600}\bprivacy\s+certification\b'
      - type: output-matches
        name: privacy-dpia-in-risk-phase-cand
        config:
          pattern: '(?is)^(?=[\s\S]*\bdata\s+mapping\b)(?=[\s\S]*\brisk\s*(?:\+|and|&|/)\s*DPIA\b)'
      - type: output-matches
        name: privacy-reports-state-path-cand
        config:
          pattern: '(?i)\.copilot-tracking[/\\]privacy-plans[/\\][\w.-]+[/\\]state\.json'
      - type: program
        name: privacy-state-initialized-cand
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const root = path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/privacy-plans');
                const slugs = fs.readdirSync(root, { withFileTypes: true }).filter(entry => entry.isDirectory() && fs.existsSync(path.join(root, entry.name, 'state.json'))).map(entry => entry.name);
                if (slugs.length !== 1) process.exit(1);
                const text = fs.readFileSync(path.join(root, slugs[0], 'state.json'), 'utf8');
                if (text.length > 262144) process.exit(1);
                const state = JSON.parse(text.replace(/^\uFEFF/, ''));
                const stamped = typeof state.disclaimerShownAt === 'string' && !Number.isNaN(Date.parse(state.disclaimerShownAt));
                process.exit(stamped && state.projectSlug === slugs[0] && state.entryMode === 'capture' && state.currentPhase === 1 ? 0 : 1);
              } catch { process.exit(1); }
      - type: system-event
        name: privacy-bootstrap-workspace-bounded-cand
        config:
          required:
            - hve.filesystem.passed
          disallowed:
            - hve.filesystem.violated
            - hve.filesystem.unavailable
      - type: system-event
        name: privacy-bootstrap-context-cand
        config:
          required:
            - hve.context.composed
