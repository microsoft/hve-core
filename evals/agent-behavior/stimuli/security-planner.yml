stimuli:
  - name: security-planner-class-recipe
    prompt: |
      Start a security planning session for a public REST API. List the six phases the planner will walk through. Write the planning state under `.copilot-tracking/security-plans/` and report the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: security-planner-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: security-planner-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\]security-plans'
      - type: output-matches
        name: security-planner-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!\b(?:not|never|without)\s)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  - name: security-planner-disclaimer-null-state
    prompt: |
      Resume the Security Planner project whose state is at `.copilot-tracking/security-plans/cadence-null/state.json`. Follow the startup contract and persist the required state change. In the final reply, print the complete canonical Security Planning CAUTION block, then explicitly report the persisted `disclaimerShownAt` ISO timestamp and the appended `session-start-disclaimer` notice before asking any Phase 1 question.
    environment:
      files:
        - src: ../../.github/agents/security/security-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: fixtures/security-planner-disclaimer-null-state.json
          dest: .copilot-tracking/security-plans/cadence-null/state.json
    tags:
      category: agent-behavior
      scenario: disclaimer-null-state
    graders:
      - type: output-matches
        name: disclaimer-before-phase-work
        config:
          pattern: '(?is)(\[!CAUTION\]|\*\*Disclaimer:\*\*).{0,1800}(disclaimerShownAt|session-start-disclaimer).{0,1200}(Phase 1|scoping|question)'
      - type: output-matches
        name: state-update-reported
        config:
          pattern: '(?is)disclaimerShownAt.{0,200}(ISO|202[0-9]).{0,500}session-start-disclaimer'

  - name: security-planner-disclaimer-shown-resume
    prompt: |
      Resume the Security Planner project whose state is at `.copilot-tracking/security-plans/cadence-shown/state.json`. The full disclaimer was already shown. Continue normal Phase 1 work and report whether the timestamp or session-start notice count changed.
    environment:
      files:
        - src: ../../.github/agents/security/security-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: fixtures/security-planner-disclaimer-shown-state.json
          dest: .copilot-tracking/security-plans/cadence-shown/state.json
    tags:
      category: agent-behavior
      scenario: disclaimer-shown-resume
    graders:
      - type: output-matches
        name: normal-resume-suppresses-replay
        config:
          pattern: '(?is)(not repeat|suppress|skip|already shown|no (?:automatic )?redisplay)'
      - type: output-matches
        name: existing-timestamp-preserved
        config:
          pattern: '(?is)(2026-09-01T12:00:00Z|timestamp).{0,250}(unchanged|preserv|remain|not (?:change|update|overwrite|overwritten))|(unchanged|preserv|remain|not (?:change|update|overwrite|overwritten)).{0,250}(2026-09-01T12:00:00Z|timestamp)'
      - type: output-matches
        name: no-duplicate-session-start-notice
        config:
          pattern: '(?is)(no duplicate|not add|unchanged|remain(?:s|ed)? (?:at )?(?:one|1)).{0,250}session-start-disclaimer|session-start-disclaimer.{0,250}(no duplicate|not add|unchanged|(?:one|1))'
      - type: output-matches
        name: no-full-disclaimer-replay
        config:
          pattern: '(?is)\*\*Disclaimer:\*\*\s*This agent is an assistive tool only'
          negate: true

  - name: security-planner-disclaimer-user-redisplay
    prompt: |
      Resume the Security Planner project whose state is at `.copilot-tracking/security-plans/cadence-shown/state.json`. I explicitly ask to see the full Security Planning disclaimer again. In the final reply, print the complete canonical Security Planning CAUTION block before reporting state effects. Then persist the required state and notice history and report the replay discriminator. A state-only summary does not satisfy this request.
    environment:
      files:
        - src: ../../.github/agents/security/security-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: fixtures/security-planner-disclaimer-shown-state.json
          dest: .copilot-tracking/security-plans/cadence-shown/state.json
    tags:
      category: agent-behavior
      scenario: disclaimer-user-redisplay
    graders:
      - type: output-matches
        name: full-disclaimer-redisplayed
        config:
          pattern: '(?is)\[!CAUTION\][\s\S]*\*\*Disclaimer:\*\*\s*This agent is an assistive tool only\.\s*It does not provide legal, regulatory, or compliance advice and does not replace professional security review boards, penetration testing teams, compliance auditors, legal counsel, or other qualified human reviewers\.\s*The output consists of suggested actions and considerations to support a user''s own internal security review and decision[-\u2011]making\.\s*All security plans, threat models, security models, and mitigation recommendations generated by this tool must be independently reviewed and validated by appropriate security and compliance reviewers before use\.\s*Outputs from this tool do not constitute security approval, compliance certification, or regulatory sign[-\u2011]off\.'
      - type: program
        name: redisplay-state-contract
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const state = JSON.parse(fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/security-plans/cadence-shown/state.json'), 'utf8'));
                const baseline = '2026-09-01T12:00:00Z';
                const stamp = state.disclaimerShownAt;
                const validStamp = typeof stamp === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(stamp) && Number.isFinite(Date.parse(stamp)) && Date.parse(stamp) > Date.parse(baseline);
                const history = Array.isArray(state.noticeLog) ? state.noticeLog : [];
                const original = history.some(notice => notice.noticeType === 'session-start-disclaimer' && notice.shownAt === baseline);
                const replay = history.some(notice => notice.shownAt === stamp && notice.details?.reason === 'user-requested-redisplay');
                const output = input.trajectory.output;
                const summary = /disclaimerShownAt/i.test(output) && /(?<!\b(?:not|never|without)\s)\b(?:updated|refreshed)\b/i.test(output) && /user[-\s]?requested[-\s]?redisplay/i.test(output);
                const denied = /(?:disclaimerShownAt[^.!?\n]*(?:not updated|not refreshed|unchanged)|(?:did not|never)\s+(?:update|refresh)[^.!?\n]*disclaimerShownAt)/i.test(output);
                process.exit(validStamp && original && replay && summary && !denied ? 0 : 1);
              } catch { process.exit(1); }

  - name: security-planner-disclaimer-source-missing
    prompt: |
      Start a new Security Planner project named `cadence-missing-source`. The required `disclaimer-language.instructions.md` file is unavailable. Follow the declared missing-source behavior and report what is blocked.

      Name the specific file you could not load, then say what this does to the session before any Phase 1 work.
    environment:
      files:
        - src: ../../.github/agents/security/security-planner.agent.md
          dest: .github/copilot-instructions.md
    tags:
      category: agent-behavior
      scenario: disclaimer-source-missing
    graders:
      - type: output-matches
        name: missing-source-halts
        config:
          # Order-insensitive: still requires the exact filename, an unavailability signal, and a halt signal.
          pattern: '(?is)(?=[\s\S]*disclaimer-language\.instructions\.md)(?=[\s\S]*(?:cannot|unable|unavailable|missing|could not|not found))(?=[\s\S]*(?:halt|stop|blocked))'
      - type: output-matches
        name: no-phase-work
        config:
          pattern: '(?is)(Phase 1 question|technology stack\?|deployment model\?|what does the system do\?)'
          negate: true

  - name: security-planner-phase6-no-drift-evidence
    prompt: |
      Resume Phase 6 for sample-service. The plan is complete through Phase 5 and includes T-WEB-001 and T-IDENTITY-001, but no Security Reviewer audit or diff report was supplied or confirmed. Perform the Phase 6 review behavior without inventing current-state evidence or dispatching another agent.

      In the final reply, explicitly report that implementation or security-plan
      drift was not assessed because current-state evidence is unavailable,
      name a user-run Security Reviewer audit or diff as the evidence-producing
      next step, and continue through the threat-model completeness verdict and
      Phase 6 human-review gate.
    agent_environment:
      files:
        - src: ../../.github/agents/security/security-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: fixtures/security-phase6/sample-service-state.json
          dest: .copilot-tracking/security-plans/sample-service/state.json
        - src: fixtures/security-phase6/sample-service-security-plan.md
          dest: .copilot-tracking/security-plans/sample-service/security-plan.md
      skills:
        - ../../.github/skills/project-planning/security-planning
    tags:
      category: agent-behavior
    constraints:
      max_agent_duration: 240s
      max_duration: 300s
    graders:
      - type: output-matches
        name: drift-not-assessed
        config:
          pattern: '(?is)(implementation drift|security[- ]plan drift).{0,160}(not assessed|unavailable|no current-state evidence)'
      - type: output-matches
        name: names-evidence-producing-step
        config:
          pattern: '(?is)security reviewer.{0,80}(audit|diff)'
      - type: output-matches
        name: completeness-continues
        config:
          pattern: '(?is)(threat[- ]model completeness|(?:verdict|status):\s*(?:PASS|INCOMPLETE)|review gap)'
      - type: output-matches
        name: no-reviewer-dispatch
        config:
          pattern: '(?i)\b(?:I|we) (?:have |just )?(?:dispatched|dispatching|invoked|invoking) (?:the )?Security Reviewer\b'
          negate: true

  - name: security-planner-phase6-with-drift-evidence
    prompt: |
      Resume Phase 6 for sample-service using the confirmed current-state report `.copilot-tracking/security/2026-08-31/security-report-001.md`.
      Baseline state: currentPhase=6, securityPlanFile=.copilot-tracking/security-plans/sample-service/security-plan.md.
      Baseline plan facts: T-WEB-001 expects request validation at src/api/gateway.ts; T-IDENTITY-001 leaves authorization open at src/auth/policy.ts.
      Confirmed report facts: WEB-INPUT PASS at src/api/gateway.ts and AUTHZ-OBJECT FAIL HIGH at src/auth/policy.ts.
      Present drift as proposed plan updates, then continue the ordinary completeness review. Do not mutate plan state or phase gates from the drift result.
    agent_environment:
      files:
        - src: ../../.github/agents/security/security-planner.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
          dest: .github/instructions/shared/disclaimer-language.instructions.md
        - src: fixtures/security-phase6/sample-service-state.json
          dest: .copilot-tracking/security-plans/sample-service/state.json
        - src: fixtures/security-phase6/sample-service-security-plan.md
          dest: .copilot-tracking/security-plans/sample-service/security-plan.md
        - src: fixtures/security-phase6/security-report-001.md
          dest: .copilot-tracking/security/2026-08-31/security-report-001.md
      skills:
        - ../../.github/skills/project-planning/security-planning
    tags:
      category: agent-behavior
    constraints:
      max_agent_duration: 240s
      max_duration: 300s
    graders:
      - type: output-matches
        name: security-planning-caution-before-drift
        config:
          pattern: '(?is)\*\*Disclaimer:\*\*\s*This agent is an assistive tool only\.\s*It does not provide legal, regulatory, or compliance advice and does not replace professional security review boards, penetration testing teams, compliance auditors, legal counsel, or other qualified human reviewers\.\s*The output consists of suggested actions and considerations to support a user''s own internal security review and decision[-\u2011]making\.\s*All security plans, threat models, security models, and mitigation recommendations generated by this tool must be independently reviewed and validated by appropriate security and compliance reviewers before use\.\s*Outputs from this tool do not constitute security approval, compliance certification, or regulatory sign[-\u2011]off\.[\s\S]*(validated controls|control drift|residual open risks|newly introduced threats|obsolete plan items)'
      - type: program
        name: drift-proposed-not-applied
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              const crypto = require('node:crypto');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const plan = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/security-plans/sample-service/security-plan.md'), 'utf8').replace(/\r\n/g, '\n');
                const unchanged = crypto.createHash('sha256').update(plan).digest('hex') === '063a40d6af8c41b372806b219ed8511792b4732bb22411f081149dc0a2002f5b';
                const output = input.trajectory.output;
                const proposal = /(?:validated controls?|control drift)/i.test(output) && /(?:proposed plan updates|proposal|recommend)/i.test(output);
                const applied = /\b(?:I|we)\s+(?:have\s+)?(?:applied|updated|modified)\b[^.!?\n]*(?:plan|drift)/i.test(output);
                process.exit(unchanged && proposal && !applied ? 0 : 1);
              } catch { process.exit(1); }
      - type: program
        name: phase6-gate-retained
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const state = JSON.parse(fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/security-plans/sample-service/state.json'), 'utf8'));
                const expected = { phase1: { gate: 'hard', confirmedAt: '2026-08-01T00:00:00Z' }, phase2: { gate: 'summary-and-advance' }, phase3: { gate: 'summary-and-advance' }, phase4: { gate: 'hard', confirmedAt: '2026-08-15T00:00:00Z' }, phase5: { gate: 'summary-and-advance' }, phase6: { gate: 'hard', confirmedAt: null } };
                const gates = state.phaseGates || {};
                const unchanged = Object.keys(gates).length === 6 && Object.entries(expected).every(([key, value]) => gates[key] && Object.entries(value).every(([field, content]) => gates[key][field] === content));
                const reply = input.trajectory.output;
                const summary = /(?:phase\s*6|review[^.!?\n]*handoff)/i.test(reply) && /(?:confirm|approval|hard gate|human review)/i.test(reply);
                process.exit(unchanged && state.currentPhase === 6 && state.handoffGenerated?.ado === false && state.handoffGenerated?.github === false && summary ? 0 : 1);
              } catch { process.exit(1); }
