# cspell:ignore degrad substitut unavailab expdes architectur priorit hypothes assum multiedit
stimuli:
  - name: experiment-designer-class-recipe
    prompt: |
      Design a minimum viable experiment for "Will adding a price slider increase conversion?" Lay out phases, hypothesis, and success metrics. Write the design under `.copilot-tracking/mve/` and report the path.
      In your response, list the phase headings, hypothesis, and success metrics before reporting the path.
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: experiment-designer-class-recipe-phase-marker-present
        config:
          pattern: '(?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)'
      - type: output-matches
        name: experiment-designer-class-recipe-tracking-file-write
        config:
          pattern: '(?i)\.copilot-tracking[-/\\](mve|plans)'
      - type: output-matches
        name: experiment-designer-class-recipe-no-source-edit
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b'
          negate: true

  - name: experiment-designer-conditional-ml-route
    prompt: |
      My persisted MVE context records `experiment type: machine learning`.
      We completed general hypothesis framing and are entering experiment
      design. State which reusable skills you load, what each owns, and what
      you would do if the conditional ML skill were unavailable.
    agent_environment:
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/project-planning/experiment-design
        - ../../.github/skills/data-science-engineering/ml-experimentation
    tags:
      category: agent-behavior
    graders:
      - type: output-matches
        name: always-loaded-general-skill
        config:
          pattern: '(?is)(experiment-design).*(hypothes|vetting|scope|general)'
      - type: output-matches
        name: conditional-ml-trigger
        config:
          pattern: '(?is)(machine[- ]learning|recorded experiment type|persisted (experiment )?type|experiment type[^.]{0,40}\bml\b)'
      - type: output-matches
        name: conditional-ml-skill-ownership
        config:
          pattern: '(?is)(?=.*ml-experimentation)(?=.*(reproducib|tracking|evaluation|readiness|environments?)).'
      - type: output-matches
        name: conditional-load-failure-condition
        config:
          pattern: '(?is)(unavailable|fails? to load|could not load|cannot load|missing|absent)'
      - type: output-matches
        name: conditional-failure-records-gap
        config:
          pattern: '(?is)(note|noting|record|recording|flag|flagging|mark|marking|state|stating|surface|surfacing)[^.]{0,80}(gap|limitation|absence|unavailab|missing)|(gap|limitation)[^.]{0,80}(note|record|flag|mark|state|surface)'
      - type: output-matches
        name: conditional-failure-continues-general
        config:
          pattern: '(?is)(continue|continuing|proceed|proceeding|still)[^.]{0,120}(experiment-design|general (coaching|design|guidance|framing|work))'
      - type: output-matches
        name: conditional-failure-reduces-ml-depth
        config:
          pattern: '(?is)(degrad|reduced depth|less depth|shallower|without ml|avoid (invent|assert|claim)|not (invent|assert|claim|substitut)|no ml-specific|missing ml-specific|ml-specific (guidance|coverage|detail|infrastructure|recommendation))'

  - name: experiment-designer-supported-classification
    prompt: |
      Start a Minimum Viable Experiment session and complete Phase 1 only. Use
      `2026-03-02` as the session date and `synthetic-checkout-latency` as the
      experiment name so the tracking path is deterministic.

      Synthetic facts from an internal platform team:

      - A synthetic checkout service returns confirmations slowly at a simulated peak.
      - The team measured that the slow step is a service-to-service call. It is not
        model inference and not a user-interface concern.
      - They want to know whether a proposed caching architecture can hold consistency
        under that peak.
      - Nobody has tested the caching approach. That is an assumption, not a measurement.

      Write the Phase 1 tracking artifact. In the final reply, summarize the
      classification and the evidence needed to resolve it. Do not continue
      past Phase 1.
    agent_environment:
      skills:
        - '../../.github/skills/project-planning/experiment-design'
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
    tags:
      category: agent-behavior
      lifecycle: supported-classification
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: file-matches
        name: expdes-supported-classification-type
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
          pattern: '(?is)experiment type.{0,160}architectur'
      - type: file-matches
        name: expdes-supported-classification-marker
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
          pattern: '(?m)^<!-- markdownlint-disable-file -->'
      - type: file-matches
        name: expdes-supported-classification-evidence-labels
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
          pattern: '(?is)(?=.*assum)(?=.*unknown).'
      - type: file-not-exists
        name: expdes-supported-classification-no-hypotheses
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/hypotheses.md

  - name: experiment-designer-ambiguous-classification
    prompt: |
      Start a Minimum Viable Experiment session and complete Phase 1 only. Use
      `2026-03-02` as the session date and `synthetic-signal-routing` as the
      experiment name so the tracking path is deterministic.

      Synthetic facts, none of them measured:

      - One person suggests a model could rank incoming signals.
      - Another says the routing service design is the real constraint.
      - A third thinks throughput at peak is the actual problem.
      - No measurement, baseline, or user observation exists for any of these.

      Write the Phase 1 tracking artifact. In the final reply, summarize the
      classification and the evidence needed to resolve it. Do not continue
      past Phase 1.
    agent_environment:
      skills:
        - '../../.github/skills/project-planning/experiment-design'
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
    tags:
      category: agent-behavior
      lifecycle: ambiguous-classification
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: file-matches
        name: expdes-ambiguous-classification-undetermined
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-signal-routing/context.md
          pattern: '(?is)experiment type.{0,160}undetermined'
      - type: program
        name: expdes-ambiguous-classification-output
        config:
          program: node
          args:
            - --eval
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              try {
                const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
                const context = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/mve/2026-03-02/synthetic-signal-routing/context.md'), 'utf8');
                const lines = context.split(/\r?\n/).map(line => line.replace(/[*`]/g, '').trim());
                const fields = lines.flatMap((line, index) => {
                  const field = /^(?:#{1,6}\s+)?experiment type\s*(?::\s*)?(.*)$/i.exec(line);
                  if (!field) return [];
                  const value = field[1].trim() || lines.slice(index + 1).find(candidate => candidate.length > 0) || '';
                  return [value];
                });
                const unresolved = fields.length === 1 && /^undetermined\b(?!\s+(?:is\s+)?(?:wrong|false|not)\b)/i.test(fields[0]) &&
                  !/\b(?:classification|experiment type)\s*(?:is|:)\s*(?:AI|ML|architecture|performance)\b/i.test(fields[0]);
                const reply = input.trajectory.output;
                const summary = /(?<!\b(?:not|never)\s)\b(?:undetermined|uncertain|ambiguous|unresolved|not yet classified)\b/i.test(reply);
                const evidence = /\b(?:evidence|measurements?|baselines?|observations?|clarif\w*)\b/i.test(reply);
                const contradiction = /(?:classification|experiment type)\s*(?:is|:)\s*(?:AI|ML|architecture|performance)\b/i.test(reply);
                process.exit(unresolved && summary && evidence && !contradiction ? 0 : 1);
              } catch { process.exit(1); }
      - type: file-not-exists
        name: expdes-ambiguous-classification-no-hypotheses
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-signal-routing/hypotheses.md

  - name: experiment-designer-progressive-hypotheses
    prompt: |
      Resume the staged Minimum Viable Experiment session at
      `.copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/`. Phase 1 is
      confirmed and its recorded context is unchanged.

      Move to hypothesis formation and write that phase's tracking artifact. Do not
      run vetting or experiment design yet.
    agent_environment:
      skills:
        - '../../.github/skills/project-planning/experiment-design'
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
        - src: fixtures/experiment-lifecycle/classified-context.txt
          dest: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
    tags:
      category: agent-behavior
      lifecycle: progressive-write
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: file-matches
        name: expdes-progressive-hypotheses-template
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/hypotheses.md
          pattern: '(?is)we believe.{0,600}we will test this by.{0,600}we will know'
      - type: file-matches
        name: expdes-progressive-hypotheses-priority
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/hypotheses.md
          pattern: '(?i)priorit'
      - type: file-matches
        name: expdes-progressive-context-preserved
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
          pattern: 'EV07-CTX-PRESERVE-001'
      - type: file-not-exists
        name: expdes-progressive-no-vetting
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/vetting.md
      - type: file-not-exists
        name: expdes-progressive-no-design
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/experiment-design.md

  - name: experiment-designer-weak-evidence-rollback
    prompt: |
      Resume the staged Minimum Viable Experiment session at
      `.copilot-tracking/mve/2026-03-02/synthetic-returns-triage/`. You are in the
      vetting phase.

      New synthetic information from the team: there is no executive sponsor, the
      team cannot agree what the problem statement means, and nobody has said what
      happens after either outcome.

      Decide how this session should proceed and update the tracking artifacts to
      match that decision.
    agent_environment:
      skills:
        - '../../.github/skills/project-planning/experiment-design'
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
        - src: fixtures/experiment-lifecycle/weak-evidence-context.txt
          dest: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/context.md
        - src: fixtures/experiment-lifecycle/weak-evidence-hypotheses.txt
          dest: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/hypotheses.md
        - src: fixtures/experiment-lifecycle/weak-evidence-vetting.txt
          dest: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/vetting.md
    tags:
      category: agent-behavior
      lifecycle: weak-evidence-rollback
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: output-matches
        name: expdes-rollback-returns-earlier-phase
        config:
          pattern: '(?is)(return|back to|revisit|earlier phase).{0,200}(phase\s*[12]|problem statement|hypothes)'
      - type: file-matches
        name: expdes-rollback-vetting-records-gaps
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/vetting.md
          pattern: '(?is)(?=.*sponsor)(?=.*problem statement)(?=.*next step).'
      - type: file-matches
        name: expdes-rollback-context-preserved
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/context.md
          pattern: 'EV07-WEAK-CTX-PRESERVE-001'
      - type: file-not-exists
        name: expdes-rollback-no-design
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/experiment-design.md
      - type: file-not-exists
        name: expdes-rollback-no-plan
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/mve-plan.md
      - type: file-not-exists
        name: expdes-rollback-no-backlog-brief
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-returns-triage/backlog-brief.md

  - name: experiment-designer-backlog-consent
    prompt: |
      Review the completed Minimum Viable Experiment plan staged at
      `.copilot-tracking/mve/2026-03-02/synthetic-invoice-matching/mve-plan.md` and
      summarize what it commits to.

      I am not asking for backlog work items, and I do not want any created.

      Report your summary in your response only.
    agent_environment:
      skills:
        - '../../.github/skills/project-planning/experiment-design'
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
        - src: fixtures/experiment-lifecycle/completed-mve-plan.txt
          dest: .copilot-tracking/mve/2026-03-02/synthetic-invoice-matching/mve-plan.md
    tags:
      category: agent-behavior
      lifecycle: backlog-consent
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: file-not-exists
        name: expdes-consent-no-backlog-brief
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-invoice-matching/backlog-brief.md
      - type: diff-empty
        name: expdes-consent-workspace-unchanged
      - type: tool-calls
        name: expdes-consent-no-tracker-tool
        config:
          disallowed:
            - name: '(?i)(azure.?devops|github.?issue|jira|backlog|work.?item)'

  - name: experiment-designer-failed-tracking-write
    prompt: |
      Resume the staged Minimum Viable Experiment session at
      `.copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/`. Phase 1 is
      confirmed.

      Move to hypothesis formation and write that phase's tracking artifact using
      PowerShell `Set-Content`. If the write fails, report exactly what happened and
      what durable state remains. Do not claim the artifact was saved.
    agent_environment:
      skills:
        - '../../.github/skills/project-planning/experiment-design'
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
        - src: fixtures/experiment-lifecycle/classified-context.txt
          dest: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
    simulation:
      # Shell names alias one another, but non-shell writers resolve by exact name,
      # so every write path is denied or the agent can silently succeed elsewhere.
      tool_overrides:
        powershell:
          patterns:
            - match: '(Set-Content|Out-File|WriteAllText)'
              output: Synthetic MVE tracking write failure
              is_error: true
        create:
          output: Synthetic MVE tracking write failure
          is_error: true
        edit:
          output: Synthetic MVE tracking write failure
          is_error: true
        write:
          output: Synthetic MVE tracking write failure
          is_error: true
        apply_patch:
          output: Synthetic MVE tracking write failure
          is_error: true
        multiedit:
          output: Synthetic MVE tracking write failure
          is_error: true
    tags:
      category: agent-behavior
      lifecycle: failed-tracking-write
    constraints:
      max_agent_duration: 110s
      max_duration: 150s
    graders:
      - type: tool-calls
        name: expdes-failed-save-writer-error-observed
        config:
          required:
            - name: '^(?:powershell|bash|shell|create|edit|write|apply_patch|multiedit)$'
              result: '(?i)Synthetic MVE tracking write failure'
      - type: file-matches
        name: expdes-failed-save-context-preserved
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/context.md
          pattern: '(?is)^<!-- markdownlint-disable-file -->.*EV07-CTX-PRESERVE-001'
      - type: file-not-exists
        name: expdes-failed-save-no-hypotheses
        config:
          path: .copilot-tracking/mve/2026-03-02/synthetic-checkout-latency/hypotheses.md
      - type: diff-empty
        name: expdes-failed-save-workspace-unchanged
      - type: output-matches
        name: expdes-failed-save-reports-failure
        config:
          pattern: '(?is)(?=.*(fail|error|unable))(?=.*(not\s+(?:\w+\s+){0,3}(?:saved|written|persisted|created)|nothing was (?:saved|written|persisted)|no partial)).'

  - name: experiment-designer-research-preparation
    prompt: |
      Phase 1 identified a material unknown: we do not know whether a prior
      internal trial already answered our proposed durability question. Before
      Phase 2, explain the Research route, what returns to `context.md`, and
      whether that result validates the hypothesis. Name the Research skill you
      would activate.
    agent_environment:
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/project-planning/experiment-design
        - ../../.github/skills/rpi/rpi-research
    tags:
      category: agent-behavior
      scenario: experiment-research-preparation
    graders:
      - type: output-matches
        name: experiment-research-prep-route
        config:
          pattern: '(?is)(?=.*(?:\b)rpi-research\b)(?=.*context\.md).*'
      - type: output-matches
        name: experiment-research-prep-status
        config:
          pattern: '(?is)(supported).*(contradicted).*(inconclusive)'
      - type: output-matches
        name: experiment-research-not-validation
        config:
          pattern: '(?is)(?=.*(rpi-research|research))(?=.*(cannot|does\W{0,4}not|never|is\W{0,4}not|not\W{0,4}a))(?=.*(validate|validation|verdict|experiment result|success criteria))(?=.*(preparation|prepare|evidence|input)).*'

  - name: experiment-designer-research-unavailable
    prompt: |
      A current platform constraint is required before one Phase 2 hypothesis
      can be formed, but the Research capability is unavailable. State how you
      record the gap, which hypothesis is blocked, and whether unrelated
      framing of independent hypotheses continues.
    agent_environment:
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
      skills:
        - ../../.github/skills/project-planning/experiment-design
        - ../../.github/skills/rpi/rpi-research
    tags:
      category: agent-behavior
      scenario: experiment-research-unavailable
    graders:
      - type: output-matches
        name: experiment-research-gap-recorded
        config:
          pattern: '(?is)^(?=[\s\S]*(?:unavailable|blocked))(?=[\s\S]*(?:\b(?:record|retain|mark|note|noting|log|logged|logging|document|capture|flag|track)\w*[^.\r\n]{0,200}(?:gap|unknown|inconclusive|unresolved)|(?:gap|unknown|inconclusive|unresolved)[^.\r\n]{0,200}\b(?:record|retain|mark|note|noting|log|logged|logging|document|capture|flag|track)))'
      - type: output-matches
        name: experiment-research-dependent-stop
        config:
          pattern: '(?is)^(?![\s\S]*\b(?:cannot|can[\x27\u2019]t|will\s+not|won[\x27\u2019]t|do\s+not|don[\x27\u2019]t|must\s+not|should\s+not)\s+(?:continue|proceed)\b(?:(?!\bbut\b)[^.;,\r\n]){0,60}\b(?:unrelated|other|independent)\b)(?![\s\S]*\b(?:unrelated|other|independent)\b[^.;,\r\n]{0,60}\b(?:cannot|can[\x27\u2019]t|will\s+not|won[\x27\u2019]t|must\s+not|should\s+not|does(?:\s+no|n[\x27\u2019])t|do\s+not|don[\x27\u2019]t)\s+(?:continue|proceed)\b)(?![\s\S]*\b(?:do\s+not|don[\x27\u2019]t|never|will\s+not|won[\x27\u2019]t|should(?:\s+no|n[\x27\u2019])t|must\s+not)\s+(?:stop|pause|block|hold|halt|defer)\b[^.;,\r\n]{0,80}\b(?:dependent|affected|hypothes(?:is|es)))(?=[\s\S]*(?:\b(?:stop|pause|block|hold|halt|defer|wait|cannot\s+proceed|can[\x27\u2019]t\s+proceed)\w*[^.\r\n]{0,200}(?:dependent|affected|hypothes(?:is|es))|(?:dependent|affected|hypothes(?:is|es))[^.\r\n]{0,200}\b(?:stop|pause|block|hold|halt|defer|wait|cannot\s+proceed|can[\x27\u2019]t\s+proceed)\w*))(?=[\s\S]*(?:\b(?:continue|proceed|prioriti[sz]\w*)[^.\r\n]{0,160}\b(?:unrelated|other|independent)\b|\b(?:unrelated|other|independent)\b[^.\r\n]{0,160}\b(?:continue|proceed)\w*|\b(?:continue|proceed)\w*[^.\r\n]{0,160}\b(?:do\s+not|don[\x27\u2019]t|does(?:\s+no|n[\x27\u2019])t)\s+depend))'
      - type: output-matches
        name: experiment-research-unavailable-no-validated-claim
        config:
          pattern: '(?i)(hypothesis|assumption)\s+(is|has been|was)\s+(validated|confirmed|proven)'
          negate: true

  - name: experiment-designer-executes-convergence-research
    prompt: |
      Resume synthetic experiment `synthetic-batching` after Phase 1. I confirm
      convergence Research task `synthetic-batching-recommendation` using only
      the staged experiment evidence. Preserve the synthetic session date
      `2026-09-21` in paths, including the Research date folder. Perform it now under the session evidence root and write
      the primary Research artifact with the recommendation, alternative,
      evidence IDs, confidence, and unresolved assumptions. Stop after the
      Research return; reconciling `context.md` is a separate step. The
      experiment session directory
      `.copilot-tracking/mve/2026-09-21/synthetic-batching/` is the alternate
      Research evidence root; no execution or hypothesis validation has occurred. Research posture:
      `focused`. The staged evidence file is the only source; explicit limit:
      one research cycle.
    agent_environment:
      files:
        - src: ../../.github/agents/experimental/experiment-designer.agent.md
          dest: .github/copilot-instructions.md
        - src: fixtures/rpi-depth/experiment-context.md
          dest: .copilot-tracking/mve/2026-09-21/synthetic-batching/context.md
        - src: fixtures/rpi-depth/experiment-context.md
          dest: evidence/experiment-evidence.md
        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
        - src: ../../.github/instructions/hve-core/copilot-tracking.instructions.md
          dest: .github/instructions/hve-core/copilot-tracking.instructions.md
      skills:
        - ../../.github/skills/project-planning/experiment-design
        - ../../.github/skills/rpi/rpi-research
    tags:
      category: agent-behavior
