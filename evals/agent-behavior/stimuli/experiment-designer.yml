        - src: ../../.github/instructions/experimental/experiment-designer.instructions.md
          dest: .github/instructions/experimental/experiment-designer.instructions.md
      skills:
        - ../../.github/skills/project-planning/experiment-design
    tags:
      category: agent-behavior
      scenario: experiment-rpi-outcome-execution
    graders:
      - type: file-exists
        name: experiment-outcome-record-exists
        config:
          path: .copilot-tracking/mve/2026-09-21/synthetic-batching/outcome.md
      - type: program
        name: experiment-outcome-binds-evidence
        config:
          program: node
          args:
            - -e
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              const { createHash } = require('node:crypto');
              let passed = false;
              try {
                const root = process.env.EVALUATE_WORKSPACE;
                const sources = [
                  '.copilot-tracking/mve/2026-09-21/synthetic-batching/mve-plan.md',
                  '.copilot-tracking/plans/2026-09-21/synthetic-batching-execution-plan.md',
                  '.copilot-tracking/changes/2026-09-21/synthetic-batching-execution-changes.md',
                  '.copilot-tracking/reviews/logs/2026-09-21/synthetic-batching-execution-review.md'
                ];
                const text = fs.readFileSync(path.join(root, '.copilot-tracking/mve/2026-09-21/synthetic-batching/outcome.md'), 'utf8');
                if (text.length > 100000) throw new Error('Oversized outcome');
                const bindings = new Map(sources.map(source => [source, []]));
                let source;
                for (const token of text.matchAll(/(\.copilot-tracking\/[^\s|`\])]+\.md)|\b([a-f0-9]{64})\b/gi)) {
                  if (token[1]) source = token[1];
                  else if (bindings.has(source)) { bindings.get(source).push(token[2].toLowerCase()); source = undefined; }
                }
                passed = sources.every(source => {
                  const values = bindings.get(source);
                  return values.length === 1 && values[0] === createHash('sha256').update(fs.readFileSync(path.join(root, source))).digest('hex');
                });
              } catch { passed = false; }
              console.log(JSON.stringify({ name: 'experiment-outcome-binds-evidence', kind: 'code', passed, score: Number(passed), evidence: 'Verify the four outcome bindings against artifact bytes.' }));
      - type: program
        name: experiment-outcome-separates-status-and-verdict
        config:
          program: node
          args:
            - -e
            - |
              const fs = require('node:fs');
              const path = require('node:path');
              const codes = new Set();
              class Stop extends Error {}
              const fail = code => { codes.add(code); throw new Stop(code); };
              const check = run => { try { run(); } catch (error) { if (!(error instanceof Stop)) throw error; } };
              try {
                const root = process.env.EVALUATE_WORKSPACE;
                const session = '.copilot-tracking/mve/2026-09-21/synthetic-batching/';
                const read = name => {
                  const file = path.join(root, name);
                  let size;
                  try { const stat = fs.statSync(file); if (!stat.isFile()) throw new Error('Not a file'); size = stat.size; } catch { fail('read-error'); }
                  if (size > 100000) fail('oversized-input');
                  try { return fs.readFileSync(file, 'utf8'); } catch { fail('read-error'); }
                };
                const plan = read(session + 'mve-plan.md');
                const results = read(session + 'results.md');
                const review = read('.copilot-tracking/reviews/logs/2026-09-21/synthetic-batching-execution-review.md');
                const raw = read(session + 'outcome.md');
                if (!/at least 20%/i.test(plan) || !/below 1%/i.test(plan)) fail('criteria-mismatch');
                const values = (value, pattern) => [...value.matchAll(pattern)].map(match => match[1].trim().toLowerCase());
                const single = (found, missing, conflicting) => {
                  const distinct = new Set(found);
                  if (distinct.size === 0) fail(missing);
                  if (distinct.size > 1) fail(conflicting);
                  return found[0];
                };
                const measure = pattern => single(values(results, pattern).map(Number), 'invalid-measurement', 'invalid-measurement');
                const baseline = measure(/Unbatched median latency:\s*([\d.]+)/gi);
                const treatment = measure(/Batched median latency:\s*([\d.]+)/g);
                const sample = measure(/Synthetic requests:\s*([\d.]+)/gi);
                const errorRate = measure(/Batched errors:\s*([\d.]+)/gi);
                if (![baseline, treatment, sample, errorRate].every(Number.isFinite) || baseline <= 0 || treatment < 0 || sample <= 0 || errorRate < 0 || errorRate > 100) fail('invalid-measurement');
                const reduction = (baseline - treatment) / baseline * 100;
                const expected = reduction >= 20 && errorRate < 1 ? 'validated' : 'invalidated';
                const decision = expected === 'validated' ? 'go' : 'no-go';
                // Lines under another hypothesis heading cannot supply H1's labeled outcome.
                const plain = [];
                const scoped = [];
                let owner = null;
                let ownerLevel = 0;
                for (const line of raw.replace(/\r\n?/g, '\n').replace(/[*`]/g, '').replace(/(\d)[^\S\n]*(?:%|per\s?cent\b)/gi, '$1%').split('\n')) {
                  const heading = /^(#{1,6})\s+(.*)$/.exec(line);
                  const body = heading ? heading[2] : line;
                  if (heading) {
                    const hypothesis = /^(?:hypothesis\s+)?(H\d+)\b/i.exec(body.trim());
                    if (hypothesis) { owner = hypothesis[1].toUpperCase(); ownerLevel = heading[1].length; }
                    else if (owner !== null && heading[1].length <= ownerLevel) owner = null;
                  }
                  plain.push(body);
                  if (owner === null || owner === 'H1') scoped.push(body);
                }
                const text = plain.join('\n');
                const scopedText = scoped.join('\n');
                check(() => {
                  const verdicts = [
                    ...values(text, /\bH1\b[^\S\n]*(?:(?:hypothesis\s+)?(?:outcome|verdict)[^\S\n]*)?(?:[|:]|\bis\b|\n)\s*(?:(?:hypothesis\s+)?(?:outcome|verdict)\s*[:|]\s*)?(validated|invalidated|mixed|inconclusive|not-evaluable)\b/gi),
                    ...values(scopedText, /^\|?[^\S\n]*(?:hypothesis\s+)?(?:outcome|verdict)[^\S\n]*(?:[:|]|\n)\s*(validated|invalidated|mixed|inconclusive|not-evaluable)\b/gim)
                  ];
                  if (single(verdicts, 'missing-field', 'conflicting-field') !== expected) codes.add('wrong-verdict');
                });
                check(() => {
                  if (single(values(text, /(?:downstream decision|decision)\s*(?:[:|]|\n)\s*(go|no-go|adjust)\b/gi), 'missing-field', 'conflicting-field') !== decision) codes.add('wrong-decision');
                });
                check(() => {
                  const reviewExecution = single(values(review, /^Review execution:\s*(\w+)/gim), 'review-mismatch', 'review-mismatch');
                  const reviewOutcome = single(values(review, /^Review outcome:\s*(\w+)/gim), 'review-mismatch', 'review-mismatch');
                  const reportedExecution = single(values(text, /(?:Review execution|execution status)\s*(?:[:|]|\n)\s*(\w+)/gi), 'missing-field', 'conflicting-field');
                  const reportedOutcome = single(values(text, /(?:Review outcome|execution outcome)\s*(?:[:|]|\n)\s*(\w+)/gi), 'missing-field', 'conflicting-field');
                  if (reportedExecution !== reviewExecution || reportedOutcome !== reviewOutcome) codes.add('review-mismatch');
                });
                const metric = (pattern, actual) => check(() => {
                  if (!(Math.abs(single(values(text, pattern).map(Number), 'missing-field', 'conflicting-field') - actual) < 0.001)) codes.add('metric-mismatch');
                });
                metric(/(?:latency (?:reduction|improvement|decrease)|median (?:reduction|improvement|decrease))\s*(?:[:|]|\n)\s*([\d.]+)%/gi, reduction);
                metric(/(?:sample size|synthetic requests)\s*(?:[:|]|\n)\s*([\d.]+)/gi, sample);
                metric(/(?:error rate|batched errors)\s*(?:[:|]|\n)\s*([\d.]+)%/gi, errorRate);
                const anomalies = values(text, /anomal(?:y|ies)\s*[:|]\s*([^\n|]*)/gi);
                if ((anomalies.length === 0 && !/\bno anomal(?:y|ies)\b/i.test(text)) || anomalies.some(value => !/^(?:none|no\b)/.test(value))) codes.add('anomaly-mismatch');
                if (!/\bconfidence\b/i.test(text)) codes.add('missing-confidence');
                const unchanged = /(?:criteri[^.\n]*(?:unchanged|not changed)|(?:unchanged|pre[- ]?committed) criteria|divergence\s*[:|]\s*none|no (?:post-start |criteria )?divergence)/i.test(text);
                const changed = /criteri[^.\n]*(?:changed to|lowered|relaxed)/i.test(text) ||
                  /(?:criteri\w*|threshold\w*)[^.\n]*\bchanged to\b/i.test(text) ||
                  /(?:criteri\w*|threshold\w*)\s+(?:\w+\s+){0,3}?(?:was|were|is|are|has been|have been|got)\s+(?:(?!not\b|never\b)\w+\s+)?(?:changed|lowered|relaxed|loosened|reduced|revised|adjusted|modified)\b/i.test(text) ||
                  /(?:criteri\w*|threshold\w*)\s+(?:changed|lowered|relaxed|loosened|reduced|revised|adjusted|modified)\s+to\b/i.test(text) ||
                  /(?<!\bnot\s|\bnever\s|n't\s)\b(?:changed|lowered|relaxed|loosened|revised|adjusted|modified)\s+(?:the\s+|our\s+|its\s+)?(?:\w+\s+){0,2}?(?:criteri\w*|threshold\w*)/i.test(text);
                const boundaries = text.split(/(?<!\d)\.(?!\d)|[\n;]/).filter(sentence => /criteri|threshold|success requires/i.test(sentence)).every(sentence =>
                  [...sentence.matchAll(/at least\s+([\d.]+)%/gi)].every(match => Number(match[1]) === 20) &&
                  [...sentence.matchAll(/(?:below|under|less than)\s+([\d.]+)%/gi)].every(match => Number(match[1]) === 1));
                if (!unchanged || changed || !boundaries || !/(?<![\d.])20%/.test(text) || !/(?<![\d.])1%/.test(text)) codes.add('criteria-mismatch');
              } catch (error) { if (!(error instanceof Stop)) codes.add('ambiguous-input'); }
              const passed = codes.size === 0;
              console.log(JSON.stringify({ name: 'experiment-outcome-separates-status-and-verdict', kind: 'code', passed, score: Number(passed), evidence: 'Compare H1 with supplied measurements and preserve independent Review values.', metadata: { failureCodes: [...codes].sort() } }));
