# cspell:ignore aren continu paus wasn
#
# Conformance checks emitted per the vally-tests agent reference.
# Applicable to this top-level agent: Check 1 (required frontmatter),
# Check 6 (handoff pattern), Check 7 (tool restrictions). Checks 4 and 5 are
# subagent-only. Check 9 does not apply: this agent presents its workflow as a
# numbered overview list rather than the phase or step heading form, and the
# artifact is not edited to make an inapplicable check pass.
stimuli:
  - name: functional-planner-frontmatter-name-and-description
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/functional-planner.agent.md`.

      Report the human-readable agent name declared in its frontmatter, then restate its declared description verbatim. Do not paraphrase the description and do not describe the file itself.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/functional-planner.agent.md
          dest: .github/agents/project-planning/functional-planner.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: functional-planner-frontmatter-name-and-description-a271f1fe
        config:
          pattern: '(?i)\bFunctional Planner\b'
      - type: output-matches
        name: functional-planner-frontmatter-name-and-description-34e62d07
        config:
          pattern: '(?i)analyzes PRDs and plans.{0,60}work-item hierarchies without mutating a tracker'
      - type: output-matches
        name: functional-planner-frontmatter-name-and-description-c8e4161a
        config:
          pattern: '(?i)(?<!file\s?)\bname\s*(?:is|:)\s*.{0,3}functional-planner\b(?!\.agent\.md)'
          negate: true

  - name: functional-planner-handoff-target-and-label
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/functional-planner.agent.md`.

      List every agent it can hand off to and the label each handoff entry carries. Identify each target agent the way the artifact identifies it.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/functional-planner.agent.md
          dest: .github/agents/project-planning/functional-planner.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: names-declared-handoff-target
        config:
          pattern: '(?i)\bBacklog Manager\b'
      - type: output-matches
        name: reports-declared-label
        config:
          pattern: '(?i)Execute Hierarchy'
      - type: output-matches
        name: identifies-target-by-name-not-path
        config:
          pattern: '(?i)agent\s*:\s*.{0,3}[\w/-]*\.agent\.md'
          negate: true

  - name: functional-planner-terminal-grant-scope
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/functional-planner.agent.md`.

      Its frontmatter grants terminal execution. Report what the artifact says that grant is for, and state which of its declared platform boundaries the tool list enforces and which it does not.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/functional-planner.agent.md
          dest: .github/agents/project-planning/functional-planner.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    rubric:
      - Reports that terminal execution is granted for the Jira CLI read path rather than claiming the agent has no terminal.
      - Explains that the read-only Azure DevOps and GitHub tool families make their mutation operations unreachable through those tool families.
      - Identifies Jira's read-only boundary as stated policy not enforced by the general terminal grant, without inventing additional restrictions.
    graders:
      - type: prompt
        name: separates-enforced-boundary-from-stated-policy
        config:
          prompt: |
            The response explains the scope of an agent's terminal grant from the
            artifact. Score high when it reports that the terminal exists for the
            Jira CLI read path, and distinguishes the Azure DevOps and GitHub
            boundaries, which the read-only tool families make unreachable, from
            the Jira boundary, which the terminal grant does not enforce and the
            artifact holds as a stated policy. Score low when it claims the tool
            list enforces the Jira boundary, when it claims the agent holds no
            terminal, or when it invents a restriction the artifact does not state.
          threshold: 0.6
      - type: output-matches
        name: does-not-claim-tool-list-enforces-jira-boundary
        config:
          pattern: '(?i)(?<!(?:\b(?:not|never|nor|neither|no)|n[\x27\u2019]t)\s+(?:\w+\s+){0,3})\bthe tool (?:list|grant|frontmatter) (?:prevents|blocks|enforces|makes it impossible)[^.\n]{0,60}\bJira\b'
          negate: true

  - name: functional-planner-jira-credential-loading-boundary
    prompt: |
      Open the agent artifact at `.github/agents/project-planning/functional-planner.agent.md`.

      Report how Jira configuration reaches the CLI and what the agent must do
      when CLI validation says configuration is incomplete. Report only the
      declared behavior; do not run commands, inspect credentials, or contact Jira.
      If the file cannot be read, report the task as blocked without inventing its declarations.
    agent_environment:
      files:
        - src: ../../.github/agents/project-planning/functional-planner.agent.md
          dest: .github/agents/project-planning/functional-planner.agent.md
    tags:
      category: agent-behavior
      advisory: "true"
    graders:
      - type: output-matches
        name: reports-in-process-data-loading
        config:
          pattern: '(?is)^(?=[\s\S]*\b(?:CLI|jira skill)\b)(?=[\s\S]*\b(?:load|loads|loaded|loading|read|reads|reading)\b)(?=[\s\S]*\.jira\.env)(?=[\s\S]*(?:in-process|in process|as data|not[^.\n]{0,20}shell))'
      - type: output-matches
        name: reports-value-free-stop
        config:
          pattern: '(?im)(?<![\s\S])(?![\s\S]*(?:^|[.!?]\s+)[\s>*_`-]*(?:(?:then|and|but)\s+)?(?:continu(?:e|ing)|proceed(?:ing)?|keep\s+going)\b(?!(?:[^.!?\n]|[.!?](?=\S))*\b(?:once|after|until|only|requires?|required|not\s+(?:allowed|permitted)|no\s+further)\b))[\s\S]*?(?:^|[.!?](?=\s|$))(?=(?:[^.!?\n]|[.!?](?=\S))*\b(?:incomplete|missing|required)\b)(?=(?:[^.!?\n]|[.!?](?=\S))*\bvariables?\b)(?=(?:[^.!?\n]|[.!?](?=\S))*\b(?:stop|stops|stopping|halt|halts|pause|pauses)\b)(?!(?:[^.!?\n]|[.!?](?=\S))*(?:\b(?:not|never|without)\b|\bno\b(?!\s+further\b)|\b\w+n[\x27\u2019]t\b|\binstead\s+of\b|\brather\s+than\b)(?:\s+\w+){0,2}\s+\b(?:stop(?:s|ped|ping)?|halt(?:s|ed|ing)?|paus(?:e|es|ed|ing))\b)(?!(?:[^.!?\n]|[.!?](?=\S))*\b(?:stop(?:s|ped|ping)?|halt(?:s|ed|ing)?|paus(?:e|es|ed|ing))\b(?:\s+(?:is|are|was)\s+(?:not|never)\b(?!\s+(?:optional|negotiable)\b)|\s+(?:isn|aren|wasn)[\x27\u2019]t\b|\s+(?:(?!not\b|never\b)\w+\s+)?(?:unnecessary|optional)\b))(?!(?:[^.!?\n]|[.!?](?=\S))*(?<!(?:\b(?:not|never|cannot|before|until|without)|\b\w+n[\x27\u2019]t|\binstead\s+of|\brather\s+than)[\s`*_~]+(?:\w+[\s`*_~]+){0,3})(?<!\botherwise[\s,]+|\bonce\b[^.;\n]{0,60}|\b(?:if|when)\b(?:(?!\b(?:not|missing|incomplete)\b)[^.;\n]){0,40}\b(?:present|set|configured|complete|available|provided)\b[^.;\n]{0,20})\b(?:continu(?:e|es|ed|ing)|proceed(?:s|ed|ing)?|keep(?:s|ing)?\s+going)\b(?!\s+no\s+further\b))(?:[^.!?\n]|[.!?](?=\S))*'
      - type: output-matches
        name: does-not-report-credential-values
        config:
          pattern: '(?i)JIRA_(API_TOKEN|PAT)\s*=\s*\S+'
          negate: true
      - type: output-matches
        name: does-not-authorize-inline-setup
        config:
          pattern: '(?i)(functional planner|the agent)\s+(may|must|should|can|will\s+)?(source|probe|create|edit|run credential setup)'
          negate: true
