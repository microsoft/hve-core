- name: dependency-reviewer-class-recipe
  prompt: |
    Review this dependency change. Report at least one finding with an explicit severity and recommendation:
    ```diff
    -"lodash": "^4.17.21"
    +"lodash": "^3.0.0"
    ```
  tags:
    category: agent-behavior
    agent: dependency-reviewer
  graders:
  - type: output-matches
    name: dependency-reviewer-class-recipe-findings-table-present
    config:
      pattern: (?is)^(?=[\s\S]*\blodash\b)(?=[\s\S]*\b(?:critical|high|medium|low)\b)(?=[\s\S]*\b(?:upgrade|retain|keep|reject|avoid|restore|pin|replace|recommend)\b)(?=[\s\S]*(?:3\.0\.0|4\.17\.21|downgrade|older|outdated|vulnerab))
  - type: output-matches
    name: dependency-reviewer-class-recipe-severity-vocab
    config:
      pattern: (?i)(critical|high|medium|low|info|severity|warning)
  - type: output-matches
    name: dependency-reviewer-class-recipe-no-source-edit
    config:
      pattern: (?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b
      negate: true
- name: documentation-audit-class-recipe
  prompt: |
    Plan a documentation coverage audit for the small synthetic `docs/` tree
    supplied in this workspace. Do not imply coverage of a larger repository.
    Write the plan to `.copilot-tracking/documentation/audit-plan.md`.
    In your response, list the ordered phase headings and a concrete completion
    condition for each phase before reporting the path you wrote. Do not perform
    the audit or change the documentation itself.
  agent_environment:
    files:
    - src: fixtures/documentation-audit.txt
      dest: docs/README.md
  tags:
    category: agent-behavior
    agent: documentation
  graders:
  - type: output-matches
    name: lists-phases
    config:
      pattern: (?im)(?:^\s*(?:#{2,3}\s+|\d+[.)]\s+)(?:[^\r\n]*\b(?:inventory|assess|review|prioriti[sz]e|report|validate|discover|define|audit)\b)[^\r\n]*\r?\n[\s\S]+?){2}
  - type: program
    name: success-criteria
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const output = input.trajectory.output.replace(/[*`]/g, '');
          const headings = [...output.matchAll(/^\s*(?:#{2,3}\s+|\d+[.)]\s+)[^\r\n]*\b(?:inventory|assess|review|prioriti[sz]e|report|validate|discover|define|audit)\b[^\r\n]*$/gim)];
          const complete = headings.length >= 2 && headings.every((heading, index) => {
            const section = output.slice(heading.index + heading[0].length, headings[index + 1]?.index ?? output.length);
            return /\b(?:success criteria|completion (?:condition|criteria)|done when|complete when|exit criteria)\s*[:\-]?\s*[^\r\n]{15,}/i.test(section) &&
              /\b(?:files?|pages?|coverage|gaps?|findings?|evidence|owners?|inventory|links?|documents?|matrix)\b/i.test(section);
          });
          process.exit(complete ? 0 : 1);
        } catch { process.exit(1); }
  - type: program
    name: documentation-audit-class-recipe-tracking-file-write
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        const path = require('node:path');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const relative = '.copilot-tracking/documentation/audit-plan.md';
          const plan = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, relative), 'utf8');
          const headings = plan.match(/^\s*(?:#{2,3}\s+|\d+[.)]\s+)\S.+$/gm) || [];
          process.exit(headings.length >= 2 && plan.length >= 100 && /\bdocs\//i.test(plan) && input.trajectory.output.includes(relative) ? 0 : 1);
        } catch { process.exit(1); }
  - type: output-matches
    name: documentation-audit-class-recipe-no-source-edit
    config:
      pattern: (?i)(?<!(?:\b(?:not|never|without)|n[\x27\u2019]t)\s+(?:(?:yet|ever|actually|explicitly|intentionally|really|previously)\s+)*)\b(?:created|wrote|modified|edited|patched|added)\s+\S{0,40}(?:\.cs|\.py|\.ts|\.js|package\.json)\b
      negate: true
- name: documentation-drift-class-recipe
  prompt: |
    Review the following PR diff for documentation drift. Do not ask for more context; analyze only what is shown below.

    ```diff
    --- a/src/cli.py
    +++ b/src/cli.py
    @@ -10,6 +10,9 @@ def build_parser():
         parser.add_argument("--output", help="Output file path")
    +    parser.add_argument(
    +        "--strict",
    +        action="store_true",
    +        help="Fail on any warning instead of continuing",
    +    )
         return parser
    ```

    The PR adds a new `--strict` CLI flag but does not update `README.md`, `CHANGELOG.md`, or the `--help` examples. Identify the documentation gaps.

    Report your findings as a markdown table with the columns `Finding | Severity | Recommendation`, using severity levels of High, Medium, or Low. Do not edit or rewrite any source files.
  tags:
    category: agent-behavior
    agent: documentation
  graders:
  - type: output-matches
    name: documentation-drift-class-recipe-findings-table-present
    config:
      pattern: (?i)(\|.*severity.*\||finding|issue|concern|recommendation|violation)
  - type: output-matches
    name: documentation-drift-class-recipe-severity-vocab
    config:
      pattern: (?i)(critical|high|medium|low|info|severity|warning)
  - type: output-matches
    name: documentation-drift-class-recipe-no-source-edit
    config:
      pattern: (?i)```\s*(diff|patch|c#|csharp|cs|python|py|typescript|ts|javascript|js|rust|rs|go|java)\b
      negate: true
