    delivery task `synthetic-pipeline-delivery` using synthetic date
    `2026-09-21`. Run the confirmed segments in order now, scan the exact
    candidate customer summary before writing it, then reconcile the produced
    Plan, Changes, and Review pointers into coach state without changing jobs
    or adopting planner state.
