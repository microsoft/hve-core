- name: security-planner-phase6-with-drift-evidence
  prompt: |
    Resume Phase 6 for sample-service using the confirmed current-state report `.copilot-tracking/security/2026-08-31/security-report-001.md`.
    Baseline state: currentPhase=6, securityPlanFile=.copilot-tracking/security-plans/sample-service/security-plan.md.
    Baseline plan facts: T-WEB-001 expects request validation at src/api/gateway.ts; T-IDENTITY-001 leaves authorization open at src/auth/policy.ts.
    Confirmed report facts: WEB-INPUT PASS at src/api/gateway.ts and AUTHZ-OBJECT FAIL HIGH at src/auth/policy.ts.
    Present drift as proposed plan updates, then continue the ordinary completeness review. Do not mutate plan state or phase gates from the drift result.
  agent_environment:
    files:
    - src: ../../.github/agents/security/security-planner.agent.md
      dest: .github/copilot-instructions.md
    - src: ../../.github/instructions/shared/disclaimer-language.instructions.md
      dest: .github/instructions/shared/disclaimer-language.instructions.md
    - src: fixtures/security-phase6/sample-service-state.json
      dest: .copilot-tracking/security-plans/sample-service/state.json
    - src: fixtures/security-phase6/sample-service-security-plan.md
      dest: .copilot-tracking/security-plans/sample-service/security-plan.md
    - src: fixtures/security-phase6/security-report-001.md
      dest: .copilot-tracking/security/2026-08-31/security-report-001.md
    skills:
    - ../../.github/skills/project-planning/security-planning
  tags:
    category: agent-behavior
    agent: security-planner
  constraints:
    max_agent_duration: 240s
    max_duration: 300s
  graders:
  - type: output-matches
    name: security-planning-caution-before-drift
    config:
      pattern: (?is)\*\*Disclaimer:\*\*\s*This agent is an assistive tool only\.\s*It does not provide legal, regulatory, or compliance advice and does not replace professional security review boards, penetration testing teams, compliance auditors, legal counsel, or other qualified human reviewers\.\s*The output consists of suggested actions and considerations to support a user's own internal security review and decision[-\u2011]making\.\s*All security plans, threat models, security models, and mitigation recommendations generated by this tool must be independently reviewed and validated by appropriate security and compliance reviewers before use\.\s*Outputs from this tool do not constitute security approval, compliance certification, or regulatory sign[-\u2011]off\.[\s\S]*(validated controls|control drift|residual open risks|newly introduced threats|obsolete plan items)
  - type: program
    name: drift-proposed-not-applied
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        const path = require('node:path');
        const crypto = require('node:crypto');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const plan = fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/security-plans/sample-service/security-plan.md'), 'utf8').replace(/\r\n/g, '\n');
          const unchanged = crypto.createHash('sha256').update(plan).digest('hex') === '063a40d6af8c41b372806b219ed8511792b4732bb22411f081149dc0a2002f5b';
          const output = input.trajectory.output;
          const proposal = /(?:validated controls?|control drift)/i.test(output) && /(?:proposed plan updates|proposal|recommend)/i.test(output);
          const applied = /\b(?:I|we)\s+(?:have\s+)?(?:applied|updated|modified)\b[^.!?\n]*(?:plan|drift)/i.test(output);
          process.exit(unchanged && proposal && !applied ? 0 : 1);
        } catch { process.exit(1); }
  - type: program
    name: phase6-gate-retained
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        const path = require('node:path');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const state = JSON.parse(fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/security-plans/sample-service/state.json'), 'utf8'));
          const expected = { phase1: { gate: 'hard', confirmedAt: '2026-08-01T00:00:00Z' }, phase2: { gate: 'summary-and-advance' }, phase3: { gate: 'summary-and-advance' }, phase4: { gate: 'hard', confirmedAt: '2026-08-15T00:00:00Z' }, phase5: { gate: 'summary-and-advance' }, phase6: { gate: 'hard', confirmedAt: null } };
          const gates = state.phaseGates || {};
          const unchanged = Object.keys(gates).length === 6 && Object.entries(expected).every(([key, value]) => gates[key] && Object.entries(value).every(([field, content]) => gates[key][field] === content));
          const reply = input.trajectory.output;
          const summary = /(?:phase\s*6|review[^.!?\n]*handoff)/i.test(reply) && /(?:confirm|approval|hard gate|human review)/i.test(reply);
          process.exit(unchanged && state.currentPhase === 6 && state.handoffGenerated?.ado === false && state.handoffGenerated?.github === false && summary ? 0 : 1);
        } catch { process.exit(1); }
