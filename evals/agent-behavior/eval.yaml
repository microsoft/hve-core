- name: rai-planner-mural-setup-and-login-verdicts
  prompt: |
    For a synthetic Phase 2 facilitator board, explain the next action for
    each local readiness result: `needs_setup` and `needs_login`. Keep the
    outcomes separate. Do not run a Mural command or claim that a board was
    created.

    Handle each verdict in its own passage that names the verdict, the
    remediation it calls for, and what you do about the current request
    before that remediation is complete.
  agent_environment:
    skills:
    - ../../.github/skills/experimental/mural
    files:
    - src: ../../.github/agents/rai-planning/rai-planner.agent.md
      dest: .github/copilot-instructions.md
  tags:
    category: agent-behavior
    scenario: mural-setup-login-verdicts
    agent: rai-planner
  graders:
  - type: output-matches
    name: rai-mural-setup-pauses
    config:
      pattern: (?is)needs_setup(?=(?:(?!needs_(?:setup|login)).)*\b(?:configure|configuration|setup)\b)(?=(?:(?!needs_(?:setup|login)).)*(?:(?<!\b(?:not|never|no|without)\s)\b(?:pause|paused|stop|stopped|retry|pending|blocked|wait|waiting)\b|\bcannot proceed\b|\bdo not\s+(?:run|dispatch|proceed|create|seed)\b(?:(?!needs_(?:setup|login)|[.\r\n]).)*\buntil\b|\buntil\b(?:(?!needs_(?:setup|login)|[.\r\n]).)*\b(?:do not|cannot|no\s+(?:command|operation|board))\b))
  - type: output-matches
    name: rai-mural-login-pauses
    config:
      pattern: (?is)needs_login(?=(?:(?!needs_(?:setup|login)).)*\b(?:login|log[- ]in|sign[- ]in|authenticated session|authenticate|authentication)\b)(?=(?:(?!needs_(?:setup|login)).)*(?:(?<!\b(?:not|never|no|without)\s)\b(?:pause|paused|stop|stopped|retry|pending|blocked|wait|waiting)\b|\bcannot proceed\b|\bdo not\s+(?:run|dispatch|proceed|create|seed)\b(?:(?!needs_(?:setup|login)|[.\r\n]).)*\buntil\b|\buntil\b(?:(?!needs_(?:setup|login)|[.\r\n]).)*\b(?:do not|cannot|no\s+(?:command|operation|board))\b))
  - type: program
    name: rai-mural-readiness-no-call
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          if (!Array.isArray(input.trajectory.events)) process.exit(1);
          const forbidden = input.trajectory.events.some(event => {
            if (event.type !== 'tool_call') return false;
            const name = event.data?.toolName || '';
            if (/mural/i.test(name)) return true;
            const command = event.data?.arguments?.command || event.data?.arguments?.code || '';
            const simpleRead = /^(?:Get-Content|cat|type)\s+[^;&|`$()\r\n]+$/i.test(command);
            return /(?:shell|terminal|exec|python|node|bash)/i.test(name) && /\bmural\b/i.test(command) && !simpleRead;
          });
          process.exit(forbidden ? 1 : 0);
        } catch { process.exit(1); }
  - type: output-matches
    name: rai-mural-readiness-no-false-create
    config:
      pattern: (?is)\b(?:I|we) (?:just )?(?:successfully )?(?:created|seeded)\b|(?:^|[.!?]\s+)(?![^.!?\r\n]{0,100}\b(?:not|never|no|without)\b)[^.!?\r\n]{0,100}\bboard (?:was|is) created\b
      negate: true
