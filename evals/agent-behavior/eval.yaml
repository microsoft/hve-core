- name: backlog-manager-performs-workflow-neutral-github-grooming
  prompt: |
    Classify this request as GitHub Grooming, then assess the supplied ordinary
    issue inventory directly through the reusable grooming policy. Do not
    invoke a workflow-bound worker, require automation inputs, or execute a
    GitHub mutation.

    Inventory scope: open issues selected by a maintainer for this review.

    Issue #2558 requests a workflow-neutral grooming policy. Repository
    evidence shows that
    `.github/instructions/project-planning/github-backlog-grooming.instructions.md`
    defines evidence-backed advisory assessment and that Backlog Manager
    applies it directly. Treat the issue as Distinct and Likely completed.

    Issue #2601 requests automatic closure of inactive issues. Repository
    evidence contains no implementation and the grooming policy keeps closure
    advisory and maintainer-owned. Treat the issue as Distinct and Still
    needed.

    Produce the compact issue index with this exact header:

    | Issue | Similarity | Disposition | Status | Recommended next step |

    Follow it with `Issue #2558` and `Issue #2601` headings in that order.
    Under each heading, include the exact labels `Repository evidence`,
    `Similarity outcome`, `Disposition`, `Grooming finding`, `Recommended
    next step`, and `Assessment status`.

    Explain the handoff using these exact sentences: "Allowed operations are
    Update and Comment; Close is prohibited." and "Writeback requires
    per-field approval and a fresh Expected Updated At value; stale approval
