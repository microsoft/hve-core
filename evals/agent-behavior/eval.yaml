- name: ux-ui-designer-mural-environment-verdicts
  prompt: |
    A completed synthetic journey asset has an explicit Mural target and
    facilitator mode. Explain the next action for each local readiness
    result: `wrong_cwd` and `deps_missing`. Keep the outcomes separate. Do
    not publish anything or run another Mural command.
  environment:
    skills:
    - ../../.github/skills/design-thinking/ux-artifacts
    - ../../.github/skills/experimental/mural
    files:
    - src: ../../.github/agents/project-planning/ux-ui-designer.agent.md
      dest: .github/copilot-instructions.md
  tags:
    category: agent-behavior
    scenario: mural-environment-verdicts
    agent: ux-ui-designer
  graders:
  - type: program
    name: ux-mural-cwd-remediation
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const lines = input.trajectory.output.replace(/[*`]/g, '').split(/\r?\n/);
          const boundaries = lines.flatMap((line, index) => /\b(?:wrong_cwd|deps_missing)\b/i.test(line) ? [index] : []);
          const owners = boundaries.filter(index => /\bwrong_cwd\b/i.test(lines[index]));
          if (owners.length !== 1 || /\bdeps_missing\b/i.test(lines[owners[0]])) process.exit(1);
          const end = boundaries.find(index => index > owners[0]) ?? lines.length;
          const section = lines.slice(owners[0], end).join('\n');
          const pause = /(?<!\b(?:not|never|no|without|don['\u2019]t|won['\u2019]t)\s)\b(?:pause|paused|stop|stopped|halt|wait|waiting|blocked)\b/i.test(section);
          const remedy = /\b(?:repository root|project root|skill directory|working directory)\b|--project/i.test(section);
          const unsafe = /(?<!\b(?:not|never|without)\s)\b(?:continue|proceed|publish)\s+(?:now|immediately)\b/i.test(section);
          process.exit(pause && remedy && !unsafe ? 0 : 1);
        } catch { process.exit(1); }
  - type: program
    name: ux-mural-dependency-remediation
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const lines = input.trajectory.output.replace(/[*`]/g, '').split(/\r?\n/);
          const boundaries = lines.flatMap((line, index) => /\b(?:wrong_cwd|deps_missing)\b/i.test(line) ? [index] : []);
          const owners = boundaries.filter(index => /\bdeps_missing\b/i.test(lines[index]));
          if (owners.length !== 1 || /\bwrong_cwd\b/i.test(lines[owners[0]])) process.exit(1);
          const end = boundaries.find(index => index > owners[0]) ?? lines.length;
          const section = lines.slice(owners[0], end).join('\n');
          const pause = /(?<!\b(?:not|never|no|without|don['\u2019]t|won['\u2019]t)\s)\b(?:pause|paused|stop|stopped|halt|wait|waiting|blocked)\b/i.test(section);
          const remedy = /\b(?:dependency|dependencies|setup)\b/i.test(section);
          const unsafe = /(?<!\b(?:not|never|without)\s)\b(?:continue|proceed|publish)\s+(?:now|immediately)\b/i.test(section);
          process.exit(pause && remedy && !unsafe ? 0 : 1);
        } catch { process.exit(1); }
  - type: program
    name: ux-mural-readiness-no-call
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          if (!Array.isArray(input.trajectory.events)) process.exit(1);
          const forbidden = input.trajectory.events.some(event => {
            if (event.type !== 'tool_call') return false;
            const name = event.data?.toolName || '';
            if (/mural/i.test(name)) return true;
            const command = event.data?.arguments?.command || event.data?.arguments?.code || '';
            const simpleRead = /^(?:Get-Content|cat|type)\s+[^;&|`$()\r\n]+$/i.test(command);
            return /(?:shell|terminal|exec|python|node|bash)/i.test(name) && /\bmural\b/i.test(command) && !simpleRead;
          });
          process.exit(forbidden ? 1 : 0);
        } catch { process.exit(1); }
  - type: output-matches
    name: ux-mural-readiness-no-false-publish
    config:
      pattern: (?i)(?<!\b(?:not|never|without)\s)\bsuccessfully\b|\bI (?:just )?(?:published|created|updated)\b|\bboard (?:was|is)\s+(?!not\b)updated\b
      negate: true
