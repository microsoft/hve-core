    advisory: "true"
    agent: codebase-profiler
  graders:
  - type: program
    name: mode-vocabulary
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const output = input.trajectory.output.replace(/[*`]/g, '');
          const fields = [...output.matchAll(/(?:^|[\n,{])\s*["']?mode["']?\s*:\s*["']?([a-z-]+)/gim)].map(match => match[1].toLowerCase());
          process.exit(fields.length > 0 && fields.every(mode => mode === 'diff') ? 0 : 1);
        } catch { process.exit(1); }
  - type: output-matches
    name: applicable-skill-vocabulary
    config:
      pattern: (?is)^(?=[\s\S]*\bpython\b)(?=[\s\S]*\bflask\b)(?=[\s\S]*\bterraform\b)(?=[\s\S]*owasp-top-10)(?=[\s\S]*owasp-cicd)(?=[\s\S]*owasp-infrastructure)(?=[\s\S]*(?:src/api/handlers\.py|changed files|represented (?:scope|diff)))
