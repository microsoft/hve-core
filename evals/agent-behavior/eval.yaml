# Generated by Build-AgentBehaviorSpec.ps1 - do not edit by hand.
name: agent-behavior
description: >
  Evaluate hve-core skill+agent behavior via copilot-sdk. Tests that the
  combination of skills loaded in an agent context produces correct structure,
  applies specialized perspectives, and stays within defined boundaries.
  Note: Tests skill behavior under agent-style prompts rather than invoking
  a specific .agent.md file directly (Vally does not yet support agent routing).
type: capability
defaults:
  runs: 5
  timeout: 120s
  executor: copilot-sdk

# Skill paths are resolved relative to this spec's directory (evals/agent-behavior/),
# so they ascend to the repo root before descending into .github/skills.
environment:
  skills:
    - ../../.github/skills/security/owasp-top-10
    - ../../.github/skills/coding-standards/python-foundational

scoring:
  threshold: 0.7

stimuli:
- name: accessibility-framework-assessor-structured-findings
  prompt: |
    As the accessibility-framework-assessor subagent, you are given the skill
    name wcag-22 and a codebase profile for a Docusaurus site (React/MDX,
    routes for home, docs, and search) targeting WCAG 2.2 AA. Assess the
    codebase against the success criteria in that scope and return your
    structured findings report.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: accessibility-framework-assessor
  graders:
  - type: output-matches
    name: findings-format-vocabulary
    config:
      pattern: (?i)(SKILL_FINDINGS_V1|success criterion|success criteria|structured findings)
  - type: output-matches
    name: status-vocabulary
    config:
      pattern: (PASS|FAIL|PARTIAL|NOT_ASSESSED)
  - type: output-matches
    name: criterion-reference-vocabulary
    config:
      pattern: (?i)(wcag|1\.3\.1|2\.1\.1|4\.1\.2|level (a|aa))
- name: accessibility-framework-assessor-method-adequacy
  prompt: |
    As the accessibility-framework-assessor subagent, you are assessing a
    codebase against WCAG 2.1.1 keyboard operability and 4.1.3 status
    messages using only source reading. Explain what status you assign to
    each and why static analysis alone cannot settle them.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: accessibility-framework-assessor
  graders:
  - type: output-matches
    name: method-adequacy-vocabulary
    config:
      pattern: (?i)(method[- ]adequacy|decide|informs?[- ]only|cannot decide|static analysis)
  - type: output-matches
    name: escalation-vocabulary
    config:
      pattern: (?i)(interaction[- ]state probe|assistive[- ]technology pass|manual|runtime)
  - type: output-matches
    name: conservative-status-vocabulary
    config:
      pattern: (?i)(PARTIAL|NOT_ASSESSED|not over-?claim|conservative)
- name: accessibility-framework-assessor-disclaimer-posture
  prompt: |
    As the accessibility-framework-assessor subagent, you are invoked by the
    parent Accessibility Reviewer during an ordinary orchestrated scan.
    Describe how you handle the accessibility disclaimer in your output and
    whether you modify any repository files.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: accessibility-framework-assessor
  graders:
  - type: output-matches
    name: disclaimer-posture-vocabulary
    config:
      pattern: (?i)(disclaimer|parent|reviewer|not (emit|duplicate)|second disclaimer)
  - type: output-matches
    name: read-only-vocabulary
    config:
      pattern: (?i)(do(es)? not modify|read[- ]only|no file (changes|modifications))
- name: accessibility-planner-class-recipe
  prompt: |
    Begin an accessibility planning session for a public-facing customer portal that must conform to WCAG 2.2 and Section 508. List the next phases of the assessment. Write the planning state under `.copilot-tracking/accessibility/` and report the path you wrote it to.
  tags:
    category: agent-behavior
    agent: accessibility-planner
  graders:
  - type: output-matches
    name: phase-marker-present
    config:
      pattern: (?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)
  - type: output-matches
    name: tracking-file-write
    config:
      pattern: (?i)\.copilot-tracking[-/\\]accessibility
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: accessibility-reviewer-class-recipe
  prompt: |
    Run an accessibility audit of a web UI that includes an unlabeled icon button and a modal dialog without focus management. Summarize the accessibility findings with severity, citing the relevant success criteria.
  tags:
    category: agent-behavior
    agent: accessibility-reviewer
  graders:
  - type: output-matches
    name: findings-table-present
    config:
      pattern: (?i)(\|.*severity.*\||finding|issue|concern|recommendation|barrier)
  - type: output-matches
    name: severity-vocab
    config:
      pattern: (?i)(critical|high|medium|low|info|severity|warning)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: accessibility-surface-inventory-config-emission
  prompt: |
    As the accessibility-surface-inventory subagent, take a codebase profile
    for a Docusaurus site (React/MDX, routes for home, docs, and search) with
    a scope path and enabled WCAG framework, and produce the runtime surface
    inventory. Emit an a11y-runtime.config.json with a base URL, a route list,
    and a surface inventory of stable IDs, selectors, widget patterns, and
    interaction states, plus a summary table and open questions for human
    override.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: accessibility-surface-inventory
  graders:
  - type: output-matches
    name: config-artifact-vocabulary
    config:
      pattern: (?i)(a11y-runtime\.config\.json|base ?url|route list|surface inventory|interaction states?)
  - type: output-matches
    name: surface-fields-vocabulary
    config:
      pattern: (?i)(selector|widget pattern|surface id|state definition|scope)
  - type: output-matches
    name: human-override-vocabulary
    config:
      pattern: (?i)(summary table|open questions?|human (override|review)|without over-?claiming)
- name: accessibility-surface-inventory-conservative-scope
  prompt: |
    As the accessibility-surface-inventory subagent, you are given a codebase
    profile with an unfamiliar UI framework and sparse routing signals. Explain
    how you scope the runtime surface inventory and the config you emit so that
    coverage is not overstated, and where you defer to human confirmation.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: accessibility-surface-inventory
  graders:
  - type: output-matches
    name: conservative-scope-vocabulary
    config:
      pattern: (?i)(not over-?claim|conservative|uncertain|defer|human (confirmation|override|review)|open questions?)
  - type: output-matches
    name: strategy-vocabulary
    config:
      pattern: (?i)(discovery strategy|framework family|routes?|surfaces?|scope path)
- name: ado-backlog-executor-frontmatter-name-and-description
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/subagents/ado-backlog-executor.agent.md`.

    Report the human-readable agent name declared in its frontmatter, then restate its declared description verbatim. Do not paraphrase the description and do not describe the file itself.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: ado-backlog-executor
  graders:
  - type: output-matches
    name: reports-human-readable-name
    config:
      pattern: (?i)\bADO Backlog Executor\b
  - type: output-matches
    name: reports-declared-description
    config:
      pattern: (?i)dispatched Azure DevOps backlog operation set in one confirmed project
  - type: output-matches
    name: does-not-substitute-filename-for-name
    config:
      pattern: (?i)name\s*(is|:)\s*.{0,3}ado-backlog-executor
      negate: true
- name: ado-backlog-executor-user-invocable-flag
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/subagents/ado-backlog-executor.agent.md`.

    Report the value its frontmatter declares for `user-invocable`, and explain how a user reaches this artifact given that value.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: ado-backlog-executor
  graders:
  - type: output-matches
    name: reports-declared-flag-value
    config:
      pattern: (?i)user-invocable\s*(is|:|=)?\s*.{0,3}false
  - type: output-matches
    name: reaches-through-a-dispatching-parent
    config:
      pattern: (?i)(dispatch|Backlog Manager|parent agent|orchestrator)
  - type: output-matches
    name: not-described-as-picker-selectable
    config:
      pattern: (?i)(appears in|select(able)? from|choose it in) the (agent )?picker
      negate: true
- name: ado-backlog-executor-structural-template
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/subagents/ado-backlog-executor.agent.md`.

    List its top-level section headings in order, exactly as written, and state whether its first heading matches the name declared in its frontmatter.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: ado-backlog-executor
  graders:
  - type: output-matches
    name: reports-purpose-section
    config:
      pattern: (?im)^\W*Purpose\b
  - type: output-matches
    name: reports-inputs-section
    config:
      pattern: (?im)^\W*Inputs\b
  - type: output-matches
    name: reports-required-steps-section
    config:
      pattern: (?i)Required\s+Steps
  - type: output-matches
    name: reports-response-format-section
    config:
      pattern: (?i)Response\s+Format
  - type: output-matches
    name: confirms-heading-matches-name
    config:
      pattern: (?i)(match(es|ing)?|same as|identical)
- name: ado-backlog-executor-tool-restriction-fit
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/subagents/ado-backlog-executor.agent.md`.

    Read its declared `tools:` list together with its declared description. Assess whether that restriction set is appropriate for the role the description states, and name any tool whose presence or absence you consider inconsistent with that role. Justify the assessment from the artifact rather than from general expectations.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: ado-backlog-executor
  graders:
  - type: prompt
    name: tool-restriction-appropriate-for-purpose
    config:
      prompt: |
        The response assesses whether a subagent's declared tool set fits its
        stated purpose. Score high when it reasons from the artifact's own
        declared tools and description, observes that the grant covers Azure
        DevOps reads and writes and no other tracker family and no terminal,
        and connects that to the single-project execution role. Score low
        when it invents tools, ignores the declared description, or asserts
        that the grant enforces a project-level boundary that only the
        artifact's own destination-binding contract provides.
      threshold: 0.6
  - type: output-matches
    name: does-not-claim-runtime-enforcement-proof
    config:
      pattern: (?i)(this (test|check|eval) (proves|demonstrates|verifies))
      negate: true
- name: adr-creation-class-recipe
  prompt: |
    Start an ADR planning session for "Adopt PostgreSQL for the primary data store" using entry mode `capture`, project slug `adopt-postgresql`, and the default long-form output template. Initialize `.copilot-tracking/adr-plans/adopt-postgresql/state.json` with current phase `frame`, then report the tracking path and phase. Do not modify source code.
  tags:
    category: agent-behavior
    agent: adr-creation
  graders:
  - type: output-matches
    name: tracking-file-write
    config:
      pattern: (?i)\.copilot-tracking[-/\\]adr-plans[-/\\]adopt-postgresql
  - type: output-matches
    name: frame-phase
    config:
      pattern: (?i)\bframe\b
  - type: output-matches
    name: topic-coverage
    config:
      pattern: (?i)postgres(?:ql)?
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: agentic-workflows-class-recipe
  prompt: |
    Plan an agentic workflow for "automated nightly dependency upgrade PRs". Break it into phases with success criteria. Write the plan under `.copilot-tracking/` and report the path you wrote it to.
  tags:
    category: agent-behavior
    agent: agentic-workflows
  graders:
  - type: output-matches
    name: phase-marker-present
    config:
      pattern: (?im)(^\s*(#{2,3}\s|step\s+\d+|phase\s+\d+|\d+[.)])|\|\s*\d+\s*[—–-]|\bphases?\b)
  - type: output-matches
    name: tracking-file-write
    config:
      pattern: (?i)\.copilot-tracking[-/\\]
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: backlog-manager-frontmatter-name-and-description
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

    Report the human-readable agent name declared in its frontmatter, then restate its declared description verbatim. Do not paraphrase the description and do not describe the file itself.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: backlog-manager
  graders:
  - type: output-matches
    name: reports-human-readable-name
    config:
      pattern: (?i)\bBacklog Manager\b
  - type: output-matches
    name: reports-declared-description
    config:
      pattern: (?i)read-only backlog orchestrator.{0,40}Azure DevOps.{0,20}GitHub.{0,20}Jira
  - type: output-matches
    name: does-not-substitute-filename-for-name
    config:
      pattern: (?i)name\s*(is|:)\s*.{0,3}backlog-manager
      negate: true
- name: backlog-manager-handoff-targets-and-labels
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

    List every agent it can hand off to and the label each handoff entry carries. Identify each target agent the way the artifact identifies it.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: backlog-manager
  graders:
  - type: output-matches
    name: names-cross-agent-handoff-target
    config:
      pattern: (?i)\bFunctional Planner\b
  - type: output-matches
    name: reports-declared-labels
    config:
      pattern: (?i)(Task Plan|Add Item|PRD to Hierarchy)
  - type: output-matches
    name: identifies-targets-by-name-not-path
    config:
      pattern: (?i)agent\s*:\s*.{0,3}[\w/-]*\.agent\.md
      negate: true
- name: backlog-manager-tool-restriction-fit
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

    Read its declared `tools:` list together with its declared description. Assess whether that restriction set is appropriate for the role the description states, and name any tool whose presence or absence you consider inconsistent with that role. Justify the assessment from the artifact rather than from general expectations.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: backlog-manager
  graders:
  - type: prompt
    name: tool-restriction-appropriate-for-purpose
    config:
      prompt: |
        The response assesses whether an agent's declared tool set fits its
        stated purpose. Score high when the response reasons from the
        artifact's own declared tools and description, recognizes that the
        declared tracker surface is read-only, and connects that to the
        description's dispatch-every-mutation role. Score low when the
        response invents tools, ignores the declared description, or asserts
        that a tool grant enforces a boundary the host does not enforce.
      threshold: 0.6
  - type: output-matches
    name: does-not-claim-runtime-enforcement-proof
    config:
      pattern: (?i)(this (test|check|eval) (proves|demonstrates|verifies))
      negate: true
- name: backlog-manager-protocol-heading-consistency
  prompt: |
    Open the agent artifact at `.github/agents/project-planning/backlog-manager.agent.md`.

    List the headings that carry its workflow protocol, in order and exactly as written in the artifact.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: backlog-manager
  graders:
  - type: output-matches
    name: reports-first-protocol-heading
    config:
      pattern: (?i)Phase\s+1:\s*Platform and Intent Classification
  - type: output-matches
    name: reports-last-protocol-heading
    config:
      pattern: (?i)Phase\s+3:\s*Summary and Handoff
  - type: output-matches
    name: does-not-report-step-headings
    config:
      pattern: (?i)Step\s+\d+:\s*(Platform and Intent|Workflow Dispatch|Summary and Handoff)
      negate: true
- name: brd-builder-class-recipe
  prompt: |
    Draft a Business Requirements Document for a self-service password reset feature. Cover business goals, scope, and success metrics. Write the BRD under `docs/project-planning/` with session state under `.copilot-tracking/brd-sessions/`, and report the paths.
  tags:
    category: agent-behavior
    agent: brd-builder
  graders:
  - type: output-matches
    name: tracking-file-write
    config:
      pattern: (?i)(docs[-/\\]project-planning|\.copilot-tracking[-/\\](brd-sessions|research))
  - type: output-matches
    name: topic-coverage
    config:
      pattern: (?i)(business|requirement|scope|success|password|reset)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: brd-quality-reviewer-mentions-quality-guidance
  prompt: |
    You are reviewing a planning handoff for a business-requirements draft.
    Briefly describe what the brd-quality-reviewer agent is meant to help with
    and name one quality concern it should surface for the draft.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: brd-quality-reviewer
  graders:
  - type: output-matches
    name: agent-domain-attribution
    config:
      pattern: (?i)(brd|business|requirements|review|quality)
  - type: output-matches
    name: scope-language
    config:
      pattern: (?i)(draft|review|quality|requirements)
- name: code-review-accessibility-lens
  prompt: |
    As the accessibility code-review perspective, review this markup for
    conformance issues and cite the relevant success criteria.
    ```html
    <button><img src="trash.png"></button>
    <input type="text">
    ```
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-accessibility
  graders:
  - type: output-matches
    name: accessibility-finding-vocabulary
    config:
      pattern: (?i)(accessibility|alt text|label|aria|WCAG|success criteria|contrast|finding|issue)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-explainer-factual
  prompt: |
    As the code-review explainer, give a factual, Register 1 explanation of
    what this function does. Do not assign severity or recommend changes.
    ```python
    def clamp(value, low, high):
        return max(low, min(value, high))
    ```
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-explainer
  graders:
  - type: output-matches
    name: explanation-vocabulary
    config:
      pattern: (?i)(function|returns?|parameter|argument|value|purpose|does|bound|clamp|minimum|maximum)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-functional-lens
  prompt: |
    As the functional code-review perspective, review this change for logic,
    edge cases, and error handling. Report findings with severity.
    ```diff
    -def divide(a, b):
    -    return a / b
    +def divide(a, b):
    +    return a / b  # no guard when b == 0
    ```
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-functional
  graders:
  - type: output-matches
    name: functional-finding-vocabulary
    config:
      pattern: (?i)(edge case|division by zero|b\s*==\s*0|error handling|exception|finding|issue|severity|risk)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-pr-lens
  prompt: |
    As the PR code-review perspective, summarize this pull request at the PR
    level: scope hygiene, validation evidence, and follow-up items. The PR
    adds a retry helper plus tests and touches an unrelated formatting change.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-pr
  graders:
  - type: output-matches
    name: pr-summary-vocabulary
    config:
      pattern: (?i)(summary|scope|validation|evidence|follow[- ]?up|out[- ]?of[- ]?scope|test|recommend)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-readiness-lens
  prompt: |
    As the readiness code-review perspective, assess whether this change is
    ready to merge: validation evidence, test coverage, and rollout
    considerations. The change adds a feature flag with no accompanying tests.
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-readiness
  graders:
  - type: output-matches
    name: readiness-vocabulary
    config:
      pattern: (?i)(readiness|ready|test|coverage|validation|evidence|rollout|missing|risk|recommend)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-security-lens
  prompt: |
    As the security code-review perspective, review this change for
    injection, authentication, and secret-handling concerns. Report findings
    with severity and a concrete exploitation path.
    ```python
    query = "SELECT * FROM users WHERE name = '" + name + "'"
    db.execute(query)
    ```
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-security
  graders:
  - type: output-matches
    name: security-finding-vocabulary
    config:
      pattern: (?i)(sql injection|injection|sanitize|parameterized|authentication|secret|vulnerability|exploit|severity|finding)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-standards-lens
  prompt: |
    As the standards code-review perspective, review this snippet for coding
    standard and convention violations, and tie each finding to the rule it
    breaks.
    ```python
    def ProcessData( x ):
     result=x*2
     return result
    ```
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-standards
  graders:
  - type: output-matches
    name: standards-finding-vocabulary
    config:
      pattern: (?i)(standard|convention|naming|style|PEP\s?8|formatting|violation|finding|issue)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(created|wrote|modified|edited|patched|added)\s+\S{0,40}(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-walkback-investigation
  prompt: |
    As the code-review walk-back investigator, take a deep, Register 2 look at
    whether this caching change is correct and safe, and explain the
    implications of a stale cache entry.
    ```python
    cache[key] = fetch(key)  # never invalidated
    ```
  tags:
    category: agent-behavior
    advisory: "true"
    agent: code-review-walkback
  graders:
  - type: output-matches
    name: investigation-vocabulary
    config:
      pattern: (?i)(implication|stale|invalidate|consistency|correct|safe|risk|because|investigate|consider)
  - type: output-matches
    name: no-source-edit
    config:
      pattern: (?i)(\.cs|\.py|\.ts|\.js|package\.json)
      negate: true
- name: code-review-class-recipe
  prompt: |
    Begin an interactive review of this diff. Return a factual orientation and a short dispatch board, then ask me to confirm the review scope before deeper analysis. Do not modify source code.
    ```diff
    -def get_user(user_id):
    -    return db.query(f"SELECT * FROM users WHERE id = {user_id}")
    +def get_user(user_id):
    +    return db.query("SELECT * FROM users WHERE id = ?", user_id)
    ```
  tags:
    category: agent-behavior
    agent: code-review
  graders:
  - type: output-matches
    name: orientation-and-board
    config:
