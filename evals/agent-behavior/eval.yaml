    config:
      pattern: (?is)\[!CAUTION\][\s\S]*\*\*Disclaimer:\*\*\s*This agent is an assistive tool only\.\s*It does not provide legal, regulatory, or compliance advice and does not replace professional security review boards, penetration testing teams, compliance auditors, legal counsel, or other qualified human reviewers\.\s*The output consists of suggested actions and considerations to support a user's own internal security review and decision[-\u2011]making\.\s*All security plans, threat models, security models, and mitigation recommendations generated by this tool must be independently reviewed and validated by appropriate security and compliance reviewers before use\.\s*Outputs from this tool do not constitute security approval, compliance certification, or regulatory sign[-\u2011]off\.
  - type: program
    name: redisplay-state-contract
    config:
      program: node
      args:
      - --eval
      - |
        const fs = require('node:fs');
        const path = require('node:path');
        try {
          const input = JSON.parse(fs.readFileSync(process.env.EVALUATE_GRADER_INPUT, 'utf8'));
          const state = JSON.parse(fs.readFileSync(path.join(process.env.EVALUATE_WORKSPACE, '.copilot-tracking/security-plans/cadence-shown/state.json'), 'utf8'));
          const baseline = '2026-09-01T12:00:00Z';
          const stamp = state.disclaimerShownAt;
          const validStamp = typeof stamp === 'string' && /^\d{4}-\d{2}-\d{2}T/.test(stamp) && Number.isFinite(Date.parse(stamp)) && Date.parse(stamp) > Date.parse(baseline);
          const history = Array.isArray(state.noticeLog) ? state.noticeLog : [];
          const original = history.some(notice => notice.noticeType === 'session-start-disclaimer' && notice.shownAt === baseline);
          const replay = history.some(notice => notice.shownAt === stamp && notice.details?.reason === 'user-requested-redisplay');
          const output = input.trajectory.output;
          const summary = /disclaimerShownAt/i.test(output) && /(?<!\b(?:not|never|without)\s)\b(?:updated|refreshed)\b/i.test(output) && /user[-\s]?requested[-\s]?redisplay/i.test(output);
          const denied = /(?:disclaimerShownAt[^.!?\n]*(?:not updated|not refreshed|unchanged)|(?:did not|never)\s+(?:update|refresh)[^.!?\n]*disclaimerShownAt)/i.test(output);
          process.exit(validStamp && original && replay && summary && !denied ? 0 : 1);
        } catch { process.exit(1); }
