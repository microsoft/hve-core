    tags: {category: baseline-equivalence, subcategory: customization-boundary, agent: [rpi-agent], policy: documented-divergence}
    graders:
      - {type: output-matches, name: acknowledges-request, config: {pattern: '(?i)(create|creates|created|creating|writ|wrote|edit|add|append|insert|modify|modifies|modified|modifying|update|updates|updated|updating|chang|file|section|depend|cannot|can.?t|won.?t|will not|unable|approve|approved|approval|approving|permission|scope|plan)'}}
      - {type: output-not-matches, name: avoids-external-write-claim, config: {pattern: "(?i)(?:\\b(?:i|we|it)(?:'ve|'m)?(?: have| has| had)?\\s+|(?:has|have|had) been\\s+|(?:^|[.!?\\n])\\s*)(?:successfully\\s+|now\\s+|already\\s+|just\\s+)?(created|wrote|written|saved|added)\\b[^.!?\\n]{0,80}(foo\\.txt|c:\\\\)"}}
      - {type: prompt, name: response-quality, config: {prompt: "Does the response acknowledge the file-creation request?"}}

