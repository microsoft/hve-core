name: skill-quality
description: >
  Evaluate hve-core skill behavior via copilot-sdk. Tests that skills
  provide accurate, structured guidance when invoked with domain-specific
  prompts. Uses multiple runs to account for non-deterministic output.
type: capability
defaults:
  runs: 3
  timeout: 120s
  executor: copilot-sdk

# Skill paths are resolved relative to this spec's directory (evals/skill-quality/),
# so they ascend to the repo root before descending into .github/skills.
environment:
  skills:
    - ../../.github/skills/security/owasp-top-10
    - ../../.github/skills/security/owasp-cicd
    - ../../.github/skills/project-planning/architecture-review

scoring:
  threshold: 0.7

stimuli:
  - name: architecture-review-record-and-authority
    prompt: |
      A System Architecture Reviewer confirmed reliability and cost as the
      focus areas for review `synthetic-queue`. Research recommends option A
      with evidence `E1`, but final budget approval is unresolved. Explain what
      the Architecture Review Record must preserve before an ADR or RPI Plan
      handoff, and who retains decision authority.
    rubric:
      - Preserve confirmed scope for synthetic-queue, evidence E1 and its recommendation of option A, assumptions distinct from verified context, and trade-offs with recommendation rationale.
      - Give both reliability and cost an explicit disposition (finding, examined with no finding, or unassessed with a limit). Preserve unresolved final budget approval as a limit, not invented approval.
      - Record review dispositions of recommendations with rationale and evidence, plus decision owners. Complete and persist the record before an ADR or RPI Plan handoff and pass its path as evidence.
      - Decision authority stays in the ADR and with the user; the review record preserves analysis and does not approve or replace their decisions. All criteria are mandatory; wrong authority, missing pillar dispositions, or assumed budget approval fails.
      - Accept equivalent wording and any clause order. Fail prompt echoes, generic lists without the required relationships, and unavailable-policy excuses.
    tags:
      category: skill-quality
      skill: architecture-review
    graders:
      - type: prompt
        name: architecture-review-contract
        config:
          scoring: binary
          threshold: 0.85

  - name: owasp-top10-identify-injection
    prompt: |
      I have a web application that constructs SQL queries by concatenating
      user input directly into the query string. What OWASP Top 10 category
      does this fall under, and what are the recommended mitigations?
    tags:
      category: skill-quality
      skill: owasp-top-10
    graders:
      - type: output-matches
        name: identifies-injection-category
        config:
          pattern: "(?i)\\binjection\\b"
      - type: output-matches
        name: references-parameterized-queries
        config:
          pattern: "(?i)parameterized|prepared.statement"

  - name: owasp-top10-identify-broken-access
    prompt: |
      A user can modify the URL parameter from /api/users/123 to /api/users/456
      and access another user's data. What OWASP Top 10 vulnerability is this?
    tags:
      category: skill-quality
      skill: owasp-top-10
    graders:
      - type: output-matches
        name: identifies-broken-access-control
        config:
          pattern: "(?i)broken.access.control|insecure.direct.object.reference|IDOR"
      - type: output-matches
        name: suggests-authorization-check
        config:
          # cspell:disable-next-line
          pattern: "(?i)authori[sz]ation|access.control|ownership.check|server.side"

  - name: owasp-cicd-pipeline-poisoning
    prompt: |
      Our CI/CD pipeline pulls build scripts from an external repository
      that multiple developers can push to without review. What security
      risks does this introduce according to OWASP CI/CD guidelines?
    tags:
      category: skill-quality
      skill: owasp-cicd
    graders:
      - type: output-matches
        name: identifies-pipeline-poisoning
        config:
          pattern: "(?i)pipeline.poison|code.injection|supply.chain|untrusted"
      - type: output-matches
        name: recommends-controls
        config:
          pattern: "(?i)branch.protect|code.review|sign|pin|restrict"
