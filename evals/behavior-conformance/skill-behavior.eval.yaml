  - name: skill-git-commit-cancellation
    turns:
      - |
        Follow the staged `git-commit` skill at
        `.github/skills/hve-core/git-commit/SKILL.md` in this contained repository.
        Inventory candidate paths, preserve the initially staged path, and ask
        me to select whole paths. Do not stage or commit before I answer.
      - |
        Select `eval-fixtures/git-commit/prior.txt` and
        `eval-fixtures/git-commit/[ab].txt`. Stage only the newly selected
        path, inspect the exact staged set, and ask for confirmation.
      - |
        Reject the staged set. Restore only this invocation's staging delta,
        preserve the working tree and initial index, and stop without a commit.
    agent_environment:
      git:
        type: worktree
        source: ../..
        ref: HEAD
      files:
        - src: ../../.github/skills/hve-core/git-commit
          dest: .github/skills/hve-core/git-commit
      commands:
        - git config user.email eval@example.invalid
        - git config user.name "Eval Fixture"
        - node -e "const fs=require('fs');const d='eval-fixtures/git-commit';fs.mkdirSync(d,{recursive:true});for(const f of ['[ab].txt','a.txt','prior.txt','unrelated.txt'])fs.writeFileSync(d+'/'+f,'baseline-'+f);"
        - git --literal-pathspecs add -- '.github/skills/hve-core/git-commit' 'eval-fixtures/git-commit/[ab].txt' 'eval-fixtures/git-commit/a.txt' 'eval-fixtures/git-commit/prior.txt' 'eval-fixtures/git-commit/unrelated.txt'
        - git commit --quiet -m "synthetic git commit baseline"
        - node -e "const fs=require('fs');const d='eval-fixtures/git-commit';fs.writeFileSync(d+'/prior.txt','prior staged change');fs.writeFileSync(d+'/[ab].txt','selected bracket change');fs.writeFileSync(d+'/unrelated.txt','unrelated working change');"
        - git --literal-pathspecs add -- 'eval-fixtures/git-commit/prior.txt'
    tags:
      category: behavior-conformance
      skill: git-commit
      branch: cancellation
      advisory: "true"
    graders:
      - type: output-matches
        name: skill-git-commit-cancel-selection-before-staging
        turn: 0
        config:
          pattern: '(?is)(?:select|choose).{0,120}(?:whole\s+)?(?:paths?|files?).{0,120}before.{0,80}(?:stag|index)|(?:not|won[\x27\u2019]t|will not|without).{0,80}(?:stag|index).{0,120}(?:until|before).{0,80}(?:select|choose|confirm)|(?:wait|waiting|await).{0,100}(?:selection|choice|confirmation).{0,100}before.{0,80}(?:stag|index)'
      - type: tool-calls
        name: skill-git-commit-cancel-no-early-mutation
        turn: 0
        config:
          disallowed:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+(?:--literal-pathspecs\s+)?(?:add|reset|commit)\b'
      - type: tool-calls
        name: skill-git-commit-cancel-literal-stage
        turn: 1
        config:
          required:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+--literal-pathspecs\s+add\s+--.*\[ab\]\.txt'
          disallowed:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+(?:--literal-pathspecs\s+)?(?:reset|commit)\b'
      - type: output-matches
        name: skill-git-commit-cancel-exact-set-confirmation
        turn: 1
        config:
          pattern: '(?is)(?=.*prior\.txt)(?=.*\[ab\]\.txt)(?=.*(?:confirm|intended))'
      - type: tool-calls
        name: skill-git-commit-cancel-literal-rollback
        turn: 2
        config:
          required:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+--literal-pathspecs\s+reset\s+--.*\[ab\]\.txt'
          disallowed:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+commit\b'
      - type: output-matches
        name: skill-git-commit-cancel-reports-no-commit
        turn: 2
        config:
          pattern: '(?is)^(?=[\s\S]*(?:no commits?|without committing|commit was not created|did not commit|(?:did|have)n[\x27\u2019]t (?:created a )?commit|nothing (?:was )?committed))(?=[\s\S]*(?:restore|restored|restoration|preserve|preserved|staging delta|unstaged only|index (?:is )?unchanged))'
      - type: run-command
        name: skill-git-commit-cancel-preserves-initial-index
        config:
          command: git
          args: ["diff", "--cached", "--name-only"]
          stdout_matches: '^eval-fixtures/git-commit/prior\.txt\r?\n?$'
      - type: run-command
        name: skill-git-commit-cancel-preserves-working-tree
        config:
          command: git
          args: ["status", "--porcelain=v1", "--", "eval-fixtures/git-commit/[ab].txt", "eval-fixtures/git-commit/prior.txt", "eval-fixtures/git-commit/unrelated.txt"]
          stdout_matches:
            - '(?m)^ M eval-fixtures/git-commit/\[ab\]\.txt$'
            - '(?m)^M  eval-fixtures/git-commit/prior\.txt$'
            - '(?m)^ M eval-fixtures/git-commit/unrelated\.txt$'
      - type: run-command
        name: skill-git-commit-cancel-no-new-commit
        config:
          command: git
          args: ["log", "-1", "--pretty=%s"]
          stdout_matches: '^synthetic git commit baseline\r?\n?$'

