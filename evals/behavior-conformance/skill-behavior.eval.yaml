# cspell:ignore reconcil appl assum declin fabricat saturat flexib modif ying rewrit overwrit rederive
name: behavior-conformance-skills
description: >
  Advisory-tier behavior conformance evals for skills exercised through
  knowledge, tool-trigger, and bleed-detection stimulus shapes. Total: 260
  stimuli, including engagement-reporting coverage, Outlook HTML guards, and
  complete branch coverage for the RPI, prompt-builder, proposal-response, and
  outcome-hypothesis skill updates. Each tool-trigger stimulus uses at least two
  graders with AND logic, and the suite-level scoring threshold gates the
  aggregate pass rate across stimuli.
type: capability
defaults:
  runs: 3
  # Raised from 120s: file-producing stimuli measured at 158s and 267s, so the
  # old cap guaranteed timeouts plus retry storms on every run.
  timeout: 400s
  executor: copilot-sdk

scoring:
  threshold: 0.6

stimuli:

  - name: skill-python-foundational-knowledge
    prompt: |
      Summarize the canonical Python idioms championed by the
      `python-foundational` skill. Cite at least three patterns it advises.
    tags:
      category: behavior-conformance
      skill: python-foundational
      shape: knowledge
      advisory: "true"
    graders:
      - type: output-matches
        name: skill-python-foundational-knowledge-skill-attribution
        config:
          pattern: '(?i)(dataclass|pathlib|type\s+hint|comprehension|context\s+manager)'
      - type: output-matches
        name: skill-python-foundational-knowledge-scope-language
        config:
          pattern: '(?i)(python|idiom|foundational|best\s+practice)'
  - name: skill-python-foundational-tool-trigger
    prompt: |
      I am authoring a new module at `scripts/utilities/helper.py` and want
      idiomatic, foundational Python patterns applied. Which skill under
      `.github/skills/**/SKILL.md` applies and what does it advise?
    tags:
      category: behavior-conformance
      skill: python-foundational
      shape: tool-trigger
      advisory: "true"
    graders:
      - type: output-matches
        name: skill-python-foundational-tool-trigger-skill-domain-92bd4fa6
        config:
          pattern: '(?i)(python|foundational|idiom|skill|pattern)'
      - type: output-matches
        name: skill-python-foundational-tool-trigger-scope-language
        config:
          pattern: '(?i)(python|idiom|skill|pattern)'
  - name: skill-python-foundational-bleed-detection
