      file applies (cite its path) and what conventions does it require for
      frontmatter, admonitions, and internal links?
    tags:
      category: behavior-conformance
      instruction: docusaurus-edits
      advisory: "true"
    graders:
      - type: output-matches
        name: applyTo-evidence
        config:
          pattern: "(?i)\\bdocs/\\b|^docs/|docs\\s*/"
      - type: output-matches
        name: scope-language
        config:
          pattern: "(?i)docusaurus|frontmatter|admonition|internal\\s+link|mermaid"

