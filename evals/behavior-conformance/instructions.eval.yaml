name: behavior-conformance-instructions
description: >
  Advisory-tier behavior conformance evals for high-signal Markdown-applyTo
  instructions in `.github/instructions/**` (covers ADO, coding-standards,
  experimental, GitHub, hve-core, Jira, privacy, RAI planning, security, and shared
  scopes). Each stimulus prompts the model
  to identify the instruction that applies in a given working context and
  asserts both `applyTo` path evidence and instruction-specific scope
  vocabulary. Per DD-05, this is an advisory tier and grader false-positives
  are absorbed by design.
type: capability
defaults:
  runs: 3
  timeout: 120s
  executor: copilot-sdk

stimuli:
  - name: skill-ado-create-pull-request-conformance
    prompt: |
      You are creating an Azure DevOps pull request from artifacts under
      `.copilot-tracking/pr/new/feature-x/`. Which skill owns that protocol,
      and what must run before the first pull request operation?
    tags:
      category: behavior-conformance
      skill: backlog-management
      advisory: "true"
    graders:
      - type: output-matches
        name: skill-named
        config:
          pattern: "(?i)backlog-management"
      - type: output-matches
        name: preflight-required
        config:
          pattern: "(?i)preflight|platform resolution|confirm.{0,30}destination|sanitiz"
      - type: output-matches
        name: scope-language
        config:
          pattern: "(?i)work\\s+item|reviewer|pull\\s+request|automated\\s+linking"

  - name: skill-ado-get-build-info-conformance
    prompt: |
      A user asks about Azure DevOps build status for a branch and you are
      drafting a response file at `.copilot-tracking/pr/123-build-info.md`.
      Which skill owns that protocol and how is it reached?
    tags:
      category: behavior-conformance
      skill: backlog-management
      advisory: "true"
    graders:
      - type: output-matches
        name: skill-named
        config:
          pattern: "(?i)backlog-management|build-info"
      - type: output-matches
        name: scope-language
        config:
          pattern: "(?i)azure\\s*devops|\\bado\\b|build|pull\\s*request|branch"

  - name: instruction-docusaurus-edits-conformance
