        turn: 0
        config:
          pattern: '(?is)(?:select|choose).{0,120}(?:whole\s+)?paths?.{0,120}before.{0,80}(?:stag|index)|(?:not|won''t|will not|without).{0,80}(?:stag|index).{0,120}(?:until|before).{0,80}(?:select|choose)'
      - type: tool-calls
        name: prompt-git-commit-cancel-no-early-mutation
        turn: 0
        config:
          disallowed:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+(?:--literal-pathspecs\s+)?(?:add|reset|commit)\b'
      - type: tool-calls
        name: prompt-git-commit-cancel-literal-stage
        turn: 1
        config:
          required:
            - name: '^(powershell|bash|shell)$'
              command: '(?is)git\s+--literal-pathspecs\s+add\s+--.*\[ab\]\.txt'
          disallowed:
            - name: '^(powershell|bash|shell)$'
